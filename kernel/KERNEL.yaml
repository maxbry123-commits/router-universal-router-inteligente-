plan_cableado:
  origen: IB-YAIWES-01
  orden:
  - {n: 1, fase: recuperacion_forense_historica, salida: "audit/historical_connections.json", job: j3_history + historical_wiring_audit}
  - {n: 2, fase: auditoria_cableado_actual, salida: "audit/current_connections.json + dependency_graph.json + missing/duplicate/orphan", job: j2_graph}
  - {n: 3, fase: grafo_ast_dependencias, salida: "audit/dependency_graph.json", job: audit}
  - {n: 4, fase: registro_central, salida: "connections/wiring_registry.yaml (centro de distribucion)", job: make_registry}
  - {n: 5, fase: contratos_harness, salida: "handoff/contracts/ + plugin dispatcher", job: audit}
  - {n: 6, fase: system_prompt_y_motores, salida: "recorrido trazado + sha del prompt", job: audit}
  - {n: 7, fase: chat_yaiwes_openclaw, salida: "UI preservada + MVP autonomo de OpenClaw", job: audit}
  - {n: 8, fase: guardianes_y_huerfanos, salida: "audit/orphan_files.json + commit reversible a _quarantine", job: audit}
  - {n: 9, fase: frontend_y_agentes, salida: "pruebas UI->backend->harness->router->modelo", job: audit}
  - {n: 10, fase: nvidia_locales_memoria_storage, salida: "evidencia de inferencia real + latencia + ACK", job: audit}
  - {n: 11, fase: job_test_integral, salida: "audit/runtime_results.json (J01..J13)", job: job_test}
  - {n: 12, fase: cierre_repo_limpio, salida: "README + bitacora + handoff + arquitectura + repo limpio", job: audit}
  adaptaciones_al_contrato:
  - "GitHub Actions PROHIBIDO: las pruebas corren en local o Job HF cpu-upgrade"
  - "LFS PROHIBIDO"
  - "sin despliegue nuevo en Vercel o HF sin autorizacion"
  - "todo job pesado cabe en 1800 s o se trocea en E1..E8"
