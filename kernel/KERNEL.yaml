layout_rules:
- every file belongs to exactly one domain
- cross-domain calls only through gateway + registry entry
- no file without owner/domain/reference -> _quarantine/
jobs:
  j0_preflight:
    script: j0_preflight
    needs: []
    timeout: 15m
  j1_inventory:
    script: j1_inventory
    needs:
    - j0_preflight
    timeout: 1h
  j2_graph:
    script: j2_graph
    needs:
    - j0_preflight
    timeout: 1h
  j3_history:
