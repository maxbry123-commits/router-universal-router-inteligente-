  - {id: N6_remirror, estado: EN_CURSO, evidencia: "j9_remirror en marcha: push por git con allowlist al Space + verificacion health.commit == HEAD"}
  - {id: N7_auditoria_final, estado: PENDIENTE, evidencia: "j8_audit PHASE=post + j10_final_audit"}
