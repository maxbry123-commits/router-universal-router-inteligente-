dag: yaiwes.motor4.git.v1
reglas: [no_github_actions, no_lfs, no_disco, no_sandbox_claude, no_force_push, motor_inmutable_tras_relock]
nodos:
  N1_publicar_motor4_git:
    hace: subir motor_4_move_batches.py con MODE=git a Yaiwes main
    estado: BLOQUEADO (API GitHub devolvio 500 al escribir en Yaiwes; reintentar)
  N2_relock:
    depende: [N1_publicar_motor4_git]
    hace: leer blob SHA nuevo de motor_4 y actualizar MOTORES_VERSION.json y el skill (regla 0.9)
  N3_colas_tarea2:
    depende: [N2_relock]
    hace: convertir docs/motores-colas/tarea2-mover.json en 10 archivos MOVES (B01..B10) con pares src->dst
    destino: "➡️ core kernel Yaiwes/<carpeta>"
  N4_ejecutar_10_motores:
    depende: [N3_colas_tarea2]
    hace: MODE=git REPO=maxbry123-commits/Yaiwes BRANCH=main MOVES_FILE=Bxx GITHUB_TOKEN=<banco de secretos Router>
    agentes: 5 imput sharck (B01-B05) + 5 Yaiwes componentes (B06-B10)
    donde: ejecutor que decida Hy (no sandbox Claude)
  N5_supervisores:
    depende: [N4_ejecutar_10_motores]
    hace: 2 supervisores leen el JSON de cierre de cada motor; exigen verdict VERIFIED_CLOSED
  N6_reporte:
    depende: [N5_supervisores]
    hace: commit + URL por motor en docs/motores-colas/
