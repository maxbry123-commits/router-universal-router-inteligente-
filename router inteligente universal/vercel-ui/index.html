<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Router YAIWES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d10;color:#d0d4dc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100dvh;padding:0 .5rem .5rem}
.app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;gap:.5rem;padding:.4rem 0}
.bar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;background:#14181d;border-radius:1rem;padding:.5rem;border:1px solid #2a3038}
.bar select,.bar button,.row button,.row input{font-size:.8rem;background:#1e242c;color:#d0d4dc;border:1px solid #2e3843;border-radius:1rem;padding:.35rem .6rem}
.bar select{flex:1 0 90px}
.sw{display:flex;align-items:center;gap:.3rem;font-size:.75rem;background:#1a2028;padding:.3rem .6rem;border-radius:1rem;border:1px solid #2e3843}
.chat{flex:1;background:#0f1318;border-radius:1rem;display:flex;flex-direction:column;border:1px solid #222a33;min-height:320px}
.hist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.5rem;font-size:.92rem}
.msg{padding:.45rem .7rem;border-radius:.9rem;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.a{background:#1f2b38;border-left:3px solid #4c9aff;align-self:flex-start}
.msg.u{background:#1b2a3a;align-self:flex-end}
.in{display:flex;gap:.3rem;padding:.45rem;border-top:1px solid #252e38}
.in input{flex:1;background:#1a212a;border:1px solid #2e3a48;border-radius:1rem;padding:.55rem .8rem;color:#d0d4dc;font-size:.95rem}
.in button{background:#2d3b4c;border:none;border-radius:1rem;padding:.4rem 1rem;color:#d0d4dc;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:.35rem;background:#11171f;border-radius:1rem;padding:.45rem;border:1px solid #2a3544}
.row input{flex:1 1 120px}
.err{color:#f99;font-size:.8rem;text-align:center;min-height:1.1rem}
button{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <select id="model"><option>cargando…</option></select>
    <label class="sw"><input type="checkbox" id="agentOn"> con agente</label>
    <select id="agent"><option value="">agente</option></select>
    <select id="gh"><option>cuenta GitHub</option></select>
    <select id="group"><option>grupo</option></select>
    <button id="wfBtn" title="Añadir workflow">➕</button>
  </div>

  <div class="chat">
    <div class="hist" id="hist"><div class="msg a">Escribe tu mensaje. Con "con agente" activado, la orden va al agente elegido.</div></div>
    <div class="in">
      <button id="attach" title="Subir archivo">📎</button>
      <input type="file" id="file" style="display:none">
      <input type="text" id="txt" placeholder="Mensaje…">
      <button id="send">➤</button>
    </div>
  </div>

  <div class="row" id="wf" style="display:none">
    <input id="wfName" placeholder="Nombre del workflow">
    <input id="wfRepo" placeholder="Repo (ej. maxbry123-commits/agentes)">
    <input id="wfPlan" placeholder="Ruta del plan">
    <button id="wfSave">Guardar</button>
  </div>

  <div class="row">
    <button data-c="pause-agents">⏸️ Pausar agentes</button>
    <button data-c="resume-agents">▶️ Reanudar agentes</button>
    <button data-c="emergency-stop">🛑 Emergencia</button>
    <button data-c="resume-router">🔌 Encender Router</button>
    <button id="orderBtn">🗓️ Orden programada</button>
  </div>

  <div class="row">
    <input type="password" id="hfTok" placeholder="Token de HF">
    <input type="password" id="apiKey" placeholder="Clave del Router">
    <button id="saveKeys">Guardar claves</button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  const FLAG='https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag';
  let BASE='';
  const $=id=>document.getElementById(id);
  const say=m=>{$('err').textContent=m||''};
  const keys=()=>{try{return{hf:localStorage.getItem('HF_TOKEN')||'',api:localStorage.getItem('X_API_KEY')||''}}catch(e){return{hf:'',api:''}}};
  function hdr(json){const k=keys(),h={};if(json)h['Content-Type']='application/json';if(k.hf)h['Authorization']='Bearer '+k.hf;if(k.api)h['X-API-Key']=k.api;return h}
  async function api(path,opt){
    opt=opt||{};
    const r=await fetch(BASE+path,{method:opt.method||'GET',headers:hdr(!!opt.body),body:opt.body?JSON.stringify(opt.body):undefined});
    if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error('El Router respondió con error '+r.status+(t?': '+t.slice(0,80):''))}
    return r.json();
  }
  function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('hist').appendChild(d);$('hist').scrollTop=1e9}
  function fill(sel,items,first){const s=$(sel);s.innerHTML=first?'<option value="">'+first+'</option>':'';items.forEach(i=>{const o=document.createElement('option');o.value=i.v;o.text=i.t;s.add(o)})}

  async function loadAll(){
    try{const d=await api('/v1/models');const l=(d.data||d||[]).map(m=>({v:m.id||m,t:m.id||m}));fill('model',l.length?l:[{v:'',t:'sin modelos'}])}catch(e){fill('model',[{v:'',t:'sin conexión'}]);say(e.message)}
    try{const d=await api('/chat/agents');const l=(d.agents||d||[]).map(a=>({v:a.id||a.name||a,t:a.name||a.id||a}));fill('agent',l,'agente')}catch(e){}
    try{const d=await api('/gh/accounts');fill('gh',(d.accounts||[]).map(a=>({v:a,t:a})))}catch(e){}
    try{const d=await api('/groups');fill('group',Object.keys(d||{}).map(g=>({v:g,t:g})),'grupo')}catch(e){}
  }

  async function send(){
    const text=$('txt').value.trim();if(!text)return;
    add('u',text);$('txt').value='';say('');
    try{
      if($('agentOn').checked){
        const ag=$('agent').value;
        if(!ag){add('a','Elige un agente arriba para mandarle la orden.');return}
        await api('/control/order',{method:'POST',body:{agente:ag,orden:text}});
        add('a','Orden enviada a '+ag+'. Queda en la cola de órdenes.');
      }else{
        const d=await api('/v1/chat/completions',{method:'POST',body:{model:$('model').value,messages:[{role:'user',content:text}]}});
        add('a',(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||d.response||JSON.stringify(d).slice(0,300));
      }
    }catch(e){add('a','No se pudo: '+e.message)}
  }

  $('send').onclick=send;
  $('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  $('attach').onclick=()=>$('file').click();
  $('file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const fd=new FormData();fd.append('file',f);fd.append('chat_id','principal');
    try{const r=await fetch(BASE+'/chat/documents',{method:'POST',headers:hdr(false),body:fd});if(!r.ok)throw new Error('error '+r.status);say('Archivo subido: '+f.name)}catch(err){say('No se pudo subir el archivo ('+err.message+')')}
    e.target.value='';
  };
  $('wfBtn').onclick=()=>{$('wf').style.display=$('wf').style.display==='none'?'flex':'none'};
  $('wfSave').onclick=async()=>{
    const b={name:$('wfName').value.trim(),repo:$('wfRepo').value.trim(),plan_path:$('wfPlan').value.trim()};
    if(!b.name||!b.repo||!b.plan_path){say('Completa nombre, repo y ruta del plan');return}
    try{await api('/chat/storage',{method:'POST',body:b});say('Workflow guardado');$('wf').style.display='none'}catch(e){say(e.message)}
  };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{
    try{await api('/control/'+b.dataset.c,{method:'POST'});say(b.textContent.trim()+': hecho')}catch(e){say(e.message)}
  });
  $('orderBtn').onclick=async()=>{
    const ag=$('agent').value||prompt('¿Para qué agente?');if(!ag)return;
    const orden=prompt('Orden para '+ag+':');if(!orden)return;
    const cuando=prompt('¿Cuándo? (vacío = ahora, o fecha y hora)')||null;
    try{await api('/control/order',{method:'POST',body:{agente:ag,orden:orden,programada_para:cuando}});say('Orden programada guardada')}catch(e){say(e.message)}
  };
  $('saveKeys').onclick=()=>{try{localStorage.setItem('HF_TOKEN',$('hfTok').value.trim());localStorage.setItem('X_API_KEY',$('apiKey').value.trim());say('Claves guardadas en este navegador');loadAll()}catch(e){say('No se pudieron guardar las claves')}};

  (async()=>{
    const k=keys();$('hfTok').value=k.hf;$('apiKey').value=k.api;
    try{const t=await (await fetch(FLAG,{cache:'no-store'})).text();const m=t.match(/LIVE_URL=(\S+)/);BASE=m?m[1].replace(/\/$/,''):''}catch(e){}
    if(!BASE){say('No encuentro la dirección del Router');return}
    if(/PAUSED=true/.test(await (await fetch(FLAG,{cache:'no-store'})).text()))say('El Router está en pausa');
    loadAll();
  })();
})();
</script>
</body>
</html>
