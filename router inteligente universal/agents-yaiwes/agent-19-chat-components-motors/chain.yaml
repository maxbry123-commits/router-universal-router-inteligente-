schema: yaiwes.chain/v1
input_block: |
  LEY PERMANENTE DEL DIRECTOR: NO crear componentes desde cero.
  Para el CHAT usar componentes OSS existentes: motores canónicos -> descargar -> extraer -> adaptar/cablear -> incorporar.
  Open WebUI es la base obligatoria del chat; la UI HTML propia no es solución final.
  Este agente EJECUTA el motor real. Claude/orquestador solo audita y ordena.

agent:
  id: agent-19-chat-components-motors
  framework: pocketflow
  group: chat
  route: [deepseek_flash, minimax_m3, nvidia, groq, cerebras]
  fallback: []
  max_tokens: 800

context:
  text: |
    Motor canónico inmutable:
    ➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py
    Fuente: https://github.com/open-webui/open-webui
    Destino explícito:
    router inteligente universal/Componente open soure router inteligente universal/open-webui/
    PASS solo con ejecución real del motor + VERIFIED_CLOSED + publicación/read-back verificados.
    Prohibido: downloader alternativo, git clone/curl/wget/pip/npm para adquirir Open WebUI.

steps:
  - id: acquire_open_webui
    task: |
      Responde exactamente MOTOR_EXEC_REQUEST_OPEN_WEBUI.
      El Sheriff ejecutará el motor canónico real con la configuración fijada por el Director.
      No escribas código, no descargues por otro método y no declares PASS por texto.
    checks:
      - kind: contains
        values: [MOTOR_EXEC_REQUEST_OPEN_WEBUI]
      - kind: motor_exec
        path: "➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py"
        timeout: 1800
        env:
          SOURCE_REPO: "open-webui/open-webui"
          SOURCE_REF: "main"
          SLUG: "open-webui"
          DEST_REPO: "maxbry123-commits/router-universal-router-inteligente-"
          DEST_BRANCH: "main"
          DEST_ROOT: "router inteligente universal/Componente open soure router inteligente universal"
          PUBLISH: "1"
        expect:
          verdict: "VERIFIED_CLOSED"
          publish.verdict: "PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED"
      - kind: no_secrets
