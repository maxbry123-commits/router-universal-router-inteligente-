schema: yaiwes.chain/v1
input_block: |
  DIRECTOR 2026-09-25: descargar en la fábrica UI los componentes de chat y panel (motor A). Varios motores: si uno se cae otro avanza.
agent:
  id: agent-40-motor-frontend-a
  framework: pocketflow
  group: chat
  route: [nvidia, cerebras, groq]
  fallback: [deepseek_flash]
  max_tokens: 300
context:
  text: Motor canónico de descarga y extracción. Cada paso es independiente; si uno falla los demás siguen. Si el destino ya existe el motor solo verifica.
  motor: &m "➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py"
  destino: &d {DEST_REPO: "maxbry123-commits/frontend", DEST_BRANCH: main, DEST_ROOT: "UI YAIWES/componentes open soure UI YAIWES", PUBLISH: "1"}
  espera: &e {verdict: VERIFIED_CLOSED, publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED}
steps:
  - id: assistant_ui
    task: Responde exactamente MOTOR_EXEC_REQUEST_ASSISTANT_UI.
    checks:
      - {kind: contains, values: [MOTOR_EXEC_REQUEST_ASSISTANT_UI]}
      - {kind: motor_exec, path: *m, timeout: 1800, expect: *e, env: {<<: *d, SOURCE_REPO: "assistant-ui/assistant-ui", SOURCE_REF: main, SLUG: "assistant-ui"}}
      - {kind: no_secrets}
  - id: tool_ui
    task: Responde exactamente MOTOR_EXEC_REQUEST_TOOL_UI.
