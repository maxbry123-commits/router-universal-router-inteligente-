schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-39-descargas-verificadas
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 800
context:
  text: 'Mismo motor y patrón que agent-19 y agent-28. Si el destino ya existe, no
    es fallo del Director: el motor solo verifica.

    '
  max_chars: 40000
task: 'Responde exactamente MOTOR_EXEC_REQUEST_MEMANTO.

  '
checks:
- kind: contains
  values:
  - MOTOR_EXEC_REQUEST_MEMANTO
- kind: motor_exec
  path: ➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor
    descarga de componentes y extracción de zip/hf_download_extract_engine.py
  timeout: 1800
  env:
    SOURCE_REPO: moorcheh-ai/memanto
    SOURCE_REF: main
    SLUG: memanto
    DEST_REPO: maxbry123-commits/router-universal-router-inteligente-
    DEST_BRANCH: main
    DEST_ROOT: router inteligente universal/Componente open soure router inteligente
      universal
    PUBLISH: '1'
  expect:
    verdict: VERIFIED_CLOSED
    publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED
- kind: no_secrets
