schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-44-motor-hermes-openclaw
  framework: pocketflow
  group: chat
  route:
  - nvidia
  - groq
  fallback:
  - deepseek_flash
  max_tokens: 300
context:
  text: 'Motor canónico. Slug con la versión para no pisar la copia anterior; la vieja
    se retira después de verificar la nueva.


    SALIDA VERIFICADA DEL PASO ANTERIOR (hermes):

    MOTOR_EXEC_REQUEST_HERMES'
  max_chars: 40000
task: Responde exactamente MOTOR_EXEC_REQUEST_OPENCLAW.
checks:
- kind: contains
  values:
  - MOTOR_EXEC_REQUEST_OPENCLAW
- kind: motor_exec
  path: ➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor
    descarga de componentes y extracción de zip/hf_download_extract_engine.py
  timeout: 1800
  expect:
    verdict: VERIFIED_CLOSED
    publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED
  env:
    DEST_REPO: maxbry123-commits/router-universal-router-inteligente-
    DEST_BRANCH: main
    DEST_ROOT: router inteligente universal/Componente open soure router inteligente
      universal
    PUBLISH: '1'
    SOURCE_REPO: openclaw/openclaw
    SOURCE_REF: v2026.9.6
    SLUG: openclaw-v2026.9.6
- kind: no_secrets
