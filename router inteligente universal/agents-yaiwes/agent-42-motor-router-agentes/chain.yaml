schema: yaiwes.chain/v1
input_block: |
  DIRECTOR 2026-09-25: descargar en la raíz de agentes del Router el staff y el micro kernel (motor C).
agent:
  id: agent-42-motor-router-agentes
  framework: pocketflow
  group: chat
  route: [nvidia, cerebras, groq]
  fallback: [deepseek_flash]
  max_tokens: 300
context:
  text: Motor canónico de descarga y extracción. Cada paso es independiente; si uno falla los demás siguen. Si el destino ya existe el motor solo verifica.
  motor: &m "➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py"
  destino: &d {DEST_REPO: "maxbry123-commits/router-universal-router-inteligente-", DEST_BRANCH: main, DEST_ROOT: "router inteligente universal/Componente open soure router inteligente universal", PUBLISH: "1"}
  espera: &e {verdict: VERIFIED_CLOSED, publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED}
steps:
  - id: ruflo
    task: Responde exactamente MOTOR_EXEC_REQUEST_RUFLO.
    checks:
      - {kind: contains, values: [MOTOR_EXEC_REQUEST_RUFLO]}
      - {kind: motor_exec, path: *m, timeout: 1800, expect: *e, env: {<<: *d, SOURCE_REPO: "ruvnet/ruflo", SOURCE_REF: main, SLUG: "ruflo"}}
      - {kind: no_secrets}
