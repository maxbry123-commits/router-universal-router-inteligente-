context:
  text: "OBJETIVOS POR AGENTE (el juez solo da CERRADO con la prueba indicada):\n\
    16 UI Vercel → index.html + vercel.json en \"router inteligente universal/vercel-ui/\"\
    \ y la web de Vercel responde.\n17 Backend → openwebui_bridge.py + memory_adapter.py\
