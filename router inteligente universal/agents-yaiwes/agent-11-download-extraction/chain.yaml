schema: yaiwes.chain/v1

# Agente 11 — SOLO DESCARGA Y EXTRACCIÓN. Marco: SmolAgents. Su única responsabilidad: bajar y extraer componentes que otros necesiten
# (código de terceros, forks, herramientas) usando el motor determinista (common/download_donors.py), NUNCA instalar modelos ni tocar el Router.
# El agente 5 (auditor) revisa su trabajo en su siguiente pasada; Claude lee el resultado del auditor, no revisa el detalle línea por línea.
input_block: |
  Le das a un agente la responsabilidad de solo descargar y extracción de componentes tu solo luego revisa el agente revisa por ti
  Coloca a Microsoft Agent Framework como ORQUESTADOR CENTRAL del router inteligente universal mándalo a descargar con los motores

agent:
  id: agent-11-download-extraction
  framework: smolagents
  group: downloads
  route: [deepseek_flash, minimax_m3, groq, nvidia, cerebras]
  fallback: []
  max_tokens: 1800

context:
  text: |
    Pendiente de descargar/extraer, aparte de los 6 donantes ya bajados (Muse Code SDK, bucle de Muse Glimmer, MetaCua, CUA+MCP, SmolAgents,
    PocketFlow) y de llama-cpp-nanbeige-fork/omniroute-readme: los 15 componentes de Jev/System One (ver `jev_components.py`, ya escrito) y
    ahora Microsoft Agent Framework (https://github.com/microsoft/agent-framework, MIT, orquestador central pedido por el Director) —
    bajar su README.md y la carpeta principal de código (python/packages, si existe, o "python"). De cada uno basta el README.md y, si
    existe, la carpeta principal de código fuente — NO bajes node_modules, dist, ni carpetas de pruebas. Usa el mismo motor determinista
    (`common/download_donors.py`, límite 150 KB por archivo, 2 MB por donante). NO instales nada, NO lances ningún Job, NO toques el Router.

steps:

  - id: jev_components_list
    task: |
      Escribe el módulo Python `jev_components.py` (solo código, un único bloque ```python, solo biblioteca estándar) con el dict
      `JEV_COMPONENTS` con EXACTAMENTE estas 15 claves (usa el nombre del repo en minúsculas, con guiones donde el nombre original los
      tenga) y cada valor una tupla (url_de_github, lista_de_rutas_para_sparse_checkout): typesafe-skills, typesafe-sdk-python,
      typesafe-sdk-js, system-one-adapter-python, typesafe-router, jev-router, jev-codex-router, jev-mcp-jkudish, typesafe-jev-mcp,
      typesafe-mcp, jev-mcp-byk, jev-agent-skill-router, skillranker, jev-eval-agent, jev-system-one. Cada tupla: (url exacta del repo
      de GitHub que dio el Director, ["README.md", "src"]). Los dos repos con nombre repetido "jev-mcp" (de jkudish y de BYK) deben
      quedar como claves distintas: "jev-mcp-jkudish" y "jev-mcp-byk", cada uno con su URL correcta.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: jev_components.py
        test: |
          from jev_components import JEV_COMPONENTS
          assert len(JEV_COMPONENTS) == 15
          assert set(JEV_COMPONENTS) == {"typesafe-skills","typesafe-sdk-python","typesafe-sdk-js","system-one-adapter-python",
              "typesafe-router","jev-router","jev-codex-router","jev-mcp-jkudish","typesafe-jev-mcp","typesafe-mcp","jev-mcp-byk",
              "jev-agent-skill-router","skillranker","jev-eval-agent","jev-system-one"}
          for url, paths in JEV_COMPONENTS.values():
              assert url.startswith("https://github.com/") and paths == ["README.md", "src"]
          assert JEV_COMPONENTS["jev-mcp-jkudish"][0] != JEV_COMPONENTS["jev-mcp-byk"][0]
          assert JEV_COMPONENTS["jev-router"][0] == "https://github.com/gargpratyush/jev-router"
      - kind: no_secrets

  - id: ms_agent_framework_donor
    task: |
      Escribe el módulo Python `ms_agent_framework_donor.py` (solo código, un único bloque ```python, solo biblioteca estándar) con la
      tupla `MS_AGENT_FRAMEWORK = ("https://github.com/microsoft/agent-framework", ["README.md", "python"])`. Nada más en el archivo.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: ms_agent_framework_donor.py
        test: |
          from ms_agent_framework_donor import MS_AGENT_FRAMEWORK
          assert MS_AGENT_FRAMEWORK == ("https://github.com/microsoft/agent-framework", ["README.md", "python"])
      - kind: no_secrets

edges:
  - jev_components_list -> ms_agent_framework_donor
