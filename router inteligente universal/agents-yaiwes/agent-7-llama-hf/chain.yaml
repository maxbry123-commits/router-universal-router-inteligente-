schema: yaiwes.chain/v1

# Agente 7 - GOLDEN: llama_cmd/hf_job/bench_report + serve_health live.
# Cero regeneracion LLM si existe GOLDEN/<module>.py (smol short-circuit).
input_block: |
  NO regeneres codigo. Copia bytes de GOLDEN/<module>.py a results/.
  Pasos paper: llama_cmd, hf_job, bench_report.
  Meta live: serve_health -> RUNNING_HEALTHY + GET /health 200 (32 GB cpu-upgrade; LFM2.5 o probe job vivo).

agent:
  id: agent-7-llama-hf
  framework: smolagents
  group: hf-llama
  route: [minimax_m3, deepseek_flash, groq, nvidia, cerebras]
  fallback: []
  max_tokens: 800

context:
  text: |
    HECHOS: llama-server carga pesos UNA vez (mmap) compartidos por ranuras.
    GOLDEN short-circuit: si existe GOLDEN/<module>.py, smol_agent lo usa verbatim (cero LLM).
    serve_health: solo flavor cpu-upgrade (32 GB). Probe live job o lanza LFM2.5.
    Referencia live: job 6ab3198e51992417dfcd4e26 GET /health 200.

steps:

  - id: llama_cmd
    context_file:
      - router inteligente universal/agents-yaiwes/agent-7-llama-hf/GOLDEN/llama_cmd.py
    task: |
      Copia verbatim GOLDEN/llama_cmd.py a results/llama_cmd.py.
      Un solo bloque python identico al GOLDEN. No inventes codigo.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: llama_cmd.py
        test: |
          from llama_cmd import build_llama_cmd
          c = build_llama_cmd("/model/m.gguf")
          s = " ".join(c)
          assert c[0] == "llama-server" and "-m /model/m.gguf" in s
          for f in ["-c 16384", "-np 4", "-cb", "--cache-prompt", "--cache-reuse 256", "--cache-ram 512", "-fa on", "-ctk q8_0 -ctv q8_0", "-t 8", "--port 8080"]:
              assert f in s, f
          assert "--mlock" not in s
          d = " ".join(build_llama_cmd("/model/m.gguf", slots=2, ctx_per_slot=2048, kv="f16", cache_ram_mb=256, threads=4, draft_path="/model/d.gguf", mmproj_path="/model/mm.gguf", port=9000))
          assert "-c 4096" in d and "-np 2" in d and "-ctk" not in d and "--cache-ram 256" in d and "-md /model/d.gguf" in d and "--mmproj /model/mm.gguf" in d and "--port 9000" in d
          for bad in (dict(kv="q4_0", flash=False), dict(slots=0), dict(ctx_per_slot=100), dict(kv="q2")):
              try:
                  build_llama_cmd("/model/m.gguf", **bad)
                  raise SystemExit("acepto " + str(bad))
              except ValueError:
                  pass
      - kind: no_secrets

  - id: hf_job
    context_file:
      - router inteligente universal/agents-yaiwes/agent-7-llama-hf/GOLDEN/hf_job.py
    task: |
      Copia verbatim GOLDEN/hf_job.py a results/hf_job.py.
      Un solo bloque python identico al GOLDEN. No inventes codigo.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: hf_job.py
        test: |
          from hf_job import build_hf_job
          s = build_hf_job("LiquidAI/LFM2.5-1.2B-Instruct-GGUF", "LFM2.5-1.2B-Instruct-Q4_K_M.gguf")
          c = " ".join(s["command"])
          assert s["image"] == "ghcr.io/ggml-org/llama.cpp:server" and s["flavor"] == "cpu-upgrade" and s["expose"] == [8080]
          assert s["volumes"] == ["hf://models/LiquidAI/LFM2.5-1.2B-Instruct-GGUF:/model:ro"]
          for f in ["-m /model/LFM2.5-1.2B-Instruct-Q4_K_M.gguf", "-np 4", "-c 16384", "--cache-ram 512", "-ctk q8_0 -ctv q8_0", "-fa on"]:
              assert f in c, f
          s2 = build_hf_job("A/B", "m.gguf", slots=2, ctx_per_slot=2048, flavor="cpu-basic", port=9000)
          assert s2["expose"] == [9000] and "-c 4096" in " ".join(s2["command"]) and s2["flavor"] == "cpu-basic"
          for bad in ("sin-barra", "a/b/c", "/b", "a/"):
              try:
                  build_hf_job(bad, "m.gguf")
                  raise SystemExit("acepto " + bad)
              except ValueError:
                  pass
      - kind: no_secrets

  - id: bench_report
    context_file:
      - router inteligente universal/agents-yaiwes/agent-7-llama-hf/GOLDEN/bench_report.py
    task: |
      Copia verbatim GOLDEN/bench_report.py a results/bench_report.py.
      Un solo bloque python identico al GOLDEN. No inventes codigo.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: bench_report.py
        test: |
          from bench_report import summarize, slots_summary
          rows = [{"n_prompt": 256, "n_gen": 0, "avg_ts": 154.7}, {"n_prompt": 0, "n_gen": 128, "avg_ts": 28.2}]
          assert summarize(rows) == "pp256=154.7 t/s | tg128=28.2 t/s"
          assert slots_summary([(1, 64, 2.0), (4, 256, 4.0)]) == ["1 simult.: 32.0 t/s total (32.0 por agente)", "4 simult.: 64.0 t/s total (16.0 por agente)"]
      - kind: no_secrets

  - id: serve_health
    context_file:
      - router inteligente universal/agents-yaiwes/agent-7-llama-hf/GOLDEN/serve_health.py
      - router inteligente universal/agents-yaiwes/common/own_server_launch.py
      - router inteligente universal/agents-yaiwes/common/hardware_sheriff.py
    task: |
      Copia verbatim GOLDEN/serve_health.py a results/serve_health.py.
      Un solo bloque python identico al GOLDEN. No inventes codigo.
      Meta: RUNNING_HEALTHY via GET /health 200 (probe live o LFM2.5 en cpu-upgrade 32 GB).
    checks:
      - kind: python_ast
      - kind: contains
        values: ["own_server_main", "assert_machine_32gb_ram", "cpu-upgrade", "LFM2.5", "health"]
      - kind: python_exec
        module: serve_health.py
        test: |
          import os
          assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN"
          import serve_health as m
          src = open(m.__file__).read()
          assert "own_server_main" in src
          assert "cpu-upgrade" in src
          from serve_health import run_all, launch_and_verify
          raised = False
          try:
              launch_and_verify(flavor="cpu-basic")
          except ValueError:
              raised = True
          assert raised, "debia rechazar 16GB"
          results = run_all()
          assert len(results) == 1
          assert results[0]["status"] == "RUNNING_HEALTHY", results[0].get("detail")
          print(results[0])
      - kind: no_secrets

edges:
  - llama_cmd -> hf_job
  - hf_job -> bench_report
  - bench_report -> serve_health
