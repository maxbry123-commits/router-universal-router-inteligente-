schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-7-llama-hf
  framework: smolagents
  group: hf-llama
  route:
  - nvidia
  - groq
  - cerebras
  - minimax_m3
  fallback: []
  max_tokens: 800
context:
  text: "HECHOS: llama-server carga pesos UNA vez (mmap) compartidos por ranuras.\n\
    GOLDEN short-circuit: si existe GOLDEN/<module>.py, smol_agent lo usa verbatim\
    \ (cero LLM).\nserve_health: solo flavor cpu-upgrade (32 GB). Probe live job o\
    \ lanza LFM2.5.\nReferencia live: job 6ab3198e51992417dfcd4e26 GET /health 200.\n\
    \n\n=== ARCHIVO router inteligente universal/agents-yaiwes/agent-7-llama-hf/GOLDEN/serve_health.py\
    \ ===\n\"\"\"GOLDEN serve_health - NO regenerar.\nMaquina 32 GB (cpu-upgrade)\
    \ + LFM2.5, o probe live GET /health 200.\nMeta: RUNNING_HEALTHY. Cero regeneracion\
    \ LLM.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport sys\n\
    import time\nfrom pathlib import Path\n\nimport requests\nfrom huggingface_hub\
    \ import HfApi\n\n_COMMON = Path(__file__).resolve().parents[4] / \"common\"\n\
    if str(_COMMON) not in sys.path:\n    sys.path.insert(0, str(_COMMON))\n\nfrom\
    \ hardware_sheriff import HardwareSheriffError, assert_machine_32gb_ram, guarded_run_job\n\
    \nFLAVOR_32GB = \"cpu-upgrade\"\nPORT = 8080\n# Job vivo de referencia (agent-10\
    \ Own Server) - reusar si /health 200\nKNOWN_JOB_ID = os.environ.get(\"RIU_LIVE_JOB_ID\"\
