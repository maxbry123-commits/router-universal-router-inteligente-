schema: yaiwes.chain/v1
input_block: |
  PRIORIDAD CHAT. Este agente EJECUTA tareas del chat. NO audita, NO decide cierre, NO declara 100%.
  Claude/orquestador audita y decide. FAIL_CLOSED.

agent:
  id: agent-18-chat-final-auditor
  framework: pocketflow
  group: chat
  route: [deepseek_flash, minimax_m3, nvidia, groq, cerebras]
  fallback: []
  max_tokens: 2800

context:
  text: |
    Rol estricto: EJECUTOR.
    Claude/orquestador hace la auditoría y define PASS/FAIL.
    Reutiliza el Chat MVP existente. No crear otro chat ni otro Router.
    Este agente debe trabajar solo en cerrar el cableado visible de Archivos/Memoria y almacenamiento del chat.
    No escribir informes de auditoría.

steps:
  - id: storage_memory_panel
    task: |
      Escribe SOLO JavaScript en storage_memory_panel.js para el Chat MVP existente.
      Debe definir initStorageMemoryPanel(container, fetchJson) y mostrar un panel persistente "Archivos / Memoria".
      Debe permitir listar estado de almacenamiento con GET /chat/storage y subir documentos usando el endpoint existente del Chat MVP.
      Debe usar textContent para datos del servidor, sin innerHTML con datos externos, sin secretos y sin inventar endpoints nuevos.
    checks:
      - kind: js_syntax
        file: storage_memory_panel.js
      - kind: contains
        values: [initStorageMemoryPanel, /chat/storage, Archivos, Memoria]
      - kind: no_secrets

  - id: wire_storage_memory
    task: |
      Escribe SOLO JavaScript en wire_storage_memory.js que conecte initStorageMemoryPanel al sistema de paneles existente del chat.
      Debe reutilizar wirePanels/initVaultPanel/initRouterPanel/initJobsPanel si existen y añadir la sección Archivos / Memoria sin redefinirlos.
      No audites ni declares PASS global.
    checks:
      - kind: js_syntax
        file: wire_storage_memory.js
      - kind: contains
        values: [initStorageMemoryPanel, wirePanels, Archivos, Memoria]
      - kind: no_secrets

edges:
  - storage_memory_panel -> wire_storage_memory
