schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-36-panel-control
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 2000
context:
  text: 'Ya existe: ROUTER_JOB_PAUSE.flag (PAUSED=true/false) que pausa el Router
    por push. Encender el Job: POST a la API de HF Jobs con HF_TOKEN (variable de
    entorno).

    Nuevo: AGENTS_PAUSE.flag (PAUSED=true/false) que el ejecutor y el centinela respetan.

    Cola de órdenes: "Claude notas/ORDENES.json" [{id, hora, agente, orden, prioridad,
    programada_para, estado}]; el proceso persistente la lee cada minuto.

    Rutas del Router: /gh/agent-launch, /gh/file. Secretos solo por nombre: NVIDIA_API_KEY_1..5,
    CEREBRAS_API_KEY_1..6, HF_TOKEN_*; Groq sin secreto (GAP).

    '
  max_chars: 40000
task: 'Entrega el código Python completo de control_panel.py (APIRouter, prefijo /control):

  POST /control/pause-agents, POST /control/resume-agents (editan AGENTS_PAUSE.flag);

  POST /control/pause-router, POST /control/resume-router (editan ROUTER_JOB_PAUSE.flag);

  POST /control/start-job (relanza el Job con la API de HF solo si /health no responde);

  POST /control/order {agente, orden, programada_para?, prioridad} añade a ORDENES.json;

  POST /control/emergency-stop = pausa agentes + router en un solo paso. Protegido
  con X-API-Key. Solo el código.

  '
checks:
- kind: python_ast
- kind: min_chars
  value: 900
- kind: no_secrets
