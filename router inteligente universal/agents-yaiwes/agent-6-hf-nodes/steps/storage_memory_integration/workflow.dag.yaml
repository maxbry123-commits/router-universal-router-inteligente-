schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-6-hf-nodes
  framework: pocketflow
  group: chat-storage
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 3800
context:
  text: "OBJETIVO DE ALMACENAMIENTO/MEMORIA:\n\n1. PostgreSQL = verdad durable:\n\
    \   conversaciones, mensajes, usuarios/ids, tareas, estado, auditoría y referencias.\n\
    \n2. Redis = estado efímero:\n   cache, TTL, sesiones, locks, colas, rate-limit,\
    \ dedupe.\n   PROHIBIDO guardar secretos.\n\n3. Graphiti + FalkorDB = memoria\
    \ relacional/temporal:\n   entidades, hechos, relaciones, contexto temporal.\n\
    \n4. AgentDB = memoria agentic:\n   episodios, patrones, skills, decisiones reutilizables.\n\
    \n5. HF Storage Bucket / object storage:\n   archivos originales, adjuntos, artefactos,\
    \ snapshots y vault cifrado.\n\n6. Niveles de memoria:\n   - CHAT MEMORY\n   -\
    \ PROJECT MEMORY\n   - GLOBAL MEMORY\n\n7. Identificadores mínimos:\n   project_id\n\
    \   conversation_id\n   memory_id\n   file_id\n   file_version\n   file_hash\n\
    \   chunk_id\n   source_uri\n   created_at\n\n8. Persistencia obligatoria:\n \
    \  adjuntar archivo\n   -> cerrar chat\n   -> abrir nuevo/reabrir\n   -> recuperar\
    \ conversación\n   -> recuperar archivo\n   -> recuperar memoria/contexto.\n\n\
    9. Secret Bank:\n   solo referencias/credential_ref en memoria normal.\n   Nunca\
    \ secretos en PostgreSQL plano, Redis, logs o respuestas.\n\nCódigo existente\
    \ a revisar/reutilizar:\n- integration/chat_mvp/store.py\n- integration/chat_mvp/router.py\n\
    - integration/chat_mvp/vault_api.py\n- integration/chat_mvp/jobs.py\n- HF bucket/config\
    \ existente.\n\n\n=== ARCHIVO router inteligente universal/integration/chat_mvp/store.py\
    \ ===\n\"\"\"SQLite-backed storage for the chat MVP: SQL, graph, cache and documents\
    \ (stdlib only).\n\nFour storage systems share one data directory (mounted from\
    \ an HF bucket in the Space):\n  sql        conversations, messages, agents  \
    \    (SQLite)\n  graph      provenance graph: nodes + edges with valid_at (SQLite,\
    \ Graphiti-shaped, no LLM extraction)\n  cache      response cache with TTL and\
    \ hit counter (SQLite)\n  documents  attachments on disk, deduplicated by sha256,\
    \ metadata in SQLite\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\n\
    import json\nimport sqlite3\nimport threading\nimport time\nimport uuid\nfrom\
    \ pathlib import Path\nfrom typing import Any\n\nMAX_UPLOAD_BYTES = 10 * 1024\
    \ * 1024\nTEXT_EXT = {\".md\", \".txt\", \".py\", \".js\", \".ts\", \".tsx\",\
    \ \".jsx\", \".json\", \".yml\", \".yaml\", \".toml\", \".csv\", \".html\",\n\
    \            \".css\", \".sql\", \".sh\", \".ini\", \".cfg\", \".rs\", \".go\"\
    , \".java\", \".c\", \".h\", \".cpp\", \".xml\", \".log\"}\n\nSCHEMA = \"\"\"\n\
    CREATE TABLE IF NOT EXISTS conversations(id TEXT PRIMARY KEY, title TEXT, agent_id\
    \ TEXT, owner TEXT, created_at REAL);\nCREATE TABLE IF NOT EXISTS messages(id\
    \ INTEGER PRIMARY KEY AUTOINCREMENT, conv_id TEXT, role TEXT, content TEXT, provider\
    \ TEXT, model TEXT, created_at REAL);\nCREATE TABLE IF NOT EXISTS documents(id\
    \ TEXT PRIMARY KEY, name TEXT, mime TEXT, size INTEGER, path TEXT, conv_id TEXT,\
    \ is_text INTEGER, created_at REAL);\nCREATE TABLE IF NOT EXISTS cache(key TEXT\
    \ PRIMARY KEY, value TEXT, expires_at REAL, hits INTEGER DEFAULT 0);\nCREATE TABLE\
    \ IF NOT EXISTS graph_nodes(id TEXT PRIMARY KEY, kind TEXT, label TEXT, props\
    \ TEXT, created_at REAL);\nCREATE TABLE IF NOT EXISTS graph_edges(id INTEGER PRIMARY\
    \ KEY AUTOINCREMENT, src TEXT, dst TEXT, rel TEXT, valid_at REAL, props TEXT);\n\
    CREATE TABLE IF NOT EXISTS agents(id TEXT PRIMARY KEY, name TEXT, role TEXT, system_prompt\
    \ TEXT, models TEXT, created_at REAL);\n\"\"\"\n\nDEFAULT_AGENTS = (\n    (\"\
    orquestador-g0\", \"Orquestador (Grupo 0)\", \"orquestacion\",\n     \"Eres el\
    \ orquestador del Grupo 0. Descompones la tarea, decides qué agente o herramienta\
    \ interviene y respondes con un plan breve y accionable.\"),\n    (\"seals-team-yaiwes-001\"\
    , \"Seals Team YAIWES 001\", \"code\",\n     \"Eres un agente Seals Team YAIWES\
    \ especializado en código. Produces parches mínimos y verificables, explicas solo\
    \ lo necesario y señalas cualquier GAP.\"),\n)\n\n\nclass Store:\n    def __init__(self,\
    \ data_dir: str | Path) -> None:\n        self.dir = Path(data_dir)\n        (self.dir\
    \ / \"docs\").mkdir(parents=True, exist_ok=True)\n        self.db_path = self.dir\
    \ / \"riu_chat.sqlite3\"\n        self._lock = threading.RLock()\n        self._db\
    \ = sqlite3.connect(str(self.db_path), check_same_thread=False)\n        self._db.row_factory\
    \ = sqlite3.Row\n        with self._lock:\n            self._db.executescript(SCHEMA)\n\
    \            self._db.commit()\n        if not self.agents():\n            for\
    \ aid, name, role, prompt in DEFAULT_AGENTS:\n                self.upsert_agent(aid,\
    \ name, role, prompt, [])\n\n    # -- low level -----------------------------------------------------------------\n\
    \    def _all(self, sql: str, params: tuple = ()) -> list[dict[str, Any]]:\n \
    \       with self._lock:\n            return [dict(r) for r in self._db.execute(sql,\
    \ params).fetchall()]\n\n    def _exec(self, sql: str, params: tuple = ()) ->\
    \ int:\n        with self._lock:\n            cur = self._db.execute(sql, params)\n\
    \            self._db.commit()\n            return cur.lastrowid or 0\n\n    #\
    \ -- sql: conversations / messages ---------------------------------------------\n\
    \    def new_conversation(self, title: str, agent_id: str | None, owner: str)\
    \ -> str:\n        cid = uuid.uuid4().hex[:16]\n        self._exec(\"INSERT INTO\
    \ conversations VALUES(?,?,?,?,?)\", (cid, title[:80], agent_id, owner, time.time()))\n\
    \        return cid\n\n    def conversation(self, cid: str) -> dict[str, Any]\
    \ | None:\n        rows = self._all(\"SELECT * FROM conversations WHERE id=?\"\
    , (cid,))\n        return rows[0] if rows else None\n\n    def conversations(self,\
    \ owner: str, limit: int = 50) -> list[dict[str, Any]]:\n        return self._all(\"\
    SELECT * FROM conversations WHERE owner=? ORDER BY created_at DESC LIMIT ?\",\
    \ (owner, limit))\n\n    def add_message(self, cid: str, role: str, content: str,\
    \ provider: str | None = None, model: str | None = None) -> None:\n        self._exec(\"\
    INSERT INTO messages(conv_id,role,content,provider,model,created_at) VALUES(?,?,?,?,?,?)\"\
    ,\n                   (cid, role, content, provider, model, time.time()))\n\n\
    \    def messages(self, cid: str, limit: int = 40) -> list[dict[str, Any]]:\n\
    \        rows = self._all(\"SELECT role,content,provider,model,created_at FROM\
    \ messages WHERE conv_id=? ORDER BY id DESC LIMIT ?\", (cid, limit))\n       \
    \ return list(reversed(rows))\n\n    # -- documents -----------------------------------------------------------------\n\
    \    def put_document(self, name: str, mime: str, data: bytes, conv_id: str |\
    \ None = None) -> dict[str, Any]:\n        if not data:\n            raise ValueError(\"\
    DOCUMENT_EMPTY\")\n        if len(data) > MAX_UPLOAD_BYTES:\n            raise\
    \ ValueError(\"DOCUMENT_TOO_LARGE\")\n        did = hashlib.sha256(data).hexdigest()[:24]\n\
    \        safe_name = Path(name).name[:120] or \"documento\"\n        is_text =\
    \ int(mime.startswith(\"text/\") or mime in {\"application/json\", \"application/xml\"\
    , \"application/x-yaml\"}\n                      or Path(safe_name).suffix.lower()\
    \ in TEXT_EXT)\n        path = self.dir / \"docs\" / did\n        if not path.exists():\n\
    \            path.write_bytes(data)\n        self._exec(\"INSERT OR REPLACE INTO\
    \ documents VALUES(?,?,?,?,?,?,?,?)\",\n                   (did, safe_name, mime[:100],\
    \ len(data), str(path), conv_id, is_text, time.time()))\n        return self.document(did)\
    \ or {}\n\n    def document(self, did: str) -> dict[str, Any] | None:\n      \
    \  rows = self._all(\"SELECT id,name,mime,size,conv_id,is_text,created_at FROM\
    \ documents WHERE id=?\", (did,))\n        return rows[0] if rows else None\n\n\
    \    def documents(self) -> list[dict[str, Any]]:\n        return self._all(\"\
    SELECT id,name,mime,size,conv_id,is_text,created_at FROM documents ORDER BY created_at\
    \ DESC\")\n\n    def document_text(self, did: str, limit: int = 12000) -> str\
    \ | None:\n        rows = self._all(\"SELECT path,is_text FROM documents WHERE\
    \ id=?\", (did,))\n        if not rows or not rows[0][\"is_text\"]:\n        \
    \    return None\n        text = Path(rows[0][\"path\"]).read_bytes().decode(\"\
    utf-8\", errors=\"replace\")\n        return text if len(text) <= limit else text[:limit]\
    \ + \"\\n[... truncado]\"\n\n    def delete_document(self, did: str) -> bool:\n\
    \        rows = self._all(\"SELECT path FROM documents WHERE id=?\", (did,))\n\
    \        if not rows:\n            return False\n        Path(rows[0][\"path\"\
    ]).unlink(missing_ok=True)\n        self._exec(\"DELETE FROM documents WHERE id=?\"\
    , (did,))\n        return True\n\n    # -- cache ---------------------------------------------------------------------\n\
    \    def cache_get(self, key: str) -> Any | None:\n        rows = self._all(\"\
    SELECT value,expires_at FROM cache WHERE key=?\", (key,))\n        if not rows\
    \ or rows[0][\"expires_at\"] < time.time():\n            return None\n       \
    \ self._exec(\"UPDATE cache SET hits=hits+1 WHERE key=?\", (key,))\n        return\
    \ json.loads(rows[0][\"value\"])\n\n    def cache_put(self, key: str, value: Any,\
    \ ttl: float = 3600.0) -> None:\n        # Upsert keeps the hit counter when an\
    \ entry is refreshed (total hits stay accurate).\n        self._exec(\"INSERT\
    \ INTO cache(key,value,expires_at,hits) VALUES(?,?,?,0) \"\n                 \
    \  \"ON CONFLICT(key) DO UPDATE SET value=excluded.value, expires_at=excluded.expires_at\"\
    ,\n                   (key, json.dumps(value), time.time() + ttl))\n\n    # --\
    \ graph ---------------------------------------------------------------------\n\
    \    def graph_node(self, node_id: str, kind: str, label: str, **props: Any) ->\
    \ None:\n        self._exec(\"INSERT INTO graph_nodes VALUES(?,?,?,?,?) ON CONFLICT(id)\
    \ DO UPDATE SET label=excluded.label, props=excluded.props\",\n              \
    \     (node_id, kind, label[:120], json.dumps(props), time.time()))\n\n    def\
    \ graph_link(self, src: str, dst: str, rel: str, **props: Any) -> None:\n    \
    \    self._exec(\"INSERT INTO graph_edges(src,dst,rel,valid_at,props) VALUES(?,?,?,?,?)\"\
    , (src, dst, rel, time.time(), json.dumps(props)))\n\n    def graph_view(self,\
    \ limit: int = 200) -> dict[str, Any]:\n        edges = self._all(\"SELECT src,dst,rel,valid_at\
    \ FROM graph_edges ORDER BY id DESC LIMIT ?\", (limit,))\n        ids = {e[\"\
    src\"] for e in edges} | {e[\"dst\"] for e in edges}\n        nodes = [n for n\
    \ in self._all(\"SELECT id,kind,label FROM graph_nodes ORDER BY created_at DESC\
    \ LIMIT ?\", (limit * 2,)) if n[\"id\"] in ids]\n        return {\"nodes\": nodes,\
    \ \"edges\": edges}\n\n    def record_turn(self, *, conv_id: str, owner: str,\
    \ provider: str, model: str, agent_id: str | None,\n                    doc_ids:\
    \ list[str], repo: str | None = None) -> None:\n        self.graph_node(f\"owner:{owner}\"\
    , \"owner\", owner)\n        self.graph_node(f\"conv:{conv_id}\", \"conversation\"\
    , conv_id)\n        self.graph_node(f\"model:{provider}/{model}\", \"model\",\
    \ f\"{provider}/{model}\")\n        self.graph_link(f\"owner:{owner}\", f\"conv:{conv_id}\"\
    , \"started\")\n        self.graph_link(f\"conv:{conv_id}\", f\"model:{provider}/{model}\"\
    , \"used_model\")\n        if agent_id:\n            self.graph_node(f\"agent:{agent_id}\"\
    , \"agent\", agent_id)\n            self.graph_link(f\"conv:{conv_id}\", f\"agent:{agent_id}\"\
    , \"ran_agent\")\n        for did in doc_ids:\n            doc = self.document(did)\n\
    \            if doc:\n                self.graph_node(f\"doc:{did}\", \"document\"\
    , doc[\"name\"])\n                self.graph_link(f\"conv:{conv_id}\", f\"doc:{did}\"\
    , \"attached\")\n        if repo:\n            self.graph_node(f\"repo:{repo}\"\
    , \"repo\", repo)\n            self.graph_link(f\"conv:{conv_id}\", f\"repo:{repo}\"\
    , \"linked_repo\")\n\n    # -- agents --------------------------------------------------------------------\n\
    \    def upsert_agent(self, agent_id: str, name: str, role: str, system_prompt:\
    \ str, models: list[str]) -> None:\n        self._exec(\"INSERT INTO agents VALUES(?,?,?,?,?,?)\
    \ ON CONFLICT(id) DO UPDATE SET name=excluded.name, role=excluded.role, system_prompt=excluded.system_prompt,\
    \ models=excluded.models\",\n                   (agent_id, name, role, system_prompt,\
    \ json.dumps(models), time.time()))\n\n    def agents(self) -> list[dict[str,\
    \ Any]]:\n        rows = self._all(\"SELECT * FROM agents ORDER BY id\")\n   \
    \     for r in rows:\n            r[\"models\"] = json.loads(r[\"models\"] or\
    \ \"[]\")\n        return rows\n\n    def agent(self, agent_id: str) -> dict[str,\
    \ Any] | None:\n        return next((a for a in self.agents() if a[\"id\"] ==\
    \ agent_id), None)\n\n    def delete_agent(self, agent_id: str) -> bool:\n   \
    \     exists = self.agent(agent_id) is not None\n        self._exec(\"DELETE FROM\
    \ agents WHERE id=?\", (agent_id,))\n        return exists\n\n    # -- stats /\
    \ snapshot ----------------------------------------------------------\n    def\
    \ stats(self) -> dict[str, Any]:\n        one = lambda sql: (self._all(sql) or\
    \ [{\"n\": 0}])[0][\"n\"] or 0  # noqa: E731\n        return {\n            \"\
    sql\": {\"path\": str(self.db_path), \"conversations\": one(\"SELECT COUNT(*)\
    \ n FROM conversations\"),\n                    \"messages\": one(\"SELECT COUNT(*)\
    \ n FROM messages\"), \"agents\": one(\"SELECT COUNT(*) n FROM agents\")},\n \
    \           \"graph\": {\"nodes\": one(\"SELECT COUNT(*) n FROM graph_nodes\"\
    ), \"edges\": one(\"SELECT COUNT(*) n FROM graph_edges\")},\n            \"cache\"\
    : {\"entries\": one(\"SELECT COUNT(*) n FROM cache\"), \"hits\": one(\"SELECT\
    \ SUM(hits) n FROM cache\")},\n            \"documents\": {\"count\": one(\"SELECT\
    \ COUNT(*) n FROM documents\"), \"bytes\": one(\"SELECT SUM(size) n FROM documents\"\
    )},\n        }\n\n    def snapshot(self, dest: str | Path) -> Path:\n        dest\
    \ = Path(dest)\n        target = sqlite3.connect(str(dest))\n        with self._lock:\n\
    \            self._db.backup(target)\n        target.close()\n        return dest\n\
    \n\n=== ARCHIVO router inteligente universal/integration/chat_mvp/router.py ===\n\
    \"\"\"Chat MVP HTTP surface: providers, chat, agents, documents, GitHub accounts,\
    \ storage, usage, DAG and graph.\n\nEvery /chat/* data endpoint requires a Router\
    \ API key (env RIU_AGENT_API_KEYS or the certified MAXBRY keystore).\nProvider\
    \ keys and GitHub tokens come from the server environment or from per-request\
    \ BYOK headers\n(X-Provider-Key, X-Provider-Keys as JSON, X-GitHub-Token); they\
    \ are never stored, logged or returned.\nChat turns go through the certified hot\
    \ path: FastAPI -> Enchufe Gate -> RedUniversal -> provider executor.\nCost: response\
    \ cache ON by default, prefix-stable prompts and a usage log (see core.py / usage.py).\n\
    \"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport base64\n\
    import json\nimport os\nimport tempfile\nfrom pathlib import Path\nfrom typing\
    \ import Any, Callable\n\nfrom fastapi import APIRouter, Depends, Header, HTTPException\n\
    from fastapi.responses import HTMLResponse\nfrom pydantic import BaseModel, Field\n\
    \nfrom ..huggingface.api_key_auth import authenticate_api_key\nfrom ..huggingface.chat_catalog\
    \ import cached_discovery, family_of, selector_models\nfrom . import core\nfrom\
    \ . import dag as dagmod\nfrom . import dag_cli\nfrom . import github_tools as\
    \ gh\nfrom . import providers as prov\nfrom .store import Store\nfrom .usage import\
    \ UsageLog, normalize_usage\n\n_UI = Path(__file__).with_name(\"chat_ui.html\"\
    )\n_store: Store | None = None\n\n\ndef get_store() -> Store:\n    global _store\n\
    \    if _store is None:\n        default = Path(\"/data\") if os.access(\"/data\"\
    , os.W_OK) else Path.cwd() / \"riu_data\"\n        _store = Store(os.getenv(\"\
    RIU_DATA_DIR\") or default)\n    return _store\n\n\ndef set_store(store: Store\
    \ | None) -> None:\n    global _store\n    _store = store\n\n\ndef _auth(\n  \
    \  x_api_key: str | None = Header(default=None, alias=\"X-API-Key\"),\n    authorization:\
    \ str | None = Header(default=None),\n) -> str:\n    candidate = x_api_key\n \
    \   if not candidate and authorization and authorization.lower().startswith(\"\
    bearer \"):\n        candidate = authorization[7:].strip()\n    try:\n       \
    \ return authenticate_api_key(candidate)\n    except RuntimeError as exc:\n  \
    \      raise HTTPException(status_code=401, detail=str(exc)) from exc\n\n\ndef\
    \ sync_to_bucket(store: Store, bucket_id: str, token: str, *, fs_factory: Callable[...,\
    \ Any] | None = None) -> dict[str, Any]:\n    \"\"\"Copy the SQLite snapshot and\
    \ documents into an HF storage bucket (needs a write token).\"\"\"\n    if fs_factory\
    \ is None:\n        from huggingface_hub import HfFileSystem as fs_factory  #\
    \ noqa: N813\n    fs = fs_factory(token=token)\n    base = f\"buckets/{bucket_id}/riu-chat\"\
    \n    files = 0\n    with tempfile.TemporaryDirectory() as tmp:\n        snap\
    \ = store.snapshot(Path(tmp) / \"riu_chat.sqlite3\")\n        fs.pipe_file(f\"\
    {base}/riu_chat.sqlite3\", snap.read_bytes())\n        files += 1\n    for doc\
    \ in store.documents():\n        fs.pipe_file(f\"{base}/docs/{doc['id']}\", (store.dir\
    \ / \"docs\" / doc[\"id\"]).read_bytes())\n        files += 1\n    return {\"\
    bucket\": bucket_id, \"files\": files}\n\n\nclass SendReq(BaseModel):\n    message:\
    \ str = Field(min_length=1, max_length=20000)\n    provider: str = \"hf\"\n  \
    \  model: str\n    conversation_id: str | None = None\n    mode: str = \"direct\"\
    \  # direct = sin agente, agent = con agente\n    agent_id: str | None = None\n\
    \    doc_ids: list[str] = []\n    cache: bool = True  # exact-match response cache\
    \ (skipped when temperature > 0)\n    refresh: bool = False  # bypass the cache\
    \ read and overwrite the entry\n    max_tokens: int = Field(default=1024, ge=1,\
    \ le=8192)\n    temperature: float | None = None\n    github: dict[str, str] |\
    \ None = None  # {\"account\": ..., \"repo\": ...} provenance only\n\n\nclass\
    \ DocReq(BaseModel):\n    name: str = Field(min_length=1, max_length=200)\n  \
    \  mime: str = \"application/octet-stream\"\n    data_b64: str\n    conversation_id:\
    \ str | None = None\n\n\nclass AgentReq(BaseModel):\n    id: str = Field(pattern=r\"\
    ^[a-z0-9][a-z0-9_-]{1,63}$\")\n    name: str = Field(min_length=1, max_length=120)\n\
    \    role: str = \"general\"\n    system_prompt: str = \"\"\n    models: list[str]\
    \ = []\n\n\nclass CommitReq(BaseModel):\n    account: str\n    repo: str = Field(pattern=r\"\
    ^[\\w.-]+/[\\w.-]+$\")\n    path: str = Field(min_length=1, max_length=300)\n\
    \    content: str\n    message: str = Field(default=\"chat: update from RIU chat\"\
    , max_length=200)\n    branch: str | None = None\n\n\nclass DagReq(BaseModel):\n\
    \    dag: dict[str, Any]\n\n\ndef _gh_token(account: str, byok: str | None) ->\
    \ str:\n    token = gh.token_for(account, byok)\n    if not token:\n        raise\
    \ HTTPException(status_code=400, detail=\"GITHUB_ACCOUNT_NOT_CONFIGURED\")\n \
    \   return token\n\n\ndef _gh(fn: Callable[..., Any], *args: Any, **kwargs: Any)\
    \ -> Any:\n    try:\n        return fn(*args, **kwargs)\n    except gh.GitHubError\
    \ as exc:\n        raise HTTPException(status_code=404 if str(exc.status) == \"\
    404\" else 502, detail=str(exc)) from exc\n\n\ndef build_router() -> APIRouter:\n\
    \    r = APIRouter()\n\n    @r.get(\"/chat\", response_class=HTMLResponse)\n \
    \   def page() -> HTMLResponse:\n        return HTMLResponse(_UI.read_text(encoding=\"\
    utf-8\"))\n\n    @r.get(\"/chat/providers\")\n    def providers() -> dict[str,\
    \ Any]:\n        return {\"live_provider_inference\": core.live_enabled(),\n \
    \               \"providers\": [{\"id\": k, \"label\": v[\"label\"], \"configured\"\
    : prov.configured(k)} for k, v in prov.PROVIDERS.items()]}\n\n    @r.get(\"/chat/providers/{provider}/models\"\
    )\n    def provider_models(provider: str, _owner: str = Depends(_auth),\n    \
    \                    x_provider_key: str | None = Header(default=None, alias=\"\
    X-Provider-Key\")) -> dict[str, Any]:\n        if provider not in prov.PROVIDERS:\n\
    \            raise HTTPException(status_code=404, detail=\"PROVIDER_UNKNOWN\"\
    )\n        if provider == \"hf\":\n            rows = selector_models(discovered=core.cached_discovery(),\
    \ live_enabled=core.live_enabled())[\"models\"]\n            return {\"provider\"\
    : \"hf\", \"models\": rows}\n        key = prov.resolve_key(provider, x_provider_key)\n\
    \        if not key and provider != \"local\":\n            raise HTTPException(status_code=400,\
    \ detail=\"PROVIDER_KEY_MISSING\")\n        try:\n            ids = prov.list_models(provider,\
    \ key)\n        except prov.ProviderError as exc:\n            raise HTTPException(status_code=502,\
    \ detail=str(exc)) from exc\n        ids = sorted(ids, key=lambda i: (family_of(i)\
    \ is None, i))\n        return {\"provider\": provider, \"models\": [{\"label\"\
    : i, \"model_id\": i, \"state\": \"PROVIDER_CATALOG\", \"certified\": False,\n\
    \                                                  \"selectable\": True, \"suggested\"\
    : family_of(i) is not None} for i in ids]}\n\n    @r.post(\"/chat/send\")\n  \
    \  async def send(req: SendReq, owner: str = Depends(_auth),\n               \
    \    x_provider_key: str | None = Header(default=None, alias=\"X-Provider-Key\"\
    )) -> dict[str, Any]:\n        st = get_store()\n        if req.provider not in\
    \ prov.PROVIDERS:\n            raise HTTPException(status_code=400, detail=\"\
    PROVIDER_UNKNOWN\")\n        if req.mode not in {\"direct\", \"agent\"}:\n   \
    \         raise HTTPException(status_code=400, detail=\"MODE_INVALID\")\n    \
    \    agent = None\n        if req.mode == \"agent\":\n            agent = st.agent(req.agent_id\
    \ or \"\")\n            if not agent:\n                raise HTTPException(status_code=400,\
