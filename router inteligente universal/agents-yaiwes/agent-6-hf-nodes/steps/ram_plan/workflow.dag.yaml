schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-6-hf-nodes
  framework: pocketflow
  group: hf-nodes
  route:
  - minimax_m3
  - deepseek_flash
  - groq
  - nvidia
  - cerebras
  fallback: []
  max_tokens: 2500
context:
  text: 'HECHOS: cada nodo HF = 8 vCPU / 32 GB RAM. Un servidor llama.cpp carga los
    pesos UNA vez (mmap) y los comparten todas las ranuras (-np); el consumo extra

    por ranura es su caché KV: kv_mb = 2 * capas * cabezas_kv * dim_cabeza * tokens_de_contexto
    * bytes_por_elemento / 1e6 (K y V; f16 = 2 bytes, q8_0 ~ 1 byte,

    q4_0 ~ 0.5 bytes). Regla del Director para la RAM: normal 0-20 GB; 20-24 GB no
    cargar otro modelo grande; 24-27 GB reducir ranuras/contexto; > 27 GB descargar

    el inactivo; ~30 GB tope. Estados por carga = max(RAM %, CPU %): < 80 GREEN, 80-90
    YELLOW, 90-95 DRAIN, >= 95 CLOSED. Si un nodo no puede aceptar, se salta al siguiente.

    Medido (runner de 4 vCPU): Qwen3.5-0.8B Q4_0 (563 MB) pp256 154.7 t/s, tg128 28.2
    t/s; LFM2.5-1.2B Q4_K_M (731 MB) pp256 103.3 t/s, tg128 30.4 t/s.

    '
  max_chars: 40000
task: "Escribe el módulo Python `hf_nodes.py` (solo código, un único bloque ```python,\
  \ solo biblioteca estándar) con:\n- `NODES`: lista de 10 dicts {\"id\": \"HF-01\"\
  \ ... \"HF-10\", \"ram_gb\": 32, \"vcpu\": 8}.\n- `kv_cache_mb(n_layers, n_kv_heads,\
  \ head_dim, ctx_tokens, bytes_per_elem) -> float` = 2 * n_layers * n_kv_heads *\
  \ head_dim * ctx_tokens * bytes_per_elem / 1e6.\n- `plan_slots(weights_mb, kv_mb_per_slot,\
  \ slots, ram_cap_mb, overhead_mb=1500) -> dict` con \"total_mb\" = weights_mb (UNA\
  \ sola copia compartida) + slots * kv_mb_per_slot + overhead_mb,\n  \"fits\" (total_mb\
  \ <= ram_cap_mb) y \"max_slots\" = máximo entero de ranuras que caben (mínimo 0).\n\
  - `reduce_ctx_to_fit(weights_mb, kv_mb_per_1k_tokens, slots, ram_cap_mb, ctx_start=8192,\
  \ ctx_min=2048, overhead_mb=1500) -> int | None`: reduce el contexto por ranura\
  \ a la mitad\n  (8192 -> 4096 -> 2048) hasta que quepa; devuelve el contexto por\
  \ ranura que cabe o None si ni con ctx_min cabe. El KV de una ranura es kv_mb_per_1k_tokens\
  \ * ctx / 1000\n  y el total es weights_mb + slots * KV_de_una_ranura + overhead_mb.\n"
checks:
- kind: python_ast
- kind: python_exec
  module: hf_nodes.py
  test: 'from hf_nodes import NODES, kv_cache_mb, plan_slots, reduce_ctx_to_fit

    assert len(NODES) == 10 and NODES[0]["id"] == "HF-01" and NODES[9]["id"] == "HF-10"
    and all(n["ram_gb"] == 32 and n["vcpu"] == 8 for n in NODES)

    assert abs(kv_cache_mb(24, 8, 64, 4096, 2) - 2 * 24 * 8 * 64 * 4096 * 2 / 1e6)
    < 1e-6

    p = plan_slots(600, 200, 4, 24000)

    assert p["total_mb"] == 600 + 4 * 200 + 1500 and p["fits"] is True and p["max_slots"]
    == (24000 - 600 - 1500) // 200

    assert plan_slots(600, 200, 200, 24000)["fits"] is False and plan_slots(30000,
    200, 4, 24000)["max_slots"] == 0

    assert reduce_ctx_to_fit(600, 100, 4, 24000) == 8192

    assert reduce_ctx_to_fit(600, 500, 4, 9000) == 2048

    assert reduce_ctx_to_fit(600, 6000, 4, 6000) is None

    '
- kind: no_secrets
