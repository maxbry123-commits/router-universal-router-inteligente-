schema: yaiwes.chain/v1

# Agente 14 — ORQUESTADOR CENTRAL: Microsoft Agent Framework. Marco: PocketFlow. De principio a fin dentro de su propio paso: instala el
# paquete y demuestra una conexión real con DeepSeek vía HF_TOKEN.
input_block: |
  Manda un nuevo 2 agente que se encargue... usen los motores y conecten todo con HF token 1 deepsek
  Coloca a Microsoft Agent Framework como ORQUESTADOR CENTRAL... mándalo a descargar con los motores

agent:
  id: agent-14-orchestrator-msaf
  framework: pocketflow
  group: orchestrators
  route: [nvidia, groq, cerebras]
  fallback: [deepseek_flash]
  max_tokens: 2400

context:
  text: |
    Microsoft Agent Framework (microsoft/agent-framework, MIT) se instala con `pip install agent-framework`. Expone un protocolo compatible
    con la API de OpenAI para sus adaptadores de modelo, que es la misma forma que usa DeepSeek vía el router de HF (base
    https://router.huggingface.co/v1, token en la variable de entorno HF_TOKEN). Objetivo: instalar el paquete y demostrar UNA llamada real
    a DeepSeek (deepseek-ai/DeepSeek-V4-Flash) con ese cliente compatible con OpenAI.

steps:

  - id: install_and_connect
    task: |
      Escribe el módulo Python `msaf_connect.py` (un único bloque ```python) con la función `connect_and_ping() -> dict` que: 1) hace
      `import subprocess, sys; subprocess.run([sys.executable, "-m", "pip", "install", "-q", "agent-framework", "--break-system-packages"], check=True)`;
      2) crea un cliente `openai.OpenAI(base_url="https://router.huggingface.co/v1", api_key=os.environ["HF_TOKEN"])` (el protocolo que usa
      Agent Framework por debajo); 3) envía UN mensaje ("Responde solo con la palabra OK.") a "deepseek-ai/DeepSeek-V4-Flash" y devuelve
      {"installed": True, "reply": texto}. Si algo falla de verdad, deja que la excepción se propague.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: msaf_connect.py
        test: |
          import os
          assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN"
          from msaf_connect import connect_and_ping
          r = connect_and_ping()
          assert r["installed"] is True and r["reply"].strip(), r
          print(r)
      - kind: no_secrets

edges: []
