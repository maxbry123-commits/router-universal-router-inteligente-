    FUENTE DE VERDAD:
    ➡️ ➡️ 📂 osquestador comand Center.md

    OPEN WEBUI:
    - ya descargado
    - manifest verificado
    - NO volver a descargar

    OBJETIVOS FUNCIONALES OBLIGATORIOS DEL CHAT:
    1. Open WebUI real como interfaz base.
    2. Router YAIWES como entrada única OpenAI-compatible.
    3. GET /v1/models operativo.
    4. POST /v1/chat/completions operativo con respuesta real.
    5. Selector de modelos visible y funcional.
    6. Modo SIN AGENTE.
    7. Modo CON AGENTE y selector de agente.
    8. Integración GitHub: cuentas, repos, leer/escribir según permisos.
    9. Integración Hugging Face.
    10. HF Jobs SOLO 32 GB RAM.
    11. Documentos/archivos adjuntos.
    12. Archivos/Memoria persistente.
    13. CHAT MEMORY.
    14. PROJECT MEMORY.
    15. GLOBAL MEMORY.
    16. Secret Bank propio cifrado; agentes usan credential_ref/broker.
    17. Persistencia de conversaciones y archivos.
    18. PostgreSQL como verdad/estado cuando aplique.
    19. Redis para cache/TTL/sesión/locks/colas cuando aplique.
    20. Graphiti + FalkorDB para memoria relacional/temporal cuando aplique.
    21. AgentDB para episodios/skills/patrones cuando aplique.
    22. HF Storage Bucket/objeto para archivos, memoria y artefactos.
    23. Estado Router/Jobs visible.
    24. Crazy Wall/Handoff accesible.
    25. Preservar y reutilizar Chat MVP y código adicional existente.
    26. Reutilizar componentes OSS antes de escribir código nuevo.
    27. Componentes externos SOLO por motores canónicos.
    28. Cero sobreingeniería: máximo 3 pasos por tarea.
    29. URL/chat usable.
    30. Autenticación cuando corresponda.
    31. Prueba browser/mobile si el entorno lo permite.
    32. Mensaje real de usuario -> respuesta real.
    33. Prueba con agente y sin agente.
    34. Adjuntar archivo -> cerrar -> reabrir -> recuperar conversación/archivo/memoria.
    35. No secretos en logs/UI/Redis/respuestas.
    36. No falso PASS.

    EQUIPO:
    - Agent 16: Open WebUI/UI/cableado de paneles existentes.
    - Agent 17: backend Router + HF32 + endpoints OpenAI-compatible.
    - Agent 18: integración capacidades y E2E.
    - Agent 4: apoyo UI/selector/modos/documentos y pruebas funcionales del frontend.
    - Agent 12: apoyo Router/OpenAI contract/modelos/fallback y conexión chat-router.
    - Agent 11: ÚNICO encargado de descargar/extractar componentes externos faltantes mediante motores canónicos.

    REGLAS DE COORDINACIÓN:
    - Antes de ordenar: leer crazy_wall.state.json + HANDOFF del agente.
    - Cada agente = un objetivo activo.
    - Trabajo independiente = paralelo.
    - Si falta componente: el AGENTE ORQUESTADOR MICROSOFT genera requerimiento -> Agent 11 lo adquiere -> vuelve al agente consumidor.
    - Agent 11 NO programa ni integra.
    - Agent 14 puede ejecutar trabajo propio de Microsoft Agent Framework; delega trabajo de especialidad al pool autorizado.
    - Máximo 2 reintentos por GAP.
    - PASS global solo con evidencias E2E.

