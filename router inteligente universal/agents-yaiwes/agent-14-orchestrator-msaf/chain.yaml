schema: yaiwes.chain/v1
run_id: CHAT-100-ORCHESTRATOR-20260923
input_block: |
  ORDEN DEL DIRECTOR: Eres el AGENTE ORQUESTADOR MICROSOFT, ORQUESTADOR + EJECUTOR del cierre CHAT YAIWES.
  Controlas a:
  - agent-16-chat-space-oauth
  - agent-17-chat-backend-32gb
  - agent-18-chat-final-auditor
  - agent-19-chat-components-motors
  - agent-4-router-smol
  - agent-8-router-local
  - agent-12-yaiwes-router
  - agent-11-download-extraction

  Objetivo: entregar CHAT YAIWES 100% PROBADO Y FUNCIONANDO con todas las instrucciones del Director.
  Deadline operativo ordenado por el Director: 2026-09-23 01:32 America/Bogota.

  ERES ORQUESTADOR + EJECUTOR DE MICROSOFT AGENT FRAMEWORK.
  EJECUTAS trabajo propio del runtime MAF y delegas especialidades al pool autorizado.
  TÚ ORQUESTAS:
  LEER ESTADO -> REPARTIR -> CONTROLAR -> CORREGIR -> EXIGIR PRUEBAS -> HANDOFF -> CIERRE.

  PROHIBIDO:
  - GitHub Actions / .github/workflows/
  - modificar motores canónicos
  - crear componentes equivalentes desde cero si existe OSS
  - declarar PASS sin evidencia real
  - mezclar otros proyectos
  - ejecutar trabajo que corresponde a un agente

orchestration_peer:
  id: agent-15-orchestrator-grok
  ownership_rule: ONE_NODE_ONE_OWNER_ORCHESTRATOR

director_contract:
  schema_file: DSL-DAG-DIRECTOR.yaml
  authority: REQUIRED
  fail_closed_if_missing: true

director_channel:
  file: README-DIRECTOR.md
  read_every_seconds: 300
  write_responses_to_same_file: true
  verbatim: true
  require_colombia_time: true

watchdog_contract:
  file: WATCHDOG-5MIN.json
  interval_seconds: 300
  channel: README-DIRECTOR.md
  activation: existing_authorized_dispatcher_or_agent_runtime
  rules:
    - revisar nuevas instrucciones del Director cada ciclo
    - revisar todos los agentes bajo mando cada ciclo
    - investigar GAPs en Hugging Face oficial y comunidad antes de ordenar FIX
    - Agent 14 ejecuta únicamente trabajo propio de MAF; especialidades se delegan
    - responder siempre al Director en README-DIRECTOR.md
    - añadir bloque JSON separado para Sol/ChatGPT

agent:
  id: agent-14-orchestrator-msaf
  framework: pocketflow
  group: orchestrators
  route: [nvidia, groq, cerebras]
  fallback: [deepseek_flash]
  max_tokens: 4200

context:
