task: 'Escribe un módulo Python `job_spec.py` (solo código, un único bloque ```python,
  sin librerías externas) con la función

  `build_job_spec(repo: str, gguf_file: str, port: int = 8080, flavor: str = "cpu-upgrade",
  parallel: int = 4, ctx: int = 8192) -> dict`

  que prepara un Job de Hugging Face que sirve un modelo GGUF con llama.cpp montando
  los pesos remotos (sin descargarlos antes).

  Devuelve un dict con: "image" = "ghcr.io/ggml-org/llama.cpp:server"; "flavor" =
  flavor; "expose" = port;

  "volumes" = [f"hf://models/{repo}:/model:ro"]; "command" = lista ["llama-server",
  "--host", "0.0.0.0", "--port", str(port),

  "--model", f"/model/{gguf_file}", "--parallel", str(parallel), "--ctx-size", str(ctx),
  "--cont-batching", "--cache-prompt"].

  Si `repo` no tiene la forma "organizacion/nombre" lanza ValueError.

  '
checks:
- kind: python_ast
- kind: python_exec
  module: job_spec.py
  test: "from job_spec import build_job_spec\ns = build_job_spec(\"LiquidAI/LFM2.5-1.2B-Thinking-GGUF\"\
    , \"LFM2.5-1.2B-Thinking-Q4_K_M.gguf\")\nassert s[\"flavor\"] == \"cpu-upgrade\"\
    \ and s[\"expose\"] == 8080 and s[\"image\"] == \"ghcr.io/ggml-org/llama.cpp:server\"\
    \nassert \"hf://models/LiquidAI/LFM2.5-1.2B-Thinking-GGUF:/model:ro\" in s[\"\
    volumes\"]\ncmd = \" \".join(s[\"command\"])\nfor f in [\"--model /model/LFM2.5-1.2B-Thinking-Q4_K_M.gguf\"\
    , \"--parallel 4\", \"--ctx-size 8192\", \"--cont-batching\", \"--cache-prompt\"\
    ]:\n    assert f in cmd, f\ns2 = build_job_spec(\"A/B\", \"m.gguf\", parallel=2,\
    \ ctx=4096, port=9000)\nassert s2[\"expose\"] == 9000 and \"--parallel 2\" in\
    \ \" \".join(s2[\"command\"]) and \"--ctx-size 4096\" in \" \".join(s2[\"command\"\
    ])\ntry:\n    build_job_spec(\"sin-barra\", \"m.gguf\")\n    raise SystemExit(\"\
    aceptó un repo inválido\")\nexcept ValueError:\n    pass\n"
- kind: no_secrets
