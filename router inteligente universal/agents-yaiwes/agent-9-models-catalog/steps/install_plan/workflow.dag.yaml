task: 'Escribe el módulo Python `install_plan.py` (solo código, un único bloque ```python,
  solo biblioteca estándar; autocontenido) con la función

  `plan_install(models, nodes, ram_cap_gb) -> dict`: `models` es una lista de dicts
  {"id","size_mb"}, `nodes` una lista de ids de nodo en orden y `ram_cap_gb` el tope
  de RAM por nodo.

  Regla: cada nodo aloja UN solo modelo (una copia de pesos compartida por sus ranuras).
  Modelos ligeros = size_mb <= 3500, ordenados por tamaño ascendente; pesados = size_mb
  > 3500.

  Al i-ésimo nodo (empezando en 0) se le asigna el ligero de índice i % len(ligeros).
  Excepción: si hay al menos 2 nodos y existe algún pesado con size_mb + 6000 <= ram_cap_gb
  * 1024,

  el ÚLTIMO nodo recibe el pesado más grande que cumpla eso (solo un nodo recibe un
  pesado). Devuelve {id_nodo: id_modelo}. Si `models` está vacío devuelve {}.

  '
checks:
- kind: python_ast
- kind: python_exec
  module: install_plan.py
  test: 'from install_plan import plan_install

    models = [{"id": "qwen", "size_mb": 563}, {"id": "lfm", "size_mb": 731}, {"id":
    "gemma", "size_mb": 3300}, {"id": "muse", "size_mb": 16800}]

    nodes = ["HF-%02d" % i for i in range(1, 11)]

    p = plan_install(models, nodes, 24)

    assert [p[n] for n in nodes[:9]] == ["qwen", "lfm", "gemma", "qwen", "lfm", "gemma",
    "qwen", "lfm", "gemma"] and p["HF-10"] == "muse" and len(p) == 10

    q = plan_install(models, nodes, 16)

    assert q["HF-10"] == "qwen" and all(v != "muse" for v in q.values())

    assert plan_install(models, ["HF-01"], 24) == {"HF-01": "qwen"}

    assert plan_install([], nodes, 24) == {}

    '
- kind: no_secrets
