schema: yaiwes.chain/v1
# relanzado 2026-09-25 (el primer push no se ejecutó)
input_block: |
  DIRECTOR 2026-09-24: En el repo agentes existe un plan de trabajo pendiente para ejecutar un workflow.
  Un agente investiga el plan de ejecución y prepara el cableo con un agente orquestador que controle el proceso desde el chat.
  Destino: repo agentes raíz ➡️📂 wordflow loop code Yaiwes/ (plan de 4 objetivos). Informa a Opus.
  DIRECTOR 2026-09-25: selector + para enrutar al chat este proyecto como workflow.

agent:
  id: agent-26-plan-4-objetivos
  framework: pocketflow
  group: chat
  route: [deepseek_flash]
  fallback: []
  max_tokens: 2000

context:
  text: |
    Plan maestro: maxbry123-commits/agentes "Claude notas/PLAN-MAESTRO-4-OBJETIVOS.md"
    Anexo: maxbry123-commits/agentes "Claude notas/PLAN-ANEXO-B-SEALS-MECANISMOS.md"
    Lectura de otros repos: GET /gh/file (agent-29). Destino: repo agentes "➡️📂 wordflow loop code Yaiwes/".
    Orquestador del chat: agent-14 (MSAF); alternativas Rowboat, Hermes. Lanzar tareas: /gh/agent-launch.

steps:
  - id: extraer_plan
    task: |
      Entrega: 1) los 4 objetivos en una línea cada uno; 2) tareas ordenadas con agente sugerido, entrada, salida verificable, tiempo;
      3) qué falta en la carpeta destino. Si no puedes leer un documento escribe GAP: <documento> y no inventes su contenido.
    checks:
      - kind: min_chars
        value: 400
      - kind: no_secrets

  - id: plan_cableo
    task: |
      Entrega el registro JSON del workflow para el selector + del chat
      {nombre, repo, plan, orquestador, tareas:[{id, agente, chain_path}]} y los pasos para que agent-14 lo controle desde el chat. GAPs al final.
    checks:
      - kind: min_chars
        value: 400
      - kind: no_secrets

edges:
  - [extraer_plan, plan_cableo]
