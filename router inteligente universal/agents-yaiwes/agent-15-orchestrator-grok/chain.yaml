schema: yaiwes.chain/v1

# Agente 15 — ORQUESTADOR DEL CHAT: Grok Build (xai-org/grok-build). Marco: SmolAgents. De principio a fin dentro de su propio paso.
input_block: |
  Manda 2 agentes separados... Y me colocas a grock como osquestador del chat para los agentes mandado a descargar con un agente con los motores
  Grok es open soure: Grok Build (xai-org/grok-build, Apache-2.0) — el agente/harness, no el modelo Grok en sí

agent:
  id: agent-15-orchestrator-grok
  framework: smolagents
  group: orchestrators
  route: [nvidia, groq, cerebras]
  fallback: [deepseek_flash]
  max_tokens: 2400

context:
  text: |
    Grok Build (xai-org/grok-build) es el agente/harness abierto de xAI (Rust, Apache-2.0). Puede apuntar a inferencia propia (no requiere el
    modelo Grok cerrado). Objetivo real y verificable sin compilar Rust: confirmar que el repo público existe y trae binarios de release
    (GitHub Releases), y demostrar UNA llamada real a DeepSeek (deepseek-ai/DeepSeek-V4-Flash) por la API de HF (base
    https://router.huggingface.co/v1, token en la variable de entorno HF_TOKEN) como el motor que Grok Build usaría por detrás para los
    agentes del chat.

steps:

  - id: verify_and_connect
    task: |
      Escribe el módulo Python `grok_connect.py` (un único bloque ```python, dependencias: requests, openai) con la función
      `verify_and_ping() -> dict` que: 1) hace un GET a "https://api.github.com/repos/xai-org/grok-build/releases/latest" y confirma que la
      respuesta tiene status 200 y una clave "tag_name" no vacía; 2) usa `openai.OpenAI(base_url="https://router.huggingface.co/v1",
      api_key=os.environ["HF_TOKEN"])` para enviar UN mensaje ("Responde solo con la palabra OK.") al modelo "deepseek-ai/DeepSeek-V4-Flash";
      3) devuelve {"grok_build_release": tag_name, "reply": texto}. Si algo falla de verdad, deja que la excepción se propague.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: grok_connect.py
        test: |
          import os
          assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN"
          from grok_connect import verify_and_ping
          r = verify_and_ping()
          assert r["grok_build_release"] and r["reply"].strip(), r
          print(r)
      - kind: no_secrets

edges: []
