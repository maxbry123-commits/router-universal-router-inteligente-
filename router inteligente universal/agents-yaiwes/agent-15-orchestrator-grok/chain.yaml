schema: yaiwes.chain/v1
run_id: GROK-ORCHESTRATOR-DIRECTOR-CONTROL

input_block: |
  ORDEN DEL DIRECTOR:
  Agent 15 / Grok Build es ORQUESTADOR + EJECUTOR.
  Debe leer README-DIRECTOR.md, conservar INPUT BLOCK VERBATIM 1:1 y responder siempre en ese archivo.
  Comparte el pool autorizado con Microsoft Agent Framework:
  Agents 4, 8, 11, 12, 16, 17, 18, 19.
  REGLA: 1 nodo = 1 owner_orchestrator.
  PROHIBIDO GitHub Actions, workflows, modificar motores o inventar PASS.

agent:
  id: agent-15-orchestrator-grok
  framework: smolagents
  target_runtime: grok-build
  group: orchestrators
  role: ORCHESTRATOR_EXECUTOR
  route: [deepseek_flash]
  fallback: []
  max_tokens: 4200

runtime_base:
  wrapper: smolagents
  target_repo: https://github.com/xai-org/grok-build
  language: Rust
  runtime_path: crates/codegen/xai-grok-shell
  tools_path: crates/codegen/xai-grok-tools
  workspace_path: crates/codegen/xai-grok-workspace
  download_status: VERIFIED_CLOSED
  source_commit: 07e35a3dfeed2f200d319ef6c893b5ea286d9a51
  tree_sha256: e547e2b616102b5615d86fea7728d2726f16ebfe4889059c3b2a6590272c6ec2

peer_orchestrator:
  id: agent-14-orchestrator-msaf
  ownership_rule: ONE_NODE_ONE_OWNER_ORCHESTRATOR

managed_agents:
  - agent-4-router-smol
  - agent-8-router-local
  - agent-11-download-extraction
  - agent-12-yaiwes-router
  - agent-16-chat-space-oauth
  - agent-17-chat-backend-32gb
  - agent-18-chat-final-auditor
  - agent-19-chat-components-motors

director_contract:
  schema_file: DSL-DAG-DIRECTOR.yaml
  authority: REQUIRED
  fail_closed_if_missing: true

director_channel:
  file: README-DIRECTOR.md
  read_every_seconds: 300
  write_responses_to_same_file: true
  verbatim: true
  require_colombia_time: true

watchdog_contract:
  file: WATCHDOG-5MIN.json
  interval_seconds: 300
  activation: existing_authorized_dispatcher_or_agent_runtime
  channel: README-DIRECTOR.md

steps:
  - id: director_control_loop
    context_file:
      - "router inteligente universal/agents-yaiwes/agent-15-orchestrator-grok/README-DIRECTOR.md"
      - "router inteligente universal/agents-yaiwes/agent-15-orchestrator-grok/DSL-DAG-DIRECTOR.yaml"
      - "router inteligente universal/agents-yaiwes/agent-15-orchestrator-grok/WATCHDOG-5MIN.json"
    task: |
      1. READ README-DIRECTOR.md and all objectives before acting.
      2. WRITE conclusion, best path, doubts/ambiguities and estimated completion window to README-DIRECTOR.md.
      3. For each task, acquire owner_orchestrator lock before execute/delegate.
      4. Execute work belonging to Grok Build runtime directly.
      5. Delegate specialty tasks only to Agents 4,8,11,12,16,17,18,19.
      6. Every 300 seconds while runtime is active, review Director instructions and managed-agent progress.
      7. On GAP, research repo + official Hugging Face + HF community + upstream OSS once; apply/delegate minimal FIX; test; read-back.
      8. Every Director-facing response includes Colombia time and visual separators.
      9. Append one separate valid JSON block for Sol/ChatGPT.
      10. If VERBATIM is violated: TERMINATED_FOR_EXECUTION until Director reauthorizes.
    checks:
      - kind: contains
        values: [README-DIRECTOR.md, WATCHDOG-5MIN.json, owner_orchestrator, GAP, FIX]
      - kind: no_secrets


  - id: director_model_probe
    context_file:
      - "router inteligente universal/agents-yaiwes/agent-15-orchestrator-grok/README-DIRECTOR.md"
      - "router inteligente universal/agents-yaiwes/ROUTE.json"
    append_output_to: "router inteligente universal/agents-yaiwes/agent-15-orchestrator-grok/README-DIRECTOR.md"
    task: |
      AGENTE ORQUESTADOR GROK BUILD: responde TÚ MISMO la sección "PRUEBA DE CONEXIÓN DEL DIRECTOR — MODELO IA"
      que está al final de README-DIRECTOR.md.

      Debes usar únicamente evidencia de TU EJECUCIÓN ACTUAL.
      Si logras una llamada real, informa provider, modelo exacto, via/route, fallback usado o no usado y estado.
      Si no logras ejecutar, responde el GAP exacto. No inventes un modelo activo por leer ROUTE.json.

      Devuelve únicamente este bloque listo para añadir verbatim al README:

      ➡️➡️➡️➡️➡️➡️➡️➡️➡️➡️
      # 📣 RESPUESTA DEL ORQUESTADOR — PRUEBA MODELO IA
      **🕐 HORA COLOMBIA:** <hora real America/Bogota>
      **PROVIDER:** <provider real o GAP>
      **MODELO:** <modelo real o GAP>
      **VIA/ROUTE:** <via/route real>
      **FALLBACK:** <usado/no usado + cuál>
      **ESTADO RUNTIME:** <operativo/bloqueado>
      **EVIDENCIA:** <evidencia observable de esta ejecución>
      ➡️➡️➡️➡️➡️➡️➡️➡️➡️➡️

    checks:
      - kind: contains
        values: ["RESPUESTA DEL ORQUESTADOR", "HORA COLOMBIA", "PROVIDER", "MODELO", "VIA/ROUTE", "FALLBACK", "ESTADO RUNTIME", "EVIDENCIA"]
      - kind: no_secrets
