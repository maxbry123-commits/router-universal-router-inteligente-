    )\n        out = _call_inference(token=token, model_id=model_id, messages=messages,\
    \ max_tokens=max_tokens)\n        return {**out, \"certified\": False}\n\n   \
    \ return executor\n\n\n=== ARCHIVO router inteligente universal/agents-yaiwes/common/hardware_sheriff.py\
    \ ===\n\"\"\"Sheriff duro: solo máquina HF con 32 GB RAM antes de run_job.\n\n\
    Orden Director: procesador/máquina de 32 GB RAM; cualquier otra → FAIL y no lanzar.\n\
    Los IDs técnicos de flavor HF son detalle de implementación (no texto del Director).\n\
    \"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Mapping\n\
    \n# Capacidad RAM (GB) conocida por flavor técnico HF Jobs (docs HF).\n_FLAVOR_RAM_GB:\
    \ dict[str, int] = {\n    \"cpu-basic\": 16,\n    \"cpu-upgrade\": 32,\n    \"\
    t4-small\": 16,\n    \"t4-medium\": 32,\n    \"a10g-small\": 24,\n    \"a10g-large\"\
    : 48,\n    \"a100-large\": 80,\n}\n\nALLOWED_RAM_GB = 32\n\n\nclass HardwareSheriffError(RuntimeError):\n\
    \    \"\"\"La máquina pedida no es la de 32 GB RAM.\"\"\"\n\n\ndef ram_gb_for_flavor(flavor:\
    \ str | None) -> int | None:\n    if not flavor:\n        return None\n    return\
    \ _FLAVOR_RAM_GB.get(str(flavor).strip().lower())\n\n\ndef assert_machine_32gb_ram(*,\
    \ flavor: str | None = None, ram_gb: int | None = None) -> None:\n    \"\"\"FAIL\
    \ cerrado si la máquina no es 32 GB RAM.\"\"\"\n    gb = ram_gb if ram_gb is not\
    \ None else ram_gb_for_flavor(flavor)\n    label = f\"flavor={flavor!r}\" if flavor\
    \ else f\"ram_gb={ram_gb!r}\"\n    if gb is None:\n        raise HardwareSheriffError(\n\
    \            f\"SHERIFF FAIL: máquina desconocida ({label}); solo se permite 32\
    \ GB RAM. No lanzar.\"\n        )\n    if gb != ALLOWED_RAM_GB:\n        raise\
    \ HardwareSheriffError(\n            f\"SHERIFF FAIL: máquina {label} tiene {gb}\
    \ GB RAM; obligatorio {ALLOWED_RAM_GB} GB. No lanzar.\"\n        )\n\n\ndef guarded_run_job(api:\
    \ Any, **kwargs: Any) -> Any:\n    \"\"\"Envuelve api.run_job: valida máquina\
