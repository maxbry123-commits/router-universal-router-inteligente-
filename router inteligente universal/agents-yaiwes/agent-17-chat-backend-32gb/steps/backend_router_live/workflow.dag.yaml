    model\": model_id,\n        \"message\": {\"role\": choice.message.role, \"content\"\
    : choice.message.content},\n        \"finish_reason\": choice.finish_reason,\n\
    \    }\n\n\ndef make_executor(*, allow_provider_live: bool, discover: Callable[[],\
    \ list[str]] = cached_discovery) -> Callable[..., dict[str, Any]]:\n    \"\"\"\
    Return an executor with the same signature as adapter.chat_completion.\"\"\"\n\
    \n    def executor(*, model_id: str, messages: list[dict[str, str]], max_tokens:\
    \ int = 256) -> dict[str, Any]:\n        if model_id in adapter.allowed_model_ids():\n\
    \            out = adapter.chat_completion(model_id=model_id, messages=messages,\
