    _CHAT_UI = Path(__file__).with_name(\"chat_ui.html\")\n\napp = FastAPI(title=\"\
    Router Inteligente Universal HF Gateway\", version=\"0.4.1\")\n\n\ndef live_enabled()\
    \ -> bool:\n    return os.getenv(LIVE_ENV, \"\") == \"1\"\n\n\ndef _require_selectable(model_id:\
