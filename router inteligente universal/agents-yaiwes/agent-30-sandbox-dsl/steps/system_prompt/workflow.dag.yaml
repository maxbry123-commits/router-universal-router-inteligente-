schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-30-sandbox-dsl
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 2000
context:
  text: 'Formato DSL: schema yaiwes.chain/v1 (input_block, agent, context, steps[id,
    task, checks], edges). Ejecutor existente: agents-yaiwes/chain.py.

    Activar agente = escribir su chain.yaml (vía /gh/agent-launch del agent-29). Estado:
    crazy_wall.state.json.

    Solo deepseek_flash. Sin GPU. Sin claves en archivos.

    '
  max_chars: 40000
task: 'Entrega el system prompt del chat (máx. 40 líneas): convierte la orden del
  Director en un chain.yaml válido yaiwes.chain/v1

  para el agente elegido en el selector, con input_block literal, pasos de principio
  a fin y checks; responde SOLO el YAML.

  '
checks:
- kind: contains
  values:
  - yaiwes.chain/v1
- kind: no_secrets
