schema: yaiwes.chain/v1
# relanzado 2026-09-25 04:55 con input 7 del Director
input_block: |
  DIRECTOR: Todos los agentes y el chat en una sola raíz ➡️📂 chat osquestador, con un solo Crazy Wall / bitácora / state JSON.
  Inventario de lo que hay; borrar archivos basura de trabajos anteriores; organizar; parte militar; cablearlos como enjambre.
  Incorporar al staff los agentes descargados (Codex, Claude Code, Hermes, Rowboat, MSAF) y los de meta que ya existen. Mirrors si hacen falta.

agent:
  id: agent-32-organizador
  framework: pocketflow
  group: chat
  route: [deepseek_flash]
  fallback: []
  max_tokens: 2000

context:
  text: |
    Hoy: agentes en "router inteligente universal/agents-yaiwes/agent-*", chat en ".../integration/chat_mvp/", UI en ".../vercel-ui/",
    componentes en ".../Componente open soure router inteligente universal/", notas en "Claude notas/".
    NO-MOVER y NO-BORRAR nunca: Job del Router, router_job_persistent.py, ROUTER_JOB_PAUSE.flag, ROUTE.json, chain.py, common/,
    motores de descarga, workflows de .github, Componente open soure, Claude notas (se archivan, no se borran).
    Basura = solo archivos de trabajo sin referencias (duplicados, tmp, logs viejos, salidas de pruebas) con evidencia.

steps:
  - id: inventario
    task: |
      Entrega el código Python completo de inventario.py que recorre el repo y escribe INVENTARIO.json:
      por carpeta {ruta, tipo: agente|componente|chat|motor|nota|basura_candidata, tamaño, última modificación, referenciado_por[]}.
      basura_candidata solo si no está en NO-BORRAR y nadie lo referencia. Solo el código.
    checks:
      - kind: python_ast
      - kind: min_chars
        value: 700
      - kind: no_secrets

  - id: reorganizar
    task: |
      Entrega el código Python completo de reorganizar.py: --dry-run por defecto; --apply copia a "➡️📂 chat osquestador/"
      (chat/, agentes/, orquestadores/ con Hermes, Rowboat, MSAF, Codex, Claude Code; memoria/, workflows/, vercel-ui/),
      crea STAFF.json {agente: {rol, raíz, grupo, estado}} y un único CRAZY_WALL.state.json agregado;
      --clean borra SOLO lo marcado basura_candidata en INVENTARIO.json y registra cada borrado en BITACORA.md. Solo el código.
    checks:
      - kind: python_ast
      - kind: min_chars
        value: 800
      - kind: no_secrets

edges:
  - [inventario, reorganizar]
