schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-16-chat-space-oauth
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 8000
context:
  text: 'El archivo se sirve desde Vercel (estático). Todas las llamadas van al Router:
    LIVE_URL se lee al cargar la página de

    https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag
    (línea LIVE_URL=).

    El usuario pega su HF token y su X-API-Key una vez; se guardan solo en localStorage
    del navegador. Nunca claves en el HTML.

    Rutas: GET /v1/models, POST /v1/chat/completions, GET /chat/agents, POST /chat/documents,
    GET /gh/accounts, POST /chat/storage,

    POST /control/pause-agents, /control/resume-agents, /control/emergency-stop, /control/start-job,
    POST /control/order, GET/POST /groups.

    '
  max_chars: 40000
task: "Escribe index.html completo en un solo archivo (CSS y JS dentro), empezando\
  \ por <!DOCTYPE html> y terminando en </html>,\nSIN bloques ``` ni texto fuera del\
  \ HTML. Móvil primero, tema oscuro. Contiene:\n1) barra superior: selector de modelo\
  \ (/v1/models), interruptor \"con agentes\", selector de agente (/chat/agents),\n\
  \   selector de cuenta GitHub (/gh/accounts), selector de grupo (/groups);\n2) área\
  \ de chat con historial y campo de texto; enviar = POST /v1/chat/completions (modelo\
  \ + \"+agentes\" si el interruptor está activo);\n3) botón \U0001F4CE subir archivo\
  \ → POST /chat/documents con chat_id;\n4) botón ➕ workflow: nombre, repo, ruta del\
  \ plan → POST /chat/storage;\n5) panel ⚙️: ⏸️ pausar agentes, ▶️ reanudar, \U0001F6D1\
  \ emergencia, \U0001F50C encender Job, \U0001F5D3️ orden programada;\n6) pantalla\
  \ de ajustes para pegar HF token y X-API-Key (localStorage);\n7) cada error se muestra\
  \ en la pantalla en una línea sencilla.\n"
checks:
- kind: contains
  values:
  - <!DOCTYPE html>
  - </html>
  - /v1/chat/completions
  - /chat/documents
  - localStorage
- kind: min_chars
  value: 3000
- kind: no_secrets
