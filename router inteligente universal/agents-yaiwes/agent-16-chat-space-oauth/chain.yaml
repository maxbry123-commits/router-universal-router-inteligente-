schema: yaiwes.chain/v1
input_block: |
  DIRECTOR: Vercel es solo UI (repo ya conectado a Vercel, despliega en cada push). Selector de modelos, con/sin agente,
  cuentas de GitHub, subida de archivos anclada al almacenamiento, selector + para añadir workflows de otros proyectos
  (ej. plan de 4 objetivos del repo agentes) y chatear con un agente encargado/orquestador.

agent:
  id: agent-16-chat-space-oauth
  framework: pocketflow
  group: chat
  route: [deepseek_flash]
  fallback: []
  max_tokens: 2000

context:
  text: |
    Base: Open WebUI ya descargado. Reciclar chat_ui.html de chat_mvp.
    Carpeta UI para Vercel: "router inteligente universal/vercel-ui/" (estática; todas las llamadas van a LIVE_URL del Router).
    LIVE_URL se lee en runtime de: https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag
    Cuentas GitHub: secretos GH_ACCOUNT_1..3 (solo nombres; el Router elige la clave). Nunca claves en el HTML.
    Rutas: /v1/models, /v1/chat/completions, /chat/agents, /chat/documents, /chat/github/*, /chat/storage.

steps:
  - id: vercel_json
    task: |
      Entrega vercel.json mínimo para servir "router inteligente universal/vercel-ui/" como sitio estático. Solo el JSON.
    checks:
      - kind: contains
        values: ["{"]
      - kind: no_secrets

  - id: index_html
    task: |
      Entrega index.html completo (un solo archivo, CSS y JS dentro) con:
      selector de modelo (lee /v1/models), interruptor con agente / sin agente, selector de cuenta GitHub (lee /chat/github/accounts),
      selector de agente (lee /chat/agents), botón + para añadir workflow (nombre + repo + ruta de plan; guarda con POST /chat/storage),
      subida de archivos (POST /chat/documents con chat_id), área de chat y campo para pegar la API key del Router guardada solo en el navegador.
      Solo el código.
    checks:
      - kind: js_syntax
      - kind: min_chars
        value: 1500
      - kind: no_secrets

edges:
  - [vercel_json, index_html]
