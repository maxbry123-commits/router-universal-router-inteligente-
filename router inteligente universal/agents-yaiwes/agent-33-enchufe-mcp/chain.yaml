schema: yaiwes.chain/v1
input_block: |
  DIRECTOR: Enchufe MCP para que Claude se conecte al chat y al sistema que gobierna el proceso y ayude a orquestar.

agent:
  id: agent-33-enchufe-mcp
  framework: pocketflow
  group: chat
  route: [deepseek_flash]
  fallback: []
  max_tokens: 2000

context:
  text: |
    El Router es FastAPI. Rutas a exponer como herramientas MCP: /chat/send, /chat/agents, /sandbox/order, /sandbox/status,
    /gh/agent-launch, /gh/agent-state, lectura del Crazy Wall central, /chat/storage.
    Transporte: HTTP streamable en la ruta /mcp del mismo Router, protegido con X-API-Key. Sin claves en archivos.

steps:
  - id: mcp_code
    task: |
      Entrega el código Python completo de mcp_plug.py que monta un servidor MCP en /mcp (usa la librería oficial "mcp", FastMCP)
      con las herramientas: enviar_chat, listar_agentes, ordenar_agente, estado_agente, leer_crazy_wall, guardar_memoria.
      Cada herramienta llama a la ruta interna del Router. Solo el código.
    checks:
      - kind: python_ast
      - kind: min_chars
        value: 700
      - kind: no_secrets

  - id: conexion
    task: |
      Entrega cómo montarlo en app.py (líneas exactas) y cómo el Director lo añade como conector personalizado en Claude
      (URL <LIVE_URL>/mcp). Nota: LIVE_URL cambia al relanzar el Job; propone cómo dar una URL estable (redirección desde Vercel /mcp).
      GAPs al final.
    checks:
      - kind: min_chars
        value: 200
      - kind: no_secrets

edges:
  - [mcp_code, conexion]
