schema: yaiwes.chain/v1

# agent-3-router — P1 FALLBACK opción 3: Static + OAuth + Inference Providers
input_block: |
  Opción 3 INPUT-l: Static Space + OAuth HF + Inference Providers. SIN Job permanente.
  NO regeneres publish_live.py con prosa. Prioridad: space_url usable YA.
  NUNCA API keys en secrets del Static Space.

agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 1800

context:
  text: |
    Fallback tras #36: Static Space riu-chat-yaiwes + OAuth (inference-api) + Inference Providers.
    Job 32GB aplazado. PASS: space_url + smoke chat 200.

steps:
  - id: space_readme
    task: |
      README.md Static Space: sdk static, hf_oauth true, scopes inference-api.
    checks:
      - kind: contains
        values: ["---", "sdk: static", "hf_oauth"]
      - kind: no_secrets

  - id: space_index
    task: |
      index.html chat OAuth HF + fetch Inference Providers. textContent. Sin API keys hardcodeadas.
      Selector: DeepSeek / MiniMax / Kimi / NVIDIA si aplica.
    checks:
      - kind: contains
        values: ["oauth", "inference", "textContent"]
      - kind: no_secrets

  - id: deploy_script
    task: |
      deploy_static_space.py HfApi create_repo/upload_folder space_sdk static. Imprime space_url.
    checks:
      - kind: python_ast
      - kind: no_secrets

  - id: publish_live
    context_file:
      - router inteligente universal/agents-yaiwes/agent-3-router/ORDEN-ORCH-CHAT.md
    task: |
      Cierra opción 3: Space publicado, OAuth activo, smoke providers = 200.
      Escribe space_url en crazy_wall. NO lances HF Job. NO reescribas publish_live.py con prosa.
    checks:
      - kind: contains
        values: ["space_url", "http"]
      - kind: no_secrets

edges:
  - space_readme -> space_index
  - space_index -> deploy_script
  - deploy_script -> publish_live
