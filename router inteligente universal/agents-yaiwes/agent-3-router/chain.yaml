schema: yaiwes.chain/v1

# agent-3-router — P1. Requisito hardware: máquina HF 32 GB RAM (Director).
input_block: |
  Reescribe publish_live YA. Sin triples rotos. Job SOLO en procesador HF 32 GB RAM
  (8 vCPU / 32GB). Otra máquina = rechazo. GET /health. Space riu-chat-yaiwes.
  Anota space_url+router_endpoint. Fail-closed.

agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 2400

context:
  text: |
    Requisito Director (verbatim): Jobs/procesador HF de 32 GB RAM; 8 vCPU / 32GB.
    Cualquier máquina que no sea esa = rechazo. No inventar nombres de flavor del Director.
    Puerto 8000. Space estático riu-chat-yaiwes. HF_TOKEN obligatorio.
    PROHIBIDO strings triples rotos en publish_live.py (falló 3 veces).
    Usa Path.write_text o "\n".join(lineas) para README/HTML.

steps:
  - id: space_readme
    task: |
      README.md Static Space con front matter sdk static + oauth scopes jobs/inference-api.
    checks:
      - kind: contains
        values: ["---", "sdk: static", "hf_oauth"]
      - kind: no_secrets

  - id: space_index
    task: |
      index.html chat: API_BASE en memoria, fetch /chat/send, textContent, OAuth HF.
    checks:
      - kind: contains
        values: ["API_BASE", "/chat/send", "textContent"]
      - kind: no_secrets

  - id: deploy_script
    task: |
      deploy_static_space.py con HfApi create_repo/upload_folder space_sdk static.
    checks:
      - kind: python_ast
      - kind: no_secrets

  - id: publish_live
    context_file:
      - router inteligente universal/agents-yaiwes/agent-3-router/ORDEN-ORCH-CHAT.md
    task: |
      REESCRIBE publish_live.py (bloque python único). Cero triples rotos.
      publish() -> dict:
      (1) whoami con HF_TOKEN;
      (2) Job Router SOLO en la máquina HF de 32 GB RAM (8 vCPU / 32GB).
          Si el hardware no es 32 GB RAM → raise (fail-closed). Puerto 8000;
      (3) hasta 300s GET /health == 200;
      (4) README+index con API_BASE = endpoint del Job;
      (5) deploy Space <cuenta>/riu-chat-yaiwes;
      (6) GET Space reachable.
      Return space_url, router_endpoint, router_health_ok, space_reachable,
      hardware_ram_gb (debe ser 32).
      Escribe space_url y router_endpoint en crazy_wall.state.json.
    checks:
      - kind: python_ast
      - kind: no_secrets

edges:
  - space_readme -> space_index
  - space_index -> deploy_script
  - deploy_script -> publish_live
