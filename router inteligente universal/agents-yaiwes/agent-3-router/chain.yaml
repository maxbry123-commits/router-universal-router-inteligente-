schema: yaiwes.chain/v1

# agent-3-router — P1. Requisito hardware: máquina HF 32 GB RAM (Director).
input_block: |
  Copia verbatim TEMPLATE publish_live.py de ORDEN-ORCH-CHAT.md.
  Job SOLO en procesador HF 32 GB RAM (8 vCPU / 32GB). Otra máquina = rechazo.
  GET /health. Space riu-chat-yaiwes. Anota space_url+router_endpoint. Fail-closed.

agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 3200

context:
  text: |
    Requisito Director (verbatim): Jobs/procesador HF de 32 GB RAM; 8 vCPU / 32GB.
    Cualquier máquina que no sea esa = rechazo. No inventar nombres de flavor del Director.
    Id técnico HF que cumple 32 GB RAM: cpu-upgrade (solo API).
    Puerto 8000. Space estático riu-chat-yaiwes. HF_TOKEN obligatorio.
    COPIA TEMPLATE de ORDEN-ORCH-CHAT.md verbatim. Cero strings triples rotos.
    Usa Path.write_text o "\n".join(lineas) para README/HTML.

steps:
  - id: space_readme
    task: |
      README.md Static Space con front matter sdk static + oauth scopes jobs/inference-api.
    checks:
      - kind: contains
        values: ["---", "sdk: static", "hf_oauth"]
      - kind: no_secrets

  - id: space_index
    task: |
      index.html chat: API_BASE en memoria, fetch /chat/send, textContent, OAuth HF.
    checks:
      - kind: contains
        values: ["API_BASE", "/chat/send", "textContent"]
      - kind: no_secrets

  - id: deploy_script
    task: |
      deploy_static_space.py con HfApi create_repo/upload_folder space_sdk static.
    checks:
      - kind: python_ast
      - kind: no_secrets

  - id: publish_live
    context_file:
      - router inteligente universal/agents-yaiwes/agent-3-router/ORDEN-ORCH-CHAT.md
    task: |
      Responde UN bloque python = TEMPLATE completo de ORDEN-ORCH-CHAT.md (verbatim).
      publish() -> dict: space_url, router_endpoint, router_health_ok, space_reachable,
      hardware_ram_gb (debe ser 32). Job SOLO máquina 32 GB RAM (cpu-upgrade). Fail-closed.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: publish_live.py
        test: |
          import os
          assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN"
          from publish_live import publish
          out = publish()
          assert out.get("hardware_ram_gb") == 32
          assert out.get("router_health_ok") is True
          assert out.get("space_url")
          assert out.get("router_endpoint")
          print(out["space_url"], out["router_endpoint"], out.get("job_id"))
      - kind: no_secrets

edges:
  - space_readme -> space_index
  - space_index -> deploy_script
  - deploy_script -> publish_live
