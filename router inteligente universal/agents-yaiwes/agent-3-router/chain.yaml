schema: yaiwes.chain/v1

# agent-3-router — PocketFlow. ORCH-CHAT Director 2026-09-22 ~19:22 COT
# CANDADO HARD: Job SOLO en procesador 32GB RAM activo. Prohibido otro CPU/GPU.
input_block: |
  URGENTE Director: publish_live YA. Sin triples. Job SOLO 32GB RAM activo (8vCPU/32GB).
  Prohibido cpu-basic/T4/A10/A100. GET /health. Space riu-chat-yaiwes. Anota URLs.

agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 2400

context:
  text: |
    Static Space GRATUITO + Job Router. NO claves en el Space.
    Repo: https://github.com/maxbry123-commits/router-universal-router-inteligente-
    Token: HF_TOKEN. Fail-closed si falta.
    HARDWARE LOCK (Director): el Job DEBE ir al procesador de 32 GB RAM que ya está
    activo (perfil 8 vCPU / 32 GB). PROHIBIDO montar cpu-basic, T4, A10G, A100 u otro.
    Si hay Job 32GB vivo, reutiliza su endpoint. Si propones otro flavor → rechazado.
    PROHIBIDO en publish_live.py: strings con tres comillas (SyntaxError previo).
    Usa Path.write_text, comillas simples/dobles escapadas, o "\n".join(lineas).

steps:

  - id: space_readme
    task: |
      Escribe README.md Static Space: front matter --- title Chat YAIWES, sdk static,
      hf_oauth true, scopes jobs e inference-api. Luego ≥300 chars en español.
    checks:
      - kind: contains
        values: ["---", "title:", "sdk: static", "hf_oauth: true", "hf_oauth_scopes:", "inference-api", "jobs"]
      - kind: min_chars
        value: 400
      - kind: no_secrets

  - id: space_index
    task: |
      Escribe index.html (HTML+CSS+JS, sin libs). API_BASE + API key en memoria;
      fetch API_BASE+'/chat/send' POST JSON; textContent nunca innerHTML; botón OAuth HF.
    checks:
      - kind: contains
        values: ["<!doctype html", "API_BASE", "fetch(", "/chat/send", "X-API-Key", "textContent", "oauth"]
      - kind: min_chars
        value: 1500
      - kind: no_secrets

  - id: deploy_script
    task: |
      Módulo deploy_static_space.py: plan_files pura + deploy con HfApi create_repo/upload_folder.
      space_sdk static. Token nunca se imprime.
    checks:
      - kind: python_ast
      - kind: contains
        values: ['space_sdk="static"', "upload_folder", "create_repo"]
      - kind: no_secrets

  - id: publish_live
    context_file:
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/space_readme/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/space_index/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/deploy_script/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/ORDEN-ORCH-CHAT.md
    task: |
      REESCRIBE publish_live.py COMPLETO (un bloque python). CERO strings de tres comillas.
      publish() -> dict:
      (1) whoami HF_TOKEN;
      (2) Job Router SOLO en hardware 32GB RAM activo (8vCPU/32GB). PROHIBIDO cpu-basic,
          T4, A10G, A100 u otro. Reutiliza Job 32GB vivo si existe. Puerto 8000 +
          common/router_job_start.py;
      (3) hasta 300s GET /health == 200;
      (4) temp README+index con API_BASE=endpoint Job;
      (5) deploy Space <cuenta>/riu-chat-yaiwes;
      (6) GET Space reachable.
      Return space_url, router_endpoint, router_health_ok, space_reachable, hardware_flavor.
      Fail-closed si falta HF_TOKEN, hardware distinto a 32GB, o /health falla.
      Escribe space_url y router_endpoint en crazy_wall.state.json del agente.
    checks:
      - kind: python_ast
      - kind: no_secrets

edges:
  - space_readme -> space_index
  - space_index -> deploy_script
  - deploy_script -> publish_live
