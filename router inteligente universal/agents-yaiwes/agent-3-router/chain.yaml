schema: yaiwes.chain/v1

# Cadena DSL DAG — agent-3-router — PocketFlow. Chat HF sin PRO.
# publish_live EJECUTA de verdad. ORCH-CHAT P1 2026-09-22: reintento publish_live sin strings triples.
input_block: |
  P1 ORCH-CHAT: reescribe publish_live.py SIN triples; Job cpu-basic:8000; GET /health;
  Static Space riu-chat-yaiwes con API_BASE real; anota space_url+router_endpoint; fail-closed.

agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 2200

context:
  text: |
    Static Space GRATUITO + Job HF con puerto 8000. NO poner claves en el Space.
    Repo: https://github.com/maxbry123-commits/router-universal-router-inteligente-
    Token: HF_TOKEN en entorno. Fail-closed si falta.
    PROHIBIDO en publish_live.py: strings con tres comillas (causa SyntaxError).
    Usa Path.write_text, "..." escapadas, o listas de líneas + "\n".join.

steps:

  - id: space_readme
    task: |
      Escribe README.md Static Space: front matter --- title Chat YAIWES, sdk static,
      hf_oauth true, scopes jobs e inference-api. Luego ≥300 chars en español.
    checks:
      - kind: contains
        values: ["---", "title:", "sdk: static", "hf_oauth: true", "hf_oauth_scopes:", "inference-api", "jobs"]
      - kind: min_chars
        value: 400
      - kind: no_secrets

  - id: space_index
    task: |
      Escribe index.html (HTML+CSS+JS, sin libs). API_BASE + API key en memoria;
      fetch API_BASE+'/chat/send' POST JSON; textContent nunca innerHTML; botón OAuth HF.
    checks:
      - kind: contains
        values: ["<!doctype html", "API_BASE", "fetch(", "/chat/send", "X-API-Key", "textContent", "oauth"]
      - kind: min_chars
        value: 1500
      - kind: no_secrets

  - id: deploy_script
    task: |
      Módulo deploy_static_space.py: plan_files pura + deploy con HfApi create_repo/upload_folder.
      space_sdk static. Token nunca se imprime.
    checks:
      - kind: python_ast
      - kind: contains
        values: ['space_sdk="static"', "upload_folder", "create_repo"]
      - kind: no_secrets

  - id: publish_live
    context_file:
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/space_readme/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/space_index/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/steps/deploy_script/results/output.txt
      - router inteligente universal/agents-yaiwes/agent-3-router/ORDEN-ORCH-CHAT.md
    task: |
      REESCRIBE publish_live.py COMPLETO (bloque ```python único). REGLA DURA: cero strings
      con tres comillas; el intento anterior falló con SyntaxError unterminated triple-quote.
      Función publish() -> dict: (1) whoami con HF_TOKEN; (2) Job cpu-basic image python:3.12
      expose 8000 clonando repo sparse + router_job_start.py; (3) hasta 300s GET /health 200;
      (4) temp README+index de pasos previos con API_BASE=endpoint Job; (5) deploy Space
      <cuenta>/riu-chat-yaiwes; (6) GET Space reachable. Return space_url, router_endpoint,
      router_health_ok, space_reachable. Fail-closed: sin HF_TOKEN o Job/health falla → raise.
      Tras éxito escribe space_url y router_endpoint en crazy_wall.state.json del agente.
    checks:
      - kind: python_ast
      - kind: no_secrets

edges:
  - space_readme -> space_index
  - space_index -> deploy_script
  - deploy_script -> publish_live
