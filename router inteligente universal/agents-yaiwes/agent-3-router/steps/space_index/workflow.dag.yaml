schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route:
  - nvidia
  - groq
  - cerebras
  fallback:
  - minimax_m3
  max_tokens: 2200
context:
  text: "OPCIONES DEL DIRECTOR PARA EL CHAT EN HF SIN PRO (documento pegado por él;\
    \ sus datos no están verificados todavía):\n- Elegida: Static Space GRATUITO (HTML/JS)\
    \ como interfaz + servidor del Router en un Job de HF (8 vCPU / 32 GB) que expone\
    \ un puerto:\n  https://<job_id>--8000.hf.jobs. El endpoint existe mientras el\
    \ Job esté vivo.\n- En un Static Space las variables/secrets pueden llegar al\
    \ JavaScript del navegador: NO poner claves privadas allí.\n- Para autenticar\
    \ sin token maestro: HF OAuth. Front matter del Space: `sdk: static`, `hf_oauth:\
    \ true`, `hf_oauth_scopes:` con `jobs`\n  e `inference-api`.\n- Alternativas:\
    \ Gradio ZeroGPU (2 Spaces gratis por cuenta elegible), o Static + OAuth + Inference\
    \ Providers directos.\n- HF exige plan de pago para crear Spaces Docker/Gradio\
    \ CPU nuevos (salvo ZeroGPU): descartado.\nAPI del chat (Router): POST /chat/send\
    \ (cabecera X-API-Key) cuerpo {\"message\",\"provider\",\"model\",\"conversation_id\"\
    ,\"mode\",\"agent_id\",\"doc_ids\",\"cache\",\"max_tokens\"} -> {\"reply\",\"\
    conversation_id\",\"certified\",\"cached\"}.\n\n\nSALIDA VERIFICADA DEL PASO ANTERIOR\
    \ (space_readme):\n---\ntitle: \"Chat YAIWES\"\nemoji: \"\U0001F4AC\"\ncolorFrom:\
    \ \"blue\"\ncolorTo: \"indigo\"\nsdk: static\npinned: false\nhf_oauth: true\n\
    hf_oauth_scopes:\n  - jobs\n  - inference-api\n---\nEste Space estático proporciona\
    \ una interfaz de chat basada en HTML y JavaScript que se ejecuta totalmente en\
    \ el navegador del usuario. No almacena ni expone claves privadas; toda la información\
    \ sensible permanece en el servidor del Router, que se ejecuta como un Job de\
    \ Hugging Face con los recursos especificados (8 vCPU / 32 GB). La interfaz se\
    \ comunica mediante peticiones HTTP al endpoint expuesto por el Job (https://<job_id>--8000.hf.jobs),\
    \ enviando el cuerpo JSON requerido por la API del Router y recibiendo la respuesta\
    \ con el mensaje, el identificador de conversación y otros campos. Para autenticar\
    \ sin necesidad de un token maestro, el Space utiliza HF OAuth, solicitando únicamente\
    \ los scopes `jobs` e `inference-api`, lo que permite al frontend iniciar y consultar\
    \ el Job y, si es necesario, acceder a proveedores de inferencia de forma segura.\
    \ Todo el código del Space es público y revisable, garantizando transparencia,\
    \ ausencia de credenciales sensibles y una experiencia de chat que depende exclusivamente\
    \ del Router ejecutado en un Job de HF."
  max_chars: 9000
task: 'Escribe el archivo `index.html` (un solo archivo, HTML + CSS + JavaScript,
  sin librerías externas) del chat estático. Requisitos:

  empieza con <!doctype html>; título "Chat YAIWES"; un campo para la URL base del
  Router (API_BASE, se guarda solo en memoria) y un

  campo de contraseña "API key del Router" (solo en memoria, nunca en localStorage
  ni en el HTML); una caja de mensajes y un botón

  "Enviar" que hace fetch(API_BASE + ''/chat/send'', {method: ''POST'', headers: {''Content-Type'':
  ''application/json'', ''X-API-Key'': <valor>},

  body: JSON.stringify({message, provider: ''nvidia'', model: ''nvidia/nemotron-3-super-120b-a12b'',
  max_tokens: 1024})}) y muestra

  la respuesta (reply) y los errores. Todo texto del servidor se muestra con textContent,
  nunca innerHTML. Incluye un botón

  "Iniciar sesión con Hugging Face" que solo lleva a https://huggingface.co/oauth/authorize
  (marcador para la integración OAuth).

  No incluyas ninguna clave.

  '
checks:
- kind: contains
  values:
  - <!doctype html
  - API_BASE
  - fetch(
  - /chat/send
  - X-API-Key
  - textContent
  - oauth
- kind: min_chars
  value: 1500
- kind: no_secrets
