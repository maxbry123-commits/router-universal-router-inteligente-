schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-3-router
  framework: pocketflow
  group: hf-chat
  route:
  - nvidia
  - groq
  - cerebras
  - minimax_m3
  fallback:
  - minimax_m3
  max_tokens: 2200
