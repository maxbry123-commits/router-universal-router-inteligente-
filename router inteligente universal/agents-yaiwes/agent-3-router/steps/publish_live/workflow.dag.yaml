task: 'Escribe el módulo Python `publish_live.py` (solo código, un único bloque ```python,
  dependencias: huggingface_hub, requests) con la

  función `publish() -> dict` que hace TODO de verdad, en este orden: 1) usa HfApi(token=os.environ["HF_TOKEN"]).whoami()
  para obtener el

  nombre de la cuenta; 2) lanza el Job del Router (imagen "python:3.12", flavor "cpu-basic",
  expose=[8000], comando bash con el clon y

  arranque descritos en el CONTEXTO); 3) espera hasta 300 s a que `inspect_job` diga
  stage=="RUNNING" y a que un GET a

  "<endpoint>/health" (con Authorization Bearer del HF_TOKEN) responda 200; 4) escribe
  en una carpeta temporal los archivos README.md e

  index.html EXACTOS de la SALIDA VERIFICADA de los pasos anteriores (sustituyendo
  dentro del index.html el texto del marcador

  "API_BASE = ''''" o similar por la URL real del Job, si existe ese marcador; si
  no, deja el archivo igual); 5) importa `deploy` de

  `deploy_static_space.py` (ya escrito, mismo directorio) y lo llama con space_id
  = "<cuenta>/riu-chat-yaiwes", esa carpeta, y el token;

  6) hace un GET a la URL del Space devuelta y confirma que responde (200 o 401, ambos
  indican que existe). Devuelve {"space_url",

  "router_endpoint", "router_health_ok": bool, "space_reachable": bool}. Cualquier
  fallo real (no simulado) debe propagarse como excepción,

  nunca inventar un resultado.

  '
checks:
- kind: python_ast
- kind: python_exec
  module: publish_live.py
  test: 'import os

    assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN en el entorno"

    from publish_live import publish

    r = publish()

    assert r["router_health_ok"] is True, r

    assert r["space_reachable"] is True, r

    assert r["space_url"].startswith("https://huggingface.co/spaces/"), r

    print(r)

    '
- kind: no_secrets
