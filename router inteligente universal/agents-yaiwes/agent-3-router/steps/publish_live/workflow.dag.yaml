    \ universal/agents-yaiwes/agent-3-router/steps/space_readme/results/output.txt\
    \ ===\n---\ntitle: \"Chat YAIWES\"\nemoji: \"\U0001F4AC\"\ncolorFrom: \"blue\"\
    \ncolorTo: \"indigo\"\nsdk: static\npinned: false\nhf_oauth: true\nhf_oauth_scopes:\n\
    \  - jobs\n  - inference-api\n---\nEste Space estático proporciona una interfaz\
    \ de chat basada en HTML y JavaScript que se ejecuta totalmente en el navegador\
    \ del usuario. No almacena ni expone claves privadas; toda la información sensible\
    \ permanece en el servidor del Router, que se ejecuta como un Job de Hugging Face\
    \ con los recursos especificados (8 vCPU / 32 GB). La interfaz se comunica mediante\
    \ peticiones HTTP al endpoint expuesto por el Job (https://<job_id>--8000.hf.jobs),\
    \ enviando el cuerpo JSON requerido por la API del Router y recibiendo la respuesta\
    \ con el mensaje, el identificador de conversación y otros campos. Para autenticar\
    \ sin necesidad de un token maestro, el Space utiliza HF OAuth, solicitando únicamente\
    \ los scopes `jobs` e `inference-api`, lo que permite al frontend iniciar y consultar\
    \ el Job y, si es necesario, acceder a proveedores de inferencia de forma segura.\
    \ Todo el código del Space es público y revisable, garantizando transparencia,\
