schema: yaiwes.chain/v1

# Agente 10 — MICRO-ORDEN: 1 Job Qwen RUNNING_HEALTHY SOLO en máquina 32 GB RAM.
# Prohibido ≠32GB. PASS solo con /health 200. Timeout healthcheck ampliado (900s).
input_block: |
  ORDEN: un solo Job en la máquina de 32 GB RAM.
  Prohibido montar Jobs en otro hardware. Meta: Qwen3-0.6B RUNNING_HEALTHY + /health.
  Relanzar con timeout mayor; PASS solo si healthcheck OK.

agent:
  id: agent-10-model-install
  framework: pocketflow
  group: hf-install
  route: [deepseek_flash, minimax_m3, groq, nvidia, cerebras]
  fallback: []
  max_tokens: 2800

context:
  text: |
    HARDWARE ÚNICO PERMITIDO: máquina de 32 GB RAM (flavor técnico HF "cpu-upgrade" = 8 vCPU / 32 GB).
    PROHIBIDO: máquina 16GB (cpu-basic), GPU y cualquier otro. Sheriff: assert_machine_32gb_ram + guarded_run_job.
    Modelo único: qwen3-0.6b → Qwen/Qwen3-0.6B-GGUF / Qwen3-0.6B-Q8_0.gguf, port 8080.
    image "ghcr.io/ggml-org/llama.cpp:server"; curl Hub → /model.gguf → llama-server.
    Job timeout="45m". Espera healthcheck hasta 900s (poll ~10s). PASS solo si GET /health → 200.
    Import Sheriff: sys.path → agents-yaiwes/common; from hardware_sheriff import assert_machine_32gb_ram, guarded_run_job.
    HfHubHTTPError desde huggingface_hub.errors (fallback .utils). NUNCA top-level.

steps:

  - id: install_launch_test
    task: |
      Escribe el módulo Python `install_launch_test.py` (solo código, un único bloque ```python, deps: huggingface_hub, requests).
      Imports: os, sys, time, Path, requests; HfApi; HfHubHTTPError desde errors (fallback utils).
      Añade common/ al sys.path (parents[4]/common) y:
        from hardware_sheriff import assert_machine_32gb_ram, guarded_run_job, HardwareSheriffError
      Constantes: MODELS = [("qwen3-0.6b","Qwen/Qwen3-0.6B-GGUF","Qwen3-0.6B-Q8_0.gguf")]  # SOLO 1
        JOB_TIMEOUT="45m"; HEALTH_WAIT_S=900; POLL_S=10
      Función `launch_and_verify(model_id, repo, file, port=8080, flavor="cpu-upgrade") -> dict`:
        - ANTES de lanzar: assert_machine_32gb_ram(flavor=flavor); si HardwareSheriffError → raise ValueError(str(e))
        - Lanzar SOLO con guarded_run_job(api, image=..., command=..., flavor=flavor, timeout=JOB_TIMEOUT, expose=[port])
        - Probar varios endpoints (job.endpoint, *.jobs.huggingface.co, *--port.hf.jobs)
        - Esperar hasta HEALTH_WAIT_S: stage RUNNING + GET .../health 200 con Bearer HF_TOKEN
        - status RUNNING_HEALTHY solo si health 200; si no FAILED con detail
        - Devuelve {model_id, job_id, endpoint, status, detail, flavor}
      `run_all()` llama launch_and_verify solo para el único MODELS.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: install_launch_test.py
        test: |
          import os
          assert os.environ.get("HF_TOKEN"), "falta HF_TOKEN en el entorno"
          from install_launch_test import run_all, launch_and_verify
          raised = False
          try:
              launch_and_verify("x", "y/z", "f.gguf", flavor="cpu-basic")
          except ValueError:
              raised = True
          assert raised, "debía rechazar máquina ≠32GB"
          raised2 = False
          try:
              launch_and_verify("x", "y/z", "f.gguf", flavor="a10g-small")
          except ValueError:
              raised2 = True
          assert raised2, "debía rechazar GPU"
          results = run_all()
          assert len(results) == 1, "solo 1 modelo esta ronda"
          r = results[0]
          assert r.get("flavor") == "cpu-upgrade"
          assert r["status"] == "RUNNING_HEALTHY", f"{r['model_id']} no quedó corriendo: {r.get('detail')}"
          print(r["model_id"], r["endpoint"], r.get("job_id"))
      - kind: no_secrets

edges: []
