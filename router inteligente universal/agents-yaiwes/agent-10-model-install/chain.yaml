schema: yaiwes.chain/v1

# Agente 10 — INSTALADOR DE MODELOS en HF. Marco: PocketFlow. Prepara la orden de cada modelo pendiente del catálogo (agent-9) como una
# especificación validada, NUNCA la ejecuta él mismo. El Sheriff prohíbe cualquier hardware con GPU (a10g, t4, l4, l40, h100, a100, gpu) —
# solo cpu-basic o cpu-upgrade. El lanzamiento real lo hace un script determinista (sin IA) que Claude corre después de leer estas órdenes.
input_block: |
  Delega pon 2 o más agente encargado de colocar todos los  modelos que hacen falta en HF
  Tu solo haces el router y supervisas todo lo demás lo delegas

agent:
  id: agent-10-model-install
  framework: pocketflow
  group: hf-install
  route: [deepseek_flash, minimax_m3, groq, nvidia, cerebras]
  fallback: []
  max_tokens: 2200

context:
  text: |
    Modelos pendientes de instalar (catálogo del agente 9), cada uno con su repo GGUF y archivo: qwen3.5-0.8b (ggml-org/Qwen3.5-0.8B-GGUF,
    Qwen3.5-0.8B-Q4_0.gguf), lfm2.5-1.2b-instruct (LiquidAI/LFM2.5-1.2B-Instruct-GGUF, LFM2.5-1.2B-Instruct-Q4_K_M.gguf), lfm2.5-1.2b-thinking
    (LiquidAI/LFM2.5-1.2B-Thinking-GGUF, LFM2.5-1.2B-Thinking-Q4_K_M.gguf), qwen3-0.6b (Qwen/Qwen3-0.6B-GGUF, Qwen3-0.6B-Q8_0.gguf), gemma-4-e2b
    (google/gemma-4-E2B-it-qat-q4_0-gguf, gemma-4-E2B_q4_0-it.gguf), k2-horizon-0.9b (IFM/K2-Horizon-0.9B-GGUF), smollm3-3b
    (ggml-org/SmolLM3-3B-GGUF), muse-glimmer-30b (meta-models/Muse-Glimmer-30B-GGUF, Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf).
    Regla de seguridad NO negociable: SOLO flavor "cpu-basic" o "cpu-upgrade". Cualquier mención de GPU (a10g, t4, l4, l40, h100, a100, gpu) hace
    que la orden se rechace por completo — nunca la propongas.

steps:

  - id: install_orders
    task: |
      Escribe SOLO un objeto JSON (un único bloque ```json) con la clave "orders": una lista con UNA orden por cada modelo del CONTEXTO
      (8 en total). Cada orden: {"model_id", "repo", "file", "flavor" (SIEMPRE "cpu-basic" o "cpu-upgrade", nunca otra cosa), "port" (8080),
      "why_this_flavor" (una frase: por qué ese modelo cabe en ese hardware sin GPU), "status": "PENDING_LAUNCH"}. Ordena la lista del modelo
      más chico al más grande. No inventes modelos que no estén en el CONTEXTO. No escribas nada de dinero ni de tiempos de espera.
    checks:
      - kind: contains
        values: ['"orders"', "cpu-basic"]
      - kind: no_secrets

  - id: install_report
    context_file:
      - router inteligente universal/agents-yaiwes/agent-10-model-install/steps/install_orders/results/output.txt
    task: |
      Con las órdenes del CONTEXTO (SALIDA VERIFICADA DEL PASO ANTERIOR), escribe el módulo Python `install_report.py` (solo código, un único
      bloque ```python, solo biblioteca estándar: json, re) con la función `validate_orders(text: str) -> dict`: extrae el JSON del texto,
      revisa cada orden y devuelve {"ok": lista de las que tienen flavor en ("cpu-basic","cpu-upgrade"), "rejected": lista de las que NO
      (cualquier otro flavor, o flavor ausente), "count": total}. Debe funcionar aunque el texto tenga texto alrededor del JSON.
    checks:
      - kind: python_ast
      - kind: python_exec
        module: install_report.py
        test: |
          from install_report import validate_orders
          text = 'texto\n```json\n{"orders": [{"model_id":"a","flavor":"cpu-basic"},{"model_id":"b","flavor":"a10g-small"},{"model_id":"c","flavor":"cpu-upgrade"}]}\n```\nmas texto'
          r = validate_orders(text)
          assert r["count"] == 3 and {o["model_id"] for o in r["ok"]} == {"a", "c"} and {o["model_id"] for o in r["rejected"]} == {"b"}
      - kind: no_secrets

edges:
  - install_orders -> install_report
