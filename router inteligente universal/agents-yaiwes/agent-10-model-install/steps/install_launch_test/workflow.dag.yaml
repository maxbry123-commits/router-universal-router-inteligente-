context:
  text: "Copia GOLDEN/install_launch_test.py verbatim a results/install_launch_test.py.\n\
    El wrapper llama own_server_launch.main(). Solo máquina 32 GB RAM.\n\n\n=== ARCHIVO\
    \ router inteligente universal/agents-yaiwes/agent-10-model-install/GOLDEN/install_launch_test.py\
    \ ===\n\"\"\"GOLDEN wrapper — NO regenerar. Ejecuta common/own_server_launch.py\
    \ (método vivo Director).\nSolo máquina 32 GB RAM. Meta: RUNNING_HEALTHY vía /health\
    \ en --8080.hf.jobs.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\n\
    import sys\nfrom pathlib import Path\n\n_COMMON = Path(__file__).resolve().parents[4]\
    \ / \"common\"\nif str(_COMMON) not in sys.path:\n    sys.path.insert(0, str(_COMMON))\n\
    \nfrom hardware_sheriff import HardwareSheriffError, assert_machine_32gb_ram\n\
    from own_server_launch import main as own_server_main\n\nFLAVOR_32GB = \"cpu-upgrade\"\
    \n\n\ndef launch_and_verify(model_id=\"qwen3.5-0.8b\", repo=\"ggml-org/Qwen3.5-0.8B-GGUF\"\
    , file=\"Qwen3.5-0.8B-Q4_0.gguf\", port=8080, flavor=FLAVOR_32GB):\n    try:\n\
    \        assert_machine_32gb_ram(flavor=flavor)\n    except HardwareSheriffError\
    \ as e:\n        raise ValueError(str(e)) from e\n    if flavor != FLAVOR_32GB:\n\
    \        raise ValueError(f\"solo máquina 32 GB RAM, got {flavor}\")\n    code\
    \ = own_server_main()\n    ok = code == 0\n    return {\n        \"model_id\"\
    : model_id,\n        \"job_id\": None,\n        \"endpoint\": None,\n        \"\
    status\": \"RUNNING_HEALTHY\" if ok else \"FAILED\",\n        \"detail\": \"own_server_launch.main\
    \ exit=%s\" % code,\n        \"flavor\": flavor,\n    }\n\n\ndef run_all():\n\
    \    return [launch_and_verify()]\n\n\nif __name__ == \"__main__\":\n    r = run_all()[0]\n\
    \    print(r)\n    raise SystemExit(0 if r[\"status\"] == \"RUNNING_HEALTHY\"\
    \ else 1)\n\n\n=== ARCHIVO router inteligente universal/agents-yaiwes/common/own_server_launch.py\
    \ ===\n\"\"\"Launches a REAL local model server on the Director's OWN Hugging\
    \ Face account\n(his compute, his Job) — NOT a third-party paid API. Weights are\
    \ fetched from the\npublic Hub URL inside the Job. Solo máquina de 32 GB RAM (via\
    \ guarded_run_job).\n\"\"\"\nfrom __future__ import annotations\n\nimport os\n\
    import time\n\nimport requests\nfrom huggingface_hub import HfApi\n\nfrom hardware_sheriff\
    \ import guarded_run_job\n\nMODEL_REPO = \"ggml-org/Qwen3.5-0.8B-GGUF\"\nMODEL_FILE\
    \ = \"Qwen3.5-0.8B-Q4_0.gguf\"\nPORT = 8080\n# Máquina obligatoria: 32 GB RAM\
    \ (nunca 16 GB / cpu-basic)\nFLAVOR_32GB = \"cpu-upgrade\"\n\n\ndef note(title:\
    \ str, msg: str, level: str = \"notice\") -> None:\n    print(f\"::{title.upper()}\
    \ {level}:: {msg}\".replace(\"\\n\", \" \")[:900], flush=True)\n    print(f\"\
    ::{level} title=RIU_OWNSERVER_{title}::{msg}\".replace(\"\\n\", \" \")[:900],\
    \ flush=True)\n\n\ndef main() -> int:\n    token = os.environ[\"HF_TOKEN\"]\n\
    \    api = HfApi(token=token)\n    url = f\"https://huggingface.co/{MODEL_REPO}/resolve/main/{MODEL_FILE}\"\
    \n    sh = (\n        f\"curl -fL '{url}' -o /model.gguf && /app/llama-server\
    \ -m /model.gguf \"\n        f\"--host 0.0.0.0 --port {PORT} \"\n        \"-c\
    \ 8192 -np 4 -cb --cache-prompt --cache-reuse 256 --cache-ram 512 \"\n       \
    \ \"-fa on -ctk q8_0 -ctv q8_0\"\n    )\n    try:\n        job = guarded_run_job(\n\
    \            api,\n            image=\"ghcr.io/ggml-org/llama.cpp:server\",\n\
    \            command=[\"bash\", \"-lc\", sh],\n            flavor=FLAVOR_32GB,\n\
    \            timeout=\"30m\",\n            expose=[PORT],\n        )\n    except\
    \ Exception as exc:  # noqa: BLE001\n        note(\"LAUNCH_ERROR\", f\"{type(exc).__name__}:\
    \ {str(exc)[:400]}\", \"warning\")\n        return 1\n    note(\"JOB_ID\", str(job.id))\n\
    \    t0, ok, urls, stage, info = time.time(), None, [], None, None\n    while\
    \ time.time() - t0 < 480 and ok is None:\n        info = api.inspect_job(job_id=job.id)\n\
    \        stage = info.status.stage\n        cand = [\n            getattr(info,\
    \ \"endpoint\", None),\n            getattr(job, \"endpoint\", None),\n      \
    \      f\"https://{job.id}--{PORT}.hf.jobs\",\n            f\"https://{job.id}.jobs.huggingface.co\"\
    ,\n        ]\n        urls = [u for u in dict.fromkeys(cand) if u]\n        if\
    \ stage == \"RUNNING\":\n            for u in urls:\n                try:\n  \
    \                  r = requests.get(\n                        str(u).rstrip(\"\
    /\") + \"/health\",\n                        headers={\"Authorization\": \"Bearer\
    \ \" + token},\n                        timeout=15,\n                    )\n \
    \                   if r.status_code == 200:\n                        ok = u\n\
    \                        break\n                except Exception:  # noqa: BLE001\n\
    \                    pass\n        if stage in (\"ERROR\", \"COMPLETED\", \"CANCELED\"\
    , \"DELETED\"):\n            break\n        time.sleep(10)\n    logs = []\n  \
    \  try:\n        for line in api.fetch_job_logs(job_id=job.id):\n            logs.append(str(line))\n\
    \    except Exception as exc:  # noqa: BLE001\n        logs.append(f\"logs: {type(exc).__name__}\"\
    )\n    note(\"STATE\", f\"stage={stage} health_ok_url={ok} urls_probadas={urls}\
    \ logs_final={' | '.join(logs[-8:])[:600]}\")\n    return 0 if ok else 1\n\n\n\
    if __name__ == \"__main__\":\n    raise SystemExit(main())\n"
  max_chars: 40000
task: 'Copia verbatim GOLDEN/install_launch_test.py a results/install_launch_test.py.

  Un solo bloque python idéntico al GOLDEN. No inventes código.

  '
