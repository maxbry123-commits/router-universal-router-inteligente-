schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-10-model-install
  framework: pocketflow
  group: hf-install
  route:
  - nvidia
  - groq
  - cerebras
  - minimax_m3
  fallback: []
  max_tokens: 2800
context:
  text: 'HARDWARE ÚNICO PERMITIDO: flavor exactamente "cpu-upgrade" (= 8 vCPU / 32
    GB RAM en HF Jobs).

    PROHIBIDO: cpu-basic (16 GB), GPU (a10g/t4/l4/etc.), cpu-xlarge u otros. Si el
    código intenta otro flavor → ValueError ANTES de run_job.

    Modelo único esta ronda: qwen3-0.6b → repo Qwen/Qwen3-0.6B-GGUF, file Qwen3-0.6B-Q8_0.gguf,
    port 8080.

    Patrón verificado: image "ghcr.io/ggml-org/llama.cpp:server", command bash:

    `curl -fL https://huggingface.co/{repo}/resolve/main/{file} -o /model.gguf &&
    /app/llama-server -m /model.gguf --host 0.0.0.0 --port 8080 -c 8192 -np 4 -cb
    --cache-prompt --cache-ram 512 -fa on -ctk q8_0 -ctv q8_0`

    HfApi(token=os.environ["HF_TOKEN"]).run_job(..., flavor="cpu-upgrade", timeout="20m",
    expose=[8080]);

    esperar inspect_job stage=="RUNNING"; GET <endpoint>/health con Authorization
    Bearer HF_TOKEN → 200 = RUNNING_HEALTHY.

    IMPORT: HfHubHTTPError NUNCA desde huggingface_hub top-level. Usar `from huggingface_hub.errors
    import HfHubHTTPError`

    (fallback `from huggingface_hub.utils import HfHubHTTPError`). HfApi sí: `from
    huggingface_hub import HfApi`.

    '
  max_chars: 40000
task: "Escribe el módulo Python `install_launch_test.py` (solo código, un único bloque\
  \ ```python, deps: huggingface_hub, requests).\nImports: os, time, requests; `from\
  \ huggingface_hub import HfApi`; `from huggingface_hub.errors import HfHubHTTPError`\n\
  (si falla el import de errors, fallback utils). NUNCA `from huggingface_hub import\
  \ HfHubHTTPError`.\nFunción `launch_and_verify(model_id, repo, file, port=8080,\
  \ flavor=\"cpu-upgrade\") -> dict`:\n  - Si flavor != \"cpu-upgrade\": raise ValueError(\"\
  HARDWARE: solo cpu-upgrade 32GB permitido\") ANTES de run_job.\n  - URL: https://huggingface.co/{repo}/resolve/main/{file}\n\
  \  - run_job(image=\"ghcr.io/ggml-org/llama.cpp:server\", command=[\"bash\",\"-lc\"\
  , curl+llama-server del CONTEXTO],\n    flavor=\"cpu-upgrade\", timeout=\"20m\"\
  , expose=[port]) con token HF_TOKEN.\n  - Espera hasta 300s: inspect_job RUNNING\
  \ + GET endpoint/health 200.\n  - Devuelve {\"model_id\",\"job_id\",\"endpoint\"\
  ,\"status\":\"RUNNING_HEALTHY\"|\"FAILED\",\"detail\",\"flavor\":\"cpu-upgrade\"\
  }.\n`MODELS = [(\"qwen3-0.6b\",\"Qwen/Qwen3-0.6B-GGUF\",\"Qwen3-0.6B-Q8_0.gguf\"\
  )]`  # SOLO este, 1 Job\n`run_all() -> list[dict]` llama launch_and_verify en secuencia\
  \ para cada MODELS (un solo item).\n"
checks:
- kind: python_ast
- kind: python_exec
  module: install_launch_test.py
  test: "import os\nassert os.environ.get(\"HF_TOKEN\"), \"falta HF_TOKEN en el entorno\"\
    \nfrom install_launch_test import run_all, launch_and_verify\n# debe rechazar\
    \ hardware no-32GB\nraised = False\ntry:\n    launch_and_verify(\"x\", \"y/z\"\
    , \"f.gguf\", flavor=\"cpu-basic\")\nexcept ValueError:\n    raised = True\nassert\
    \ raised, \"debía rechazar cpu-basic (solo cpu-upgrade 32GB)\"\nraised2 = False\n\
    try:\n    launch_and_verify(\"x\", \"y/z\", \"f.gguf\", flavor=\"a10g-small\"\
    )\nexcept ValueError:\n    raised2 = True\nassert raised2, \"debía rechazar GPU\"\
    \nresults = run_all()\nassert len(results) == 1, \"solo 1 modelo esta ronda\"\n\
    r = results[0]\nassert r.get(\"flavor\") == \"cpu-upgrade\"\nassert r[\"status\"\
    ] == \"RUNNING_HEALTHY\", f\"{r['model_id']} no quedó corriendo: {r.get('detail')}\"\
    \nprint(r[\"model_id\"], r[\"endpoint\"], r.get(\"job_id\"))\n"
- kind: no_secrets
