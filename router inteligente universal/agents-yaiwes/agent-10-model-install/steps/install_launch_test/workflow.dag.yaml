  values:
  - own_server_launch
  - own_server_main
  - assert_machine_32gb_ram
  - cpu-upgrade
- kind: python_exec
  module: install_launch_test.py
  test: "import os\nassert os.environ.get(\"HF_TOKEN\"), \"falta HF_TOKEN\"\nimport\
    \ install_launch_test as m\nsrc = open(m.__file__).read()\nassert \"own_server_launch\"\
    \ in src\nassert \"own_server_main\" in src\nfrom install_launch_test import run_all,\
    \ launch_and_verify\nraised = False\ntry:\n    launch_and_verify(flavor=\"cpu-basic\"\
    )\nexcept ValueError:\n    raised = True\nassert raised, \"debía rechazar 16GB\"\
    \nresults = run_all()\nassert len(results) == 1\nassert results[0][\"status\"\
    ] == \"RUNNING_HEALTHY\", results[0].get(\"detail\")\nprint(results[0])\n"
- kind: no_secrets
