schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-10-model-install
  framework: pocketflow
  group: hf-install
  route:
  - nvidia
  - groq
  - cerebras
  - deepseek_flash
  fallback: []
  max_tokens: 2200
context:
  text: |
    ORDEN Director: HARDWARE ÚNICO = flavor exactamente "cpu-upgrade" (8 vCPU / 32 GB RAM).
    PROHIBIDO: cpu-basic (16 GB), GPU, cualquier otro flavor.
    Modelos (repo GGUF / file): qwen3-0.6b (Qwen/Qwen3-0.6B-GGUF, Qwen3-0.6B-Q8_0.gguf),
    qwen3.5-0.8b (ggml-org/Qwen3.5-0.8B-GGUF, Qwen3.5-0.8B-Q4_0.gguf),
    lfm2.5-1.2b-instruct, lfm2.5-1.2b-thinking, gemma-4-e2b, k2-horizon-0.9b, smollm3-3b, muse-glimmer-30b.
  max_chars: 40000
task: |
  Escribe SOLO un objeto JSON (un único bloque ```json) con la clave "orders":
  UNA orden por modelo del CONTEXTO. Cada orden: {"model_id","repo","file",
  "flavor":"cpu-upgrade" (SIEMPRE exactamente cpu-upgrade, nunca cpu-basic ni GPU),
  "port":8080, "why_this_flavor":"32GB cpu-upgrade obligatorio Director",
  "status":"PENDING_LAUNCH"}. Ordena de más chico a más grande.
checks:
- kind: contains
  values:
  - '"orders"'
  - cpu-upgrade
- kind: no_secrets
