schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-28-memoria-descarga
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 600
context:
  text: 'Motor canónico, mismo patrón que agent-19 (CLOSED). Destino: Componente open
    soure router inteligente universal/<slug>.

    GAP (repo exacto sin confirmar, no se descargan): mimo code, Memanto, Ponytail,
    Archify, AgentDB (posible dentro de ruflo, ya descargado).



    SALIDA VERIFICADA DEL PASO ANTERIOR (graphiti):

    GAP: no se puede determinar el slug exacto del repositorio de Graphiti para construir
    el request de descarga. El contexto indica "repo exacto sin confirmar" y solo
    se mencionan candidatos (mimo code, Memanto, Ponytail, Archify, AgentDB) sin confirmar
    cuál corresponde a Graphiti. Sin el slug concreto, no es posible emitir MOTOR_EXEC_REQUEST_GRAPHITI.'
  max_chars: 40000
task: Responde exactamente MOTOR_EXEC_REQUEST_FALKORDB.
checks:
- kind: contains
  values:
  - MOTOR_EXEC_REQUEST_FALKORDB
- kind: motor_exec
  path: ➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor
    descarga de componentes y extracción de zip/hf_download_extract_engine.py
  timeout: 1800
  env:
    SOURCE_REPO: FalkorDB/falkordb-py
    SOURCE_REF: main
    SLUG: falkordb-py
    DEST_REPO: maxbry123-commits/router-universal-router-inteligente-
    DEST_BRANCH: main
    DEST_ROOT: router inteligente universal/Componente open soure router inteligente
      universal
    PUBLISH: '1'
  expect:
    verdict: VERIFIED_CLOSED
    publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED
- kind: no_secrets
