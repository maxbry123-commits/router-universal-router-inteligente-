schema: yaiwes.chain/v1

# Cadena de pasos (DSL DAG) del agente 1 — CHAT. Marco: PocketFlow. Cada paso lo valida el Sheriff; si un paso queda BLOCKED, los siguientes no corren.
input_block: |
  Revisa mis instrucciones de lo que debe hace cada agente y revisas todas mis notas y lo pones a trabajar 2 agentes en  en el chat en taress distintas
  Le das una encadenado de pasos

agent:
  id: agent-1-chat-hf
  framework: pocketflow
  group: chat
  route: [nvidia, groq, cerebras]
  fallback: [minimax_m3]
  max_tokens: 1800

context:
  text: |
    ENDPOINTS DEL CHAT (todos con cabecera X-API-Key; los paneles reciben fetchJson(path, options) -> Promise<{status, body}>):
    - POST /vault/unlock  cuerpo {"passphrase": "..."}  -> 200 {"unlocked": true, "credentials": N}; 401 contraseña incorrecta; 429 demasiados intentos.
    - POST /vault/lock    -> 200 {"unlocked": false}
    - GET  /chat/router/status -> {"deepseek_peak_now": bool, "limiter": {"tier": n, "slots": n, "tiers": [3, 10]}, "latency_seconds": {...},
        "groups": {"<grupo>": {"authorized_fallback": bool, "chain": [{"provider": "...", "model": "..."}], "skipped": ["..."]}}}
    - POST /chat/jobs/run cuerpo {"jobs": [...], "max_parallel": 8} -> {"results": [{"id": "...", "status": "..."}], "passed": n, "total": n}
    Regla de seguridad: mostrar datos del servidor SOLO con textContent (nunca innerHTML).

steps:

  - id: vault_panel
    task: |
      Escribe SOLO JavaScript (un único bloque ```js) que defina la función global `initVaultPanel(container, fetchJson)` para la
      pestaña "Claves" del chat. `container` es un elemento DOM y `fetchJson(path, options)` devuelve una promesa con {status, body}.
      La función crea dentro del contenedor: un campo de contraseña (type password, placeholder "Contraseña maestra"), un botón
      "Desbloquear" que llama a fetchJson('/vault/unlock', {method: 'POST', body: JSON.stringify({passphrase: <valor del campo>})}),
      un botón "Bloquear" que llama a fetchJson('/vault/lock', {method: 'POST'}) y un elemento de estado que muestra "desbloqueado" o
      "bloqueado" según la respuesta (status 200 = éxito). Al desbloquear debe vaciar el campo de contraseña. Sin librerías externas.
      Usa textContent, nunca innerHTML con datos del servidor.
    checks:
      - kind: js_syntax
        file: vault_panel.js
      - kind: contains
        values: [initVaultPanel, /vault/unlock, /vault/lock, passphrase]
      - kind: no_secrets

  - id: router_panel
    task: |
      Escribe SOLO JavaScript (un único bloque ```js) que defina la función global `initRouterPanel(container, fetchJson)`.
      Crea dentro del contenedor un botón "Actualizar estado del Router" y un elemento de texto. Al pulsar (y una vez al iniciar) llama a
      fetchJson('/chat/router/status') y, si status es 200, muestra con textContent: una línea "Hora pico de DeepSeek: sí/no"
      (según body.deepseek_peak_now), una línea "Concurrencia: <limiter.slots> espacios (nivel <limiter.tier>)" y una línea por grupo:
      "<grupo>: respaldo autorizado sí/no (authorized_fallback) — <modelos de chain unidos con ' → '>". Si status no es 200 muestra
      "Error <status>". Sin librerías externas. Nunca innerHTML con datos del servidor.
    checks:
      - kind: js_syntax
        file: router_panel.js
      - kind: contains
        values: [initRouterPanel, /chat/router/status, deepseek_peak_now, authorized_fallback]
      - kind: no_secrets

  - id: wire_panels
    task: |
      Escribe SOLO JavaScript (un único bloque ```js) que defina la función global `wirePanels(root, fetchJson)`. `root` es un elemento
      DOM. Para cada panel crea una sección con un título (h3, textContent) y un div contenedor dentro de `root`, y llama a la función
      del panel con ese div y `fetchJson`: "Banco" -> initVaultPanel, "Router" -> initRouterPanel y "Trabajos" -> initJobsPanel.
      initJobsPanel solo existe si otro agente ya la entregó: llámala únicamente si `typeof initJobsPanel === 'function'`; si no,
      muestra en su sección el texto "Panel de trabajos pendiente". Devuelve un objeto {banco, router, trabajos} con los tres divs.
      Usa las funciones de los pasos anteriores (SALIDA VERIFICADA DEL PASO ANTERIOR) sin redefinirlas. Sin librerías externas.
    checks:
      - kind: js_syntax
        file: wire_panels.js
      - kind: contains
        values: [wirePanels, initVaultPanel, initRouterPanel, initJobsPanel]
      - kind: no_secrets

edges:
  - vault_panel -> router_panel
  - router_panel -> wire_panels
