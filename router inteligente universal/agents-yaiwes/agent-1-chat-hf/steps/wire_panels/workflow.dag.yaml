schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-1-chat-hf
  framework: pocketflow
  group: chat
  route:
  - nvidia
  - groq
  - cerebras
  fallback:
  - minimax_m3
  max_tokens: 1800
context:
  text: "ENDPOINTS DEL CHAT (todos con cabecera X-API-Key; los paneles reciben fetchJson(path,\
    \ options) -> Promise<{status, body}>):\n- POST /vault/unlock  cuerpo {\"passphrase\"\
    : \"...\"}  -> 200 {\"unlocked\": true, \"credentials\": N}; 401 contraseña incorrecta;\
    \ 429 demasiados intentos.\n- POST /vault/lock    -> 200 {\"unlocked\": false}\n\
    - GET  /chat/router/status -> {\"deepseek_peak_now\": bool, \"limiter\": {\"tier\"\
    : n, \"slots\": n, \"tiers\": [3, 10]}, \"latency_seconds\": {...},\n    \"groups\"\
    : {\"<grupo>\": {\"authorized_fallback\": bool, \"chain\": [{\"provider\": \"\
    ...\", \"model\": \"...\"}], \"skipped\": [\"...\"]}}}\n- POST /chat/jobs/run\
    \ cuerpo {\"jobs\": [...], \"max_parallel\": 8} -> {\"results\": [{\"id\": \"\
    ...\", \"status\": \"...\"}], \"passed\": n, \"total\": n}\nRegla de seguridad:\
    \ mostrar datos del servidor SOLO con textContent (nunca innerHTML).\n\n\nSALIDA\
    \ VERIFICADA DEL PASO ANTERIOR (router_panel):\n```js\nfunction initRouterPanel(container,\
    \ fetchJson) {\n    container.innerHTML = '';\n\n    const btn = document.createElement('button');\n\
    \    btn.textContent = 'Actualizar estado del Router';\n    const output = document.createElement('div');\n\
    \    output.style.whiteSpace = 'pre-line';\n\n    container.append(btn, output);\n\
    \n    async function refresh() {\n        const resp = await fetchJson('/chat/router/status');\n\
    \        if (resp.status === 200) {\n            const { deepseek_peak_now, limiter,\
    \ groups } = resp.body;\n            const lines = [];\n            lines.push(`Hora\
    \ pico de DeepSeek: ${deepseek_peak_now ? 'sí' : 'no'}`);\n            lines.push(`Concurrencia:\
    \ ${limiter.slots} espacios (nivel ${limiter.tier})`);\n            for (const\
    \ [groupName, info] of Object.entries(groups)) {\n                const authorized\
    \ = info.authorized_fallback ? 'sí' : 'no';\n                const models = info.chain.map(c\
    \ => c.model).join(' → ');\n                lines.push(`${groupName}: respaldo\
    \ autorizado ${authorized} (authorized_fallback) — ${models}`);\n            }\n\
    \            output.textContent = lines.join('\\n');\n        } else {\n     \
    \       output.textContent = `Error ${resp.status}`;\n        }\n    }\n\n   \
    \ btn.addEventListener('click', refresh);\n    refresh(); // initial load\n}\n\
    ```"
  max_chars: 9000
task: 'Escribe SOLO JavaScript (un único bloque ```js) que defina la función global
  `wirePanels(root, fetchJson)`. `root` es un elemento

  DOM. Para cada panel crea una sección con un título (h3, textContent) y un div contenedor
  dentro de `root`, y llama a la función

  del panel con ese div y `fetchJson`: "Banco" -> initVaultPanel, "Router" -> initRouterPanel
  y "Trabajos" -> initJobsPanel.

  initJobsPanel solo existe si otro agente ya la entregó: llámala únicamente si `typeof
  initJobsPanel === ''function''`; si no,

  muestra en su sección el texto "Panel de trabajos pendiente". Devuelve un objeto
  {banco, router, trabajos} con los tres divs.

  Usa las funciones de los pasos anteriores (SALIDA VERIFICADA DEL PASO ANTERIOR)
  sin redefinirlas. Sin librerías externas.

  '
checks:
- kind: js_syntax
  file: wire_panels.js
- kind: contains
  values:
  - wirePanels
  - initVaultPanel
  - initRouterPanel
  - initJobsPanel
- kind: no_secrets
