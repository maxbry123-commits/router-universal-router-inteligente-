schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-2-chat-hf-smol
  framework: smolagents
  group: chat
  route:
  - deepseek_flash
  - minimax_m3
  - groq
  - nvidia
  - cerebras
  fallback:
  - minimax_m3
  max_tokens: 1800
context:
  text: "CONTEXTO DEL CHAT: el Router ejecuta planes en el esquema `riu.dag/v1` (schema,\
    \ id, input_block literal, nodes con id, instructions,\nneeds, expect, retries,\
    \ model). El chat necesita una plantilla FIJA determinista que convierta las reglas\
    \ (YAML→dict) y una orden\n(JSON→dict) en un plan, y un Crazy Wall / handoff permanente\
    \ encadenado por hash para anotar cada avance. Solo biblioteca estándar.\n\n\n\
    SALIDA VERIFICADA DEL PASO ANTERIOR (jobs_panel):\n```js\nfunction initJobsPanel(container,\
    \ fetchJson) {\n  // Create textarea for JSON input\n  const textarea = document.createElement('textarea');\n\
    \  textarea.rows = 10;\n  textarea.cols = 60;\n  textarea.placeholder = 'Paste\
    \ JSON array of jobs here';\n  container.appendChild(textarea);\n\n  // Create\
    \ button\n  const button = document.createElement('button');\n  button.textContent\
    \ = 'Ejecutar en paralelo';\n  container.appendChild(button);\n\n  // Create output\
    \ container for results\n  const output = document.createElement('div');\n  container.appendChild(output);\n\
    \n  // Handle click\n  button.addEventListener('click', function() {\n    let\
    \ jobs;\n    try {\n      jobs = JSON.parse(textarea.value);\n      if (!Array.isArray(jobs))\
    \ throw new Error('Expected a JSON array');\n    } catch (e) {\n      output.textContent\
    \ = 'Error: ' + e.message;\n      return;\n    }\n\n    fetchJson('/chat/jobs/run',\
    \ {\n      method: 'POST',\n      body: JSON.stringify({jobs: jobs, max_parallel:\
    \ 8})\n    }).then(function(result) {\n      if (result.status >= 200 && result.status\
    \ < 300) {\n        const data = result.body;\n        const lines = data.map(function(job)\
    \ {\n          return job.id + ' - ' + job.status;\n        });\n        output.textContent\
    \ = lines.join('\\n');\n      } else {\n        output.textContent = 'Error: HTTP\
    \ ' + result.status;\n      }\n    }).catch(function(err) {\n      output.textContent\
    \ = 'Error: ' + err.message;\n    });\n  });\n}\n```"
  max_chars: 40000
task: 'Escribe un módulo Python `fixed_template.py` (solo código, un único bloque
  ```python, solo biblioteca estándar) con la función

  `render_order(rules: dict, order: dict) -> dict`.

  `rules` tiene "max_retries" (int), "route" (lista de proveedores) y "fallback" (lista).
  `order` tiene "id", "input_block" y "steps"

  (lista de dicts con "id", "instructions" y opcionalmente "expect").

  Devuelve un dict con: "schema" = "riu.dag/v1"; "id" = order["id"]; "input_block"
  = order["input_block"] SIN cambios; "route" y

  "fallback" copiados de rules; y "nodes": una lista con un nodo por paso, en el mismo
  orden, cada uno con "id" = id del paso,

  "instructions" = instructions del paso, "needs" = [] para el primero y [id del paso
  anterior] para los demás, "retries" =

  rules["max_retries"], "expect" = step.get("expect") y "model" = {"provider": rules["route"][0],
  "model": "auto"}.

  Lanza ValueError si "steps" está vacío, si input_block está vacío o si route está
  vacía. No modifica los diccionarios recibidos.

  '
checks:
- kind: python_ast
- kind: python_exec
  module: fixed_template.py
  test: "import copy\nfrom fixed_template import render_order\nrules = {\"max_retries\"\
    : 2, \"route\": [\"nvidia\", \"groq\"], \"fallback\": [\"minimax_m3\"]}\norder\
    \ = {\"id\": \"PLAN-1\", \"input_block\": \"  HAZ X\\nliteral  \", \"steps\":\
    \ [\n    {\"id\": \"A\", \"instructions\": \"primero\", \"expect\": {\"contains\"\
    : [\"ok\"]}}, {\"id\": \"B\", \"instructions\": \"segundo\"}, {\"id\": \"C\",\
    \ \"instructions\": \"tercero\"}]}\nr0, o0 = copy.deepcopy(rules), copy.deepcopy(order)\n\
    d = render_order(rules, order)\nassert rules == r0 and order == o0\nassert d[\"\
    schema\"] == \"riu.dag/v1\" and d[\"id\"] == \"PLAN-1\" and d[\"input_block\"\
    ] == \"  HAZ X\\nliteral  \"\nassert [n[\"id\"] for n in d[\"nodes\"]] == [\"\
    A\", \"B\", \"C\"]\nassert d[\"nodes\"][0][\"needs\"] == [] and d[\"nodes\"][1][\"\
    needs\"] == [\"A\"] and d[\"nodes\"][2][\"needs\"] == [\"B\"]\nassert d[\"nodes\"\
    ][0][\"expect\"] == {\"contains\": [\"ok\"]} and d[\"nodes\"][1][\"expect\"] is\
    \ None and d[\"nodes\"][0][\"retries\"] == 2\nassert d[\"nodes\"][0][\"model\"\
    ] == {\"provider\": \"nvidia\", \"model\": \"auto\"} and d[\"route\"] == [\"nvidia\"\
    , \"groq\"] and d[\"fallback\"] == [\"minimax_m3\"]\nfor bad in ({**order, \"\
    steps\": []}, {**order, \"input_block\": \"\"}):\n    try:\n        render_order(rules,\
    \ bad)\n        raise SystemExit(\"aceptó una orden inválida\")\n    except ValueError:\n\
    \        pass\ntry:\n    render_order({**rules, \"route\": []}, order)\n    raise\
    \ SystemExit(\"aceptó route vacía\")\nexcept ValueError:\n    pass\n"
- kind: no_secrets
