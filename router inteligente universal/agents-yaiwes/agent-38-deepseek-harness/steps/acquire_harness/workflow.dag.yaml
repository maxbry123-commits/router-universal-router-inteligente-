schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-38-deepseek-harness
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 2000
context:
  text: 'Camino rápido aprobado: CHAT → Harness → Memoria → Router YAIWES → LLM/Agente
    → Sheriff (puertas yaiwes.gate/v1) → respuesta.

    Evolución (MemRL, SCOPE, Bayesian-Agent, MetaClaw, Continual/Meta/Life-Harness,
    MOSS) = fase 2, asíncrona, fuera del camino de cada mensaje.

    Descarga solo con el motor canónico.

    '
  max_chars: 40000
task: 'Responde exactamente MOTOR_EXEC_REQUEST_DEEPSEEK_HARNESS.

  '
checks:
- kind: contains
  values:
  - MOTOR_EXEC_REQUEST_DEEPSEEK_HARNESS
- kind: motor_exec
  path: ➡️📂motores de descarga extracción copiado movimiento archivos router-universal-router-inteligente-/📂Motor
    descarga de componentes y extracción de zip/hf_download_extract_engine.py
  timeout: 1800
  env:
    SOURCE_REPO: deepseek-ai/deepseek-harness
    SOURCE_REF: main
    SLUG: deepseek-harness
    DEST_REPO: maxbry123-commits/router-universal-router-inteligente-
    DEST_BRANCH: main
    DEST_ROOT: router inteligente universal/Componente open soure router inteligente
      universal
    PUBLISH: '1'
  expect:
    verdict: VERIFIED_CLOSED
    publish.verdict: PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED
- kind: no_secrets
