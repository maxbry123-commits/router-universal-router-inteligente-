task: 'Audita el PAQUETE del CONTEXTO. Devuelve SOLO un objeto JSON {"items": [...]}
  con al menos 6 ítems, cada uno con:

  "id" (único, ej. P1-01), "quote" (copiada LETRA POR LETRA de las palabras del Director
  en el paquete, de 20 a 200 caracteres),

  "status" (uno de HECHO, PARCIAL, PENDIENTE, AMBIGUO, REFUTADO), "evidence" (lista
  de rutas del repo que EXISTEN y respaldan el estado; usa

  list_repo_dir y read_repo_file; lista vacía si es PENDIENTE) y "note" (una frase).
  Criterios: HECHO solo con evidencia verificada;

  REFUTADO si un agente afirma o entrega algo que no cumple la instrucción (di en
  "note" qué agente y por qué); AMBIGUO si la instrucción no

  permite decidir; PENDIENTE si no hay evidencia. No inventes rutas ni citas.

  '
