schema: yaiwes.chain/v1

# Agente 5 — AUDITOR / CHECKLIST (copia de SmolAgents convertida) — 4 PASADAS sobre TODAS las notas del Director (input block verbatim), una por lente:
# 1 chat · 2 almacenamiento y cableado de agentes con chat y documentos · 3 modelos de IA locales y aceleradores · 4 verificación cruzada (refuta a los agentes).
# El Sheriff exige que cada cita sea textual del Director y que cada evidencia exista en el repo. Salida determinista: AUDIT-CHECKLIST.md y DELEGACION.md.
input_block: |
  Prioridad solo el chat y los modelos de ai lo ales busca audita todos los imput block verbartin que yo te di para revisar haces una lista de lo que debe funcionar en hf todos los detalles del chat y almacenamiento para agantes y cabkear los agente al Chat y documentos y todos los modelos de ai más aceleradores para si
  Audita los archivos y haces una lista de lo que vas a mandar hacer
  4 pasadas

agent:
  id: agent-5-auditor
  framework: smolagents
  runner: auditor
  post: audit_report
  group: audit
  route: [deepseek_flash, minimax_m3, groq, nvidia, cerebras]
  fallback: []
  max_tokens: 4000

context:
  text: |
    Auditas por PASADAS: cada paso recibe un paquete con las palabras LITERALES del Director sobre un tema (`=== ARCHIVO: ... ===`) y el estado actual de los agentes (`agents_state.md`,
    con las rutas de sus entregables). Agentes: agent-1-chat-hf (paneles del chat), agent-2-chat-hf-smol (panel de trabajos, plantilla fija, Crazy Wall), agent-3-router (chat sin PRO en HF: Static Space),
    agent-4-router-smol (registro de modelos, Job, monitor de nodos), agent-6-hf-nodes (RAM, caché reducida, 10 procesadores), agent-7-llama-hf (llama-server con aceleradores), agent-8-router-local (pool de
    nodos locales y ruta espejo), agent-9-models-catalog (catálogo de modelos y plan de instalación). Ya existe en el repo: Chat MVP (`router inteligente universal/integration/chat_mvp/`: selector de
    proveedor y modelo, con/sin agente, cuentas GitHub, documentos, SQL+grafo+caché+documentos, banco de claves, jobs en paralelo, DAG, `/chat/route`); el Router corre en un Job de HF (probado); benchmarks
    de llama.cpp (Qwen3.5-0.8B tg 28 t/s, LFM2.5-1.2B tg 30 t/s en 4 vCPU). Prioridad del Director: SOLO el chat y los modelos de IA locales.

steps:

  - id: lens_chat
    context_file:
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-chat.md
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/agents_state.md
    task: |
      PASADA 1 — CHAT. Audita TODOS los detalles del chat que el Director pidió (interfaz, selector de proveedor y modelo, con o sin agente, cuentas de GitHub, documentos adjuntos, historial, banco de claves,
      paneles, costos, publicarlo en Hugging Face, URL) y di cuáles funcionan. Devuelve SOLO un objeto JSON {"items": [...]} con al menos 10 ítems, cada uno con: "id" (único, P1-01...), "quote" (copiada LETRA POR LETRA
      de las palabras del Director en el paquete, de 20 a 200 caracteres), "status" (HECHO, PARCIAL, PENDIENTE, AMBIGUO o REFUTADO), "area" (chat, almacenamiento, agentes, modelos o aceleradores),
      "evidence" (lista de rutas del CONTEXTO que respaldan el estado; [] si es PENDIENTE), "note" (una frase) y "tarea" (qué hay que mandar hacer a un agente, una frase; "" si es HECHO).
      HECHO solo con evidencia; REFUTADO si un agente entregó algo que no cumple (di cuál en "note"); AMBIGUO si no permite decidir; no inventes citas ni rutas.
    checks:
      - kind: audit_json
        min_items: 10
        sources: [router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-chat.md]
      - kind: no_secrets

  - id: lens_storage
    context_file:
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-storage.md
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/agents_state.md
    task: |
      PASADA 2 — ALMACENAMIENTO Y CABLEADO. Audita el ALMACENAMIENTO para agentes (SQL, grafo, caché, documentos, memoria, Crazy Wall, handoff, notas) y la conexión ("cablear") de los agentes con el chat y con
      los documentos, en Hugging Face. Devuelve SOLO un objeto JSON {"items": [...]} con al menos 10 ítems, cada uno con: "id" (único, P2-01...), "quote" (copiada LETRA POR LETRA de las palabras del Director en el
      paquete, de 20 a 200 caracteres), "status" (HECHO, PARCIAL, PENDIENTE, AMBIGUO o REFUTADO), "area" (chat, almacenamiento, agentes, modelos o aceleradores), "evidence" (lista de rutas del CONTEXTO; [] si es
      PENDIENTE), "note" (una frase) y "tarea" (qué mandar hacer a un agente; "" si es HECHO). No inventes citas ni rutas.
    checks:
      - kind: audit_json
        min_items: 10
        sources: [router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-storage.md]
      - kind: no_secrets

  - id: lens_models
    context_file:
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-models.md
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/agents_state.md
    task: |
      PASADA 3 — MODELOS DE IA LOCALES Y ACELERADORES. Audita los MODELOS locales en Hugging Face (pesos remotos, cuantización, una copia compartida por varias sesiones = espejo, RAM, 10 procesadores de 32 GB,
      salto de nodo, Jobs) y los ACELERADORES (llama.cpp: atención flash, caché KV q8, caché de prompt, batching continuo, ranuras, decodificación especulativa; OpenVINO, ONNX, TorchAO, etc.). Devuelve SOLO un objeto
      JSON {"items": [...]} con al menos 10 ítems, cada uno con: "id" (único, P3-01...), "quote" (copiada LETRA POR LETRA de las palabras del Director en el paquete, de 20 a 200 caracteres), "status" (HECHO,
      PARCIAL, PENDIENTE, AMBIGUO o REFUTADO), "area" (chat, almacenamiento, agentes, modelos o aceleradores), "evidence" (lista de rutas del CONTEXTO; [] si es PENDIENTE), "note" (una frase) y "tarea" (qué mandar
      hacer a un agente; "" si es HECHO). No inventes citas ni rutas.
    checks:
      - kind: audit_json
        min_items: 10
        sources: [router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-models.md]
      - kind: no_secrets

  - id: lens_cross
    context_file:
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-cross.md
      - router inteligente universal/agents-yaiwes/agent-5-auditor/packs/agents_state.md
    task: |
      PASADA 4 — VERIFICACIÓN CRUZADA. Contrasta lo que dicen los agentes (su estado y entregables en `agents_state.md`) con lo que el Director pidió (paquete). Marca REFUTADO cuando un agente entregó algo que no cumple
      lo pedido o no está donde debe, PENDIENTE lo que nadie hizo, AMBIGUO lo que no permite decidir. Solo chat y modelos locales. Devuelve SOLO un objeto JSON {"items": [...]} con al menos 10 ítems, cada uno con:
      "id" (único, P4-01...), "quote" (copiada LETRA POR LETRA de las palabras del Director en el paquete, de 20 a 200 caracteres), "status" (HECHO, PARCIAL, PENDIENTE, AMBIGUO o REFUTADO), "area" (chat,
      almacenamiento, agentes, modelos o aceleradores), "evidence" (lista de rutas del CONTEXTO; [] si es PENDIENTE), "note" (una frase; en REFUTADO di qué agente y por qué) y "tarea" (qué mandar hacer a un agente;
      "" si es HECHO). No inventes citas ni rutas.
    checks:
      - kind: audit_json
        min_items: 10
        sources: [router inteligente universal/agents-yaiwes/agent-5-auditor/packs/lens-cross.md]
      - kind: no_secrets

edges:
  - lens_chat -> lens_storage
  - lens_storage -> lens_models
  - lens_models -> lens_cross
