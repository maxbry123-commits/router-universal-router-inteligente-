context:
  text: "Secretos (solo nombres): NVIDIA_API_KEY_1..5, CEREBRAS_API_KEY_1..6. Groq:\
    \ no hay secreto todavía (GAP: el Director debe crear GROQ_API_KEY).\nAgentes\
    \ que programan (siguen con deepseek_flash): 16, 17, 25, 29, 30, 31, 33, 35, 36.\n\
    Agentes que no programan (van al router gratuito): 24, 26, 27 (mapa/parte), 32\
    \ (inventario), 38 (plan).\nROUTE.json existente en agents-yaiwes/ define las\
    \ rutas; añadir una ruta nueva \"free_pool\" sin tocar deepseek_flash.\n\n\nSALIDA\
    \ VERIFICADA DEL PASO ANTERIOR (free_pool):\n```python\nimport json\nimport os\n\
    import random\nimport time\nfrom datetime import datetime\nfrom typing import\
    \ Optional\n\nimport httpx\n\nHEALTH_FILE = \"free_pool_health.json\"\nHEALTH_INTERVAL\
    \ = 300  # 5 minutos\nLAST_CHECK = 0\nHEALTH_CACHE = {}\n\nPROVIDERS = {\n   \
    \ \"nvidia\": {\n        \"base_url\": \"https://integrate.api.nvidia.com/v1\"\
    ,\n        \"key_names\": [f\"NVIDIA_API_KEY_{i}\" for i in range(1, 6)],\n  \
    \      \"models\": [\"meta/llama-3.1-70b-instruct\", \"mistralai/mistral-7b-instruct-v0.3\"\
    ]\n    },\n    \"cerebras\": {\n        \"base_url\": \"https://api.cerebras.ai/v1\"\
    ,\n        \"key_names\": [f\"CEREBRAS_API_KEY_{i}\" for i in range(1, 7)],\n\
    \        \"models\": [\"claude-3-haiku-20240307\"]\n    },\n    \"groq\": {\n\
    \        \"base_url\": \"https://api.groq.com/openai/v1\",\n        \"key_names\"\
    : [\"GROQ_API_KEY\"],\n        \"models\": [\"mixtral-8x7b-32768\", \"llama-3.1-70b-versatile\"\
    , \"gemma-7b-it\"]\n    }\n}\n\ndef _get_provider_key(provider: str) -> Optional[str]:\n\
    \    keys = []\n    for name in PROVIDERS[provider][\"key_names\"]:\n        val\
    \ = os.getenv(name)\n        if val:\n            keys.append(val)\n    if not\
    \ keys:\n        return None\n    return random.choice(keys)\n\ndef _check_provider(provider:\
    \ str) -> dict:\n    key = _get_provider_key(provider)\n    if not key:\n    \
    \    return {\"healthy\": False, \"error\": \"no_key\", \"latency\": None, \"\
    timestamp\": datetime.utcnow().isoformat()}\n    \n    cfg = PROVIDERS[provider]\n\
    \    start = time.time()\n    try:\n        # Intenta listar modelos como health\
    \ check mínimo\n        resp = httpx.get(\n            f\"{cfg['base_url']}/models\"\
    ,\n            headers={\"Authorization\": f\"Bearer {key}\"},\n            timeout=10.0\n\
    \        )\n        latency = time.time() - start\n        if resp.status_code\
    \ == 200:\n            return {\"healthy\": True, \"error\": None, \"latency\"\
    : latency, \"timestamp\": datetime.utcnow().isoformat()}\n        else:\n    \
    \        return {\"healthy\": False, \"error\": f\"http_{resp.status_code}\",\
    \ \"latency\": latency, \"timestamp\": datetime.utcnow().isoformat()}\n    except\
    \ Exception as e:\n        return {\"healthy\": False, \"error\": str(e), \"latency\"\
    : time.time() - start, \"timestamp\": datetime.utcnow().isoformat()}\n\ndef _update_health():\n\
    \    global LAST_CHECK, HEALTH_CACHE\n    now = time.time()\n    if now - LAST_CHECK\
    \ < HEALTH_INTERVAL:\n        return\n    LAST_CHECK = now\n    for provider in\
    \ PROVIDERS:\n        HEALTH_CACHE[provider] = _check_provider(provider)\n   \
    \ with open(HEALTH_FILE, \"w\") as f:\n        json.dump(HEALTH_CACHE, f, indent=2)\n\
    \ndef _find_healthy_provider() -> Optional[str]:\n    _update_health()\n    for\
    \ provider in [\"nvidia\", \"cerebras\", \"groq\"]:\n        info = HEALTH_CACHE.get(provider,\
    \ {})\n        if info.get(\"healthy\"):\n            if _get_provider_key(provider):\n\
    \                return provider\n    return None\n\ndef complete(messages: list,\
    \ max_tokens: int = 1024) -> str:\n    provider = _find_healthy_provider()\n \
    \   if not provider:\n        # fallback a deepseek_flash (importación local para\
    \ evitar ciclo)\n        from deepseek_flash import complete as flash_complete\n\
    \        return flash_complete(messages, max_tokens)\n    \n    cfg = PROVIDERS[provider]\n\
    \    key = _get_provider_key(provider)\n    model = random.choice(cfg[\"models\"\
    ])\n    \n    try:\n        resp = httpx.post(\n            f\"{cfg['base_url']}/chat/completions\"\
    ,\n            headers={\"Authorization\": f\"Bearer {key}\", \"Content-Type\"\
    : \"application/json\"},\n            json={\n                \"model\": model,\n\
    \                \"messages\": messages,\n                \"max_tokens\": max_tokens\n\
    \            },\n            timeout=60.0\n        )\n        if resp.status_code\
    \ == 200:\n            return resp.json()[\"choices\"][0][\"message\"][\"content\"\
    ]\n        else:\n            raise ValueError(f\"API error: {resp.status_code}\
    \ {resp.text}\")\n    except Exception as e:\n        # fallback recursivo (máximo\
    \ 1 nivel)\n        from deepseek_flash import complete as flash_complete\n  \
    \      return flash_complete(messages, max_tokens)\n```"
  max_chars: 40000
task: 'Entrega el bloque JSON exacto para añadir "free_pool" a ROUTE.json y la lista
  de agentes a los que se les cambia la ruta a [free_pool].

  Prueba de éxito y GAPs al final.

  '
