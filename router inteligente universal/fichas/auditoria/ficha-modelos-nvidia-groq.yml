# FICHA MODELOS NVIDIA + GROQ (cifrada con la clave del banco). Claves tomadas del banco; Groq lleva varias llaves para rotar al llegar al limite.
- id: llm-pi-ai
  config:
    providers:
      ficha-kimi3:
        displayName: "Kimi K3 (NVIDIA)"
        apiKeyEnv: FICHA_KIMI3_API
        api: openai-completions
        baseURL: "https://integrate.api.nvidia.com/v1"
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: "moonshotai/kimi-k3", name: "Kimi K3 (NVIDIA)", contextWindow: 131072, maxTokens: 8192}]
        apiKey: "<CLAVE EN EL SELLO>"
      ficha-glm53:
        displayName: "GLM 5.3 (NVIDIA)"
        apiKeyEnv: FICHA_GLM53_API
        api: openai-completions
        baseURL: "https://integrate.api.nvidia.com/v1"
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: "z-ai/glm-5.3", name: "GLM 5.3 (NVIDIA)", contextWindow: 131072, maxTokens: 8192}]
        apiKey: "<CLAVE EN EL SELLO>"
      ficha-qwen38groq:
        displayName: "Qwen 3.8 27B (Groq)"
        apiKeyEnv: FICHA_QWEN38GROQ_API
        api: openai-completions
        baseURL: "https://api.groq.com/openai/v1"
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: "qwen/qwen3.8-27b", name: "Qwen 3.8 27B (Groq)", contextWindow: 131072, maxTokens: 8192}]
        apiKey: "<CLAVE EN EL SELLO>"
        apiKeysExtra: ["<CLAVE EN EL SELLO>", "<CLAVE EN EL SELLO>", "<CLAVE EN EL SELLO>", "<CLAVE EN EL SELLO>", "<CLAVE EN EL SELLO>"]
      ficha-glimmer30b:
        displayName: "Muse Glimmer 30B (Meta, NVIDIA)"
        apiKeyEnv: FICHA_GLIMMER30B_API
        api: openai-completions
        baseURL: "https://integrate.api.nvidia.com/v1"
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: "meta/muse-glimmer-30b", name: "Muse Glimmer 30B (Meta, NVIDIA)", contextWindow: 131072, maxTokens: 8192}]
        apiKey: "<CLAVE EN EL SELLO>"
