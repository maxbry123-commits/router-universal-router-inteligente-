# Ficha 1 (modelos individuales) -> harness DeepSeek por HTTP. El harness NO se edita: este patch es parte de la ficha.
# Cada modelo es una ficha del Router con su propio token amarrado: todo lo que se pide con ese token pasa por esa ficha (un solo modelo).
# Variables (los tokens estan en el banco del Router, refs router/harness-ficha-1-*):
#   RIU_ROUTER_URL=https://comand-center-1-claude-github-mcp-backup.hf.space
#   FICHA_KIMI_TOKEN  FICHA_GLM_TOKEN  FICHA_NEMOTRON_TOKEN  FICHA_GROQ_TOKEN  FICHA_LIGHTNING_TOKEN
# Uso: dsh headless --patch 'router inteligente universal/fichas/individuales/harness-individuales.cordis.yml' "tarea"
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: agent-default-model
  config:
    provider: ficha-groq-qwen
    model: auto
- id: llm-pi-ai
  config:
    providers:
      ficha-kimi-k3:
        displayName: Ficha 1 - Kimi K3 (NVIDIA)
        apiKeyEnv: FICHA_KIMI_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RIU_ROUTER_URL || 'https://comand-center-1-claude-github-mcp-backup.hf.space') + '/v1/router'
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: auto, name: Kimi K3, contextWindow: 131072, maxTokens: 8192}]
      ficha-glm-5:
        displayName: Ficha 1 - GLM 5.3 (NVIDIA)
        apiKeyEnv: FICHA_GLM_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RIU_ROUTER_URL || 'https://comand-center-1-claude-github-mcp-backup.hf.space') + '/v1/router'
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: auto, name: GLM 5.3, contextWindow: 131072, maxTokens: 8192}]
      ficha-nemotron-super:
        displayName: Ficha 1 - Nemotron 3 Super 120B (NVIDIA)
        apiKeyEnv: FICHA_NEMOTRON_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RIU_ROUTER_URL || 'https://comand-center-1-claude-github-mcp-backup.hf.space') + '/v1/router'
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: auto, name: Nemotron 3 Super, contextWindow: 131072, maxTokens: 8192}]
      ficha-groq-qwen:
        displayName: Ficha 1 - Qwen 3.8 (Groq)
        apiKeyEnv: FICHA_GROQ_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RIU_ROUTER_URL || 'https://comand-center-1-claude-github-mcp-backup.hf.space') + '/v1/router'
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: auto, name: Qwen 3.8 Groq, contextWindow: 131072, maxTokens: 8192}]
      ficha-nemotron-lightning:
        displayName: Ficha 1 - Nemotron 3.5 Lightning (NVIDIA)
        apiKeyEnv: FICHA_LIGHTNING_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RIU_ROUTER_URL || 'https://comand-center-1-claude-github-mcp-backup.hf.space') + '/v1/router'
        compat: {supportsDeveloperRole: false, maxTokensField: max_tokens}
        models: [{id: auto, name: Nemotron 3.5 Lightning, contextWindow: 131072, maxTokens: 8192}]
