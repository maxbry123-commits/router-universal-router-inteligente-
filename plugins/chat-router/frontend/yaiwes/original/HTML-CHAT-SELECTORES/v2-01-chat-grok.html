<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>FROMTED v2 — 01 Chat</title>
<style>
/* REGLAS LITERALES PROYECTO-FROMTED:
   fondo negro mate | letras blanco | naranja SOLO títulos Cargar/Descargar (~3%)
   seleccionado = azul eléctrico en LETRAS | notificación = verde en LETRAS
   chat = 2 grises | NINGÚN botón con color de relleno */
:root {
  --bg: #0d0d0d;
  --surface: #171717;
  --border: #2a2a2a;
  --white: #f5f5f5;
  --gray-1: #b8b8b8;
  --gray-2: #8a8a8a;
  --chat-out: #2a2a2a;
  --chat-in: #1a1a1a;
  --orange: #ff6b1a;
  --blue: #2f6bff;
  --green: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #000; color: var(--white);
  display: flex; justify-content: center; min-height: 100dvh;
}
.phone {
  width: 100%; max-width: 390px; min-height: 100dvh; background: var(--bg);
  display: flex; flex-direction: column;
}
/* top tabs like Grok photo */
.top {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 8px 0; border-bottom: 1px solid var(--border);
}
.top .ico {
  width: 40px; height: 40px; border: 0; background: transparent;
  color: var(--gray-2); display: grid; place-items: center;
}
.top .ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.tabs { flex: 1; display: flex; gap: 16px; justify-content: center; padding-bottom: 10px; }
.tabs button {
  background: none; border: 0; color: var(--gray-2); font-size: 15px; padding: 6px 2px;
  border-bottom: 2px solid transparent;
}
.tabs button.on {
  color: var(--white);
  border-bottom-color: var(--blue); /* selección = azul en borde/letra, no botón relleno */
}
.tabs button.on { color: var(--blue); border-bottom-color: var(--blue); }
.thread {
  flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px;
}
.msg { font-size: 15px; line-height: 1.5; max-width: 100%; }
.msg.ai { color: var(--gray-1); }
.msg.user {
  align-self: stretch;
  background: var(--chat-out);
  color: var(--gray-1);
  padding: 14px 16px;
  border-radius: 18px;
}
.msg .t { color: var(--white); margin-bottom: 6px; font-size: 13px; }
.icon-row {
  display: flex; gap: 14px; align-items: center; margin-top: 10px; color: var(--gray-2);
}
.icon-row button {
  width: 32px; height: 32px; border: 0; background: transparent; color: var(--gray-2);
  display: grid; place-items: center; border-radius: 50%;
}
.icon-row button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.icon-row button.circ { background: var(--surface); }
.suggest {
  color: var(--gray-2); font-size: 14px; padding-left: 8px;
  border-left: 2px solid var(--border); margin: 4px 0;
}
.composer {
  padding: 10px 12px 18px; display: flex; align-items: center; gap: 8px;
}
.composer .plus, .composer .mic {
  width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: transparent; color: var(--gray-2);
  display: grid; place-items: center;
}
.composer .plus svg, .composer .mic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.pill-mode {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 8px 12px; color: var(--gray-1); font-size: 13px;
}
.pill-mode svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.grow { flex: 1; }
.send {
  width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: #e8e8e8; color: #111; /* neutro claro — NO naranja/azul */
  display: grid; place-items: center; font-weight: 600;
}
.send svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.notif {
  text-align: center; font-size: 12px; color: var(--green); padding: 4px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <button class="ico" aria-label="menú">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="tabs">
      <button class="on">Pregunta</button>
      <button>Imagine</button>
    </div>
    <button class="ico" aria-label="editar">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    </button>
    <button class="ico" aria-label="más">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </div>
  <div class="thread">
    <div class="msg ai">
      El panel de archivos ancla documentos al hilo. El artifact muestra resultado sin salir del chat.
      <div class="icon-row">
        <button aria-label="copiar"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        <button aria-label="compartir"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
        <button aria-label="ok"><svg viewBox="0 0 24 24"><path d="M7 11v8M7 11l4-7a2 2 0 0 1 3 2v4h6a2 2 0 0 1 2 2l-1 5a3 3 0 0 1-3 2H7"/></svg></button>
        <button aria-label="no"><svg viewBox="0 0 24 24"><path d="M17 13V5M17 13l-4 7a2 2 0 0 1-3-2v-4H4a2 2 0 0 1-2-2l1-5a3 3 0 0 1 3-2h11"/></svg></button>
        <button aria-label="audio"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
        <button class="circ" aria-label="regenerar"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.2"/><path d="M21 3v6h-6"/></svg></button>
      </div>
    </div>
    <div class="suggest">Explorar MCP para conectar UI a microservicios</div>
    <div class="suggest">Investigar E2B para entornos Linux en navegador</div>
    <div class="msg user">Integra el bloc de notas local y el artifact.</div>
  </div>
  <p class="notif">● Conectado · datos en tu dispositivo</p>
  <div class="composer">
    <button class="plus" aria-label="añadir">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="pill-mode">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c.5.5 1 1.5 1 2h6c0-.5.5-1.5 1-2a6 6 0 0 0-4-10z"/></svg>
      Expert
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="grow"></div>
    <button class="mic" aria-label="mic">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
    </button>
    <button class="send" aria-label="enviar">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
</body>
</html>
