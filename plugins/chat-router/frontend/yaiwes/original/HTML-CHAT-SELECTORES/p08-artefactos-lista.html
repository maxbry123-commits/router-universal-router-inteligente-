<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FROMTED p08 — Lista artefactos</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:390px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
.top{display:flex;align-items:center;padding:12px 14px;gap:8px;border-bottom:1px solid var(--border)}
.top button{border:0;background:transparent;color:var(--dim);width:36px;height:36px}
.top button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.top h1{flex:1;font-size:16px;font-weight:600;text-align:center}
.badge{align-self:center;margin:12px;padding:6px 12px;border-radius:16px;background:var(--elev);border:1px solid var(--border);font-size:12px;color:var(--dim)}
.list{padding:0 12px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:auto}
.card{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--border);border-radius:14px;padding:12px}
.card .thumb{width:40px;height:48px;border-radius:6px;background:var(--elev);display:grid;place-items:center;color:var(--dim)}
.card .thumb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.card .n{font-size:15px}.card .s{font-size:12px;color:var(--dim);margin-top:2px}
.composer{margin:12px;background:var(--sheet);border:1px solid var(--border);border-radius:16px;padding:10px}
.composer .hint{font-size:13px;color:var(--dim);margin-bottom:8px}
.composer .row{display:flex;align-items:center;gap:8px}
.composer .mode{padding:6px 10px;border-radius:12px;background:var(--elev);font-size:12px;color:var(--dim)}
.composer .send{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:#e8e8e8;color:#111;display:grid;place-items:center}
.composer .send svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <button aria-label="menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>Artefactos</h1>
    <button aria-label="nuevo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="badge">6 artefactos</div>
  <div class="list">
    <div class="card"><div class="thumb"><svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></div><div><div class="n">fromted-shell</div><div class="s">Código · TS</div></div></div>
    <div class="card"><div class="thumb"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div><div><div class="n">plan-v2</div><div class="s">Documento · MD</div></div></div>
    <div class="card"><div class="thumb"><svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></div><div><div class="n">MCP tools</div><div class="s">Código · JSON</div></div></div>
    <div class="card"><div class="thumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div><div><div class="n">mock-dock</div><div class="s">Imagen · PNG</div></div></div>
  </div>
  <div class="composer">
    <div class="hint">Responder en este proyecto…</div>
    <div class="row">
      <button class="mode" type="button">+ Modelo ▾</button>
      <button class="send" type="button" aria-label="enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
