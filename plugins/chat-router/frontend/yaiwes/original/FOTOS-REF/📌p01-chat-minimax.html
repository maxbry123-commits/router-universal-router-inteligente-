<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>FROMTED p01 — Chat MiniMax-style</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:390px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.top button{border:0;background:transparent;color:var(--dim);width:36px;height:36px;display:grid;place-items:center}
.top button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.top .title{flex:1;text-align:center;font-size:15px;font-weight:500;color:var(--dim)}
.top .dl{width:auto;padding:6px 12px;border:1px solid var(--border);border-radius:10px;color:var(--orange);font-size:13px;font-weight:600;background:transparent}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
.hero h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:28px;color:var(--white)}
.box{width:100%;background:var(--sheet);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left}
.box .hint{color:var(--dim);font-size:14px;margin-bottom:14px}
.box .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--elev);color:var(--dim);font-size:13px;border:0}
.box .chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.box .chip.blue-text{color:var(--blue)}
.box .send{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#e8e8e8;color:#111;display:grid;place-items:center}
.box .send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tools{display:flex;gap:8px;margin-top:12px;width:100%;justify-content:center;flex-wrap:wrap}
.tools button{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--sheet);border:1px solid var(--border);color:var(--dim);font-size:13px}
.tools button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.status{text-align:center;font-size:11px;color:var(--green);padding:10px}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <button aria-label="cerrar"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div class="title">FROMTED</div>
    <button class="dl" type="button">Descargar</button>
  </div>
  <div class="hero">
    <h2>FROMTED hace tu trabajo más fácil</h2>
    <div class="box">
      <div class="hint">Escribe o usa / para skills</div>
      <div class="row">
        <button class="chip" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="chip blue-text" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10c.5.5 1 1.5 1 2h6c0-.5.5-1.5 1-2a6 6 0 0 0-4-10z"/><path d="M9 18h6M10 21h4"/></svg> Thinking</button>
        <button class="chip" type="button">Qwen Omni ▾</button>
        <button class="send" type="button" aria-label="enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div class="tools">
      <button type="button"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Documento</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M2 12h20"/></svg> Website</button>
      <button type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Imagen</button>
    </div>
  </div>
  <p class="status">● Conectado · datos en tu dispositivo</p>
</div>
</body>
</html>
