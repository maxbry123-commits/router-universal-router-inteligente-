<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat RIU — Router Inteligente Universal</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --mut:#6b6a68; --card:#fff; --line:#e4e1d8; --acc:#c96442; --ok:#2f7d4f; --warn:#a15c00; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#262624; --fg:#f0eee6; --mut:#a3a19a; --card:#30302e; --line:#41403d; --acc:#d97757; --ok:#6fcf97; --warn:#e0a458; --err:#f2857d; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  select, input, textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  select { max-width:100%; }
  button { background:var(--acc); color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #pill { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(760px, 92%); padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--acc); color:#fff; border-color:transparent; }
  .meta { font-size:12px; color:var(--mut); margin-top:6px; }
  .meta.warn { color:var(--warn); }
  .error { border-color:var(--err); color:var(--err); }
  footer { padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); display:flex; gap:8px; }
  textarea { flex:1; resize:none; min-height:44px; max-height:140px; }
  #keyrow { display:flex; gap:8px; flex:1 1 220px; }
  #key { flex:1; min-width:0; }
</style>
</head>
<body>
<header>
  <h1>Chat RIU</h1>
  <span id="pill">cargando…</span>
  <select id="model" aria-label="Modelo"></select>
  <div id="keyrow"><input id="key" type="password" placeholder="API key del Router (solo en memoria)" autocomplete="off"></div>
</header>
<div id="log" aria-live="polite"></div>
<footer>
  <textarea id="input" rows="1" placeholder="Escribe un mensaje…  (Enter envía, Shift+Enter nueva línea)"></textarea>
  <button id="send">Enviar</button>
</footer>
<script>
(function () {
  var modelEl = document.getElementById('model'), pill = document.getElementById('pill'),
      log = document.getElementById('log'), input = document.getElementById('input'),
      send = document.getElementById('send'), keyEl = document.getElementById('key');
  var history = [];

  function add(text, cls, meta, metaCls) {
    var d = document.createElement('div'); d.className = 'msg ' + (cls || '');
    d.textContent = text;
    if (meta) { var m = document.createElement('div'); m.className = 'meta ' + (metaCls || ''); m.textContent = meta; d.appendChild(m); }
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }

  fetch('/chat/models').then(function (r) { return r.json(); }).then(function (data) {
    pill.textContent = data.live_provider_inference ? 'proveedores en vivo: ACTIVOS' : 'proveedores en vivo: desactivados';
    var firstSelectable = null;
    data.models.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m.model_id || '';
      var tag = m.certified ? 'certificado' : m.state;
      o.textContent = m.label + (m.model_id ? ' — ' + m.model_id : '') + '  [' + tag + (m.selectable ? '' : ' · no disponible: ' + (m.reason || '')) + ']';
      o.disabled = !m.selectable;
      modelEl.appendChild(o);
      if (m.selectable && !firstSelectable) firstSelectable = o;
    });
    if (firstSelectable) firstSelectable.selected = true;
    else add('No hay modelos disponibles todavía. Activa RIU_CHAT_ALLOW_PROVIDER_LIVE=1 y define HF_TOKEN en el servidor.', 'error');
  }).catch(function (e) { pill.textContent = 'sin catálogo'; add('No se pudo cargar /chat/models: ' + e, 'error'); });

  function explain(status, detail) {
    if (status === 401) return 'API key ausente o inválida (RIU_AGENT_API_KEYS).';
    if (status === 400) return 'Modelo no permitido por el Router: ' + detail;
    if (status === 503) return 'El proveedor no respondió (¿HF_TOKEN sin permiso de Inference Providers?): ' + detail;
    return 'Error ' + status + ': ' + detail;
  }

  function submit() {
    var text = input.value.trim(), model = modelEl.value;
    if (!text || !model) return;
    input.value = ''; send.disabled = true;
    history.push({ role: 'user', content: text });
    add(text, 'user');
    var wait = add('…', '');
    fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': keyEl.value },
      body: JSON.stringify({ model: model, messages: history, max_tokens: 1024 })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; }, function () { return { status: r.status, body: {} }; });
    }).then(function (res) {
      wait.remove();
      if (res.status !== 200) { history.pop(); add(explain(res.status, res.body.detail || ''), 'error'); return; }
      var choice = res.body.choices[0], reply = choice.message.content || '';
      var meta = res.body.model + (res.body.certified ? '' : ' · NO certificado (intento en vivo)');
      if (!reply) {
        history.pop();
        add('(El modelo devolvió texto vacío: probablemente agotó max_tokens razonando. Reintenta o usa otro modelo.)', 'error', meta + ' · finish=' + choice.finish_reason, 'warn');
        return;
      }
      history.push({ role: 'assistant', content: reply });
      add(reply, '', meta, res.body.certified ? '' : 'warn');
    }).catch(function (e) { wait.remove(); history.pop(); add('Error de red: ' + e, 'error'); })
      .then(function () { send.disabled = false; input.focus(); });
  }

  send.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
})();
</script>
</body>
</html>
