<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAIWES · Organización</title>
  <link rel="stylesheet" href="/chat/ui/shell.css">
  <script type="module" src="/chat/ui/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Vistas">
      <div class="brand">Y</div>
      <nav id="navigation">
        <button data-view="chat" aria-current="page">Chat</button>
        <button data-view="archivos">Archivos</button>
        <button data-view="seguimiento">Seguimiento</button>
        <button data-view="canvas">Canvas</button>
        <button data-view="connectors">Conectores</button>
        <button data-view="templates">Plantillas</button>
        <button data-view="engineering">Ingeniería</button>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div><strong id="view-title">Chat</strong><small>Router Inteligente Universal · IMMUTABLE</small></div>
        <div class="access"><label for="router-key">Acceso Router</label><input id="router-key" type="password" autocomplete="off" placeholder="Clave de sesión"><span id="connection">Sin conectar</span></div>
      </header>
      <main id="panel" aria-live="polite"></main>
      <div id="notice" role="status"></div>
    </div>
  </div>
</body>
</html>
