# =====================================================================
# PLAN DSL DAG - PARTE 0: CONTRATO DE EJECUCION — CHAT YAIWES
# Version 1.0 | 2026-09-27 | Opus. Formato copiado de agentes/Claude notas/PLAN-DSL-DAG-00-CONTRATO.yaml
# Ejecutor: runtime/fleet autorizado por el DAG. Ningun modelo es autoridad de PASS.
# Los nodos estan en: chat router/01-PLAN/PLAN-DSL-DAG-01-NODOS.yaml
# =====================================================================
dsl_version: "yaiwes.dag/v1"
engine: "chat_yaiwes"
repo: "maxbry123-commits/router-universal-router-inteligente-"
raiz: "chat router/"
branch: "main"

canonical_files:
  contrato: "chat router/01-PLAN/PLAN-DSL-DAG-00-CONTRATO.yaml"
  nodos: "chat router/01-PLAN/PLAN-DSL-DAG-01-NODOS.yaml"
  arquitectura: "chat router/02-ARQUITECTURA/📂readme chat Arquitectura.md"
  estado: "chat router/03-ESTADO/HANDOFF.md"
  superseded: "chat router/01-PLAN/PLAN-MAESTRO-CHAT.yaml y PLAN-DSL-DAG-CHAT-AGENTES-INFRA.yaml (NO EJECUTAR; solo referencia)"

read_order:
  - "chat router/03-ESTADO/HANDOFF.md"
  - "chat router/01-PLAN/PLAN-DSL-DAG-00-CONTRATO.yaml"
  - "chat router/01-PLAN/PLAN-DSL-DAG-01-NODOS.yaml"
  - "chat router/02-ARQUITECTURA/📂readme chat Arquitectura.md"
  - "chat router/00-INSTRUCCIONES/ (partes 1..5)"

precedence:
  executable_contract: "PLAN-DSL-DAG-00-CONTRATO.yaml"
  executable_nodes: "PLAN-DSL-DAG-01-NODOS.yaml"
  architecture_and_intent: "📂readme chat Arquitectura.md"
  legacy_duplicate: "PLAN-MAESTRO-CHAT.yaml / PLAN-DSL-DAG-CHAT-AGENTES-INFRA.yaml: NO EJECUTAR"

# ---------------------------------------------------------------------
# FUENTE DE VERDAD - instrucciones del Director, 1 a 1, por mensaje (M#) y documento (doc #).
# Cada nodo declara `fuente_director`. Auditable 1 a 1.
# ---------------------------------------------------------------------
source_of_truth:
  archivos:
    parte_1: "chat router/00-INSTRUCCIONES/INPUT-BLOCK-VERBATIM-CHAT-Y-PANEL.md   (M1..M21)"
    parte_2: "PENDIENTE de subir: documentos completos del 25-sep (FLAG-4)"
    parte_3: "chat router/00-INSTRUCCIONES/INPUT-BLOCK-VERBATIM-CHAT-Y-PANEL-PARTE-3.md (M22..M28, docs 11-13)"
    parte_4: "chat router/00-INSTRUCCIONES/INPUT-BLOCK-VERBATIM-CHAT-Y-PANEL-PARTE-4.md (M29, docs 14-19)"
    parte_5: "chat router/00-INSTRUCCIONES/INPUT-BLOCK-VERBATIM-PARTE-5.md (M30..M44, docs 22-26)"
  mapa:
    M1:         "chat Open WebUI publico + selector modelos + con/sin agente + cuentas GitHub + archivos anclados"
    M2:         "delegar a agentes; motores de descarga; cadenas completas; centinela; memoria persistente"
    M3:         "usar el webui descargado; IA sola e IA + agentes con acceso HF/GitHub; boton de workflows de otros repos; orquestadores Microsoft/Rowboat/Hermes"
    M4:         "Vercel solo UI, code GitHub, HF procesador; todos los agentes cableados al chat; plan 4 objetivos"
    M6:         "memoria: PostgreSQL+Redis+Graphiti+FalkorDB+AgentDB+HF Bucket+Graphify; router a todos los repos; sandbox DSL DAG por selector; Claude.md/Memoria.md/Skills.md por agente; una raiz; enchufe MCP; selector + workflow"
    M7:         "centinela 5-10 min; centralizar proyectos; mirrors; esquema obligatorio ECC/Prompt Master/Ponytail/Agent Skills; mapa mental; apagado; mini router por grupos; router gratuito; DeepSeek Harness"
    M16:        "13 puntos del chat + barra WORK, rewind, compact, Council, Archify, handoff.md automatico, panel separado"
    M18:        "chat con WebUI o chat listo; probar cada boton; sin mocks; usar skills y fabrica UI"
    M27_M28:    "descargar componentes; micro kernel CLI-Anything + DeepSeek Harness; Rowboat principal + Ruflo; Claude diseña, Grok ejecuta, Claude revisa, 4 Meta mejoran; chats en Vercel"
    M30_M33:    "Router en HF 16 GB de pago siempre encendido con MCP y OmniRoute dentro; autoescalado 16 GB 80% / 32 GB 85% hasta 10"
    M40:        "limpiar basura; README router; OmniRoute 100% funcional; almacenamiento y memoria"
    M42:        "OpenClaw y Hermes asistentes del orquestador y del chat (fork); Harness conectado al chat"
    M43:        "un solo Router con OmniRoute+APIs; aviso Kimi K3/DeepSeek V4 NVIDIA en el chat; cadena de ingenieria; mirror solo equipo de ingenieria; grafo de agentes; acceso HF/GitHub; exportar sin historia a YAIWES; terminar memoria"
    M44:        "todos usan nuestro Router; una raiz ordenada; plan con el formato del plan de agentes; componentes de memoria del Director solo cablear; handoff para otro Opus"
    doc22:      "EngineeringLoop + MIRROR selectivo (worktree) + fabrica recursiva"
    doc23:      "jerarquia Rowboat > Hermes+OpenClaw > Sheriff > Ruflo > Colmena > Sentinel > revision > Judge"
    doc24:      "State Hub: BITACORA.jsonl inmutable -> STATE/CRAZY_WALL/HANDOFF/TASK.json"
    doc26:      "Evidence/Search Gate con 12 goals antes/despues"

# ---------------------------------------------------------------------
# REGLAS GLOBALES - ANTI-DESVIACION (se evaluan en CADA nodo; violar una = BLOQUEADO)
# ---------------------------------------------------------------------
reglas_globales:
  R01_no_codigo_desde_cero:
    regla: "PROHIBIDO escribir codigo desde cero si hay componente descargado"
    orden: "REUSE > PATCH > ADAPT > GENERATE"
    fuente: "M18, M27"
  R02_max_loc: {regla: "maximo 500 LOC por bloque", si_no_cabe: "dividir en mas nodos"}
  R03_nunca_borrar_del_director: {regla: "nunca borrar archivos del Director; solo piezas sueltas propias con aprobacion (M40)"}
  R04_no_pass_sin_evidencia: {regla: "PASS requiere CODE + TEST + EVIDENCE + READ-BACK", prohibido: "un LLM diciendo CORRECTO no es PASS"}
  R05_todo_por_nuestro_router: {regla: "todo modelo de todos los agentes y del chat pasa por nuestro Router (M44.1-2)", prohibido: "APIs de Anthropic"}
  R06_anotar_antes_de_avanzar:
    regla: "no se avanza sin anotar"
    destinos: [00-INSTRUCCIONES, 03-ESTADO/HANDOFF.md, BITACORA.jsonl, CRAZY_WALL]
    momento: "ANTES de marcar el nodo cerrado"
  R07_una_raiz: {regla: "todo lo del chat vive en chat router/ (M44.3); nada suelto fuera"}
  R08_no_cambiar_al_director: {regla: "no cambiar instrucciones, diseño ni herramientas del Director sin autorizacion"}
  R09_un_nodo_por_chat: {regla: "1 chat = 1 nodo activo en CRAZY_WALL"}
  R10_descargas_solo_motor: {regla: "descargas solo con el motor de descarga y extraccion"}
  R11_sin_sobreingenieria: {regla: "si el nodo no cierra un gap declarado, no se ejecuta"}
  R12_cuidar_ventana: {regla: "no esperar trabajos largos; anotar y parar para relanzar (M41)"}

cadena_de_autoridad:
  LLM: PROPONE
  SHERIFF: AUTORIZA   # codigo
  TOOL: EJECUTA
  RECEIPT: DEMUESTRA
  JUDGE: DECIDE_PASS  # codigo

jerarquia_agentes:   # doc23
  nivel_0: Director
  nivel_1: Rowboat (director de agentes)
  nivel_2: "Hermes + OpenClaw (plan A/B, debate, supervision)"
  nivel_3: "Sheriff (codigo)"
  nivel_4: "Ruflo (colmena)"
  nivel_5: "Colmena: Claude Code (arquitecto/revisor), Grok (ejecutor), Meta x4 (codigo/tests/visual/adversarial), Meta Code (fixer)"
  nivel_6: "Sentinel (vigila)"
  nivel_7: "Hermes + OpenClaw (revision cruzada)"
  nivel_8: "Judge (codigo)"

invariantes:
  - NO_PASS_WITHOUT_EVIDENCE
  - NO_MUTATION_WITHOUT_AUTH
  - NO_STATE_WRITE_OUTSIDE_STATE_HUB   # doc24
  - NO_TWO_WRITERS_SAME_RESOURCE
  - NO_MODEL_OUTSIDE_OUR_ROUTER        # M44

contratos:
  Job: {required: [job_id, objective, scope, acceptance, state, attempt, evidence, issues]}          # doc22
  Result: {required: [job_id, agent, status, changed_files, tests, issues, evidence, next_action]}  # doc22
  Task: {required: [id, objective, role, dependencies, allowed_paths, acceptance, evidence]}         # doc23
  Event: {required: [seq, type, project, task, actor, payload]}                                      # doc24

gap_ladder:
  1: "reintento simple"
  2: "reintento con espera"
  3: "rotar clave (NVIDIA/Cerebras/Groq)"
  4: "cambiar proveedor/modelo por el Router"
  5: "partir el nodo en subnodos"
  6: "sparse-checkout minimo"
  7: "leer por API de GitHub"
  8: "usar motor existente"
  9: "buscar mecanismo en componente ya descargado (REUSE)"
  10: "degradar a modo documentado: cableado pero NO_VERIFICADO"
  11: "FLAG con traza y SEGUIR con el siguiente nodo"
  regla_final: "agotadas -> FLAG + continue_next. Anotar en HANDOFF."

checkpoint_policy:
  cuando: "al cerrar cada nodo, PASS o FLAG"
  escribe:
    - "chat router/03-ESTADO/BITACORA.jsonl (evento)"
    - "chat router/03-ESTADO/HANDOFF.md (estado + que sigue)"
    - "chat router/01-PLAN/PLAN-DSL-DAG-01-NODOS.yaml (seccion estado)"
  sin_checkpoint: "el nodo NO se considera cerrado"

goals:   # doc26: 12 goals entrada -> salida del proyecto
  G01: {in: "chat sin base aprobada",            out: "chat sobre base elegida por el Director con sus skills"}
  G02: {in: "Router en 32 GB que se reinicia",   out: "Router en HF 16 GB de pago siempre encendido"}
  G03: {in: "sin OmniRoute",                     out: "OmniRoute privado dentro del Router, probado"}
  G04: {in: "sin aviso de modelos NVIDIA",       out: "aviso Kimi K3/DeepSeek V4 al abrir el chat"}
  G05: {in: "estado disperso",                   out: "State Hub unico (bitacora -> state/wall/handoff)"}
  G06: {in: "memoria en /tmp",                   out: "memoria persistente con componentes del Director, probada tras reinicio"}
  G07: {in: "agentes descargados sin conectar",  out: "jerarquia doc23 conectada al Router y al chat"}
  G08: {in: "sin cadena de ingenieria",          out: "EngineeringLoop Claude/Grok/Meta en mirror aislado"}
  G09: {in: "sin evidencia antes/despues",       out: "Evidence Gate con 12 goals"}
  G10: {in: "botones sin probar",                out: "cada boton probado con captura"}
  G11: {in: "sin autoescalado",                  out: "16 GB 80% / 32 GB 85% hasta 10"}
  G12: {in: "proyecto en repo del Router",       out: "raiz exportable sin historia a YAIWES"}

ask_council:
  C01: {q: "Quien decide PASS?", a: "Judge (codigo): test + evidencia + read-back. Nunca un LLM."}
  C02: {q: "Puedo escribir codigo nuevo?", a: "Solo si no existe en componentes descargados (R01)."}
  C03: {q: "Que modelo uso?", a: "El que asigne nuestro Router. Nada de Anthropic."}
  C04: {q: "Donde guardo archivos?", a: "Solo en chat router/ (R07)."}
  C05: {q: "Donde anoto?", a: "00-INSTRUCCIONES (instruccion nueva), BITACORA + HANDOFF (cada paso)."}
  C06: {q: "Quien escribe STATE?", a: "Solo el State Hub (doc24)."}
  C07: {q: "Puedo cambiar el diseño del Director?", a: "NO sin autorizacion (R08)."}
  C08: {q: "Que hago si falla?", a: "gap_ladder; agotado -> FLAG y siguiente nodo."}
  C09: {q: "Espero trabajos largos?", a: "NO: anotar y parar (R12)."}
  C10: {q: "Memoria: creo algo nuevo?", a: "NO: cablear los componentes del Director (M44.4)."}
  C11: {q: "Donde van los agentes nuevos?", a: "Mirror con solo el equipo de ingenieria y solo el sistema a tocar (M43, doc22)."}
  C12: {q: "Cuando se exporta a YAIWES?", a: "Cuando todo este probado y el Director lo autorice (M44.3)."}

flags_abiertos:
  FLAG-1: "ui_bridge.py guarda en chat router/data/; la carpeta se movio a 03-ESTADO/data/ -> ajustar DATA (nodo B-1)"
  FLAG-2: "enlace del chat desplegado por Manus (lo tiene el Director) -> nodo D-1"
  FLAG-3: "Groq sin clave en secretos del Router"
  FLAG-4: "Parte 2 del verbatim sin subir; documentos 22-26 y M40 registrados resumidos -> completar literal (nodo V-1)"
