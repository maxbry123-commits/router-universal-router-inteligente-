schema_id: skills_schema/agent-reach.dag.yaml
schema: yaiwes.skill-dag/v1
objective: 'Exponer Agent Reach como capa de capacidades de Internet para selección, routing y diagnóstico de canales, nunca como agente ni autoridad.'
work_surface: MIXED
acceptance:
- capability agent-reach registrada en COMPONENT_CAPABILITIES
- runtime ausente falla cerrado via YAIWES_AGENT_REACH_COMMAND
- no transfiere autoridad; efectos de sistema requieren sheriff
tools:
- agent-reach
- sheriff
- judge
- verifier
evidence:
- path: evidence/agent-reach.json
  sha256: pending
oracle: 'component_adapter:agent-reach'
gap_policy: 'RUNTIME_UNAVAILABLE => BLOCKED; nunca PASS sin evidencia'
nodes:
- id: claim
  role: writer
- id: execute
  depends_on:
  - claim
- id: verify
  depends_on:
  - execute
