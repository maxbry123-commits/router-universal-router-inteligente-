schema: yaiwes.chain/v1
input_block: |
  DIRECTOR: Vercel es solo UI; todo el código en GitHub; corre en el Router; HF como procesador.
  Chat Open WebUI (ya descargado) conectado al Router, modo solo IA y modo IA + agentes, memoria persistente para chat y agentes.

agent:
  id: agent-17-chat-backend-32gb
  framework: pocketflow
  group: chat
  route: [deepseek_flash]
  fallback: []
  max_tokens: 2000

context:
  text: |
    Open WebUI en: router inteligente universal/Componente open soure router inteligente universal/open-webui/
    Router (FastAPI): router inteligente universal/integration/chat_mvp/ (app.py, router.py, route_api.py, store.py, providers.py)
    Rutas existentes: /chat/send, /chat/agents, /chat/documents, /chat/github/*, /chat/storage, /v1/chat/completions, /v1/models
    LIVE_URL: leer ROUTER_JOB_PAUSE.flag. Headers: Authorization Bearer HF_TOKEN + X-API-Key (secreto RIU_ROUTER_API_KEY). Nunca valores en archivos.
    Memoria: PostgreSQL + Redis (como servicio) + Graphiti + FalkorDB + HF Storage Bucket; hoy store.py. Solo deepseek_flash. CPU.

steps:
  - id: modelos_modos
    task: |
      Entrega el código Python completo de un archivo nuevo openwebui_bridge.py para chat_mvp que:
      1) en /v1/models devuelve dos entradas: "deepseek-flash" (solo IA) y "deepseek-flash+agentes" (IA + agentes);
      2) en /v1/chat/completions, si el modelo termina en "+agentes", manda la orden a /chat/agents; si no, a /chat/send;
      3) guarda cada mensaje en store.py (chat_id, rol, texto) antes de responder.
      Solo el código, sin explicaciones.
    checks:
      - kind: python_ast
      - kind: min_chars
        value: 600
      - kind: no_secrets

  - id: memoria_persistente
    task: |
      Entrega el código Python completo de memory_adapter.py que guarda y lee memoria en 3 niveles (chat, proyecto, global)
      usando PostgreSQL si hay variable DATABASE_URL, si no SQLite local, y un espejo en HF Storage Bucket (variable HF_BUCKET).
      Funciones: save(scope, key, text), load(scope, key), search(scope, query). Sin claves en el código. Solo el código.
    checks:
      - kind: python_ast
      - kind: min_chars
        value: 600
      - kind: no_secrets

  - id: config_openwebui
    task: |
      Entrega la lista de variables de entorno para Open WebUI apuntando al Router
      (OPENAI_API_BASE_URL=<LIVE_URL>/v1, nombres de secretos, sin valores) y los pasos para arrancarlo en CPU en el Router.
      Termina con la prueba de éxito y los GAPs.
    checks:
      - kind: min_chars
        value: 300
      - kind: no_secrets

edges:
  - [modelos_modos, memoria_persistente]
  - [memoria_persistente, config_openwebui]
