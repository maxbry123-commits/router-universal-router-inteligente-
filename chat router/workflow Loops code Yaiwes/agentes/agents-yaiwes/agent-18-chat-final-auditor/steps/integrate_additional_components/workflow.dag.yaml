schema: yaiwes.micro-agent/v1
execution:
  mode: fail_closed
  max_parallel: 1
  continue_on_failure: false
  retries: 2
agent:
  id: agent-18-chat-final-auditor
  framework: pocketflow
  group: chat
  route:
  - deepseek_flash
  fallback: []
  max_tokens: 3000
context:
  text: 'Base: Open WebUI descargado solo mediante motores canónicos por agent-19.

    Código adicional a preservar:

    agent-1: vault_panel.js, router_panel.js, wire_panels.js

    agent-2: jobs_panel.js, fixed_template.py, crazy_wall_chain.py

    Chat MVP actual: integration/chat_mvp/chat_ui.html y backend asociado.

    No descargar componentes aquí. No borrar ni reescribir esas capacidades desde
    cero.

    '
  max_chars: 40000
task: 'Integra en Open WebUI las capacidades adicionales ya existentes del Chat MVP:

  Archivos/Memoria, Secret Bank, estado Router, Jobs, GitHub, agentes, selector, Crazy
  Wall/handoff.

  Reutiliza/edita/cablea el código existente; no recrees esas funciones desde cero
  y no borres sus fuentes originales.

  Si falta Open WebUI, falla OPENWEBUI_COMPONENT_MISSING.

  La salida debe registrar exactamente qué código existente se conservó y dónde quedó
  cableado.

  '
checks:
- kind: contains
  values:
  - Open WebUI
  - Archivos
  - Memoria
  - Secret Bank
  - Router
  - Jobs
  - GitHub
  - Crazy Wall
- kind: no_secrets
