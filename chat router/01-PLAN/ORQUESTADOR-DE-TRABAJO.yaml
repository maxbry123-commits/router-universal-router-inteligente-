# ORQUESTADOR DE TRABAJO — cómo trabajan los agentes (según las instrucciones del Director)
# Fuente: chat router/INPUT-BLOCK-VERBATIM-*.md (M2, M4, M6, M7, M16, M27, M28) + plan de 4 objetivos (repo agentes, Claude notas/PLAN-OPUS).
# Autor: Opus. 2026-09-27. Pequeño y ejecutable: una orden entra por el chat → sale un resultado verificado al chat y al Crazy Wall.
schema: yaiwes.orquestador/v1

reglas_del_director_para_los_agentes:   # cómo deben trabajar, en sus palabras (resumen fiel)
  - "La orden NO es una tarea simple: es una cadena completa de tareas de principio a fin (M2.4)."
  - "Opus es el cerebro: planifica, reparte, audita GAPs; los agentes ejecutan (M2.2)."
  - "Todo en DSL DAG determinista; lo no resuelto = GAP, nunca inventar (reglas)."
  - "Centinela/supervisor/juez/guardián con watchdog: vigila cada 5-10 min, reactiva al que se para, resuelve GAPs (M2.6, M7)."
  - "Cada agente con su micro sistema: CLAUDE.md, MEMORIA.md, SKILLS.md, HANDOFF.md, inbox/ (M6, M16)."
  - "handoff.md automático: objetivo, estado, archivos, cambios, intentos, fallos, siguiente paso, con trazabilidad en GitHub (M16)."
  - "Puertas obligatorias en código (no skills informativos): ECC, Prompt Master, Ponytail, Agent Skills (M7)."
  - "Cadena: Rowboat orquesta, Ruflo mueve el flujo, Claude Code diseña, Grok ejecuta, Claude Code revisa, los 4 de Meta mejoran (M27 paso 4)."
  - "Rutas IA: NVIDIA → Cerebras → Groq → DeepSeek V4 Flash al final; sin APIs de Anthropic (M28)."
  - "Todo centralizado en el chat; el Director activa con un botón, no solo conversando (M7)."

roles:
  orquestador_principal: {agente: Rowboat, hace: "recibe la orden del chat, la convierte en DAG y la reparte"}
  asistentes_del_orquestador_y_del_chat:
    - {agente: "OpenClaw v2026.9.6", fork: "maxbry123-commits/openclaw (fork del oficial)", hace: "asistente operativo: navega, usa herramientas y MCP, ejecuta pasos cortos, responde en el chat mientras el equipo trabaja"}
    - {agente: "Hermes Agent v2026.9.24", fork: "maxbry123-commits/hermes-agent (fork del oficial)", hace: "asistente de memoria y seguimiento: resume, mantiene el /goal y la cola, redacta HANDOFF.md y avisa en el chat"}
  flujo: {agente: Ruflo, hace: "reparte en paralelo (1/3/5/N workers) y coordina"}
  disena_y_revisa: {agente: "Claude Code (modelos por el Router)"}
  ejecuta: {agente: "Grok (GrokBot / Grok Build GUI)"}
  mejoran_y_prueban: {agentes: ["Muse Code", "Muse Glimmer", "MetaCua (capturas del frontend)", "CUA + MCP (computadora de pruebas)"]}
  vigilante: {agente: centinela, hace: "watchdog, reactiva, anota GAPs, mapa vivo cada hora"}
  cerebro_operativo: {pieza: "DeepSeek Harness (Cordis)", hace: "carga como plugins: Router (modelos), memoria, skills, tools, sandbox; el chat habla con el Harness"}
  modelos: "Router → OmniRoute (misma máquina) → NVIDIA/Cerebras/Groq/DeepSeek"

ciclo_de_una_orden:
  - {n: 1, quien: chat, hace: "el Director escribe o pulsa ▶ WORK; la orden va a la cola del Router"}
  - {n: 2, quien: Rowboat, hace: "orden → DSL DAG (con Prompt Master); asistentes OpenClaw/Hermes confirman en el chat"}
  - {n: 3, quien: Router, hace: "si hace falta cómputo, enciende procesador 32 GB (cola + autoescalado)"}
  - {n: 4, quien: "Ruflo", hace: "reparte los nodos a Claude Code (diseño) → Grok (ejecución) → Claude Code (revisión) → 4 de Meta (mejora y prueba)"}
  - {n: 5, quien: "puertas ECC/Ponytail", hace: "cada paso pasa por las puertas obligatorias; si falla → BLOCKED + GAP"}
  - {n: 6, quien: Hermes, hace: "escribe HANDOFF.md de cada agente y actualiza el Crazy Wall"}
  - {n: 7, quien: centinela, hace: "verifica cierre real; si alguien se para, lo reactiva"}
  - {n: 8, quien: chat, hace: "resultado + evidencia + enlace al Director"}

pasos_para_montarlo:   # sin sobre-ingeniería, en orden
  - {id: O1, hace: "fork en GitHub de openclaw/openclaw y NousResearch/hermes-agent a la cuenta del Director (versiones verificadas)", estado: pendiente}
  - {id: O2, hace: "OpenClaw y Hermes arrancan en la máquina 16 GB del Router con modelos por /omniroute/v1 y el Router", estado: pendiente}
  - {id: O3, hace: "botones en el chat: 'Asistente OpenClaw' y 'Asistente Hermes' (hablan por /chat/agents)", estado: pendiente}
  - {id: O4, hace: "DeepSeek Harness como capa del chat: el chat → Harness → plugins (Router, memoria, skills, sandbox)", estado: pendiente}
  - {id: O5, hace: "cola del Router + Rowboat recibe órdenes de la cola; primera orden de prueba de punta a punta", estado: pendiente}
  - {id: O6, hace: "centinela + HANDOFF.md automático por agente", estado: pendiente}

depende_de: ["OmniRoute respondiendo en /omniroute (prueba en curso)", "arquitectura de programación que el Director va a pasar (se añade aquí)"]
