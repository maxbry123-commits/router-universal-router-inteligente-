# DSL DAG — MEMORIA Y ALMACENAMIENTO (ejecuta: MANUS) + PUENTE HF (ejecuta: OPUS)
# Fuente: Director M6, M40, M43, M44.4, doc24; auditoría de Manus 2026-09-27 (tabla de 13 componentes).
# Regla madre: SOLO CABLEAR componentes ya descargados. No inventar, no sustituir, no fingir instalado. Lo que falte = GAP.
dsl_version: "yaiwes.dag/v1"
raiz_codigo: "chat router/04-MEMORIA/"          # TODO el código nuevo de memoria vive aquí (paquete memoria_yaiwes)
componentes_fuente: "router inteligente universal/Componente open soure router inteligente universal/"
router: "router inteligente universal/integration/chat_mvp/"   # único punto donde el Router carga memoria_yaiwes (1 archivo loader)
estado: "chat router/03-ESTADO/"                # State Hub escribe aquí
prohibido: [desplegar Vercel, tocar secretos/cómputo HF, borrar datos, APIs Anthropic]

microflujo_transversal: |
  CHAT → Router /chat/send → memoria_yaiwes.save(turno) → SQLite (fuente principal)
       ├→ grafo (Graphiti→FalkorDB | fallback grafo SQLite) → búsqueda por relación
       ├→ Memanto (memoria de agentes) → qué recordar/caducar
       ├→ State Hub (evento → BITACORA.jsonl → STATE/CRAZY_WALL/HANDOFF)
       └→ PUENTE HF (Opus): snapshot SQLite + adjuntos → Bucket/Dataset
  REINICIO → restaurar desde HF → SQLite → memoria viva

contrato_adapter:   # cada componente expone esto (JSON in/out)
  metodos: [health(), save(scope, key, data), load(scope, key), search(scope, query, k)]
  scopes: [chat, proyecto, global, agente]
  regla: "si el componente no está disponible → health=GAP y el adapter cae al siguiente (SQLite siempre)"

nodos:
  - id: M-0
    titulo: "Inventario real"
    flujo: "listar componentes_fuente → marcar PRESENTE/FALTA por componente → 03-ESTADO/MEMORIA-INVENTARIO.json"
    acceptance: ["13 componentes con estado verificado por ruta y sha"]
    depends_on: []
  - id: M-1
    titulo: "Paquete memoria_yaiwes + loader en el Router"
    flujo: "04-MEMORIA/memoria_yaiwes/__init__.py (fachada) → chat_mvp/memoria_loader.py (monta rutas /memoria/*, try/except: nunca tumba el Router)"
    acceptance: ["/memoria/health responde con el estado de cada adapter"]
    depends_on: [M-0]
  - id: M-2
    titulo: "SQLite persistente (fuente principal)"
    flujo: "reusar store.py del Router → RIU_DATA_DIR persistente → prueba guardar/reiniciar/leer"
    acceptance: ["turno sobrevive reinicio del proceso"]
    depends_on: [M-1]
  - id: M-3
    titulo: "State Hub"
    flujo: "emit(actor,event,project,task,payload) → BITACORA.jsonl (append) → reducer → STATE.json, CRAZY_WALL.json, HANDOFF.md en 03-ESTADO/"
    acceptance: ["STATE reconstruible solo desde la bitácora"]
    depends_on: [M-1]
  - id: M-4
    titulo: "Grafo: Graphiti (+FalkorDB si existe) con fallback al grafo SQLite"
    flujo: "adapter graphiti → si FalkorDB FALTA: GAP + usar grafo SQLite actual → search por relación"
    acceptance: ["consulta por relación devuelve resultados; FalkorDB marcado GAP si falta"]
    depends_on: [M-2]
  - id: M-5
    titulo: "Memanto (memoria de agentes) y Graphify (grafo de código)"
    flujo: "adapter memanto → scope agente; adapter graphify → índice del repo del chat (solo lectura)"
    acceptance: ["un agente guarda y recupera un recuerdo por Memanto"]
    depends_on: [M-2]
  - id: M-6
    titulo: "PostgreSQL / Redis / AgentDB"
    flujo: "solo si hay servicio activo o paquete presente → adapter; si no → GAP documentado (SQLite cubre)"
    acceptance: ["estado real de cada uno (CONECTADO o GAP), sin fingir"]
    depends_on: [M-2]
  - id: M-7
    titulo: "Prueba integral"
    flujo: "chat guarda turno → reinicio → recupera turno + búsqueda grafo + evento en bitácora"
    acceptance: ["3 pruebas PASS con evidencia en 03-ESTADO/MEMORIA-PRUEBA.json"]
    depends_on: [M-3, M-4, M-5, M-6]
  - id: H-1
    ejecuta: OPUS
    titulo: "Puente de almacenamiento con Hugging Face"
    flujo: "snapshot SQLite + adjuntos → Dataset COMAND-CENTER-1/yaiwes-hf-memoria (privado) / Bucket → al arrancar el Router: restaurar si SQLite vacío"
    acceptance: ["reinicio completo de la máquina → memoria restaurada desde HF"]
    depends_on: [M-2]

orden: [M-0, M-1, M-2, M-3, H-1, M-4, M-5, M-6, M-7]
checkpoint: "al cerrar cada nodo → evento en BITACORA.jsonl + línea en 03-ESTADO/HANDOFF.md"
