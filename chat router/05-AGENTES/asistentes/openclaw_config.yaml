schema: yaiwes.assistant/v1
name: openclaw
role: guardian_supervisor
provider: openai_compatible
base_url_env: RIU_ROUTER_URL   # se usa <RIU_ROUTER_URL>/v1/router
model_default: assistants   # grupo del Router (o auto)
api_key_env: RIU_ROUTER_API_KEY
capabilities:
  - plan
  - critique
  - review
  - debate
  - monitor
  - heartbeat
state_policy: emit_only
heartbeat_minutes: 30
