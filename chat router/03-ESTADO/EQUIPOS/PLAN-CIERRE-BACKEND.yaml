schema: yaiwes.plan-cierre-backend/v1
fecha: 2026-10-02
autor: Claude (Sonnet) para el Director
rama: devin/1790824641-chat-agent-plan   # PR #6, no crear otro
raiz_wl: "chat router/📂 workflow Loops code Yaiwes/"
objetivo: "Cerrar el backend del Wordflow lo máximo posible respetando las prohibiciones. Lo que no se pueda cerrar queda como GAP con motivo, no como fallo."
prohibido_a_todos: [tocar el router, tocar LFS git, GitHub Actions, Hugging Face]
si_falta_un_componente: "No se escribe código: se busca en GitHub y se trae solo con los motores de descarga y extracción que están en main."

# ------------------------------------------------------------
# 1. QUÉ SIGNIFICA 'BACKEND CERRADO' (9 puntos, cada uno con dueño y prueba)
# ------------------------------------------------------------
cierre:
  CB-1: {que: "Los 8 componentes del orquestador se invocan de verdad (O4-07..14)", dueno: EQUIPO-1, tareas: [S1-01..S1-08], prueba: "stdout real de cada comando + ledger.verify() verdadero"}
  CB-2: {que: "Prueba con 3 workers aislados y auditoría de cierre de Seals (S-11, S-12)", dueno: EQUIPO-1, tareas: [S1-09, S1-10], prueba: "evidencia por worker + auditoría"}
  CB-3: {que: "Las 4 capacidades descargadas quedan como herramientas (P2)", dueno: EQUIPO-3, tareas: [A-01..A-12], prueba: "1 entrada real por capacidad + test que falla cerrado"}
  CB-4: {que: "Crazy Wall visual (O4-17) y auditoría de cierre (O4-20)", dueno: EQUIPO-4, tareas: [B-01..B-08], prueba: "proyección generada del ledger real + test"}
  CB-5: {que: "28 skills de UI clasificadas, con contrato o registradas (lote SKILLS-UI)", dueno: EQUIPO-5, tareas: [C-01..C-12], prueba: "tabla de 28 + contratos + test por grupo"}
  CB-6: {que: "Memoria local con read-back y sobrevive al reinicio", dueno: EQUIPO-6, tareas: [D-01..D-12], prueba: "guardar, leer, reiniciar, leer otra vez"}
  CB-7: {que: "Suites corridas contra la base, evidencia global y README de arquitectura", dueno: EQUIPO-7, tareas: [E-01..E-12], prueba: "resultados vs base 267/3 y 44/45 + sha256 de cada evidencia"}
  CB-8: {que: "Repo ordenado en la raíz nueva (P5 y parte de P6)", dueno: EQUIPO-2 (o Claude si Haiku sigue sin acceso), tareas: [H-01..H-12], prueba: "0 diferencias de hash antes de borrar nada"}
  CB-9: {que: "Función real de cada imagen del plan (nueva auditoría)", dueno: EQUIPO-8, tareas: [I-01..I-12], prueba: "tabla por imagen comparada con el catálogo actual"}

# ------------------------------------------------------------
# 2. RONDAS (3 tareas por equipo y por vuelta; commit y salir; el Director activa)
# ------------------------------------------------------------
reglas_de_ronda:
  - "Cada equipo usa SIEMPRE el mismo prompt fijo que apunta a su handoff por URL. Lo que cambia entre rondas es 'ronda_actual' en su EQUIPO-N-*.json, y lo actualiza Claude después de auditar."
  - "Después de cada ronda Claude audita los 8 archivos y avisa al Director qué equipos activar."
  - "Nadie se queda esperando más de 1 minuto: commit, anotar, salir."
rondas:
  R0: {estado: CERRADA, quien: Claude, que: "Carpeta nueva creada como copia exacta (mismo hash de árbol f8aee828). Commit 7b52b8e. H-03 y H-04 cerradas", gate: G0_ABIERTO}
  R1: {activar: [EQUIPO-1, EQUIPO-3, EQUIPO-4, EQUIPO-5, EQUIPO-6, EQUIPO-7, EQUIPO-8, EQUIPO-2], tareas: "las 3 primeras de cada cola (Haiku: H-01, H-02, H-05)"}
  R2: {activar: "los 8", tareas: "tareas 4 a 6 de cada cola (Haiku: H-06, H-07, H-08)"}
  R3: {activar: "los 8", tareas: "tareas 7 a 9 (Haiku: H-09, H-10 solo con OK del Director, H-11; Sol 5: E-07 y E-08)"}
  R4: {activar: "los 8", tareas: "tareas 10 a 12 (Haiku: H-12; Sol 5 espera a que cierren los equipos 1 a 6)"}
  R5: {activar: [EQUIPO-7], tareas: "E-09 a E-12: suite final ordenada, evidencia global, README final"}
  AUDITORIA_FINAL: {quien: Claude, que: "Lee los 8 JSON, verifica evidencia por muestreo, declara qué CB-1..CB-9 están cerrados y qué queda como GAP"}

# ------------------------------------------------------------
# 3. LO QUE NO SE PUEDE CERRAR CON LAS PROHIBICIONES (se registra como GAP, no como fallo)
# ------------------------------------------------------------
gaps_estructurales:
  G-HF: "Puente HF y restauración H-1: Hugging Face está prohibido."
  G-ROUTER: "Conectar el Wordflow al Router principal (API, almacenamiento, cómputo): requiere tocar el Router. EQUIPO-6 deja la lista de requisitos (D-11)."
  G-ACTIONS: "Verificación en GitHub Actions: prohibido y la cuenta está bloqueada por facturación. Todo se prueba en local."
  G-SERVICIOS: "PostgreSQL, Redis, Graphiti y FalkorDB como servicio persistente: sin cómputo propio. Queda el respaldo SQLite probado."
  G-N213: "Los 4 archivos N-2.13 no existen; se registran como cubiertos por materiales equivalentes."
  G-FRONT: "Frontend T-06: bloqueado hasta cerrar el backend."
  G-STALE: "3 tests upstream stale no se tocan (g009, g021, ficha loader)."
  G-RENOMBRAR-BIGAGI: "Renombrar big-AGI necesita OK expreso del Director (FLAG-6)."

# ------------------------------------------------------------
# 4. DEPENDENCIAS (flujo transversal)
# ------------------------------------------------------------
flujo: >
  R0(Claude: raíz nueva) -> R1..R4 en paralelo (8 equipos) -> Claude audita cada ronda ->
  R5 (EQUIPO-7: suite final + evidencia global + README) -> AUDITORIA_FINAL (Claude) -> Director decide merge del PR #6
