# S1-19 Memoria de Manus conectada al harness DeepSeek como plugin (solo configuracion, nada ejecutado)
schema: yaiwes.harness-plugin-link/v1
harness: chat router/deepseek-harness-chat
plugin: memoria-yaiwes
fachada: chat router/04-MEMORIA/memoria_yaiwes/__init__.py   # MemoryFacade: health, save, load, search
rutas: [GET /memoria/health, POST /memoria/save, GET /memoria/load, GET /memoria/search]   # fuente: 04-MEMORIA/ROUTER-NEEDS-MEMORIA.json (el Router no se toca)
enchufe_fables: solo si hace falta para unir; partes en chat router/Workflow Loop code Yaiwes/01-PLAN/ANEXOS/
adapters:
  sqlite:            {estado: PASS, evidencia: chat router/Workflow Loop code Yaiwes/11-EVIDENCIA/equipos/EQUIPO-6/D-08-save-readback.json}
  grafo_sqlite:      {estado: PASS, evidencia: chat router/Workflow Loop code Yaiwes/11-EVIDENCIA/equipos/EQUIPO-6/D-10-graph-relation-search.json}
  persistencia:      {estado: PASS, evidencia: chat router/Workflow Loop code Yaiwes/11-EVIDENCIA/equipos/EQUIPO-6/D-09-restart-persistence.json}
  graphiti:          {estado: PENDIENTE_RUNTIME, cae_a: grafo_sqlite}
  graphify:          {estado: PENDIENTE_RUNTIME, modo: READ_ONLY, contrato: chat router/04-MEMORIA/GRAPHIFY-READONLY-CONTRACT.json}
  memanto:           {estado: PENDIENTE_RUNTIME, cae_a: sqlite}
  falkordb:          {estado: PENDIENTE_RUNTIME, cae_a: grafo_sqlite}
  agentdb:           {estado: PENDIENTE_RUNTIME, cae_a: sqlite}
  postgresql_redis:  {estado: SIN_SERVICIO, cae_a: sqlite}
  puente_hf_h1:      {estado: DESACTIVADO, motivo: regla de Hy, no se usa Hugging Face}
regla: si un adapter no responde, health=GAP y se usa el siguiente; SQLite siempre.
fuente_gaps: chat router/04-MEMORIA/HANDOFF-MEMORIA-GAPS.json
