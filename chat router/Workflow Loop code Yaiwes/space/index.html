<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Router YAIWES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d10;color:#d0d4dc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100dvh;padding:0 .5rem .5rem}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;gap:.45rem;padding:.4rem 0}
.row{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;background:#14181d;border-radius:1rem;padding:.45rem;border:1px solid #2a3038}
select,button,input,textarea{font-size:.8rem;background:#1e242c;color:#d0d4dc;border:1px solid #2e3843;border-radius:.9rem;padding:.4rem .6rem}
select{flex:1 0 100px;min-width:0}
button{cursor:pointer}
.sw{display:flex;align-items:center;gap:.3rem;font-size:.75rem;background:#1a2028;padding:.35rem .6rem;border-radius:.9rem;border:1px solid #2e3843}
.st{font-size:.78rem;flex:1 0 100%}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#666;margin:0 .25rem 0 .4rem}
.on{background:#3ecf8e}.off{background:#e5534b}
.chat{flex:1;background:#0f1318;border-radius:1rem;display:flex;flex-direction:column;border:1px solid #222a33;min-height:300px}
.hist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.5rem;font-size:.92rem}
.msg{padding:.45rem .7rem;border-radius:.9rem;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.a{background:#1f2b38;border-left:3px solid #4c9aff;align-self:flex-start}
.msg.u{background:#1b2a3a;align-self:flex-end}
.docs{font-size:.72rem;padding:0 .7rem;opacity:.8}
.in{display:flex;gap:.3rem;padding:.45rem;border-top:1px solid #252e38}
.in textarea{flex:1;background:#1a212a;border-radius:.9rem;padding:.55rem .8rem;font-size:.95rem;resize:none;height:2.6rem}
.in button{font-size:1rem;padding:.4rem .9rem}
.err{color:#f99;font-size:.8rem;text-align:center;min-height:1.1rem}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <div class="st">Router<span class="dot" id="dR"></span><b id="sR">revisando…</b> &nbsp; Agentes<span class="dot" id="dA"></span><b id="sA">…</b></div>
    <button data-p="router/on">🔌 Encender Router</button>
    <button data-p="router/off">⏻ Apagar Router</button>
    <button data-p="agents/on">▶️ Encender agentes</button>
    <button data-p="agents/off">⏸️ Apagar agentes</button>
    <button id="stop">🛑 Emergencia</button>
  </div>

  <div class="row">
    <select id="conv"><option value="">➕ Conversación nueva</option></select>
    <select id="group"><option value="">Grupo</option></select>
    <button id="addGroup" title="Crear grupo">➕ grupo</button>
  </div>

  <div class="row">
    <select id="provider"><option>Proveedor</option></select>
    <select id="model"><option>Modelo</option></select>
    <label class="sw"><input type="checkbox" id="agentOn"> con agente</label>
    <select id="agent"><option value="">Agente</option></select>
    <label class="sw"><input type="checkbox" id="dagOn"> DSL DAG</label>
  </div>

  <div class="row">
    <select id="gh"><option value="">Cuenta GitHub</option></select>
    <select id="repo"><option value="">Repo</option></select>
    <select id="wf"><option value="">Workflow</option></select>
    <button id="addWf" title="Añadir workflow">➕ workflow</button>
    <button id="order">🗓️ Orden programada</button>
  </div>

  <div class="chat">
    <div class="hist" id="hist"><div class="msg a">Hola. Elige proveedor y modelo y escribe. Con "con agente", responde el agente elegido. Con "DSL DAG", pega un DAG en JSON y se ejecuta.</div></div>
    <div class="docs" id="docs"></div>
    <div class="in">
      <button id="attach" title="Subir archivo">📎</button>
      <input type="file" id="file" class="hide">
      <textarea id="txt" placeholder="Mensaje…"></textarea>
      <button id="send">➤</button>
    </div>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const say=m=>{$('err').textContent=m||''};
  let conv=null, docIds=[], docNames=[], groups={}, workflows=[], loaded=false;

  async function api(path,opt){
    opt=opt||{};
    const r=await fetch(path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined});
    let d={};try{d=await r.json()}catch(e){}
    if(!r.ok)throw new Error(d.error||d.detail||('error '+r.status));
    return d;
  }
  function add(c,t){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('hist').appendChild(d);$('hist').scrollTop=1e9}
  function fill(sel,items,first){const s=$(sel);const cur=s.value;s.innerHTML=first!==undefined?'<option value="">'+first+'</option>':'';items.forEach(i=>{const o=document.createElement('option');o.value=i.v;o.text=i.t;s.add(o)});if([...s.options].some(o=>o.value===cur))s.value=cur}

  async function status(){
    try{
      const s=await api('/power/status');
      $('sR').textContent=s.router;$('dR').className='dot '+(s.router==='encendido'?'on':'off');
      $('sA').textContent=s.agentes;$('dA').className='dot '+(s.agentes==='activos'?'on':'off');
      if(s.router==='encendido'&&!loaded){loaded=true;loadAll()}
      return s;
    }catch(e){say(e.message)}
  }

  async function loadModels(){
    const p=$('provider').value;if(!p)return;
    try{const d=await api('/chat/providers/'+p+'/models');fill('model',(d.models||[]).filter(m=>m.selectable!==false).map(m=>({v:m.model_id,t:m.label||m.model_id})))}catch(e){fill('model',[],'sin modelos');say(e.message)}
  }
  async function loadRepos(){
    const a=$('gh').value;if(!a){fill('repo',[],'Repo');return}
    try{const d=await api('/chat/github/repos?account='+encodeURIComponent(a));fill('repo',(d.repos||[]).map(r=>{const n=r.full_name||r.name||r;return{v:n,t:n}}),'Repo')}catch(e){say(e.message)}
  }
  async function loadConvs(){
    try{const d=await api('/chat/conversations');fill('conv',(d.conversations||[]).map(c=>({v:c.id,t:(c.title||c.id).slice(0,50)})),'➕ Conversación nueva')}catch(e){}
  }
  async function loadAll(){
    try{const d=await api('/chat/providers');fill('provider',(d.providers||[]).filter(p=>p.configured).map(p=>({v:p.id,t:p.label})));await loadModels()}catch(e){say(e.message)}
    try{const d=await api('/chat/agents');fill('agent',(d.agents||[]).map(a=>({v:a.id,t:a.name||a.id})),'Agente')}catch(e){}
    try{const d=await api('/chat/github/accounts');fill('gh',(d.accounts||[]).filter(a=>a.configured).map(a=>({v:a.account,t:a.account})),'Cuenta GitHub')}catch(e){}
    try{groups=await api('/groups');fill('group',Object.keys(groups).map(g=>({v:g,t:g})),'Grupo')}catch(e){}
    try{workflows=(await api('/workflows')).workflows||[];fill('wf',workflows.map(w=>({v:w.nombre,t:w.nombre})),'Workflow')}catch(e){}
    loadConvs();
  }

  async function openConv(){
    conv=$('conv').value||null;$('hist').innerHTML='';
    if(!conv){add('a','Conversación nueva.');return}
    try{const d=await api('/chat/conversations/'+conv);(d.messages||[]).forEach(m=>add(m.role==='user'?'u':'a',m.content))}catch(e){say(e.message)}
  }

  async function send(){
    const text=$('txt').value.trim();if(!text)return;
    add('u',text);$('txt').value='';say('');
    try{
      if($('dagOn').checked){
        let dag;try{dag=JSON.parse(text)}catch(e){add('a','El DAG debe ser JSON válido.');return}
        const d=await api('/chat/dag/run',{method:'POST',body:{dag:dag}});
        add('a',JSON.stringify(d,null,1).slice(0,4000));return;
      }
      const body={message:text,provider:$('provider').value,model:$('model').value,conversation_id:conv,
        mode:$('agentOn').checked?'agent':'direct',agent_id:$('agentOn').checked?($('agent').value||null):null,doc_ids:docIds};
      if($('gh').value)body.github={account:$('gh').value,repo:$('repo').value||''};
      if(body.mode==='agent'&&!body.agent_id){add('a','Elige un agente.');return}
      const d=await api('/chat/send',{method:'POST',body:body});
      add('a',d.reply||'(respuesta vacía)');
      if(d.conversation_id&&d.conversation_id!==conv){conv=d.conversation_id;await loadConvs();$('conv').value=conv}
      docIds=[];docNames=[];$('docs').textContent='';
    }catch(e){add('a','No se pudo: '+e.message)}
  }

  $('send').onclick=send;
  $('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  $('provider').onchange=loadModels;
  $('gh').onchange=loadRepos;
  $('conv').onchange=openConv;
  $('group').onchange=async()=>{
    const g=groups[$('group').value];if(!g)return;
    if(g.api_origen){$('provider').value=g.api_origen;await loadModels()}
    if(g.modelo)$('model').value=g.modelo;
    if(g.orquestador){$('agentOn').checked=true;$('agent').value=g.orquestador}
    say('Grupo '+$('group').value+': '+(g.agentes||[]).join(', '));
  };
  $('addGroup').onclick=async()=>{
    const grupo=prompt('Nombre del grupo:');if(!grupo)return;
    const orquestador=prompt('Agente orquestador del grupo (id):')||'';
    const agentes=(prompt('Agentes del grupo, separados por comas:')||'').split(',').map(s=>s.trim()).filter(Boolean);
    const api_origen=prompt('API de origen (hf, nvidia, cerebras, groq, deepseek, local):',$('provider').value||'hf')||'hf';
    const modelo=prompt('Modelo (vacío = el elegido arriba):',$('model').value)||$('model').value;
    try{await api('/groups',{method:'POST',body:{grupo,orquestador,agentes,api_origen,modelo}});groups=await api('/groups');fill('group',Object.keys(groups).map(g=>({v:g,t:g})),'Grupo');say('Grupo guardado')}catch(e){say(e.message)}
  };
  $('addWf').onclick=async()=>{
    const nombre=prompt('Nombre del workflow:');if(!nombre)return;
    const repo=prompt('Repo (ej. maxbry123-commits/agentes):');if(!repo)return;
    const plan=prompt('Ruta del plan en el repo:')||'';
    const orquestador=prompt('Agente orquestador que lo controla (id):',$('agent').value)||'';
    try{workflows=(await api('/workflows',{method:'POST',body:{nombre,repo,plan,orquestador}})).workflows;fill('wf',workflows.map(w=>({v:w.nombre,t:w.nombre})),'Workflow');say('Workflow guardado')}catch(e){say(e.message)}
  };
  $('order').onclick=async()=>{
    const w=workflows.find(x=>x.nombre===$('wf').value);
    const agente=$('agent').value||(w&&w.orquestador)||prompt('¿Para qué agente?');if(!agente)return;
    let orden=prompt('Orden para '+agente+':');if(!orden)return;
    if(w)orden='[workflow '+w.nombre+' | repo '+w.repo+' | plan '+w.plan+'] '+orden;
    const cuando=prompt('¿Cuándo? (vacío = ahora)')||null;
    try{const d=await api('/control/order',{method:'POST',body:{agente,orden,programada_para:cuando}});say('Orden '+d.id+' enviada a '+agente)}catch(e){say(e.message)}
  };
  $('attach').onclick=()=>$('file').click();
  $('file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    try{const d=await api('/chat/documents',{method:'POST',body:{name:f.name,mime:f.type||'application/octet-stream',data_b64:b64,conversation_id:conv}});
      docIds.push(d.document.id);docNames.push(f.name);$('docs').textContent='📎 '+docNames.join(', ');say('Archivo guardado: '+f.name)}catch(err){say('No se pudo subir: '+err.message)}
    e.target.value='';
  };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
    try{const d=await api('/power/'+b.dataset.p,{method:'POST'});say(d.estado);setTimeout(status,4000)}catch(e){say(e.message)}
  });
  $('stop').onclick=async()=>{
    if(!confirm('¿Parar todo (agentes y Router)?'))return;
    try{await api('/power/agents/off',{method:'POST'});await api('/power/router/off',{method:'POST'});say('Todo parado');status()}catch(e){say(e.message)}
  };
  (async()=>{
    const s=await status();
    if(s&&s.router!=='encendido'){say('Encendiendo el Router, tarda 2 a 5 minutos…');try{await api('/power/router/on',{method:'POST'})}catch(e){}}
    setInterval(status,20000);
  })();
})();
</script>
</body>
</html>
