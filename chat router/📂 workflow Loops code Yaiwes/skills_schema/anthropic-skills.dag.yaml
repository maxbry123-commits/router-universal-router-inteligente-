schema_id: skills_schema/anthropic-skills.dag.yaml
schema: yaiwes.skill-dag/v1
objective: 'Exponer Anthropic Skills como biblioteca de instrucciones, scripts y recursos de herramienta; nunca como agente, staff o autoridad.'
work_surface: LOCAL
acceptance:
- capability anthropic-skills registrada en COMPONENT_CAPABILITIES
- runtime ausente falla cerrado via YAIWES_ANTHROPIC_SKILLS_COMMAND
- no transfiere autoridad ni muta el goal global
tools:
- anthropic-skills
- sheriff
- judge
- verifier
evidence:
- path: evidence/anthropic-skills.json
  sha256: pending
oracle: 'component_adapter:anthropic-skills'
gap_policy: 'RUNTIME_UNAVAILABLE => BLOCKED; nunca PASS sin evidencia'
nodes:
- id: claim
  role: writer
- id: execute
  depends_on:
  - claim
- id: verify
  depends_on:
  - execute
