<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YAIWES · Organización</title>
  <link rel="stylesheet" href="/chat/ui/shell.css">
  <link rel="stylesheet" href="/chat/ui/responsive.css">
  <link rel="stylesheet" href="/chat/ui/temas-nuevos.css">
  <link rel="stylesheet" href="/chat/ui/shell-riu.css">
  <link rel="stylesheet" href="/chat/ui/chat-movil.css">
  <link rel="stylesheet" href="/chat/ui/encendido.css">
  <link rel="stylesheet" href="/chat/ui/boton-enviar.css">
  <link rel="stylesheet" href="/chat/ui/room-conferencias.css">
  <link rel="stylesheet" href="/chat/ui/orquestador.css">
  <script src="/chat/ui/version.js"></script>
  <script src="/chat/ui/config.js"></script>
  <script type="module" src="/chat/ui/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Vistas">
      <div class="brand">Y</div>
      <span id="nav-slot"></span>
      <nav id="navigation">
        <button data-view="chat" aria-current="page">Chat</button>
        <button data-view="canvas">Canvas</button>
        <button data-view="seguimiento">Seguimiento</button>
        <button data-view="archivos">Archivos</button>
        <button data-view="apariencia">Configuración</button>
      </nav>
    </aside>
    <div class="workspace">
      <div id="movil-bar" hidden><button type="button" id="movil-toggle" aria-expanded="false" aria-controls="movil-panel">Chat v</button><span id="campana-slot" class="campana-slot"></span><span id="movil-status">· Router</span></div>
      <div id="movil-panel" hidden><div id="mv-nav"></div><div id="mv-top"></div><div id="mv-title"></div><div id="mv-ctl"></div></div>
      <span id="topbar-slot"></span>
      <header class="topbar topbar-slim">
        <strong id="view-title" hidden>Chat</strong>
        <div class="access"><button class="secondary" id="connect" type="button" hidden>Reintentar conexión</button><label for="theme" hidden>Tema <select id="theme"><option value="gris">Gris</option><option value="little">Little</option><option value="matte">Matte</option><option value="blanco">Blanco</option><option value="crystal">Cristal</option><option value="orange">Naranja</option><option value="blue">Azul</option></select></label><span id="connection" role="status">Sin verificar</span></div>
      </header>
      <main id="panel" aria-live="polite"></main>
      <div id="notice" role="status"></div>
    </div>
  </div>
</body>
</html>
