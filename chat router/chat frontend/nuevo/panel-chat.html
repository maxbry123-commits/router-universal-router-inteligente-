<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat nuevo · YAIWES</title>
  <link rel="stylesheet" href="./base.css"><link rel="stylesheet" href="./panel-chat.css">
  <script src="../config.js"></script><script type="module" src="./panel-chat.js"></script>
</head>
<body><div class="shell">
  <aside class="sidebar"><div class="brand">Y</div><nav aria-label="Paneles">
    <a href="./panel-chat.html" aria-current="page">Chat nuevo</a>
    <a href="./panel-media.html">Imágenes y videos</a>
    <a href="./panel-agentes.html">Multiagente</a>
    <a href="./panel-seguimiento.html">Seguimiento y planificación</a>
    <a href="./panel-configuracion.html">Configuración de UI</a>
    <a href="./panel-claves.html">Claves secretas</a>
  </nav></aside>
  <div class="workspace"><header class="topbar"><strong>Chat nuevo · Router Inteligente Universal</strong></header>
  <main><h1>Chat nuevo</h1><p class="muted">Pantalla adicional. El chat actual permanece separado.</p>
    <section>
      <div class="row"><label>Modelo (ficha) <select id="ficha"></select></label>
        <label>Proveedor <select id="provider"><option value="auto">Automático</option></select></label>
        <label>Modelo <select id="model"><option value="">Router elige</option></select></label>
        <label>Agente <select id="agent"><option value="">Sin agente</option></select></label>
        <label>Modo <select id="mode"><option value="fast">Rápido</option><option value="balanced" selected>Equilibrado</option><option value="think">Pensar</option></select></label>
      </div>
      <div class="chat-bar"><button id="nuevo-chat" class="secondary" type="button">Nuevo chat</button>
        <div id="chat-tabs" role="tablist" aria-label="Chats"></div><output id="chat-id" class="muted"></output>
        <small id="historial-origen" class="muted" role="status"></small></div>
      <div id="chat-subtabs" role="tablist" aria-label="Chats hijos (agentes anclados)" hidden></div>
      <details id="hijos" class="chat-hijos"><summary>Anclar agente</summary>
        <label>Agente <select id="hijo-agente"><option value="">Elige un agente</option></select></label>
        <label for="hijo-input">INPUT_BLOCK (se envía literal, sin recortar ni normalizar)</label>
        <textarea id="hijo-input" class="mono" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <button id="hijo-crear" class="secondary" type="button">Crear chat hijo</button></details>
      <small id="hijo-estado" class="muted" role="status"></small>
      <div id="hijo-ficha" class="hijo-ficha" hidden></div>
      <div id="orq" class="orq" hidden><button id="orq-switch" class="orq-switch" type="button" role="switch" aria-checked="false">Orquestador OFF</button>
        <label id="orq-nodos-caja" hidden>Nodos <select id="orq-nodos"></select></label>
        <small id="orq-limites" class="muted"></small><small id="orq-estado" class="muted" role="status"></small>
        <details id="orq-runs" class="orq-runs"><summary id="orq-runs-titulo">Ejecuciones del orquestador</summary>
          <div id="orq-runs-lista" class="orq-runs-lista"></div><div id="orq-detalle" class="orq-detalle" hidden></div></details></div>
      <div class="chat-files" aria-label="Archivos del chat"><div class="chat-files-head"><strong id="archivos-titulo">Archivos de este chat</strong>
        <button id="archivos-subir" class="secondary" type="button">Subir archivo</button><input id="archivos-input" type="file" hidden>
        <small id="archivos-estado" class="muted" role="status"></small></div><ul id="archivos-lista"></ul></div>
      <div id="history" class="chat-history" role="log" aria-live="polite"></div>
      <form id="composer"><label for="message">Mensaje</label><textarea id="message" required placeholder="Escribe un mensaje"></textarea><button class="action" type="submit">Enviar al Router</button></form>
    </section>
  </main><p id="notice" role="status"></p></div>
</div></body>
</html>
