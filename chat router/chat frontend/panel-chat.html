<link rel="stylesheet" href="/chat/ui/shell.css">
<link rel="stylesheet" href="/chat/ui/responsive.css">
<script src="/chat/ui/config.js"></script>
<script type="module">
  import { api } from "/chat/ui/api.js";
  import { mount } from "/chat/ui/panel-chat.js";
  mount(document.body, { api, tell: (m) => { let n = document.getElementById("notice"); if (!n) { n = document.createElement("div"); n.id = "notice"; document.body.appendChild(n); } n.textContent = m; }, view: "chat" });
</script>
<h1>Chat del Router</h1>
<section>
  <div id="chat-tabs" class="chat-tabs"></div>
  <div class="row fields">
    <button type="button" id="ficha" class="pill" data-sheet="sh-ficha">modelo ▾</button>
    <button type="button" id="modo" class="pill" data-sheet="sh-modo">⚖ equilibrado ▾</button>
    <button type="button" id="mas" class="pill" data-sheet="sh-mas">⚙ más ▾</button>
    <button type="button" id="ancla" class="pill" data-sheet="sh-ancla">⚓ ancla ▾</button>
  </div>
  <div id="histories"></div>
  <form id="composer"><textarea id="message" placeholder="Escribe una orden o /ayuda" aria-label="Mensaje" autocomplete="off" required></textarea><div class="row composer-bar"><input type="file" id="adjunto" hidden><button type="button" id="btn-adjunto" class="secondary" title="Adjuntar archivo">📎</button><button type="button" id="btn-archivos" class="secondary" title="Archivos en memoria" data-sheet="ventana-archivos">🗂</button><button type="button" id="btn-sandbox" class="secondary" title="Sandbox: system prompt de code" data-sheet="ventana-sandbox">🧪</button><button type="button" id="btn-copiar-input" class="secondary" title="Copiar texto">⧉</button><button class="action">Enviar</button><span id="anclados" class="anclados"></span></div></form>
  <div id="sh-ficha" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>Modelo (ficha)</strong><button type="button" class="secondary sh-cerrar">✕</button></div><div id="sh-ficha-lista" class="list"></div></div></div>
  <div id="sh-modo" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>Modo</strong><button type="button" class="secondary sh-cerrar">✕</button></div><div id="sh-modo-lista" class="list"></div></div></div>
  <div id="sh-mas" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>Más opciones</strong><button type="button" class="secondary sh-cerrar">✕</button></div><div class="row fields"><label>Proveedor <select id="provider"><option value="auto">Automático</option></select></label><label>Modelo <select id="model"><option value="">Router elige</option></select></label><label>Agente <select id="agent"><option value="">Sin agente</option></select></label><label>Grupo <select id="group"><option value="">Predeterminado</option></select></label><label>Cuenta GitHub <select id="github"><option value="">Ninguna</option></select></label><label>Rama <input id="branch" placeholder="main" disabled></label></div></div></div>
  <div id="sh-ancla" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>⚓ Anclar al chat</strong><button type="button" class="secondary sh-cerrar">✕</button></div><div id="sh-ancla-lista" class="list"></div><textarea id="mi-handoff" placeholder="Mi handoff: pega o escribe dónde debe trabajar la llm…"></textarea><div class="row"><button type="button" id="mh-guardar" class="toggle">Encender/Guardar</button><button type="button" id="mh-apagar" class="toggle rojo">Apagar</button><span id="mh-estado" class="muted"></span></div><div class="row"><input id="ancla-enlace" placeholder="Pega enlace para anclar…" autocomplete="off"><button type="button" id="ancla-enlace-on" class="mini">Encender</button></div><div class="fila-desc">Enciende un handoff del proyecto/skill/preview, guarda tu propio handoff o pega un enlace: queda anclado y se envía con cada mensaje.</div></div></div>
  <div id="ventana-archivos" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>Archivos en memoria</strong><button type="button" class="secondary sh-cerrar">✕</button></div><div id="va-lista" class="list"></div></div></div>
  <div id="ventana-sandbox" class="sheet" hidden><div class="va-caja"><div class="row va-head"><strong>🧪 Sandbox — system prompt de code</strong><button type="button" class="secondary sh-cerrar">✕</button></div><textarea id="sandbox-texto" placeholder="System prompt de code que corre anclado a este chat…"></textarea><div class="row"><button type="button" id="sb-guardar" class="toggle">Encender</button><button type="button" id="sb-apagar" class="toggle rojo">Apagar</button><span id="sb-estado" class="muted"></span></div></div></div>
</section>
<section><h2>Control</h2><div class="row"><button type="button" id="tg-agentes" class="toggle" title="Encender = reanudar, apagar = pausar">Agentes</button><button type="button" id="tg-router" class="toggle" title="Encender = router, apagar = paro de emergencia">Router</button><button type="button" data-control="emergency-stop" class="toggle rojo">Emergencia</button><button type="button" id="apagar-respaldo" class="toggle rojo" title="Apagar todos los servidores de respaldo">Respaldo</button></div></section>
