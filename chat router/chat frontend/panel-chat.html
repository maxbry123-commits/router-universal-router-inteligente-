<h1>Chat del Router</h1>
<section>
  <div class="row fields"><label>Modelo (ficha) <select id='ficha'></select></label>
    <label>Proveedor <select id="provider"><option value="auto">Automático</option></select></label>
    <label>Modelo <select id="model"><option value="">Router elige</option></select></label>
    <label>Agente <select id="agent"><option value="">Sin agente</option></select></label>
    <label>Modo <select id="mode"><option value="fast">Rápido</option><option value="balanced" selected>Equilibrado</option><option value="think">Pensar</option></select></label>
    <label>Grupo <select id="group"><option value="">Predeterminado</option></select></label></div>
  <div class="row fields"><label>Cuenta GitHub <select id="github"><option value="">Ninguna</option></select></label><label>Rama <input id="branch" placeholder="main" disabled></label></div>
  <div id="history" class="chat-history" role="log" aria-live="polite"></div>
  <form id="composer"><textarea id="message" placeholder="Escribe una orden o /ayuda" aria-label="Mensaje" autocomplete="off" required></textarea><div class="row composer-bar"><input type="file" id="adjunto" hidden><button type="button" id="btn-adjunto" class="secondary" title="Adjuntar archivo">📎</button><button type="button" id="btn-archivos" class="secondary" title="Archivos subidos">🗂</button><button type="button" id="btn-copiar-input" class="secondary" title="Copiar texto">⧉</button><button class="action">Enviar</button><span id="anclados" class="anclados"></span></div></form>
  <div id="ventana-archivos" hidden><div class="va-caja"><div class="row va-head"><strong>Archivos en memoria</strong><button type="button" id="va-cerrar" class="secondary">✕</button></div><div id="va-lista" class="list"></div></div></div>
</section>
<section><h2>Control</h2><div class="row"><button class="secondary" data-control="pause-agents">Pausar agentes</button><button class="secondary" data-control="resume-agents">Reanudar agentes</button><button class="secondary" data-control="emergency-stop">Emergencia</button><button class="secondary" data-control="resume-router">Encender Router</button><button id='apagar-respaldo' class='secondary'>Apagar respaldo (todos los servidores)</button></div></section>
