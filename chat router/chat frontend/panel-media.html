<h1>Imágenes, videos y archivos</h1>
<section>
  <div class="row">
    <label>Buscar <input id="media-search" type="search" placeholder="Nombre de archivo"></label>
    <label>Tipo <select id="media-type"><option value="">Todos</option><option value="image/">Imágenes</option><option value="video/">Videos</option><option value="other">Otros archivos</option></select></label>
    <button id="media-reload" class="secondary" type="button">Actualizar</button>
  </div>
  <p id="media-status" role="status" class="muted">Consultando archivos del Router…</p>
  <div id="media-files" class="list"></div>
</section>
<section>
  <h2>Vista previa</h2>
  <div id="media-preview" class="item">Selecciona un archivo registrado.</div>
  <div id="media-actions" class="row"></div>
</section>
<section>
  <h2>Adjuntar al Router</h2>
  <form id="media-upload" class="row">
    <input id="media-input" type="file" required aria-label="Archivo para subir">
    <button class="action" type="submit">Subir archivo</button>
  </form>
  <p class="muted">Máximo 10 MB. El ID y la lista sólo se confirman tras respuesta del Router.</p>
</section>
