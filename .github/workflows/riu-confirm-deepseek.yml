name: RIU Confirm DeepSeek Account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/agents-yaiwes/common/confirm_deepseek_account.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub openai
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: python "router inteligente universal/agents-yaiwes/common/confirm_deepseek_account.py"
