name: Sentinelas (chat, fabrica, plan4)

# Un solo LOOP compartido:
# gobierno/sentinel_loop.py = reglas
# 07-SENTINELAS/REPLICAS.yaml = configuración por réplica
# 07-SENTINELAS/replica_runner.py = observación/investigación/orden
#
# Flujo: DSL → DAG → Schema → Sheriff → OBSERVE → VERIFY → GUARDIAN
#        → CLASSIFY → RESEARCH → ORDER → EXECUTOR → REVERIFY.
# La LLM investiga/redacta; nunca decide PASS.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sentinelas
  cancel-in-progress: false

jobs:
  sentinela:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        proyecto: [chat, fabrica, plan4]
    env:
      GH_TOKEN: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.GH_CLASSIC_FULL_2 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
      NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
      NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
      PROYECTO: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.GH_CLASSIC_FULL_2 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          fetch-depth: 50
          sparse-checkout: |
            chat router
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias mínimas
        run: pip install -q pyyaml

      - name: LOOP común del sentinela
        run: python "chat router/07-SENTINELAS/replica_runner.py" --replica "$PROYECTO"

      - name: Guardar réplica
        run: |
          git config user.name "sentinela-${PROYECTO}"
          git config user.email "sentinela@users.noreply.github.com"

          case "$PROYECTO" in
            chat) REP="chat" ;;
            fabrica) REP="fabrica" ;;
            plan4) REP="plan4" ;;
          esac

          git add --sparse             "chat router/06-EQUIPO/SENTINELA-${REP}.md"             "chat router/07-SENTINELAS/estado-replicas/${REP}.json"             "chat router/07-SENTINELAS/ordenes/${REP}.yaml"

          git commit -q -m "sentinela ${PROYECTO}: LOOP común" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 3
          done
