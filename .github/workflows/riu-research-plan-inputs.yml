name: RIU Research Plan Inputs

# One-shot research for the chat plan. Uses the Router's own websearch engine (ddgs provider, no LLM, no API key)
# and public metadata endpoints. Results are emitted as annotations. No secret value is printed.
# The engine file is located through the GitHub tree API (folder names contain emoji), never by a typed path.
# Every stage reports its own error as an annotation so a failure is never silent.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-research-plan-inputs.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search with the Router websearch engine (ddgs, no LLM)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install ddgs 2>&1 | tail -n 1
          python - <<'PY'
          import base64, importlib.util, json, os, pathlib, traceback, urllib.request
          os.environ["PUBLISH_GITHUB"] = "off"

          def stage(msg):
              print("::notice title=RIU_STAGE::" + msg)

          def gh(path):
              req = urllib.request.Request("https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-/" + path,
                                           headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "riu"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          try:
              root = gh("git/trees/main")["tree"]
              motores = next(e for e in root if "motores de descarga" in e["path"])
              sub = gh("git/trees/%s?recursive=1" % motores["sha"])["tree"]
              blob = next(e for e in sub if e["path"].endswith("websearch_engine.py"))
              dst = pathlib.Path("/tmp/websearch_engine.py")
              dst.write_bytes(base64.b64decode(gh("git/blobs/%s" % blob["sha"])["content"]))
              spec = importlib.util.spec_from_file_location("we", dst)
              we = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(we)
              stage("engine loaded, %d bytes" % dst.stat().st_size)
          except Exception as e:
              print("::warning title=RIU_SEARCH_ERR::load %s %s" % (type(e).__name__, str(e)[:200]))
              raise SystemExit(0)

          queries = [
              "Open WebUI OpenAI compatible endpoint file upload knowledge base model selector agents",
              "LibreChat agents file uploads custom OpenAI endpoint MCP multi model self hosted",
              "Graphiti FalkorDB docker compose quickstart graphiti-core falkordb",
          ]
          lines = []
          for q in queries:
              try:
                  res = we.run(q, ["ddgs"], 8, pathlib.Path("/tmp/ws"))
                  data = json.loads(pathlib.Path(res["result_json"]).read_text(encoding="utf-8"))
                  top = ["%s <%s>" % (x["title"][:60], x["url"]) for x in data["results"][:5]]
                  lines.append("Q=%s | %s | %s" % (q[:40], res["provider_status"].get("ddgs", {}), " ; ".join(top)))
              except Exception as e:
                  lines.append("Q=%s | ERR %s %s" % (q[:40], type(e).__name__, str(e)[:160]))
          print("::notice title=RIU_SEARCH::" + " ### ".join(lines))
          PY

      - name: Hub facts (Decider-2B-Vision, NanoJev, LFM2 vs LFM2.5)
        run: |
          python - <<'PY'
          import json, urllib.request
          ids = ["Mapika/decider-2b-vision", "C-Tianyu/NanoJev", "LiquidAI/LFM2-2.6B", "LiquidAI/LFM2.5-2.6B"]
          out = []
          for i in ids:
              try:
                  with urllib.request.urlopen("https://huggingface.co/api/models/" + i, timeout=20) as x:
                      d = json.load(x)
                  tags = d.get("tags", [])
                  out.append("%s downloads=%s likes=%s lib=%s pipe=%s lic=%s base=%s updated=%s" % (
                      i, d.get("downloads"), d.get("likes"), d.get("library_name"), d.get("pipeline_tag"),
                      [t for t in tags if t.startswith("license:")], [t for t in tags if t.startswith("base_model:")][:3],
                      (d.get("lastModified") or "")[:10]))
              except Exception as e:
                  out.append("%s ERR %s" % (i, type(e).__name__))
          print("::notice title=RIU_HUB::" + " || ".join(out))
          PY

      - name: HF token scopes (entity and permissions only, no values)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          tok = os.environ.get("HF_TOKEN", "")
          if not tok:
              print("::warning title=RIU_HF_SCOPES::GAP_SECRET_MISSING")
              raise SystemExit(0)
          req = urllib.request.Request("https://huggingface.co/api/whoami-v2", headers={"Authorization": "Bearer " + tok})
          with urllib.request.urlopen(req, timeout=30) as r:
              d = json.load(r)
          fg = ((d.get("auth") or {}).get("accessToken") or {}).get("fineGrained") or {}
          scoped = ["%s:%s perms=%s" % ((s.get("entity") or {}).get("type"), (s.get("entity") or {}).get("name"), ",".join(s.get("permissions", []))) for s in fg.get("scoped", [])]
          print("::notice title=RIU_HF_SCOPES::global=%s | scoped=%s" % (",".join(fg.get("global", [])), " ; ".join(scoped)))
          PY
