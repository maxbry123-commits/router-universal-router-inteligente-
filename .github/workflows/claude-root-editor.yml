name: Claude Root Editor

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for Claude inside this repository'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Claude direct GitHub root access
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RIU_GITHUB_PAT || github.token }}
          additional_permissions: |
            actions: read
          prompt: ${{ inputs.prompt }}
