name: TMP Bloque2 verify

# TEMPORAL (Bloque 2, 2026-09-29). Se borra al terminar. Solo workflow_dispatch.
# tests: suite completa en main y en bloque2-agentes (lista de fallos ordenada + huella sha256) y archivos de prueba de la rama con -rA.
# live: grupo assistants con las claves reales (cadena, puerta OpenAI, /chat/send auto). Resultados como anotaciones ::notice. Nunca se imprime un secreto.
# (segundo commit sin [skip ci] para que GitHub registre el workflow)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main, bloque2-agentes]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/plugins/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/tests/
            router inteligente universal/verifier/
            router inteligente universal/Banco de claves/
            chat router/05-AGENTES/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic uvicorn huggingface_hub cryptography pyyaml requests
      - name: Full tests and branch test files
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider "router inteligente universal/tests" 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          last=$(tail -n 1 /tmp/pytest.txt | tr -d '\r')
          echo "::notice title=B2_${{ matrix.ref }}::exit=${code} | ${last}"
          fails=$(grep -E '^(FAILED|ERROR)' /tmp/pytest.txt | sed 's/ - .*//' | sort | tr '\n' ';')
          count=$(grep -Ec '^(FAILED|ERROR)' /tmp/pytest.txt)
          sha=$(printf '%s' "$fails" | sha256sum | cut -c1-16)
          echo "::notice title=B2_FAILSET_${{ matrix.ref }}::count=${count} sha=${sha} | ${fails}"
          T="router inteligente universal/tests"
          C="chat router/05-AGENTES"
          files=""
          for f in "$T/test_model_pool.py" "$T/test_resilience.py" "$T/test_nvidia_pool.py" "$T/test_plugin_host.py" "$T/test_openai_route.py" "$T/test_dag_route_loop.py" "$T/test_chat_cost_dag.py" "$T/test_chat_mvp_app.py" "$C/colmena/tests/test_router_cliente_live.py" "$C/gobierno/tests/test_espejo_equipo.py"; do
            if [ -f "$f" ]; then files="$files|$f"; else echo "::notice title=B2_MISSING_${{ matrix.ref }}::$f"; fi
          done
          if [ -d "$C/asistentes" ]; then
            for f in $(find "$C/asistentes" -name 'test_*.py' | sort); do files="$files|$f"; done
          fi
          IFS='|' read -r -a arr <<< "${files#|}"
          for f in "${arr[@]}"; do
            [ -z "$f" ] && continue
            python -m pytest -q -p no:cacheprovider -rA "$f" > /tmp/one.txt 2>&1
            c=$?
            passed=$(grep -c '^PASSED' /tmp/one.txt)
            other=$(grep -E '^(FAILED|ERROR|SKIPPED)' /tmp/one.txt | sed 's/ - .*//' | tr '\n' ';')
            echo "::notice title=B2_FILE_${{ matrix.ref }}::$(basename "$f") exit=${c} passed=${passed} | other=${other} | $(tail -n 1 /tmp/one.txt)"
          done
          exit 0

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloque2-agentes
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/plugins/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/verifier/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install fastapi httpx pydantic uvicorn huggingface_hub cryptography pyyaml requests
      - name: Assistants group live
        env:
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
        run: |
          cd "router inteligente universal"
          python - <<'PY'
          import json, os, secrets, sys, tempfile, time
          key = "ci-" + secrets.token_hex(8)
          os.environ["RIU_AGENT_API_KEYS"] = json.dumps({key: "ci-agent"})
          os.environ["RIU_CHAT_ALLOW_PROVIDER_LIVE"] = "1"
          os.environ["RIU_DATA_DIR"] = tempfile.mkdtemp()
          sys.path.insert(0, ".")
          from integration.chat_mvp import providers as prov, resilience as R
          RES = []

          def note(title, msg):
              RES.append("%s: %s" % (title, msg))

          import datetime as dt
          note("B2_KEYS", "; ".join("%s=%d" % (p, len(prov.env_keys(p))) for p in ("nvidia", "groq", "hf")))
          note("B2_CHAIN_ASSISTANTS", " > ".join("%s/%s" % (e["provider"], e["model"]) for e in R.resolve_chain("assistants", dt.datetime.now(dt.timezone.utc))[0]))
          from fastapi.testclient import TestClient
          from integration.chat_mvp.app import app
          c = TestClient(app)
          H = {"X-API-Key": key}

          def call(tag, fn):
              t0 = time.time()
              try:
                  r = fn()
                  body = r.text[:260].replace("\n", " ")
                  note(tag, "%d %.1fs %s" % (r.status_code, time.time() - t0, body))
              except Exception as e:
                  note(tag, "EXC %s" % type(e).__name__)

          call("B2_ROUTE_ASSISTANTS", lambda: c.post("/chat/route", headers=H, json={"group": "assistants", "message": "Reply with the single word OK", "max_tokens": 512}))
          call("B2_OPENAI_ASSISTANTS", lambda: c.post("/v1/router/chat/completions", headers=H, json={"model": "assistants", "messages": [{"role": "user", "content": "Reply with the single word OK"}], "max_tokens": 512}))
          call("B2_OPENAI_MODELS", lambda: c.get("/v1/router/models", headers=H))
          call("B2_SEND_AUTO", lambda: c.post("/chat/send", headers=H, json={"message": "Reply with the single word OK", "provider": "auto"}))
          try:
              st = c.get("/chat/router/status", headers=H).json()
              note("B2_STATUS_GROUPS", "%s | assistants_chain=%s" % (sorted(st["groups"]), [e["model"] for e in st["groups"].get("assistants", {}).get("chain", [])]))
          except Exception as e:
              note("B2_STATUS_GROUPS", "EXC %s" % type(e).__name__)
          chunk, n = "", 0
          for item in RES + [None]:
              if item is None or len(chunk) + len(item) > 3000:
                  if chunk:
                      n += 1
                      print("::notice title=B2_LIVE_%d::%s" % (n, chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))
                  chunk = ""
              if item is not None:
                  chunk += (" || " if chunk else "") + item
          PY
