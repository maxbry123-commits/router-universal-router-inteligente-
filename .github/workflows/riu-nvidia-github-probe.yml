name: RIU NVIDIA and GitHub Probe

# One-shot evidence for: (0) why GH_ACCOUNT_1/2 are rejected, (Paso 1) HF account used for billing, (Paso 2) the 5 NVIDIA keys.
# Values are never printed. Results are annotations (::notice) readable through the check-run API.
# Paso 2 result so far: all 5 keys list 82 models; minimaxai/minimax-m2.7 returns 410 Gone (retired by NVIDIA).
# This version chat-tests every key with a model that IS in the NVIDIA catalog.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo NVIDIA a probar con cada clave'
        default: 'deepseek-ai/deepseek-v4-flash-0731'
  push:
    paths:
      - '.github/workflows/riu-nvidia-github-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        env:
          MODEL: ${{ inputs.model || 'deepseek-ai/deepseek-v4-flash-0731' }}
          N1: ${{ secrets.NVIDIA_API_KEY_1 }}
          N2: ${{ secrets.NVIDIA_API_KEY_2 }}
          N3: ${{ secrets.NVIDIA_API_KEY_3 }}
          N4: ${{ secrets.NVIDIA_API_KEY_4 }}
          N5: ${{ secrets.NVIDIA_API_KEY_5 }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          def note(t, m): print("::notice title=%s::%s" % (t, m))

          def call(method, url, headers, body=None, timeout=90):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers={"User-Agent": "riu-probe", "Content-Type": "application/json", **headers}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  txt = e.read().decode(errors="replace")[:200]
                  try:
                      return e.code, json.loads(txt)
                  except Exception:
                      return e.code, {"raw": txt}
              except Exception as e:
                  return type(e).__name__, {}

          model = os.environ["MODEL"]
          out = []
          for i in range(1, 6):
              tok = os.environ.get("N%d" % i, "")
              if not tok:
                  out.append("N%d=missing" % i); continue
              s, d = call("POST", "https://integrate.api.nvidia.com/v1/chat/completions", {"Authorization": "Bearer " + tok},
                          {"model": model, "messages": [{"role": "user", "content": "Reply with the single word OK"}], "max_tokens": 256})
              if s == 200:
                  ch = (d.get("choices") or [{}])[0]
                  u = d.get("usage") or {}
                  out.append("N%d chat=200 finish=%s reply=%r tokens=%s" % (i, ch.get("finish_reason"), ((ch.get("message") or {}).get("content") or "")[:20].replace("\n", " "), u.get("total_tokens")))
              else:
                  out.append("N%d chat=%s %s" % (i, s, json.dumps(d, ensure_ascii=False)[:100].replace(tok, "***")))
          note("RIU_PROBE_NVIDIA_CHAT", "model=%s | %s" % (model, "; ".join(out)))
          PY
