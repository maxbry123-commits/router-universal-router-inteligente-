name: Keep MCP Space Awake

# El Space del conector (CPU Upgrade, de pago) está fijado en NUNCA DORMIR (sleep time = -1).
# Este workflow solo vigila que siga así, y reinicia el Space únicamente si está en error.
# 2026-09-26: se retira el KEEPER (Job 16 GB) y sus Jobs de espera: ya no hacen falta y gastaban saldo de HF.
# Cada ejecución cancela cualquier KEEPER o Job de espera que siga encendido.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -U huggingface_hub
      - name: Nunca dormir + apagar KEEPER y Jobs de espera
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = "COMAND-CENTER-1/claude-github-mcp-backup"
          rt = api.get_space_runtime(space)
          print(f"Estado: {rt.stage} | hardware: {rt.hardware} | dormir tras: {rt.sleep_time}")
          if rt.sleep_time != -1:
              api.set_space_sleep_time(space, sleep_time=-1)
              print("::notice::Space fijado en NUNCA DORMIR")
          if str(rt.stage).upper() in ("RUNTIME_ERROR", "STOPPED"):
              api.restart_space(space)
              print(f"::warning::Space estaba en {rt.stage}; reiniciado")
          apagados = 0
          for j in api.list_jobs():
              cmd = " ".join(j.command or [])
              if (j.status.stage or "").upper() in ("RUNNING", "STARTING") and ("keeper.py" in cmd or "EN ESPERA LISTO" in cmd):
                  api.cancel_job(job_id=j.id)
                  apagados += 1
                  print(f"::notice::Job apagado: {j.id}")
          print(f"Jobs de keeper/espera apagados: {apagados}")
          PY
