name: RIU Auth Capability Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-auth-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HF_AUTH_TOKEN: ${{ secrets.RIU_HF_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      GH_AUTH_TOKEN: ${{ secrets.RIU_GITHUB_PAT || secrets.GH_TOKEN }}
      CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_1: ${{ secrets.CODEX_AUTH_JSON_ACCOUNT_1 }}
      CODEX_AUTH_2: ${{ secrets.CODEX_AUTH_JSON_ACCOUNT_2 }}
      OPENAI_API_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Secret presence only - never print values
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_AUTH_TOKEN GH_AUTH_TOKEN CLAUDE_AUTH CODEX_AUTH_1 CODEX_AUTH_2 OPENAI_API_KEY_PRESENT ANTHROPIC_API_KEY_PRESENT; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=ABSENT"
            fi
          done

      - name: Verify Hugging Face identity and token role
        if: ${{ env.HF_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19.0,<2'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          me = HfApi(token=os.environ['HF_AUTH_TOKEN']).whoami()
          auth = me.get('auth') or {}
          access = auth.get('accessToken') or {}
          print('HF_IDENTITY=' + str(me.get('name') or me.get('fullname') or 'UNKNOWN'))
          print('HF_TOKEN_ROLE=' + str(access.get('role') or access.get('type') or 'UNKNOWN'))
          print('HF_TOKEN_VALID=PASS')
          PY

      - name: Verify GitHub PAT identity and access to project repositories
        if: ${{ env.GH_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_AUTH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'riu-auth-probe'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)
          me=get('https://api.github.com/user')
          print('GITHUB_IDENTITY=' + str(me.get('login','UNKNOWN')))
          repos=[
            'frontend','agentes','Agentes-motores-Wordflow-YAIWES','osquestador-auditor',
            'Maxbry-AGI','nct-core','TAREA-1','router-universal-router-inteligente-'
          ]
          for repo in repos:
              data=get('https://api.github.com/repos/maxbry123-commits/'+repo)
              p=data.get('permissions') or {}
              print('GITHUB_REPO_ACCESS repo='+repo+' admin='+str(bool(p.get('admin'))).lower()+' push='+str(bool(p.get('push'))).lower()+' pull='+str(bool(p.get('pull'))).lower())
          print('GITHUB_PAT_VALID=PASS')
          PY
