name: swecode-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'router-mvp/SWEN CODE free/apk-movil/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: assembleDebug
        working-directory: router-mvp/SWEN CODE free/apk-movil
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: swecode-agente-apk
          path: router-mvp/SWEN CODE free/apk-movil/app/build/outputs/apk/debug/app-debug.apk
