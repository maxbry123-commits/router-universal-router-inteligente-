name: MCP Webhook Lanzador Unico (una vez)

# Orden del Director 2026-09-27: el webhook del conector relanzaba el Router con su propia receta (cpu-upgrade 32 GB, 6 h,
# sin OmniRoute ni httpx). Ahora el webhook solo dispara el lanzador único (riu-router-job-central.yml, 16 GB de pago).
# Vuelta atrás automática si el conector no responde tras el cambio.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/mcp-webhook-lanzador-unico-once.yml']

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN_1 }}
      MCP_SECRET: ${{ secrets.RIU_ROUTER_API_KEY }}
      SPACE_ID: COMAND-CENTER-1/claude-github-mcp-backup
    steps:
      - run: python -m pip install --quiet huggingface_hub requests
      - run: |
          python - <<'PY'
          import os, time, re, requests
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download
          api = HfApi(token=os.environ["HF_TOKEN"]); space = os.environ["SPACE_ID"]; secret = os.environ["MCP_SECRET"].strip()
          root = Path("/tmp/sp"); snapshot_download(repo_id=space, repo_type="space", token=os.environ["HF_TOKEN"], local_dir=str(root))
          p = root / "app.py"; old = p.read_text(encoding="utf-8")
          start = old.index("def _launch_router_job_sync()")
          end = old.index("try:\n    from starlette.requests import Request as _Request")
          new_block = '''async def _relaunch_and_record() -> None:
              """Dispara el lanzador UNICO del Router (16 GB de pago, OmniRoute dentro). El propio Router escribe LIVE_URL."""
              if _RELAUNCHING["busy"]:
                  return
              _RELAUNCHING["busy"] = True
              try:
                  await _github_request("POST", "/repos/maxbry123-commits/router-universal-router-inteligente-/actions/workflows/riu-router-job-central.yml/dispatches",
                                        json_body={"ref": "main", "inputs": {"flavor": "cpu-basic", "lifetime": "48h"}})
              finally:
                  _RELAUNCHING["busy"] = False


          '''
          new_block = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in new_block.splitlines()) + "\n"
          new = old[:start] + new_block + old[end:]
          compile(new, "app.py", "exec")
          def up(txt, msg):
              p.write_text(txt, encoding="utf-8")
              api.upload_file(path_or_fileobj=str(p), path_in_repo="app.py", repo_id=space, repo_type="space", commit_message=msg)
          def ok(minutes):
              base = "https://comand-center-1-claude-github-mcp-backup.hf.space"; end_t = time.time() + minutes * 60
              while time.time() < end_t:
                  try:
                      r = requests.post(f"{base}/{secret}/mcp", timeout=15, headers={"Accept": "application/json, text/event-stream", "Content-Type": "application/json"},
                                        json={"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "prueba", "version": "1"}}})
                      if r.status_code == 200: return True
                  except Exception: pass
                  time.sleep(10)
              return False
          up(new, "webhook: dispara el lanzador unico del Router (16 GB) en vez de su propia receta")
          time.sleep(40)
          if ok(8):
              print("::notice::WEBHOOK_LANZADOR_UNICO=OK")
          else:
              up(old, "revert: webhook anterior (el conector no respondio)"); raise SystemExit("::error::revertido")
          PY
