name: Chat Router Space Deploy

# Crea o actualiza el Space del chat (cpu-basic 16 GB, se despierta al abrirlo) y le pone las claves como secretos del Space.
# Se ejecuta solo cuando cambia algo en "chat router/space/" o este archivo.

on:
  push:
    branches: [main]
    paths:
      - 'chat router/space/**'
      - '.github/workflows/chat-router-space-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -U huggingface_hub
      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          RIU_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
          GH_TOKEN_FOR_SPACE: ${{ secrets.RIU_GITHUB_PAT_FULL_ACCESO || secrets.GH_JOB_PUSH_TOKEN }}
        run: |
          python - <<'PY'
          import os, pathlib
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          owner = api.whoami()["name"]
          space = f"{owner}/chat-router"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          readme = pathlib.Path("chat router/space/README.md")
          readme.write_text("---\ntitle: Chat Router YAIWES\nemoji: 🛰️\ncolorFrom: blue\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\nChat del Router YAIWES.\n", encoding="utf-8")
          for k, v in (("HF_TOKEN", os.environ["HF_TOKEN"]), ("RIU_ROUTER_API_KEY", os.environ.get("RIU_KEY", "")), ("GH_TOKEN", os.environ.get("GH_TOKEN_FOR_SPACE", ""))):
              if v:
                  api.add_space_secret(space, k, v)
              else:
                  print(f"::warning::falta el secreto {k}")
          api.upload_folder(folder_path="chat router/space", repo_id=space, repo_type="space", commit_message="deploy chat router")
          print(f"::notice title=CHAT_URL::https://huggingface.co/spaces/{space}")
          print(f"::notice title=CHAT_DIRECT::https://{space.replace('/', '-').lower()}.hf.space")
          PY
