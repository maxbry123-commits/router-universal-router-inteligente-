name: Chat Router Space Deploy

# Crea o actualiza el Space del chat (cpu-basic 16 GB, se despierta al abrirlo) y le pone las claves como secretos del Space.
# Prueba primero HF_TOKEN_1 (la cuenta que ya lanza el Router); si una cuenta falla, prueba la siguiente y deja visible cuál usó.

on:
  push:
    branches: [main]
    paths:
      - 'chat router/space/**'
      - '.github/workflows/chat-router-space-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chat router/space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -U huggingface_hub
      - name: Deploy Space
        env:
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_MAXBRY123: ${{ secrets.HF_TOKEN_MAXBRY123 }}
          RIU_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
          GH_A: ${{ secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          GH_B: ${{ secrets.GH_JOB_PUSH_TOKEN }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          from huggingface_hub import HfApi
          pathlib.Path("chat router/space/README.md").write_text("---\ntitle: Chat Router YAIWES\nemoji: 🛰️\ncolorFrom: blue\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\nChat del Router YAIWES.\n", encoding="utf-8")
          gh = os.environ.get("GH_A") or os.environ.get("GH_B") or ""
          done = False
          for name in ("HF_TOKEN_1", "HF_WRITE_TOKEN", "HF_TOKEN_MAXBRY123"):
              t = os.environ.get(name, "")
              if not t:
                  print(f"::notice::{name} vacío"); continue
              try:
                  api = HfApi(token=t); owner = api.whoami()["name"]
                  space = f"{owner}/chat-router"
                  print(f"::notice::probando {name} en la cuenta {owner}")
                  api.create_repo(space, repo_type="space", space_sdk="docker", space_hardware="cpu-basic", exist_ok=True, private=False)
                  for k, v in (("HF_TOKEN", t), ("RIU_ROUTER_API_KEY", os.environ.get("RIU_KEY", "")), ("GH_TOKEN", gh)):
                      if v: api.add_space_secret(space, k, v)
                      else: print(f"::warning::falta el secreto {k}")
                  api.upload_folder(folder_path="chat router/space", repo_id=space, repo_type="space", commit_message="deploy chat router")
                  print(f"::notice title=CHAT_URL::https://{space.replace('/', '-').lower()}.hf.space  (cuenta {owner}, clave {name})")
                  done = True
                  break
              except Exception as e:
                  print(f"::warning::{name}: {type(e).__name__}: {str(e)[:250]}")
          if not done:
              print("::error::ninguna cuenta de HF pudo crear el Space"); sys.exit(1)
          PY
