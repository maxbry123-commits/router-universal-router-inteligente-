name: RIU GitHub Credential Evidence Probe

on:
  push:
    paths:
      - '.github/workflows/riu-github-credential-evidence-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_ACCOUNT_1: ${{ secrets.GH_ACCOUNT_1 }}
      GH_ACCOUNT_2: ${{ secrets.GH_ACCOUNT_2 }}
      GH_ACCOUNT_3: ${{ secrets.GH_ACCOUNT_3 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub credentials without exposing tokens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime

          out = {
              "schema": "riu.github-credential-probe/v1",
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": "maxbry123-commits/router-universal-router-inteligente-",
              "results": []
          }

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "riu-github-credential-evidence-probe"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception:
                  return 0, {}

          for name in ("GH_ACCOUNT_1", "GH_ACCOUNT_2", "GH_ACCOUNT_3"):
              token = os.environ.get(name, "")
              item = {
                  "secret": name,
                  "present": bool(token),
                  "token_value_exposed": False
              }
              if not token:
                  item["valid"] = False
                  item["status"] = "MISSING"
                  out["results"].append(item)
                  continue

              user_http, user = get_json("https://api.github.com/user", token)
              item["user_http"] = user_http
              item["login"] = user.get("login")
              item["valid"] = user_http == 200 and bool(user.get("login"))

              repo_http, repo = get_json(
                  "https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-",
                  token
              )
              perms = repo.get("permissions") or {}
              item["router_repo_http"] = repo_http
              item["router_access"] = repo_http == 200
              item["router_push"] = bool(perms.get("push"))
              item["router_admin"] = bool(perms.get("admin"))
              item["status"] = "PASS" if item["valid"] else "FAIL"
              out["results"].append(item)

          with open(".evidence/riu-github-credential-probe-latest.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
              f.write("\n")

          for item in out["results"]:
              print(
                  f"{item['secret']} status={item['status']} "
                  f"login={item.get('login')} user_http={item.get('user_http')} "
                  f"router_http={item.get('router_repo_http')} "
                  f"push={item.get('router_push')} admin={item.get('router_admin')}"
              )
          PY

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .evidence/riu-github-credential-probe-latest.json
          git commit -m "test: record sanitized GitHub credential probe evidence" || exit 0
          git push
