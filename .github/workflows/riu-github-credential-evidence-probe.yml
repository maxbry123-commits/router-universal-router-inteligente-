name: RIU GitHub Credential Evidence Probe

on:
  push:
    paths:
      - '.github/workflows/riu-github-credential-evidence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_ACCOUNT_1: ${{ secrets.GH_ACCOUNT_1 }}
      GH_ACCOUNT_2: ${{ secrets.GH_ACCOUNT_2 }}
      GH_ACCOUNT_3: ${{ secrets.GH_ACCOUNT_3 }}
    steps:
      - name: Validate GitHub credentials without exposing tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "riu-github-credential-evidence-probe"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception:
                  return 0, {}

          for name in ("GH_ACCOUNT_1", "GH_ACCOUNT_2", "GH_ACCOUNT_3"):
              token = os.environ.get(name, "")
              if not token:
                  print(f"{name} status=MISSING login=None user_http=None router_http=None push=None admin=None")
                  continue

              user_http, user = get_json("https://api.github.com/user", token)
              login = user.get("login")
              valid = user_http == 200 and bool(login)

              repo_http, repo = get_json(
                  "https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-",
                  token
              )
              perms = repo.get("permissions") or {}
              status = "PASS" if valid else "FAIL"
              print(
                  f"{name} status={status} login={login} user_http={user_http} "
                  f"router_http={repo_http} push={bool(perms.get('push'))} "
                  f"admin={bool(perms.get('admin'))}"
              )
          PY
