name: RIU Secret Scan

# S0 del plan RIU-0108: falla si aparece una credencial en texto plano en el repo.
# No imprime nunca el valor encontrado: solo archivo, línea y nombre del patrón.
# Se excluye el pool de componentes donantes (código de terceros).
# Una línea con el marcador  secret-scan:allow  se ignora (para tokens falsos de tests).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/router inteligente universal/Componente open soure router inteligente universal/
          sparse-checkout-cone-mode: false

      - name: Scan tracked text files
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          PATTERNS = {
              "HUGGINGFACE_TOKEN": r"\bhf_[A-Za-z0-9]{30,}\b",
              "GITHUB_PAT_CLASSIC": r"\bghp_[A-Za-z0-9]{30,}\b",
              "GITHUB_PAT_FINE_GRAINED": r"\bgithub_pat_[A-Za-z0-9_]{40,}\b",
              "OPENAI_STYLE_KEY": r"\bsk-[A-Za-z0-9_-]{32,}\b",
              "NVIDIA_KEY": r"\bnvapi-[A-Za-z0-9_-]{30,}\b",
              "CEREBRAS_KEY": r"\bcsk-[A-Za-z0-9]{30,}\b",
              "GROQ_KEY": r"\bgsk_[A-Za-z0-9]{30,}\b",
          }
          COMPILED = {name: re.compile(rx) for name, rx in PATTERNS.items()}
          ALLOW = "secret-scan:allow"

          def scan_text(text):
              hits = []
              for lineno, line in enumerate(text.splitlines(), 1):
                  if ALLOW in line:
                      continue
                  for name, rx in COMPILED.items():
                      if rx.search(line):
                          hits.append((lineno, name))
              return hits

          # Positive self-test: tokens are built at runtime so this file never contains one.
          fake = {
              "hf": "hf_" + "A" * 34,
              "gh": "ghp_" + "B" * 36,
              "sk": "sk-" + "C" * 40,
          }
          for label, token in fake.items():
              assert scan_text("x = " + token), "self-test failed for " + label
          assert not scan_text("x = " + fake["hf"] + "  # " + ALLOW), "allow marker failed"
          assert not scan_text("hf_ and ghp_ are prefixes, not tokens"), "false positive"
          print("::notice title=RIU_SECRET_SCAN_SELFTEST::PASS")

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "replace").split("\0")
          findings, scanned = [], 0
          for path in files:
              if not path or not os.path.isfile(path):
                  continue
              try:
                  if os.path.getsize(path) > 2_000_000:
                      continue
                  raw = open(path, "rb").read()
              except OSError:
                  continue
              if b"\0" in raw[:4096]:
                  continue
              scanned += 1
              for lineno, name in scan_text(raw.decode("utf-8", "replace")):
                  findings.append((path, lineno, name))

          print("::notice title=RIU_SECRET_SCAN::scanned=%d findings=%d" % (scanned, len(findings)))
          for path, lineno, name in findings[:40]:
              print("::error file=%s,line=%d,title=RIU_SECRET_SCAN::%s (valor no impreso)" % (path, lineno, name))
          sys.exit(1 if findings else 0)
          PY
