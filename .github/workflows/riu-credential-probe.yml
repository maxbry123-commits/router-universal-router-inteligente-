name: RIU Credential Probe

# Reports WHO each stored credential belongs to and WHAT it can do (login, role, scopes). Never prints values.
# The verdicts are what decide which token can deploy the chat Space (write) and which GitHub accounts the chat can switch between.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe credentials
        env:
          SELFTEST: ${{ secrets.RIU_SECRET_SELFTEST }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          HF_TOKEN_1B: ${{ secrets.HF_TOKEN_1B }}
          HF_TOKEN_MAXBRY123: ${{ secrets.HF_TOKEN_MAXBRY123 }}
          GH_ACCOUNT_1: ${{ secrets.GH_ACCOUNT_1 }}
          GH_ACCOUNT_2: ${{ secrets.GH_ACCOUNT_2 }}
          GH_ACCOUNT_3: ${{ secrets.GH_ACCOUNT_3 }}
          GH_CLASSIC_FULL_1: ${{ secrets.GH_CLASSIC_FULL_1 }}
          GH_CLASSIC_FULL_2: ${{ secrets.GH_CLASSIC_FULL_2 }}
          GH_PAT_FINE_FULL: ${{ secrets.GH_PAT_FINE_FULL }}
          RIU_GITHUB_PAT_FULL_ACCESO: ${{ secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request

          def h(name):
              v = os.environ.get(name, "")
              return hashlib.sha256(v.encode()).hexdigest()[:12] if v else ""

          def note(t, m): print("::notice title=%s::%s" % (t, m))
          def get(url, tok, hdr=None):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok, "User-Agent": "riu-probe", **(hdr or {})})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.load(r), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, {}, dict(e.headers)
              except Exception as e:
                  return type(e).__name__, {}, {}

          note("RIU_PROBE_SELFTEST", "sha256_prefix=%s expected=8971d2fe9bea match=%s" % (h("SELFTEST"), h("SELFTEST") == "8971d2fe9bea"))
          out = []
          for n in ("HF_TOKEN_1", "HF_TOKEN_1B", "HF_TOKEN_MAXBRY123"):
              tok = os.environ.get(n, "")
              if not tok:
                  out.append("%s=MISSING" % n); continue
              s, d, _ = get("https://huggingface.co/api/whoami-v2", tok)
              at = ((d.get("auth") or {}).get("accessToken") or {})
              fg = at.get("fineGrained") or {}
              scoped = ["%s:%s" % (x.get("entity", {}).get("type"), "+".join(x.get("permissions", []))) for x in fg.get("scoped", [])]
              out.append("%s http=%s name=%s role=%s global=%s scoped=%s hash=%s" % (n, s, d.get("name"), at.get("role"), ",".join(fg.get("global", [])), "|".join(scoped)[:160], h(n)))
          note("RIU_PROBE_HF", "; ".join(out))
          out = []
          for n in ("GH_ACCOUNT_1", "GH_ACCOUNT_2", "GH_ACCOUNT_3", "GH_CLASSIC_FULL_1", "GH_CLASSIC_FULL_2", "GH_PAT_FINE_FULL", "RIU_GITHUB_PAT_FULL_ACCESO"):
              tok = os.environ.get(n, "")
              if not tok:
                  out.append("%s=MISSING" % n); continue
              s, d, hd = get("https://api.github.com/user", tok)
              s2, d2, _ = get("https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-", tok)
              perms = (d2.get("permissions") or {})
              out.append("%s http=%s login=%s scopes=[%s] repo_http=%s push=%s admin=%s hash=%s" % (
                  n, s, d.get("login"), hd.get("X-OAuth-Scopes", hd.get("x-oauth-scopes", "")), s2, perms.get("push"), perms.get("admin"), h(n)))
          note("RIU_PROBE_GITHUB", "; ".join(out))
          note("RIU_PROBE_PROVIDERS", "; ".join("%s=%s" % (n, "set" if os.environ.get(n) else "missing") for n in ("NVIDIA_API_KEY_1", "GROQ_API_KEY_1", "DEEPSEEK_API_KEY", "MOONSHOT_API_KEY", "MINIMAX_API_KEY")))
          PY
