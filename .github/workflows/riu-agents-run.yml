name: RIU Agents Run

# The 4 Yaiwes agents, each on its own and in parallel (PocketFlow: agents 1 and 3; SmolAgents: agents 2 and 4).
# Claude (the brain) edits an agent's workflow.dag.yaml (the DSL DAG) and dispatches this workflow; the agents execute, note their
# progress in their own crazy_wall.state.json / HANDOFF.md / results/, and the results are committed back. Keys: only the encrypted
# bank (agent-microkernel/runtime-bank.db.gz.b64); the single secret is its passphrase.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/verifier/
            router inteligente universal/agent-microkernel/
            router inteligente universal/agents-yaiwes/
            Chat Mvp/secret_bank/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pocketflow smolagents openai fastapi pydantic huggingface_hub pyyaml cryptography

      - name: Run the 4 agents in parallel
        env:
          RIU_BANK_PASSPHRASE: ${{ secrets.RIU_RUNTIME_BANK_PASSPHRASE }}
          RIU_CHAT_ALLOW_PROVIDER_LIVE: '1'
        shell: bash
        run: |
          set +e
          cd "router inteligente universal"
          python agents-yaiwes/pocketflow_agent.py agents-yaiwes/agent-1-chat-hf > /tmp/a1.log 2>&1 &
          python agents-yaiwes/smol_agent.py agents-yaiwes/agent-2-chat-hf-smol > /tmp/a2.log 2>&1 &
          python agents-yaiwes/pocketflow_agent.py agents-yaiwes/agent-3-router > /tmp/a3.log 2>&1 &
          python agents-yaiwes/smol_agent.py agents-yaiwes/agent-4-router-smol > /tmp/a4.log 2>&1 &
          wait
          for i in 1 2 3 4; do
            grep -h '^::notice' /tmp/a$i.log || true
            grep -E '^(Traceback|[A-Za-z]*(Error|Exception))' /tmp/a$i.log | head -3 | while IFS= read -r l; do echo "::warning title=RIU_AGENT_${i}_ERROR::${l}"; done
          done
          exit 0

      - name: Commit results (Crazy Wall, HANDOFF, deliverables)
        if: always()
        shell: bash
        run: |
          git config user.name "riu-agents"
          git config user.email "riu-agents@users.noreply.github.com"
          git add "router inteligente universal/agents-yaiwes" || true
          git commit -m "agentes: resultados de la ronda (Crazy Wall + HANDOFF + entregables verificados)" || { echo "nada que confirmar"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && { echo "::notice title=RIU_AGENTS_COMMIT::pushed"; exit 0; }
            sleep 4
          done
          echo "::warning title=RIU_AGENTS_COMMIT::push failed after retries"
