name: RIU Agents Run

# The Yaiwes SWARM: every folder agents-yaiwes/agent-*/ that has a chain.yaml (the DSL DAG) runs on its own and in parallel with its chain of steps.
# Add an agent = add a folder with a chain.yaml. `only` runs a single agent (priority runs, e.g. the auditor) in its own concurrency group.
# Frameworks: PocketFlow and SmolAgents (auditor = SmolAgents copy). Claude (the brain) only edits chains and agents-yaiwes/ROUTE.json (code -> MiniMax M3,
# jobs -> DeepSeek V4 Flash) and dispatches this workflow; the agents execute, note their progress in their own crazy_wall.state.json / HANDOFF.md /
# steps/<id>/results/, and the results are committed back. Steps already CLOSED are skipped. Keys: only the encrypted bank plus HF_TOKEN, needed
# 2026-09-22 so an agent step's own Sheriff check can really launch and verify a model Job on the Director's HF account end-to-end, with no manual
# step by Claude in between (Director's explicit order). Time budget: 90 min per job, 90 min per agent process.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this agent folder (e.g. agent-5-auditor). Empty = the whole swarm.'
        default: ''

permissions:
  contents: write

concurrency:
  group: riu-agents-run-${{ inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/verifier/
            router inteligente universal/agent-microkernel/
            router inteligente universal/agents-yaiwes/
            Chat Mvp/secret_bank/
            Claude notas/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pocketflow smolagents openai fastapi httpx pydantic huggingface_hub pyyaml cryptography requests

      - name: Build the auditor's evidence packs (deterministic)
        run: python "router inteligente universal/agents-yaiwes/common/audit_pack.py"

      - name: Run the swarm (every agent-* with a chain.yaml, in parallel)
        env:
          RIU_BANK_PASSPHRASE: ${{ secrets.RIU_RUNTIME_BANK_PASSPHRASE }}
          RIU_CHAT_ALLOW_PROVIDER_LIVE: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          ONLY: ${{ inputs.only }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        shell: bash
        run: |
          set +e
          cd "router inteligente universal"
          for d in agents-yaiwes/agent-*/; do
            d="${d%/}"
            if [ -f "$d/chain.yaml" ] && { [ -z "$ONLY" ] || [ "$(basename "$d")" = "$ONLY" ]; }; then
              timeout 5400 python agents-yaiwes/chain.py "$d" > "/tmp/$(basename "$d").log" 2>&1 &
            fi
          done
          wait
          for f in /tmp/agent-*.log; do
            grep -h '^::notice title=RIU_CHAIN' "$f" || echo "::warning title=RIU_AGENT_LOG_$(basename "$f" .log)::$(tail -n 14 "$f" | tr '\n' '|' | cut -c1-700)"
          done
          exit 0

      - name: Commit results (Crazy Wall, HANDOFF, deliverables, audit)
        if: always()
        shell: bash
        run: |
          git config user.name "riu-agents"
          git config user.email "riu-agents@users.noreply.github.com"
          find "router inteligente universal/agents-yaiwes" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          # Restaurar GOLDEN agent-10 (impide commit de .py regenerado roto)
          GOLDEN_A10="router inteligente universal/agents-yaiwes/agent-10-model-install/GOLDEN/install_launch_test.py"
          DEST_A10="router inteligente universal/agents-yaiwes/agent-10-model-install/steps/install_launch_test/results/install_launch_test.py"
          if [ -f "$GOLDEN_A10" ]; then cp -f "$GOLDEN_A10" "$DEST_A10"; fi
          # Nunca commitear pesos HF (bloqueo #31: Qwen GGUF 610MB)
          find "router inteligente universal/agents-yaiwes" -path '*/results/models/*' -type f -delete 2>/dev/null || true
          find "router inteligente universal/agents-yaiwes" -name '*.gguf' -size +10M -delete 2>/dev/null || true
          git add "router inteligente universal/agents-yaiwes" || true
          git commit -m "agentes: resultados de la ronda (Crazy Wall + HANDOFF + entregables verificados + auditoría)" || { echo "nada que confirmar"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && { echo "::notice title=RIU_AGENTS_COMMIT::pushed"; exit 0; }
            sleep 5
          done
          echo "::warning title=RIU_AGENTS_COMMIT::push failed after retries"
