name: RIU HF Job Models

# Runs the availability test of DeepSeek V4, Kimi K3, Kimi K2.6, GLM and MiniMax INSIDE a Hugging Face Job on the
# cpu-upgrade processor (8 vCPU / 32 GB RAM). The job reads the HF router catalog, tests every matching model that is
# listed, and prints RESULT lines; this workflow collects them into one annotation (RIU_HF_JOB).
# Values are never printed. Token: HF_TOKEN_1 (submits the job) and passed to the job as a job secret.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-hf-job-models.yml'

permissions:
  contents: read

jobs:
  hfjob:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - name: Submit the job to the HF processor and collect the result
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: |
          python - <<'PY'
          import base64, os, re, time
          from huggingface_hub import HfApi

          JOB_SCRIPT = r'''
          import json, os, re, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          tok = os.environ["HF_TOKEN"]
          print("RESULT|host|cpus=%s|mem_gb=%.1f" % (os.cpu_count(), int([l for l in open("/proc/meminfo") if l.startswith("MemTotal")][0].split()[1]) / 1048576))
          def http(method, url, body=None, timeout=150):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "User-Agent": "riu-hfjob"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception as e:
                  return type(e).__name__, {}
          s, cat = http("GET", "https://router.huggingface.co/v1/models")
          ids = sorted(d["id"] for d in cat.get("data", [])) if s == 200 else []
          rx = re.compile(r"deepseek-v4|kimi-k3|kimi-k2\.6|glm-5|minimax", re.I)
          want = [i for i in ids if rx.search(i) and "vision" not in i.lower() and "fp8" not in i.lower() and "bf16" not in i.lower() and "9b" not in i.lower() and "4v" not in i.lower()]
          print("RESULT|catalog|http=%s|total=%d|to_test=%d" % (s, len(ids), len(want)))
          def one(m):
              t0 = time.time()
              s, d = http("POST", "https://router.huggingface.co/v1/chat/completions", {"model": m, "messages": [{"role": "user", "content": "Reply with the single word OK"}], "max_tokens": 128})
              txt = ((d.get("choices") or [{}])[0].get("message") or {}).get("content") or ""
              return m, s, time.time() - t0, (d.get("usage") or {}).get("total_tokens"), txt.strip()[:12].replace("\n", " ")
          with ThreadPoolExecutor(max_workers=6) as ex:
              for m, s, dt, tk, txt in ex.map(one, want):
                  print("RESULT|model|%s|http=%s|%.0fs|tokens=%s|reply=%r" % (m, s, dt, tk, txt))
          print("RESULT|done")
          '''
          script = "\n".join(l[10:] if l.startswith("          ") else l for l in JOB_SCRIPT.splitlines())
          b64 = base64.b64encode(script.encode()).decode()
          api = HfApi(token=os.environ["HF_TOKEN"])
          job = api.run_job(image="python:3.12", command=["python", "-c", "import base64;exec(base64.b64decode('%s').decode())" % b64],
                            flavor="cpu-upgrade", timeout="20m", secrets={"HF_TOKEN": os.environ["HF_TOKEN"]}, namespace="COMAND-CENTER-1")
          print("::notice title=RIU_HF_JOB_SUBMIT::job=%s flavor=cpu-upgrade" % job.id)
          stage = ""
          for _ in range(90):
              time.sleep(10)
              st = api.inspect_job(job_id=job.id, namespace="COMAND-CENTER-1").status
              stage = str(getattr(st, "stage", st))
              if any(x in stage.upper() for x in ("COMPLETED", "ERROR", "CANCELED", "DELETED")):
                  break
          lines = []
          try:
              for l in api.fetch_job_logs(job_id=job.id, namespace="COMAND-CENTER-1"):
                  l = str(l).strip()
                  if l.startswith("RESULT|"):
                      lines.append(l[7:])
          except Exception as e:
              lines.append("logs_error:" + type(e).__name__)
          print("::notice title=RIU_HF_JOB::stage=%s | %s" % (stage, " || ".join(lines)))
          PY
