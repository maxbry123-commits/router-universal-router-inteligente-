name: RIU Llama Bench

# Real tokens/second of the small local models with llama.cpp on a CPU runner (4 vCPU / 16 GB, a proxy of the HF CPU nodes):
# llama-bench (pp/tg) and llama-server with parallel slots (1, 4, 8 simultaneous requests) with the accelerators. See common/llama_bench.py.
# Results are printed as annotations (RIU_BENCH_*).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/agents-yaiwes/common/llama_bench.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub requests
      - name: Bench
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: python "router inteligente universal/agents-yaiwes/common/llama_bench.py"
