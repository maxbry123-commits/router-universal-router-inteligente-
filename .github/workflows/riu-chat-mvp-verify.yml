name: RIU Chat MVP Verify

# Real-runner evidence for the chat MVP (providers, agents, storage, documents, GitHub accounts),
# the selector models and the HF router hot-path.
# Results are emitted as aggregated annotations (::notice / ::warning), readable through the check-run API.
# No secret value is ever printed; secrets are only injected into the env of the steps that need them.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-chat-mvp-verify.yml'
      - 'router inteligente universal/integration/huggingface/router_hot_path.py'
      - 'router inteligente universal/tests/test_hf_router_hot_path.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/tests/
            router inteligente universal/verifier/
            CLAUDE.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic uvicorn huggingface_hub

      - name: Run chat MVP, auth and Hugging Face tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider \
            "router inteligente universal/tests/test_chat_mvp.py" \
            "router inteligente universal/tests/test_chat_catalog_patterns.py" \
            "router inteligente universal/tests/test_chat_gateway.py" \
            "router inteligente universal/tests/test_chat_mvp_pure.py" \
            "router inteligente universal/tests/test_chat_mvp_app.py" \
            "router inteligente universal/tests/test_keystore_auth.py" \
            "router inteligente universal/tests/test_hf_scheduler.py" \
            "router inteligente universal/tests/test_huggingface_openai_chat_registry.py" \
            "router inteligente universal/tests/test_hf_router_hot_path.py" \
            "router inteligente universal/tests/test_identity_pool.py" 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          last=$(tail -n 1 /tmp/pytest.txt | tr -d '\r')
          echo "::notice title=RIU_TESTS::exit=${code} | ${last}"
          grep -E '^(FAILED|ERROR)' /tmp/pytest.txt | head -8 | while IFS= read -r line; do echo "::warning title=RIU_TEST_FAIL::${line}"; done
          exit "$code"

      - name: HF token capability probe (role and scopes only, no values)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          tok = os.environ.get("HF_TOKEN", "")
          if not tok:
              print("::warning title=RIU_HF_CAPS::GAP_SECRET_MISSING")
              raise SystemExit(0)
          req = urllib.request.Request("https://huggingface.co/api/whoami-v2", headers={"Authorization": "Bearer " + tok})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
          except Exception as e:
              print("::warning title=RIU_HF_CAPS::FAIL " + type(e).__name__)
              raise SystemExit(0)
          at = (d.get("auth") or {}).get("accessToken") or {}
          fg = at.get("fineGrained") or {}
          print("::notice title=RIU_HF_CAPS::account=%s type=%s role=%s global=%s scoped=%d" % (d.get("name"), d.get("type"), at.get("role"), ",".join(fg.get("global", [])), len(fg.get("scoped", []))))
          PY

      - name: End-to-end through the gateway (API key -> Enchufe -> RedUniversal -> HF)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        run: |
          cd "router inteligente universal"
          python - <<'PY'
          import json, os, secrets, sys
          key = "ci-" + secrets.token_hex(8)
          os.environ["RIU_AGENT_API_KEYS"] = json.dumps({key: "ci-agent"})
          os.environ["RIU_CHAT_ALLOW_PROVIDER_LIVE"] = "1"
          sys.path.insert(0, ".")
          from fastapi.testclient import TestClient
          from integration.huggingface import fastapi_gateway as gw
          client = TestClient(gw.app)
          rows = client.get("/chat/models").json()["models"]
          sel = ["%s|%s|%s" % (r["model_id"], r["state"], "sel" if r["selectable"] else "no") for r in rows]
          print("::notice title=RIU_SELECTOR::" + "; ".join(sel))
          out = []
          for r in rows:
              mid = r["model_id"]
              if not mid or not r["selectable"]:
                  continue
              try:
                  resp = client.post("/v1/chat/completions", headers={"X-API-Key": key},
                                     json={"model": mid, "messages": [{"role": "user", "content": "Reply with the single word OK"}], "max_tokens": 256})
                  body = resp.json()
                  if resp.status_code == 200:
                      ch = body["choices"][0]
                      out.append("%s 200 len=%d finish=%s cert=%s" % (mid, len(ch["message"].get("content") or ""), ch["finish_reason"], body["certified"]))
                  else:
                      out.append("%s %d %s" % (mid, resp.status_code, str(body.get("detail", ""))[:80].replace("\n", " ")))
              except Exception as e:
                  out.append("%s EXC %s" % (mid, type(e).__name__))
          print("::notice title=RIU_E2E::" + "; ".join(out))
          PY

      - name: Chat MVP end-to-end with real providers (through the Router hot path)
        if: always()
        env:
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GITHUB_TOKEN_1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN_2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "router inteligente universal"
          python - <<'PY'
          import base64, json, os, secrets, sys, tempfile
          key = "ci-" + secrets.token_hex(8)
          os.environ["RIU_AGENT_API_KEYS"] = json.dumps({key: "ci-agent"})
          os.environ["RIU_CHAT_ALLOW_PROVIDER_LIVE"] = "1"
          os.environ["RIU_DATA_DIR"] = tempfile.mkdtemp()
          os.environ["RIU_GITHUB_ACCOUNTS"] = json.dumps({"ci-a": "GITHUB_TOKEN_1", "ci-b": "GITHUB_TOKEN_2"})
          sys.path.insert(0, ".")
          from fastapi.testclient import TestClient
          from integration.chat_mvp.app import app
          c = TestClient(app)
          H = {"X-API-Key": key}
          out = []

          def note(title, msg):
              print("::notice title=%s::%s" % (title, msg))

          def send(tag, **body):
              body.setdefault("max_tokens", 512)
              try:
                  r = c.post("/chat/send", headers=H, json=body)
                  j = r.json()
                  if r.status_code == 200:
                      return "%s 200 len=%d finish=%s cert=%s" % (tag, len(j["reply"]), j["finish_reason"], j["certified"]), j
                  return "%s %d %s" % (tag, r.status_code, str(j.get("detail", ""))[:90].replace("\n", " ")), j
              except Exception as e:
                  return "%s EXC %s" % (tag, type(e).__name__), {}

          prov = c.get("/chat/providers").json()["providers"]
          note("RIU_CHAT_PROVIDERS", "; ".join("%s=%s" % (p["id"], "key" if p["configured"] else "nokey") for p in prov))
          ok = "Reply with the single word OK"
          for mid in ("moonshotai/Kimi-K3", "deepseek-ai/DeepSeek-V4-Flash", "deepseek-ai/DeepSeek-V4-Pro", "MiniMaxAI/MiniMax-M3"):
              out.append(send("hf:" + mid.split("/")[1], provider="hf", model=mid, message=ok)[0])
          for pid in ("cerebras", "nvidia", "groq"):
              r = c.get("/chat/providers/%s/models" % pid, headers=H)
              if r.status_code != 200:
                  out.append("%s models %d %s" % (pid, r.status_code, str(r.json().get("detail", ""))[:60]))
                  continue
              ms = r.json()["models"]
              sug = [m["model_id"] for m in ms if m.get("suggested")]
              pick = (sug or [m["model_id"] for m in ms])[0]
              out.append("%s catalog=%d suggested=%s" % (pid, len(ms), ",".join(sug[:4])))
              out.append(send("%s:%s" % (pid, pick), provider=pid, model=pick, message=ok)[0])
          note("RIU_CHAT_E2E_MODELS", "; ".join(out))

          flow = []
          doc = c.post("/chat/documents", headers=H, json={"name": "secreto.txt", "mime": "text/plain",
                       "data_b64": base64.b64encode("La palabra secreta del proyecto es zafiro.".encode()).decode()}).json()["document"]
          tag, j = send("doc", provider="hf", model="deepseek-ai/DeepSeek-V4-Flash", doc_ids=[doc["id"]],
                        message="Según el documento adjunto, ¿cuál es la palabra secreta? Responde solo la palabra.")
          flow.append(tag + " contains_zafiro=%s" % ("zafiro" in (j.get("reply") or "").lower()))
          tag, j = send("agent", provider="hf", model="deepseek-ai/DeepSeek-V4-Flash", mode="agent", agent_id="seals-team-yaiwes-001",
                        message="En una frase, ¿cuál es tu rol?")
          flow.append(tag + " agent=%s" % j.get("agent_id"))
          t1, a = send("cache1", provider="hf", model="moonshotai/Kimi-K3", message=ok, cache=True)
          t2, b = send("cache2", provider="hf", model="moonshotai/Kimi-K3", message=ok, cache=True)
          flow.append("cache first=%s second=%s" % (a.get("cached"), b.get("cached")))
          conv = a.get("conversation_id")
          if conv:
              hist = c.get("/chat/conversations/" + conv, headers=H).json()
              flow.append("history_msgs=%d" % len(hist.get("messages", [])))
          accs = c.get("/chat/github/accounts", headers=H).json()["accounts"]
          flow.append("gh_accounts=%s" % ",".join(x["account"] for x in accs))
          last = {}
          for acc in ("ci-a", "ci-b"):
              r = c.get("/chat/github/file", headers=H, params={"account": acc, "repo": "maxbry123-commits/router-universal-router-inteligente-", "path": "CLAUDE.md", "attach": "true"})
              flow.append("gh_file[%s]=%d" % (acc, r.status_code))
              last = r.json()
          if last.get("document"):
              tag, j = send("ghdoc", provider="hf", model="deepseek-ai/DeepSeek-V4-Flash", doc_ids=[last["document"]["id"]],
                            message="Resume el documento adjunto en 8 palabras.")
              flow.append(tag)
          st = c.get("/chat/storage", headers=H).json()
          flow.append("storage msgs=%s graph_edges=%s cache_hits=%s docs=%s" % (
              st["sql"]["messages"], st["graph"]["edges"], st["cache"]["hits"], st["documents"]["count"]))
          note("RIU_CHAT_E2E_FLOW", "; ".join(flow))
          PY
