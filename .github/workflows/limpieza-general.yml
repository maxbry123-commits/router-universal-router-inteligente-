      - name: Fase A - borrar y mover (todo menos workflows)
        run: |
          cd r
          git config user.name "limpieza-general"; git config user.email "limpieza-general@users.noreply.github.com"
          DEST="Notas del Director (verbatim)"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            line=$(git ls-files -s -- "$p" | head -1)
            [ -z "$line" ] && continue
            mode=$(echo "$line" | cut -d' ' -f1); sha=$(echo "$line" | cut -d' ' -f2)
            git update-index --add --cacheinfo "$mode,$sha,$DEST/$(basename "$p")"
            git rm --cached -q -- "$p"
          done < /tmp/mover.txt
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            git rm -r --cached -q --ignore-unmatch -- "$p"
          done < /tmp/borrar.txt
          git status --short | wc -l
          git commit -q -m "limpieza general: quitar notas, estados, handoffs, informes, routers viejos y agentes sin uso (orden del Director)" || echo "nada que commitear"
          git push -q origin HEAD:main

      - name: Fase B - borrar workflows viejos (puede requerir permiso workflow)
        continue-on-error: true
        run: |
          cd r
          git fetch -q origin main || true
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            git rm --cached -q --ignore-unmatch -- "$p"
          done < /tmp/workflows.txt
          git rm --cached -q --ignore-unmatch -- ".github/workflows/limpieza-general.yml"
          git commit -q -m "limpieza general: quitar workflows de un solo uso y de routers viejos" || echo "nada"
          git push -q origin HEAD:main
