name: Codex Token Setup - Cuenta 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auth-account-1
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.RIU_HF_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official clients
        run: |
          npm install -g @openai/codex
          python -m pip install huggingface_hub
          codex --version
      - name: Check HF destination before starting authorization
        run: python scripts/persist_codex_auth_hf.py preflight --account 1
      - name: Authorize ChatGPT account 1 from mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "CUENTA=1; autoriza con la cuenta correcta en el navegador del movil."
          echo "Usa el enlace y codigo NUEVOS que imprime Codex."
          timeout 840 codex -c 'cli_auth_credentials_store="file"' login --device-auth
          codex login status
      - name: Save account 1 to Hugging Face Secrets
        run: python scripts/persist_codex_auth_hf.py save --account 1
