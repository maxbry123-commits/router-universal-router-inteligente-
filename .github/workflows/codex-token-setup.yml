name: Codex Token Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run login raw output
        shell: bash
        run: |
          npm install -g @openai/codex
          STATUS=0
          script -qec "timeout 60 codex login" /tmp/session_codex.log || STATUS=$?
          echo "===== SALIDA COMPLETA ====="
          cat /tmp/session_codex.log
          echo "==========================="
          echo "CODEX_EXIT_STATUS=$STATUS"
          exit "$STATUS"
