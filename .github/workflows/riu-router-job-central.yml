name: RIU Router Job Central

# Router principal del chat. La segunda via HF de respaldo NO se cancela ni se usa
# como motivo para bloquear el relanzamiento del principal.
# Publica LIVE_URL.json solo despues de health + E2E real NVIDIA + GROQ.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riu-router-job-central.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      lifetime:
        description: 'Vida del Job'
        default: '7d'
      flavor:
        description: 'Maquina HF'
        default: 'cpu-basic'

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub requests
      - name: Launch primary Router
        env:
          HF_TOKEN: ${{ secrets.HF_CONTROL_JOBS_TOKEN }}
          GH_JOB_PUSH_TOKEN: ${{ secrets.GH_JOB_PUSH_TOKEN }}
          HF_TOKEN_1_SECRET: ${{ secrets.HF_TOKEN_1 }}
          GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
          GH_WRITE: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          RIU_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
          RIU_AGENT_KEYS: ${{ secrets.RIU_AGENT_API_KEYS_JSON }}
          LIFETIME: ${{ inputs.lifetime || '7d' }}
          FLAVOR: ${{ inputs.flavor || 'cpu-basic' }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
        run: |
          python - <<'PY'
          import base64, json, os, time, requests
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN', '').strip()
          if not token:
              raise SystemExit('HF_CONTROL_JOBS_TOKEN no configurado')
          api = HfApi(token=token)

          PRIMARY_LABEL = 'riu-router-primary-central'
          def label_name(job):
              labels = getattr(job, 'labels', {}) or {}
              return labels.get('name') if isinstance(labels, dict) else None

          primaries = [
              j for j in api.list_jobs()
              if (j.status.stage or '').upper() in ('RUNNING', 'STARTING')
              and label_name(j) == PRIMARY_LABEL
          ]

          # En cron, conservar un principal etiquetado y sano. Los Jobs de respaldo
          # nunca se consideran aqui y nunca se cancelan.
          scheduled = os.environ.get('GITHUB_EVENT_NAME') == 'schedule'
          if scheduled and primaries:
              now = time.time()
              for j in primaries:
                  created = getattr(j, 'created_at', None)
                  age_h = (now - created.timestamp()) / 3600 if created is not None else 999
                  if age_h < 46:
                      print(f'::notice::principal ya vivo {j.id} age_h={age_h:.1f}; backup preservado')
                      raise SystemExit(0)

          cmd = (
              "set -e; apt-get update -qq >/dev/null 2>&1 || true; "
              "command -v git >/dev/null || apt-get install -y -qq git >/dev/null 2>&1; "
              "git clone --depth 1 https://github.com/maxbry123-commits/router-universal-router-inteligente- /tmp/r && "
              "cd /tmp/r && "
              "pip install -q fastapi 'uvicorn[standard]' pydantic huggingface_hub cryptography pyyaml requests httpx psutil && "
              "python 'router inteligente universal/agents-yaiwes/common/router_job_persistent.py'"
          )

          secrets = {'GITHUB_TOKEN': os.environ.get('GH_JOB_PUSH_TOKEN', '')}
          secrets['HF_CONTROL_JOBS_TOKEN'] = token
          secrets['HF_TOKEN_1'] = os.environ.get('HF_TOKEN_1_SECRET') or token
          if os.environ.get('GH_AGENT_TOKEN'):
              secrets['GH_AGENT_TOKEN'] = os.environ['GH_AGENT_TOKEN']
          if os.environ.get('RIU_KEY'):
              secrets['RIU_ROUTER_API_KEY'] = os.environ['RIU_KEY']
          if os.environ.get('RIU_AGENT_KEYS'):
              secrets['RIU_AGENT_API_KEYS'] = os.environ['RIU_AGENT_KEYS']

          provider_count = 0
          for pref, nums in (('NVIDIA_API_KEY_', range(1, 5)), ('GROQ_API_KEY_', range(2, 8))):
              for i in nums:
                  value = os.environ.get(f'{pref}{i}', '')
                  if value:
                      secrets[f'{pref}{i}'] = value
                      provider_count += 1
          print(f'::notice::provider secrets forwarded={provider_count}')
          if provider_count == 0:
              raise SystemExit('No hay claves NVIDIA/GROQ configuradas en GitHub Secrets')

          lifetime = os.environ.get('LIFETIME') or '7d'
          flavor = os.environ.get('FLAVOR') or 'cpu-basic'
          job = None
          last_exc = None
          for ttl in (lifetime, '48h', '24h'):
              try:
                  job = api.run_job(
                      image='python:3.12',
                      command=['bash', '-lc', cmd],
                      flavor=flavor,
                      timeout=ttl,
                      expose=[8000],
                      secrets=secrets,
                      env={'RIU_G2_GROQ_MODEL': 'qwen/qwen3.8-27b'},
                      labels={'name': PRIMARY_LABEL},
                  )
                  break
              except Exception as exc:
                  last_exc = exc
                  print(f'::warning::launch ttl={ttl} fallo: {type(exc).__name__}: {str(exc)[:120]}')
          if job is None:
              raise SystemExit(f'No se pudo lanzar principal: {last_exc}')

          url = f'https://{job.id}--8000.hf.jobs'
          print(f'::notice::candidate={job.id} url={url}')

          # 1) health
          health_ok = False
          deadline = time.time() + 480
          while time.time() < deadline:
              stage = api.inspect_job(job_id=job.id).status.stage
              if stage == 'RUNNING':
                  try:
                      r = requests.get(url + '/health', timeout=15)
                      if r.status_code == 200:
                          health_ok = True
                          break
                  except Exception:
                      pass
              if stage in ('ERROR', 'COMPLETED', 'CANCELED', 'DELETED'):
                  break
              time.sleep(10)
          if not health_ok:
              raise SystemExit(f'Candidate sin health PASS: {job.id}')
          print('::notice::health PASS')

          # 2) prueba real del harness por provider: NVIDIA + GROQ.
          def call(action, payload, timeout=30):
              r = requests.post(url + '/plugins/puente_chat/call/' + action, json=payload, timeout=timeout)
              r.raise_for_status()
              return r.json()

          def model_e2e(model):
              start = call('chat_async', {
                  'model': model,
                  'messages': [{'role': 'user', 'content': 'Responde solamente OK'}],
                  'max_tokens': 16,
                  'sesion': 'router-launch-e2e-' + job.id,
              })
              pid = ((start.get('result') or {}).get('proceso_id'))
              if not pid:
                  return False, 'SIN_PROCESO_ID'
              end = time.time() + 90
              while time.time() < end:
                  out = call('resultado', {'proceso_id': pid})
                  result = out.get('result') or {}
                  if result.get('estado') == 'procesando':
                      time.sleep(1)
                      continue
                  if result.get('error'):
                      return False, str(result.get('error')) + ':' + str(result.get('detalle') or '')[:160]
                  choices = result.get('choices') or []
                  text = (((choices[0] if choices else {}).get('message') or {}).get('content') or '').strip()
                  return bool(text), ('PASS' if text else 'SIN_TEXTO')
              return False, 'TIMEOUT'

          for model in ('nv-nemotron-super', 'groq-qwen-3-8'):
              ok, detail = model_e2e(model)
              print(f'::notice::E2E {model} ok={ok} detail={detail}')
              if not ok:
                  raise SystemExit(f'E2E FAIL {model}: {detail}')

          # 3) publicar principal. NO cancelar otros Routers ni Jobs de respaldo.
          gh_token = os.environ.get('GH_WRITE', '').strip()
          if not gh_token:
              raise SystemExit('GH_WRITE ausente; candidate sano pero no se puede publicar LIVE_URL')
          headers = {'Authorization': f'Bearer {gh_token}', 'Accept': 'application/vnd.github+json'}
          repo_api = 'https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-/contents/'

          def put_file(path, text, message):
              quoted = requests.utils.quote(path, safe='/')
              api_url = repo_api + quoted
              cur = requests.get(api_url + '?ref=main', headers=headers, timeout=20)
              cur.raise_for_status()
              sha = cur.json().get('sha')
              body = {
                  'message': message,
                  'sha': sha,
                  'branch': 'main',
                  'content': base64.b64encode(text.encode()).decode(),
              }
              res = requests.put(api_url, headers=headers, json=body, timeout=30)
              res.raise_for_status()

          live = {
              'LIVE_URL': url,
              'job_id': job.id,
              'flavor': flavor,
              'updated': time.time(),
              'auth': 'X-API-Key',
              'harnessUrl': url + '/plugins/puente_chat/call',
          }
          put_file(
              'router inteligente universal/LIVE_URL.json',
              json.dumps(live, ensure_ascii=False, indent=2) + '\n',
              f'router: publicar principal E2E {job.id}',
          )
          put_file(
              'router inteligente universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag',
              f'PAUSED=false\nLIVE_URL={url}\n',
              f'router: actualizar flag principal {job.id}',
          )
          print(f'::notice title=RIU_PRIMARY_READY::{job.id} health=PASS nvidia=PASS groq=PASS backup=PRESERVED')
          PY
