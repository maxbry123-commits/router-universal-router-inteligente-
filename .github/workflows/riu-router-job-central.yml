# Lanzador CENTRAL del Router (Job único de Hugging Face)
#
# Lanza el Job ÚNICO y persistente del Router (common/router_job_persistent.py).
# Máquina HF 16 GB DE PAGO (cpu-basic, $0.01/h), siempre encendida, vida larga. Al lanzar uno nuevo, cancela los anteriores.
# 2026-09-28 (Director): OmniRoute DESCARTADO. Prueba 09:05: el programa arranca (1/1 vivo, catálogo 200) pero los proveedores
#   gratis bloquean (OpenCode 403 "solo dentro de OpenCode", Felo 400/503) → no aporta respuestas; y dentro del Router lo tumbó (x10).
#   El Router ya NO arranca OmniRoute. Modelos: NVIDIA (Kimi K3 / GLM-5.3) + Groq (claves 2-7) directos.
# Secretos al Job (nunca en archivos): GITHUB_TOKEN, RIU_ROUTER_API_KEY, RIU_AGENT_API_KEYS, NVIDIA_API_KEY_1..4, GROQ_API_KEY_2..7, HF_TOKEN_1.
# Tras health OK, este workflow ESCRIBE LIVE_URL en el flag.
# E2E verificado 2026-09-28: /chat/send → NVIDIA moonshotai/kimi-k3 → respuesta real.

on:
  workflow_dispatch:
    inputs:
      lifetime:
        description: 'Vida del Job'
        default: '48h'
      flavor:
        description: 'Máquina HF (cpu-basic = 16 GB de pago)'
        default: 'cpu-basic'

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub requests
      - name: Launch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          GH_JOB_PUSH_TOKEN: ${{ secrets.GH_JOB_PUSH_TOKEN }}
          GH_WRITE: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          RIU_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
          RIU_AGENT_KEYS: ${{ secrets.RIU_AGENT_API_KEYS_JSON }}
          LIFETIME: ${{ inputs.lifetime || '48h' }}
          FLAVOR: ${{ inputs.flavor || 'cpu-basic' }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
        run: |
          python - <<'PY'
          import base64, os, time, requests
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          old = [j for j in api.list_jobs() if (j.status.stage or "").upper() in ("RUNNING", "STARTING") and "router_job_persistent.py" in " ".join(j.command or [])]
          cmd = (
              "set -e; apt-get update -qq >/dev/null 2>&1 || true; "
              "command -v git >/dev/null || apt-get install -y -qq git >/dev/null 2>&1; "
              "git clone --depth 1 https://github.com/maxbry123-commits/router-universal-router-inteligente- /tmp/r && "
              "cd /tmp/r && "
              "pip install -q fastapi 'uvicorn[standard]' pydantic huggingface_hub cryptography pyyaml requests httpx && "
              "python 'router inteligente universal/agents-yaiwes/common/router_job_persistent.py'"
          )
          secrets = {"GITHUB_TOKEN": os.environ["GH_JOB_PUSH_TOKEN"]}
          secrets["HF_TOKEN_1"] = os.environ["HF_TOKEN"]  # proveedor hf (DeepSeek V4 Flash / MiniMax) del chat; la lista de modelos sale de este token
          for env_name, sec_name in (("RIU_KEY", "RIU_ROUTER_API_KEY"), ("RIU_AGENT_KEYS", "RIU_AGENT_API_KEYS")):
              if os.environ.get(env_name):
                  secrets[sec_name] = os.environ[env_name]
          n = 0
          for pref, rango in (("NVIDIA_API_KEY_", range(1, 5)), ("GROQ_API_KEY_", range(2, 8))):
              for i in rango:
                  v = os.environ.get(f"{pref}{i}", "")
                  if v:
                      secrets[f"{pref}{i}"] = v; n += 1
          print(f"::notice::claves de proveedores enviadas: {n} · lista del Router: {'sí' if 'RIU_AGENT_API_KEYS' in secrets else 'NO'}")
          lifetime = os.environ["LIFETIME"]
          try:
              job = api.run_job(image="python:3.12", command=["bash", "-lc", cmd], flavor=os.environ["FLAVOR"], timeout=lifetime,
                                expose=[8000], secrets=secrets, env={"RIU_G2_GROQ_MODEL": "qwen/qwen3.8-27b"})
          except Exception as e:
              print(f"::warning::vida {lifetime} rechazada ({str(e)[:120]}); reintento con 24h")
              job = api.run_job(image="python:3.12", command=["bash", "-lc", cmd], flavor=os.environ["FLAVOR"], timeout="24h",
                                expose=[8000], secrets=secrets, env={"RIU_G2_GROQ_MODEL": "qwen/qwen3.8-27b"})
          print(f"::notice title=RIU_ROUTER_CENTRAL_JOB_ID::{job.id} flavor={os.environ['FLAVOR']}")
          t0, ok, stage = time.time(), None, None
          url = f"https://{job.id}--8000.hf.jobs"
          while time.time() - t0 < 480 and ok is None:
              stage = api.inspect_job(job_id=job.id).status.stage
              if stage == "RUNNING":
                  try:
                      if requests.get(url + "/health", headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]}, timeout=15).status_code == 200:
                          ok = url
                  except Exception:
                      pass
              if stage in ("ERROR", "COMPLETED", "CANCELED", "DELETED"):
                  break
              time.sleep(10)
          if ok:
              gh = {"Authorization": f"Bearer {os.environ['GH_WRITE']}", "Accept": "application/vnd.github+json"}
              api_url = "https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-/contents/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag"
              for intento in range(3):
                  cur = requests.get(api_url, headers=gh, timeout=20).json()
                  body = {"message": f"flag: LIVE_URL {job.id} (lanzador)", "sha": cur.get("sha"),
                          "content": base64.b64encode(f"PAUSED=false\nLIVE_URL={ok}\n".encode()).decode()}
                  if requests.put(api_url, headers=gh, json=body, timeout=20).status_code in (200, 201):
                      print(f"::notice::FLAG actualizado → {ok}"); break
                  time.sleep(3)
              for j in old:
                  try:
                      api.cancel_job(job_id=j.id); print(f"::notice::Router anterior apagado {j.id}")
                  except Exception:
                      pass
          print(f"::notice title=RIU_ROUTER_CENTRAL_STATE::stage={stage} health_ok_url={ok}")
          PY
