name: Sentinela Orquestador (cada 20 min)

# Bucle de recuperación de tareas T01-T08 (contrato: chat router/07-SENTINELAS/CONTRATOS.yaml).
# OBSERVAR → VERIFICAR (determinista, decide PASS) → CLASIFICAR → INVESTIGAR (solo si falla) → ORDENAR → RELANZAR espejo → REVERIFICAR.
# Memoria por tarea en chat router/07-SENTINELAS/ESTADO-TAREAS.json. Informe: chat router/07-SENTINELAS/informes/ORQUESTADOR.md.
# Despierta por cron Y por cambios de tarea/orden/código. FOCUS.yaml impone 1 sola tarea activa.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["Claude Code Espejos"]
    types: [in_progress, completed]
  push:
    paths:
      - '.github/workflows/sentinela-orquestador.yml'
      - 'chat router/07-SENTINELAS/FOCUS.yaml'
      - 'chat router/07-SENTINELAS/CONTRATOS.yaml'
      - 'chat router/07-SENTINELAS/sentinela_orquestador.py'
      - 'chat router/07-SENTINELAS/REPLICAS.yaml'
      - 'chat router/06-EQUIPO/ORDENES.md'
      - 'chat router/06-ESPEJOS/tareas/**'
      - 'chat router/05-AGENTES/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sentinela-orquestador
  cancel-in-progress: true

jobs:
  orquestar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
      NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
      NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.RIU_GITHUB_PAT_FULL_ACCESO }}
          fetch-depth: 50
          sparse-checkout: |
            chat router
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pyyaml pytest fastapi httpx requests
      - name: Autoverificar sentinela
        run: |
          python -m py_compile             "chat router/05-AGENTES/gobierno/sentinel_loop.py"             "chat router/07-SENTINELAS/sentinela_orquestador.py"
          python -m pytest "chat router/05-AGENTES/gobierno/tests/test_gobierno.py" -q
      - name: Bucle del sentinela
        id: s
        run: python "chat router/07-SENTINELAS/sentinela_orquestador.py"
      - name: Guardar estado, correcciones e informe
        run: |
          git config user.name "sentinela-orquestador"
          git config user.email "sentinela@users.noreply.github.com"

          # Persistencia fail-closed sin recalcular investigación por commits
          # independientes de las réplicas. Primero congelamos SOLO las salidas
          # autorizadas; luego rebaseamos sobre main y publicamos.
          find "chat router" -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "chat router" -name '*.pyc' -delete 2>/dev/null || true

          git add --sparse \
            "chat router/07-SENTINELAS/ESTADO-TAREAS.json" \
            "chat router/07-SENTINELAS/informes/ORQUESTADOR.md" \
            "chat router/06-ESPEJOS/tareas" || true
          git commit -q -m "sentinela orquestador: estado y correcciones" || true

          PUSHED=0
          for i in 1 2 3 4; do
            if timeout 90s git fetch -q origin main &&
               timeout 90s git rebase -q origin/main &&
               timeout 90s git push -q origin HEAD:main; then
              PUSHED=1
              echo "::notice::SENTINELA_ESTADO_GUARDADO"
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::SENTINELA_PERSIST_FAIL: estado no llegó a main"
            exit 1
          fi
      - name: Relanzar espejos con corrección
        if: steps.s.outputs.relanzar != ''
        run: gh workflow run claude-code-espejos.yml -R maxbry123-commits/router-universal-router-inteligente- -f tareas="${{ steps.s.outputs.relanzar }}" && echo "::notice::relanzados ${{ steps.s.outputs.relanzar }}"
