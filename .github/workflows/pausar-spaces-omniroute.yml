name: Pausar Spaces OmniRoute (una vez)

# Orden del Director 2026-09-26: OmniRoute vive ahora DENTRO de la máquina HF 16 GB del Router.
# Los 5 Spaces omniroute-1..5 (CPU Upgrade) sobran: se PAUSAN (no cobran) sin borrarlos, por si hicieran falta.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pausar-spaces-omniroute.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pausar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install -q -U huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN_1 }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"]); owner = api.whoami()["name"]
          for i in range(1, 6):
              sid = f"{owner}/omniroute-{i}"
              try:
                  api.pause_space(sid); print(f"::notice::PAUSADO {sid}")
              except Exception as e:
                  print(f"::warning::{sid}: {type(e).__name__} {str(e)[:150]}")
          PY
