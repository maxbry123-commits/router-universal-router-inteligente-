name: TMP plugin host diag

# TEMPORAL. Solo workflow_dispatch. Se borra al terminar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloque1-cadena-chat
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/tests/
            router inteligente universal/verifier/
            router inteligente universal/Banco de claves/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic uvicorn huggingface_hub
      - name: Plugin host failures
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider --tb=short -rA "router inteligente universal/tests/test_plugin_host.py" > /tmp/ph.txt 2>&1
          python - <<'PY'
          import re
          lines = open("/tmp/ph.txt", encoding="utf-8", errors="replace").read().splitlines()
          secs, cur = [], None
          for l in lines:
              m = re.match(r"^_{3,} (.+?) _{3,}$", l)
              if m:
                  cur = [m.group(1), []]
                  secs.append(cur)
                  continue
              if l.startswith("=") and cur is not None:
                  cur = None
                  continue
              if cur is not None:
                  cur[1].append(l)
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for name, body in secs[:9]:
              tail = body[-25:]
              txt = "\n".join(tail)
              if len(txt) > 1400:
                  txt = txt[-1400:]
              print("::notice title=PH_%s::%s" % (name[:60], esc(txt)))
          print("::notice title=PH_SUMMARY::sections=%d | %s" % (len(secs), esc(lines[-1] if lines else "")))
          PY
          exit 0
