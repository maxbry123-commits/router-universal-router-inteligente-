name: Wordflow router OSS 50
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordflow-router-oss.yml'
      - 'scripts/research_download_router.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descarga-extraccion:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Runner probe
        shell: bash
        run: |
          set -euxo pipefail
          echo "RUNNER=${RUNNER_NAME}"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          test -n "${GITHUB_SHA}"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Preparar tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          command -v git
          command -v zip
          command -v unzip
          command -v zipsplit
      - name: Crear trazabilidad del RUN
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p 'Download code router'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('Download code router/RUN_TRACE.json').write_text(json.dumps({
            'repository': os.environ['GITHUB_REPOSITORY'],
            'workflow': os.environ['GITHUB_WORKFLOW'],
            'run_id': int(os.environ['GITHUB_RUN_ID']),
            'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'sha': os.environ['GITHUB_SHA'],
            'ref': os.environ['GITHUB_REF'],
            'status': 'STARTED'
          }, indent=2), encoding='utf-8')
          PY
      - name: Preflight determinista
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/workflows/wordflow-router-oss.yml
          test -f scripts/research_download_router.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/research_download_router.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('scripts/research_download_router.py')
          t=p.read_text(encoding='utf-8')
          w=Path('.github/workflows/wordflow-router-oss.yml').read_text(encoding='utf-8')
          if 'lfs: false' not in w or 'git lfs' in w or 'GIT_LFS_' in w:
              raise SystemExit('LFS operational policy FAIL')
          tree=ast.parse(t)
          f=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='clone_retry')
          if any(isinstance(x,ast.Call) and isinstance(x.func,ast.Name) and x.func.id=='clone_retry' for x in ast.walk(f)):
              raise SystemExit('clone_retry recursion detected')
          print('PREFLIGHT PASS')
          PY
      - name: Limpiar descarga anterior
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf 'Download code router' '_work/router-oss'
          mkdir -p 'Download code router' '_work/router-oss/src' '_work/router-oss/pack'
      - name: Restaurar trazabilidad después de clean-room
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('Download code router/RUN_TRACE.json').write_text(json.dumps({
            'repository': os.environ['GITHUB_REPOSITORY'], 'workflow': os.environ['GITHUB_WORKFLOW'],
            'run_id': int(os.environ['GITHUB_RUN_ID']), 'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'sha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'], 'status': 'CLEAN_ROOM_READY'
          }, indent=2), encoding='utf-8')
          PY
      - name: ZIP + EXTRACT 50 desde cero
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/research_download_router.py
      - name: Evidencia final 50
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('Download code router')
          manifest=out/'RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          report=out/'FINAL_FORENSIC_REPORT.json'
          trace=out/'RUN_TRACE.json'
          if not manifest.is_file() or not report.is_file() or not trace.is_file(): raise SystemExit('FINAL EVIDENCE FILES MISSING')
          rows=[json.loads(x) for x in manifest.read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows)!=50 or [int(x['number']) for x in rows]!=list(range(1,51)): raise SystemExit('MANIFEST 50/50 FAIL')
          if any(x.get('status')!='COMPLETE' for x in rows): raise SystemExit('MANIFEST COMPLETE FAIL')
          data=json.loads(report.read_text(encoding='utf-8'))
          if data.get('status')!='PASS' or data.get('components')!=50: raise SystemExit('FINAL REPORT FAIL')
          tr=json.loads(trace.read_text(encoding='utf-8')); tr.update({'status':'PASS','manifest_rows':len(rows),'components':50})
          trace.write_text(json.dumps(tr,indent=2),encoding='utf-8')
          print('ROUTER 50/50 FINAL EVIDENCE PASS')
          PY
a      - name: Publicar evidencia forense y trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-50-forensic-${{ github.run_id }}
          path: |
            Download code router/RUN_TRACE.json
            Download code router/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            Download code router/FAILURE_LEDGER.yml
            Download code router/FINAL_FORENSIC_REPORT.json
          if-no-files-found: warn
          retention-days: 14
