name: Codex Token Setup - Cuenta 2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codex-token-setup-account2.yml"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Run Codex Cuenta 2 device authorization
        shell: bash
        run: |
          set -u
          export CODEX_HOME="$RUNNER_TEMP/codex-account-2"
          mkdir -p "$CODEX_HOME"
          npm install -g @openai/codex
          echo "Codex version: $(codex --version)"
          echo "CUENTA=2"
          echo "Abre https://auth.openai.com/codex/device y escribe el codigo de un solo uso que aparecera debajo."
          STATUS=0
          script -qec "timeout 840 codex login --device-auth" /tmp/codex-account-2.log || STATUS=$?
          echo "===== SALIDA COMPLETA CUENTA 2 ====="
          cat /tmp/codex-account-2.log
          echo "===================================="
          echo "CODEX_ACCOUNT_2_EXIT_STATUS=$STATUS"
          if [ "$STATUS" -eq 124 ]; then
            echo "::error::Codex Cuenta 2 expiro esperando aprobacion; vuelve a ejecutar para obtener un codigo nuevo."
          fi
          exit "$STATUS"
