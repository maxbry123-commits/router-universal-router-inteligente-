name: Codex Token Setup
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install and run login
        run: |
          npm install -g @openai/codex
          export PATH="$(npm config get prefix)/bin:$PATH"
          script -qefc "timeout 120 codex login" /tmp/session_codex.log
          echo "===== LOG COMPLETO ====="
          cat /tmp/session_codex.log
