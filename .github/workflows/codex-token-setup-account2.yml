name: Codex Token Setup - Cuenta 2
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install and run device-auth
        run: |
          npm install -g @openai/codex
          export PATH="$(npm config get prefix)/bin:$PATH"
          set +e
          script -qefc "timeout 840 codex login --device-auth" /tmp/session_codex.log
          rc=$?
          echo "===== LOG COMPLETO ====="
          cat /tmp/session_codex.log
          exit "$rc"
