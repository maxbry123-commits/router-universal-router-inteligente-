name: RIU Own Server Launch

# Lanza Qwen3.5-0.8B en la cuenta HF del Director (máquina 32 GB RAM) vía own_server_launch.py.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/agents-yaiwes/common/own_server_launch.py
            router inteligente universal/agents-yaiwes/common/hardware_sheriff.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub requests
      - name: Launch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          PYTHONPATH: router inteligente universal/agents-yaiwes/common
        run: python "router inteligente universal/agents-yaiwes/common/own_server_launch.py"
