name: RIU Webhook Setup (una sola vez)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/agents-yaiwes/webhook_receiver/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          GH_JOB_PUSH_TOKEN: ${{ secrets.GH_JOB_PUSH_TOKEN }}
        run: |
          python - <<'PY'
          import os, traceback
          from huggingface_hub import HfApi
          try:
              api = HfApi(token=os.environ["HF_TOKEN"])
              who = api.whoami()["name"]
              space_id = f"{who}/riu-webhook-receiver"
              api.create_repo(space_id, repo_type="space", space_sdk="gradio", exist_ok=True)
              api.upload_folder(folder_path="router inteligente universal/agents-yaiwes/webhook_receiver", repo_id=space_id, repo_type="space")
              try:
                  api.add_space_secret(space_id, "HF_TOKEN", os.environ["HF_TOKEN"])
                  api.add_space_secret(space_id, "GH_JOB_PUSH_TOKEN", os.environ["GH_JOB_PUSH_TOKEN"])
              except AttributeError:
                  import requests
                  for k, v in (("HF_TOKEN", os.environ["HF_TOKEN"]), ("GH_JOB_PUSH_TOKEN", os.environ["GH_JOB_PUSH_TOKEN"])):
                      r = requests.post(f"https://huggingface.co/api/spaces/{space_id}/secrets",
                                        headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]}, json={"key": k, "value": v})
                      print("::notice title=RIU_WEBHOOK_SECRET_FALLBACK::" + k + " status=" + str(r.status_code) + " " + r.text[:200])
              print("::notice title=RIU_WEBHOOK_SPACE::https://huggingface.co/spaces/" + space_id)
              print("::notice title=RIU_WEBHOOK_URL::https://" + who.lower() + "-riu-webhook-receiver.hf.space/webhook")
          except Exception as e:
              print("::error title=RIU_WEBHOOK_SETUP_ERROR::" + type(e).__name__ + ": " + str(e)[:600])
              traceback.print_exc()
              raise SystemExit(1)
          PY
