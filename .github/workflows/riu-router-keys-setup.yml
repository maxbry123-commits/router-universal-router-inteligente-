name: RIU Router Keys Setup (una sola vez)

# 1) Lanza el Router central con GITHUB_TOKEN + HF_TOKEN + RIU_AGENT_API_KEYS (antes solo llevaba GITHUB_TOKEN: sin HF_TOKEN no podía
#    llamar a DeepSeek y sin RIU_AGENT_API_KEYS todas las rutas /chat/* respondían 401).
# 2) Prueba real: /health, /chat/send (DeepSeek V4 Flash por HF) y /chat/jev.
# 3) Si pasa: actualiza LIVE_URL, cancela el Router viejo, y deja el conector (Webhook) relanzando con las mismas 3 claves.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U huggingface_hub requests
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          GH_JOB_PUSH_TOKEN: ${{ secrets.GH_JOB_PUSH_TOKEN }}
          ROUTER_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
          KEYS_JSON: ${{ secrets.RIU_AGENT_API_KEYS_JSON }}
        run: |
          python - <<'PY'
          import os, re, time, json, base64, requests
          from huggingface_hub import HfApi, hf_hub_download
          hf, gh, rk, kj = os.environ["HF_TOKEN"], os.environ["GH_JOB_PUSH_TOKEN"], os.environ["ROUTER_KEY"], os.environ["KEYS_JSON"]
          api = HfApi(token=hf)
          def note(t, m): print(f"::notice title={t}::{m}"[:1500], flush=True)
          cmd = ("set -e; apt-get update -qq >/dev/null 2>&1 || true; command -v git >/dev/null || apt-get install -y -qq git >/dev/null 2>&1; "
                 "git clone --depth 1 https://github.com/maxbry123-commits/router-universal-router-inteligente- /tmp/r && cd /tmp/r && "
                 "pip install -q fastapi 'uvicorn[standard]' pydantic huggingface_hub cryptography pyyaml requests && "
                 "python 'router inteligente universal/agents-yaiwes/common/router_job_persistent.py'")
          job = api.run_job(image="python:3.12", command=["bash", "-lc", cmd], flavor="cpu-upgrade", timeout="6h", expose=[8000],
                            secrets={"GITHUB_TOKEN": gh, "HF_TOKEN": hf, "RIU_AGENT_API_KEYS": kj})
          url = f"https://{job.id}--8000.hf.jobs"
          note("RIU_NEW_JOB", job.id)
          H = {"Authorization": "Bearer " + hf}
          ok, t0 = False, time.time()
          while time.time() - t0 < 420:
              st = api.inspect_job(job_id=job.id).status.stage
              if st == "RUNNING":
                  try:
                      if requests.get(url + "/health", headers=H, timeout=10).status_code == 200:
                          ok = True; break
                  except Exception:
                      pass
              if st in ("ERROR", "COMPLETED", "CANCELED", "DELETED"):
                  break
              time.sleep(8)
          note("RIU_HEALTH", f"ok={ok} url={url}")
          if not ok:
              logs = []
              try:
                  logs = [str(l) for l in api.fetch_job_logs(job_id=job.id)][-10:]
              except Exception:
                  pass
              note("RIU_FAIL_LOGS", " | ".join(logs))
              api.cancel_job(job_id=job.id)
              raise SystemExit(1)
          HK = {**H, "X-API-Key": rk, "Content-Type": "application/json"}
          r1 = requests.post(url + "/chat/send", headers=HK, timeout=120,
                             json={"message": "Responde solo con la palabra OK.", "provider": "hf", "model": "deepseek-ai/DeepSeek-V4-Flash", "max_tokens": 20, "cache": False})
          note("RIU_TEST_CHAT_SEND", f"status={r1.status_code} body={r1.text[:300]}")
          r2 = requests.post(url + "/chat/jev", headers=HK, timeout=120,
                             json={"kind": "noul", "state": {"tests_passed": True}, "instructions": "¿Los tests pasaron?", "provider": "hf", "model": "deepseek-ai/DeepSeek-V4-Flash"})
          note("RIU_TEST_CHAT_JEV", f"status={r2.status_code} body={r2.text[:300]}")
          r3 = requests.get(url + "/chat/usage", headers={**H}, timeout=30)
          note("RIU_TEST_SIN_CLAVE", f"status={r3.status_code} (debe ser 401)")
          if r1.status_code != 200:
              note("RIU_ABORT", "chat/send no respondió 200: no se cambia LIVE_URL; se cancela el Job nuevo")
              api.cancel_job(job_id=job.id)
              raise SystemExit(1)
          FLAG = "https://api.github.com/repos/maxbry123-commits/router-universal-router-inteligente-/contents/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag"
          GH = {"Authorization": "Bearer " + gh}
          cur = requests.get(FLAG, headers=GH, timeout=15).json()
          old = re.search(r"LIVE_URL=https://([0-9a-f]+)--", base64.b64decode(cur["content"]).decode())
          old_id = old.group(1) if old else None
          requests.put(FLAG, headers=GH, timeout=15, json={"message": "router: LIVE_URL nueva (con HF_TOKEN y clave del Router)",
                       "content": base64.b64encode(f"PAUSED=false\nLIVE_URL={url}\n".encode()).decode(), "sha": cur["sha"]})
          note("RIU_LIVE_URL", url)
          canceled = []
          for j in api.list_jobs():
              if j.status.stage in ("RUNNING", "SCHEDULING") and j.id != job.id and "router_job_persistent" in " ".join(j.command or []):
                  api.cancel_job(job_id=j.id); canceled.append(j.id)
          note("RIU_OLD_CANCELED", f"{canceled} (anterior en flag: {old_id})")
          SPACE = "COMAND-CENTER-1/claude-github-mcp-backup"
          p = hf_hub_download(SPACE, "app.py", repo_type="space", token=hf)
          src = open(p, encoding="utf-8").read()
          old_s = 'secrets={"GITHUB_TOKEN": _required_env("GITHUB_PERSONAL_ACCESS_TOKEN")})'
          new_s = ('secrets={"GITHUB_TOKEN": _required_env("GITHUB_PERSONAL_ACCESS_TOKEN"), "HF_TOKEN": _required_env("HF_TOKEN"), '
                   '"RIU_AGENT_API_KEYS": os.getenv("RIU_AGENT_API_KEYS", "")})')
          if old_s in src:
              open("/tmp/app.py", "w", encoding="utf-8").write(src.replace(old_s, new_s))
              api.add_space_secret(SPACE, "RIU_AGENT_API_KEYS", kj)
              api.upload_file(path_or_fileobj="/tmp/app.py", path_in_repo="app.py", repo_id=SPACE, repo_type="space",
                              commit_message="webhook: el relanzamiento del Router pasa HF_TOKEN y la clave del Router")
              note("RIU_CONNECTOR", "parcheado: relanza con las 3 claves")
          else:
              note("RIU_CONNECTOR", "línea no encontrada; no se tocó")
          PY
