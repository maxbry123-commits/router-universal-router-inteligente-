name: HF MCP Space Publish (manual maintenance only)

on:
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

# Never overlap Space rebuilds. A rebuild can make an already-open Claude chat
# keep a stale MCP tool catalog even after the server comes back.
concurrency:
  group: hf-mcp-space-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_REPO: COMAND-CENTER-1/claude-github-mcp-backup
      HF_OIDC_RESOURCE: spaces/COMAND-CENTER-1/claude-github-mcp-backup

    steps:
      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build hardened Claude-compatible MCP patch
        run: |
          curl -fsSL "https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/.github/scripts/harden_claude_mcp.py" -o /tmp/harden_claude_mcp.py
          python /tmp/harden_claude_mcp.py --output /tmp/app.py

      - name: Publish app.py to Hugging Face with OIDC
        run: |
          hf upload "$HF_REPO" /tmp/app.py app.py             --repo-type space             --commit-message "fix: Claude MCP stateless GET-SSE compatibility and isolated slots"

      - name: Verify Space rebuilt and source is live
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          api = "https://huggingface.co/api/spaces/COMAND-CENTER-1/claude-github-mcp-backup"
          raw = "https://huggingface.co/spaces/COMAND-CENTER-1/claude-github-mcp-backup/resolve/main/app.py"

          for attempt in range(90):
              with urllib.request.urlopen(api, timeout=20) as r:
                  info = json.load(r)

              stage = info.get("runtime", {}).get("stage")
              sha = info.get("sha", "")
              print(f"attempt={attempt} stage={stage} sha={sha[:12]}")

              if stage == "RUNNING":
                  source = urllib.request.urlopen(raw, timeout=20).read().decode("utf-8")
                  if (
                      "MCP_SECRET_HF" in source
                      and "_ClaudeMCPCompat" in source
                      and "stateless_http=True" in source
                      and "CLAUDE_GET_SSE_COMPAT=enabled" in source
                  ):
                      print("PASS: Space RUNNING with Claude MCP compatibility patch")
                      raise SystemExit(0)

              if stage in {"BUILD_ERROR", "RUNTIME_ERROR", "PAUSED"}:
                  raise SystemExit(f"FAIL: Space stage={stage}")

              time.sleep(5)

          raise SystemExit("FAIL: timeout waiting for rebuilt Space")
          PY
