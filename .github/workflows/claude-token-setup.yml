name: Claude Token Setup
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/claude-token-setup.yml'
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install and run setup-token
        run: |
          npm install -g @anthropic-ai/claude-code
          export PATH="$(npm config get prefix)/bin:$PATH"
          script -qefc "timeout 120 claude setup-token" /tmp/session.log
          echo "===== LOG COMPLETO ====="
          cat /tmp/session.log
