name: Claude Token Setup
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install and run setup-token
        run: |
          npm install -g @anthropic-ai/claude-code
          export PATH="$(npm config get prefix)/bin:$PATH"
          set +e
          script -qefc "timeout 120 claude setup-token" /tmp/session.log
          rc=$?
          echo "===== LOG COMPLETO ====="
          cat /tmp/session.log
          exit "$rc"
