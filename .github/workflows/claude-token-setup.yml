name: Claude Token Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run setup-token raw output
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          STATUS=0
          script -qec "timeout 60 claude setup-token" /tmp/session.log || STATUS=$?
          echo "===== SALIDA COMPLETA ====="
          cat /tmp/session.log
          echo "==========================="
          echo "CLAUDE_EXIT_STATUS=$STATUS"
          exit "$STATUS"
