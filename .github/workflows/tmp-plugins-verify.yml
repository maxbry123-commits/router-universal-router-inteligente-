name: TMP Plugins verify

# TEMPORAL (Bloque 3, agente plugins). Se borra al terminar. Corre en push a bloque3-plugins y a mano.

on:
  workflow_dispatch:
  push:
    branches: [bloque3-plugins]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/
            !router inteligente universal/Componente open soure router inteligente universal/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        working-directory: router inteligente universal
        run: pip install -q pytest -r requirements.txt || pip install -q pytest httpx fastapi
      - name: plugins nuevos + host
        working-directory: router inteligente universal
        run: python -m pytest -rA -q tests/test_plugins_bloque3.py tests/test_plugin_host.py
      - name: suite completa de la rama (informativa)
        if: always()
        working-directory: router inteligente universal
        run: python -m pytest -q -p no:cacheprovider tests 2>&1 | tail -40
