name: RIU Propagate Auth Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RIU_GITHUB_PAT: ${{ secrets.RIU_GITHUB_PAT }}
      RIU_HF_TOKEN: ${{ secrets.RIU_HF_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON_ACCOUNT_1: ${{ secrets.CODEX_AUTH_JSON_ACCOUNT_1 }}
      CODEX_AUTH_JSON_ACCOUNT_2: ${{ secrets.CODEX_AUTH_JSON_ACCOUNT_2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed unless bootstrap GitHub credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RIU_GITHUB_PAT" ]; then
            echo '::error::RIU_GITHUB_PAT is required in the Router repository Actions secrets.'
            exit 2
          fi
          echo 'BOOTSTRAP_GITHUB_CREDENTIAL=PRESENT'
          if [ -n "$RIU_HF_TOKEN" ]; then echo 'HF_GLOBAL_WRITE_CREDENTIAL=PRESENT'; else echo 'HF_GLOBAL_WRITE_CREDENTIAL=ABSENT'; fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo 'CLAUDE_SUBSCRIPTION_CREDENTIAL=PRESENT'; else echo 'CLAUDE_SUBSCRIPTION_CREDENTIAL=ABSENT'; fi
          if [ -n "$CODEX_AUTH_JSON_ACCOUNT_1" ]; then echo 'CODEX_ACCOUNT_1=PRESENT'; else echo 'CODEX_ACCOUNT_1=ABSENT'; fi
          if [ -n "$CODEX_AUTH_JSON_ACCOUNT_2" ]; then echo 'CODEX_ACCOUNT_2=PRESENT'; else echo 'CODEX_ACCOUNT_2=ABSENT'; fi

      - name: Install encryption dependency
        run: python -m pip install --quiet --disable-pip-version-check pynacl

      - name: Propagate approved credentials to the eight project repositories
        run: python scripts/propagate_actions_secrets.py
