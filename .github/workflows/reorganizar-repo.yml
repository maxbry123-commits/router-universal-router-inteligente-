name: Reorganizar repo (una vez, orden del Director 2026-09-29)

# Mueve (NO borra componentes) a las raices pedidas, corrige las rutas que dependen de lo movido
# y borra replicar-motores.yml (copiaba motores a todos los repos = ruido). Se borra a si mismo al terminar.
# Respaldo previo: rama backup-antes-limpieza-20260929 + el commit anterior a este.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "false = solo mostrar el plan; true = mover y subir"
        default: "false"

permissions:
  contents: read

jobs:
  reorganizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.GH_CLASSIC_FULL_2 || secrets.RIU_GITHUB_PAT_FULL_ACCESO || secrets.GH_JOB_PUSH_TOKEN }}
      APLICAR: ${{ inputs.aplicar }}
    steps:
      - name: Clonar sin archivos (solo indice)
        run: |
          git config --global core.quotepath off
          git clone -q --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/maxbry123-commits/router-universal-router-inteligente-.git" r
          cd r && git read-tree HEAD && git ls-files | wc -l

      - name: Script de reorganizacion
        run: |
          cat > /tmp/reorg.py <<'EOF_PY'
          import os, re, subprocess, sys, collections

          APLICAR = os.environ.get("APLICAR", "false") == "true"
          R = "r"

          def git(*a):
              p = subprocess.run(["git", "-C", R, *a], capture_output=True, text=True)
              if p.returncode != 0:
                  raise SystemExit("git %s fallo: %s" % (" ".join(a), p.stderr[:400]))
              return p.stdout

          ROUTER = "router inteligente universal"
          COMP = ROUTER + "/Componentes del Router"
          MOTORES = "Motores descarga extracción búsquedas"
          DOCS = "Documentos del proyecto"
          READMES = "Readme router inteligente universal"
          HF = "Huggingface"
          VERCEL = "Vercel"
          ESTADO = "Estado y handoff global"

          KEEP = {".devcontainer", ".github", ".gitignore", ".gitmodules", "CLAUDE.md", "vercel.json",
                  "Claude notas", "chat router", ROUTER, "Readme arquitectura router inteligente universal",
                  MOTORES, DOCS, READMES, HF, VERCEL, ESTADO}

          EXPLICIT = {
              "Chat Mvp": ROUTER + "/Banco de claves",
              "router inteligente software": COMP + "/router inteligente software",
              "api": COMP + "/api",
              "Yaiwes Cognitive Control Plane": COMP + "/Yaiwes Cognitive Control Plane",
              "dataset Yaiwes": COMP + "/dataset Yaiwes",
              "hermes-agent": COMP + "/hermes-agent",
              "scripts": ROUTER + "/scripts",
              "chat_orders": "chat router/chat_orders",
              "conectividad con Router inteligente universal": HF + "/conectividad con Router inteligente universal",
              "coneccion huggueface Github": HF + "/coneccion huggueface Github",
              "Github coneccion": HF + "/Github coneccion",
              "huggueface": HF + "/huggueface",
              "README-HUGGINGFACE.md": HF + "/README-HUGGINGFACE.md",
              "vercel-chat": VERCEL + "/vercel-chat",
              "Documentos proyectos router inteligente universal": DOCS + "/Documentos proyectos router inteligente universal",
              "Notas del Director (verbatim)": DOCS + "/Notas del Director (verbatim)",
              "Download code router inteligente universal": MOTORES + "/Download code router inteligente universal",
          }

          def dest_top(name):
              if name in KEEP:
                  return None
              if name in EXPLICIT:
                  return EXPLICIT[name]
              low = name.lower()
              if name.startswith("➡"):
                  if "motores de" in low:
                      return MOTORES + "/" + name
                  return DOCS + "/" + name
              if "huggueface" in low or "fast api key" in low:
                  return HF + "/" + name
              if low.startswith("readme"):
                  return READMES + "/" + name
              raise SystemExit("carpeta/archivo de la raiz sin regla: %r (no muevo nada)" % name)

          ESTADO_FILES = ["ESTADO.json", "CRAZY_WALL.json", "BITACORA.jsonl", "HANDOFF.md"]
          SPECIAL = {"chat router/03-ESTADO/" + f: ESTADO + "/" + f for f in ESTADO_FILES}

          raw = subprocess.run(["git", "-C", R, "ls-files", "-s", "-z"], capture_output=True).stdout.decode("utf-8")
          entries = []
          for rec in raw.split("\0"):
              if not rec:
                  continue
              meta, path = rec.split("\t", 1)
              mode, sha, stage = meta.split()
              entries.append((mode, sha, path))

          plan = collections.OrderedDict()
          for mode, sha, path in entries:
              top = path.split("/", 1)[0]
              if path in SPECIAL:
                  plan.setdefault(path, collections.Counter())["->" + SPECIAL[path]] += 1
                  continue
              d = dest_top(top)
              if d:
                  plan.setdefault(top, collections.Counter())["->" + d] += 1

          print("=== PLAN ===")
          for top, c in plan.items():
              for k, v in c.items():
                  print("%-70s %s (%d archivos)" % (top[:70], k, v))
                  print("::notice title=MOVER::%s %s (%d)" % (top[:60], k[:90], v))
          sys.stdout.flush()

          if not APLICAR:
              print("::notice title=SOLO_PLAN::no se movio nada (aplicar=false)")
              raise SystemExit(0)

          lines = []
          moved = 0
          for mode, sha, path in entries:
              top = path.split("/", 1)[0]
              if path in SPECIAL:
                  new = SPECIAL[path]
              else:
                  d = dest_top(top)
                  if not d:
                      continue
                  new = d + path[len(top):]
              lines.append("0 0000000000000000000000000000000000000000\t%s\0" % path)
              lines.append("%s %s\t%s\0" % (mode, sha, new))
              moved += 1
          payload = "".join(lines).encode("utf-8")
          p = subprocess.run(["git", "-C", R, "update-index", "-z", "--index-info"], input=payload, capture_output=True)
          if p.returncode != 0:
              raise SystemExit("update-index fallo: " + p.stderr.decode()[:400])
          print("archivos movidos:", moved)

          PFX = "Motores descarga extracción búsquedas/"
          MOT = "➡️\U0001F4C2motores de descarga extracción copiado movimiento archivos"
          def motores(s):
              return re.sub(r"(?<!%s)%s" % (re.escape(PFX), re.escape(MOT)), PFX + MOT, s)

          def lit(a, b):
              return lambda s: s.replace(a, b)

          BANCO = "router inteligente universal/Banco de claves"
          EDITS = [
              (".github/workflows/riu-microkernel-run.yml", [lit("Chat Mvp/secret_bank/", BANCO + "/secret_bank/")]),
              (".github/workflows/riu-agents-run.yml", [lit("Chat Mvp/secret_bank/", BANCO + "/secret_bank/"), motores]),
              (".github/workflows/riu-chat-mvp-core-verify.yml", [lit("Chat Mvp", BANCO)]),
              (".github/workflows/riu-agent11-canonical-download.yml", [motores]),
              (".github/workflows/riu-websearch-run.yml", [motores]),
              (".github/workflows/riu-websearch.yml", [lit('"motores de descarga" in e["path"]', 'e["path"].startswith("Motores descarga")')]),
              (".github/workflows/riu-dag-run.yml", [
                  lit('case "$PLAN" in chat_orders/*.dag.json)', 'case "$PLAN" in "chat router/chat_orders/"*.dag.json)'),
                  lit("default: 'chat_orders/ORDER-000-smoke.dag.json'", "default: 'chat router/chat_orders/ORDER-000-smoke.dag.json'"),
                  lit("            chat_orders/\n", "            chat router/chat_orders/\n"),
                  lit('"$root/chat_orders/results/', '"$root/chat router/chat_orders/results/'),
                  lit("git add chat_orders/results", 'git add "chat router/chat_orders/results"'),
              ]),
              (".github/workflows/riu-propagate-auth-secrets.yml", [lit("python scripts/propagate_actions_secrets.py", 'python "router inteligente universal/scripts/propagate_actions_secrets.py"')]),
              ("router inteligente universal/agents-yaiwes/agent-11-download-extraction/chain.yaml", [motores]),
              ("router inteligente universal/agents-yaiwes/agent-11-download-extraction/steps/acquire_requested_component/workflow.dag.yaml", [motores]),
              ("chat router/04-MEMORIA/memoria_yaiwes/__init__.py", [lit('ROOT / "router inteligente software"', 'ROOT / "router inteligente universal" / "Componentes del Router" / "router inteligente software"')]),
          ]
          for path, fns in EDITS:
              out = subprocess.run(["git", "-C", R, "show", ":" + path], capture_output=True)
              if out.returncode != 0:
                  print("::warning title=EDIT_NO_ARCHIVO::%s" % path)
                  continue
              src = out.stdout.decode("utf-8")
              new = src
              for f in fns:
                  new = f(new)
              if new == src:
                  print("::warning title=EDIT_SIN_CAMBIO::%s" % path)
                  continue
              h = subprocess.run(["git", "-C", R, "hash-object", "-w", "--stdin"], input=new.encode("utf-8"), capture_output=True).stdout.decode().strip()
              mode = subprocess.run(["git", "-C", R, "ls-files", "-s", "--", path], capture_output=True).stdout.decode().split()[0]
              git("update-index", "--cacheinfo", "%s,%s,%s" % (mode, h, path))
              print("::notice title=EDIT_OK::%s" % path)

          for x in (".github/workflows/replicar-motores.yml", ".github/workflows/reorganizar-repo.yml"):
              git("rm", "--cached", "-q", "--ignore-unmatch", "--", x)
          EOF_PY

      - name: Mostrar el plan (siempre) y aplicar si se pidio
        run: |
          python3 /tmp/reorg.py

      - name: Confirmar y subir
        if: ${{ inputs.aplicar == 'true' }}
        run: |
          cd r
          git config user.name "reorganizar-repo"; git config user.email "reorganizar-repo@users.noreply.github.com"
          git status --short | wc -l
          git commit -q -m "reorganizar repo: raices pedidas por el Director, rutas corregidas, sin borrar componentes [skip ci]"
          git push -q origin HEAD:main
          echo "::notice title=TOP_NIVEL::$(git ls-tree --name-only HEAD | tr '\n' '|')"
