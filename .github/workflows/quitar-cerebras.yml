name: Quitar Cerebras (una vez, orden del Director 2026-09-29)

# Quita Cerebras del codigo del Router, cadenas de agentes, tests y workflows. Pone Groq donde Cerebras era 2.o de la cadena g2.
# apply=false: solo prueba (tests antes y despues) y no sube nada. apply=true: sube un commit y se borra a si mismo.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = subir el commit"
        default: "false"

permissions:
  contents: read

jobs:
  quitar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_CLASSIC_FULL_1 || secrets.GH_CLASSIC_FULL_2 || secrets.RIU_GITHUB_PAT_FULL_ACCESO || secrets.GH_JOB_PUSH_TOKEN }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clonar y materializar solo lo necesario
        run: |
          git config --global core.quotepath off
          git config --global user.name "riu-bot"; git config --global user.email "riu-bot@users.noreply.github.com"
          git clone -q --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/maxbry123-commits/router-universal-router-inteligente-.git" r
          cd r && git read-tree HEAD
          R="router inteligente universal"
          { git ls-files -z -- "$R" ":(exclude)$R/Componente open soure router inteligente universal" ":(exclude)$R/Componentes del Router" ":(exclude)$R/vercel-ui" ":(exclude)$R/vercel-jev-bridge" ":(exclude)$R/agents-yaiwes" ; \
            git ls-files -z -- "$R/agents-yaiwes/common" ; \
            git ls-files -z -- ':(glob)**/chain.yaml' ':(glob)**/workflow.dag.yaml' ; \
            git ls-files -z -- .github/workflows ; } | sort -zu > /tmp/materializar.z
          xargs -0 git checkout-index -f -- < /tmp/materializar.z
          tr '\0' '\n' < /tmp/materializar.z | wc -l
      - name: Tests ANTES
        run: |
          pip install -q pytest httpx pyyaml cryptography requests uvicorn -r "r/router inteligente universal/requirements.txt" 2>&1 | tail -1
          cd "r/router inteligente universal"
          timeout 900 python -m pytest tests "Banco de claves/tests" -q -p no:cacheprovider --maxfail=200 2>&1 | tail -400 > /tmp/antes.txt || true
          echo "::notice title=ERR_ANTES::$(grep -E '^E  ' /tmp/antes.txt | sort | uniq -c | sort -rn | head -4 | tr '\n' ' ' | cut -c1-600)"
          grep -E "^(FAILED|ERROR)" /tmp/antes.txt | sed 's/ - .*//' | sort -u > /tmp/antes_fail.txt || true
          tail -1 /tmp/antes.txt; wc -l < /tmp/antes_fail.txt
      - name: Editar
        run: |
          cat > /tmp/edit.py <<'EOF_PY'
          import re, os, subprocess
          os.chdir("r")
          R = "router inteligente universal/"
          miss, done = [], []
          D = "$" + "{{"
          def rd(p): return open(p, encoding="utf-8").read()
          def wr(p, t): open(p, "w", encoding="utf-8").write(t)
          def sub(p, old, new, regex=False, flags=0, must=True):
              if not os.path.exists(p): miss.append("NOFILE " + p); return
              t = rd(p)
              n = re.sub(old, new, t, flags=flags) if regex else t.replace(old, new)
              if n == t:
                  if must: miss.append("SINCAMBIO %s :: %s" % (p, old[:50]))
                  return
              wr(p, n); done.append(p)
          I = R + "integration/chat_mvp/"
          sub(I + "providers.py", "Cerebras sigue registrado pero\n  el enrutado de agentes lo excluye (pide pago).", "Cerebras ELIMINADO (Director 2026-09-29).")
          sub(I + "providers.py", r'^    "cerebras": \{.*\},\n', "", True, re.M)
          sub(I + "resilience.py", "NVIDIA -> Cerebras -> local API", "NVIDIA -> Groq -> local API")
          sub(I + "resilience.py", '{"provider": "cerebras", "model": "env:RIU_G2_CEREBRAS_MODEL"}', '{"provider": "groq", "model": "env:RIU_G2_GROQ_MODEL"}')
          sub(I + "vault_bridge.py", '"cerebras": "cerebras", ', "")
          A = R + "agents-yaiwes/common/"
          sub(A + "routes.py", 'EXCLUIDOS = {"cerebras"}', "EXCLUIDOS: set = set()")
          sub(A + "probe_keys.py", '("nvidia", "groq", "cerebras")', '("nvidia", "groq")')
          sub(A + "probe_keys.py", "(NVIDIA, Groq, Cerebras)", "(NVIDIA, Groq)")
          sub(A + "boot.py", "(NVIDIA, Groq, Cerebras, Hugging Face, GitHub)", "(NVIDIA, Groq, Hugging Face, GitHub)")
          K = R + "agent-microkernel/kernel/"
          sub(K + "dag_loader.py", 'ROUTES = {"nvidia", "groq", "cerebras"}', 'ROUTES = {"nvidia", "groq"}')
          sub(K + "dispatcher.py", "`nvidia` / `groq` / `cerebras` (their", "`nvidia` / `groq` (their")
          sub(K + "dispatcher.py", r'^    "cerebras": \[.*\],\n', "", True, re.M)
          G = R + "gateway/hf_chat_mvp/"
          sub(G + "app.py", "  CEREBRAS_API_KEY_1 -> Cerebras (Llama, Qwen)\n", "")
          sub(G + "app.py", r'    "Cerebras": \{.*?\n    \},\n', "", True, re.S)
          sub(G + "README.md", "Groq, NVIDIA NIM y Cerebras", "Groq y NVIDIA NIM", must=False)
          sub(G + "README.md", "`NVIDIA_API_KEY_1`, `CEREBRAS_API_KEY_1`.", "`NVIDIA_API_KEY_1`.", must=False)
          B = R + "Banco de claves/"
          sub(B + "accounts.yaml", '"CEREBRAS_API_KEY_1..6", ', "")
          sub(B + "groups.yaml", "4 API de NVIDIA y Cerebras", "4 API de NVIDIA y Groq")
          W = ".github/workflows/"
          sub(W + "deploy-chat-space.yml", "          S_CEREBRAS: " + D + " secrets.CEREBRAS_API_KEY_1 }}\n", "")
          sub(W + "deploy-chat-space.yml", '"CEREBRAS_API_KEY": "S_CEREBRAS", ', "")
          sub(W + "riu-chat-mvp-verify.yml", "          CEREBRAS_API_KEY_1: " + D + " secrets.CEREBRAS_API_KEY_1 }}\n", "")
          sub(W + "riu-chat-mvp-verify.yml", '("cerebras", "nvidia", "groq")', '("nvidia", "groq")')
          sub(W + "riu-dag-run.yml", "          CEREBRAS_API_KEY_1: " + D + " secrets.CEREBRAS_API_KEY_1 }}\n", "")
          sub(W + "riu-validate-provider-keys.yml", r'\n      - name: Validate Cerebras\n.*?CEREBRAS_RESULT=FAIL"; exit 1; \}\n', "\n", True, re.S)
          # tests: cambio mecanico cerebras -> groq
          T = R + "tests/"
          sub(T + "test_chat_mvp_app.py", '{"hf", "cerebras", "nvidia", "groq",', '{"hf", "nvidia", "groq",')
          for f in ("test_chat_cost_dag.py", "test_chat_mvp_app.py", "test_chat_mvp_pure.py", "test_resilience.py", "test_vault_wordflow_jobs.py"):
              p = T + f; t = rd(p)
              n = t.replace("CEREBRAS", "GROQ").replace("Cerebras", "Groq").replace("cerebras", "groq")
              if n != t: wr(p, n); done.append(p)
          p = B + "tests/test_secret_bank.py"; t = rd(p); wr(p, t.replace("cerebras/open", "groq/open")); done.append(p)
          # rutas de agentes
          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout.decode().split("\0")
          nchain = 0
          def fix_inline(m):
              items = [s.strip() for s in m.group(2).split(",")]
              if "cerebras" not in items: return m.group(0)
              return m.group(1) + ", ".join(x for x in items if x and x != "cerebras") + m.group(3)
          for f in files:
              if not (f.endswith("/chain.yaml") or f.endswith("/workflow.dag.yaml")): continue
              if not os.path.exists(f): continue
              t = rd(f)
              n = re.sub(r"(route:\s*\[)([^\]\n]*)(\])", fix_inline, t)
              n = re.sub(r"^[ \t]*- cerebras[ \t]*\n", "", n, flags=re.M)
              if n != t: wr(f, n); nchain += 1
          print("::notice title=EDITADOS::archivos_codigo=%d rutas_yaml=%d" % (len(set(done)), nchain))
          if miss: print("::warning title=FALLOS_EDICION::" + " | ".join(miss)[:3500])
          EOF_PY
          python /tmp/edit.py
      - name: Tests DESPUES
        run: |
          cd "r/router inteligente universal"
          timeout 900 python -m pytest tests "Banco de claves/tests" -q -p no:cacheprovider --maxfail=200 2>&1 | tail -400 > /tmp/despues.txt || true
          grep -E "^(FAILED|ERROR)" /tmp/despues.txt | sed 's/ - .*//' | sort -u > /tmp/despues_fail.txt || true
          tail -1 /tmp/despues.txt
          nuevos=$(comm -13 /tmp/antes_fail.txt /tmp/despues_fail.txt)
          echo "$nuevos" > /tmp/nuevos.txt
          echo "::notice title=TESTS::antes=$(tail -1 /tmp/antes.txt) | despues=$(tail -1 /tmp/despues.txt) | nuevos_fallos=$(echo -n "$nuevos" | grep -c . || true)"
          [ -n "$nuevos" ] && echo "::warning title=NUEVOS_FALLOS::$(echo "$nuevos" | head -15 | tr '\n' ' ')" || true
          echo "::notice title=ERR_DESPUES::$(grep -E '^E  ' /tmp/despues.txt | sort | uniq -c | sort -rn | head -4 | tr '\n' ' ' | cut -c1-600)"
      - name: Subir
        if: ${{ inputs.apply == 'true' }}
        run: |
          cd r
          git rm -q --cached .github/workflows/quitar-cerebras.yml
          git add -u
          git commit -q -m "Router: se elimina Cerebras (codigo, cadenas de agentes, tests, workflows); Groq entra en la cadena g2 [skip ci]"
          for i in 1 2 3; do git push -q origin HEAD:main && break || { git fetch -q origin main && git rebase -q origin/main; }; done
          git log --oneline -1
