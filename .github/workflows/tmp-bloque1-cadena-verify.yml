name: TMP Bloque1 cadena chat verify

# TEMPORAL (Bloque 1, 2026-09-29). Se borra al terminar. Solo workflow_dispatch.
# 1) Pruebas completas ANTES (main) y DESPUES (rama bloque1-cadena-chat) con el mismo conjunto de carpetas.
#    La lista de pruebas que fallan sale en UNA sola anotacion (ordenada + huella sha256) para comparar las dos listas exactas.
# 2) Evidencia en vivo: lista de modelos de NVIDIA/Groq y la cadena real /chat/route y /chat/send provider=auto, con el pool
#    marcando modelos muertos uno a uno (Kimi -> GLM -> DeepSeek -> Qwen Groq -> Nemotron -> todos marcados).
# Resultados como anotaciones ::notice / ::warning (legibles con la API de check-runs). Nunca se imprime un valor de secreto.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main, bloque1-cadena-chat]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/plugins/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/tests/
            router inteligente universal/verifier/
            router inteligente universal/Banco de claves/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic uvicorn huggingface_hub
      - name: Full tests of the tests folder
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider "router inteligente universal/tests" 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          last=$(tail -n 1 /tmp/pytest.txt | tr -d '\r')
          echo "::notice title=B1_${{ matrix.ref }}::exit=${code} | ${last}"
          fails=$(grep -E '^(FAILED|ERROR)' /tmp/pytest.txt | sed 's/ - .*//' | sort | tr '\n' ';')
          count=$(grep -Ec '^(FAILED|ERROR)' /tmp/pytest.txt)
          sha=$(printf '%s' "$fails" | sha256sum | cut -c1-16)
          echo "::notice title=B1_FAILSET_${{ matrix.ref }}::count=${count} sha=${sha} | ${fails}"
          # The new / changed tests on their own, with every test name listed (only meaningful on the branch)
          python -m pytest -q -p no:cacheprovider -rA "router inteligente universal/tests/test_model_pool.py" "router inteligente universal/tests/test_resilience.py" "router inteligente universal/tests/test_nvidia_pool.py" "router inteligente universal/tests/test_plugin_host.py" > /tmp/chain.txt 2>&1
          passed=$(grep -c '^PASSED' /tmp/chain.txt)
          other=$(grep -E '^(FAILED|ERROR|SKIPPED)' /tmp/chain.txt | sed 's/ - .*//' | tr '\n' ';')
          echo "::notice title=B1_CHAIN_TESTS_${{ matrix.ref }}::passed=${passed} | other=${other} | $(tail -n 1 /tmp/chain.txt)"
          names=$(grep '^PASSED' /tmp/chain.txt | sed 's/^PASSED .*:://' | tr '\n' ';')
          echo "::notice title=B1_CHAIN_NAMES_${{ matrix.ref }}::${names}"
          exit 0

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloque1-cadena-chat
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/plugins/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/verifier/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install fastapi httpx pydantic uvicorn huggingface_hub
      - name: Which chain models do NVIDIA and Groq list, and does the real chain answer?
        env:
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
        run: |
          cd "router inteligente universal"
          python - <<'PY'
          import json, os, secrets, sys, tempfile, time
          key = "ci-" + secrets.token_hex(8)
          os.environ["RIU_AGENT_API_KEYS"] = json.dumps({key: "ci-agent"})
          os.environ["RIU_CHAT_ALLOW_PROVIDER_LIVE"] = "1"
          os.environ["RIU_DATA_DIR"] = tempfile.mkdtemp()
          os.environ["RIU_MODEL_COOLDOWN"] = "900"  # a model marked dead in this script stays skipped for the whole run
          sys.path.insert(0, ".")
          from integration.chat_mvp import model_pool, providers as prov, resilience as R

          RES = []  # GitHub keeps only 10 annotations per step: collect everything and print it in a few chunks at the end

          def note(title, msg):
              RES.append("%s: %s" % (title, msg))

          note("B1_KEYS", "; ".join("%s=%d" % (p, len(prov.env_keys(p))) for p in ("nvidia", "groq", "hf")))
          note("B1_CHAIN_RESOLVED", " > ".join("%s/%s" % (e["provider"], e["model"]) for e in R.resolve_chain("default", __import__("datetime").datetime.now(__import__("datetime").timezone.utc))[0]))
          # 1) What each provider lists (the same call the pool makes)
          want = {"nvidia": ["moonshotai/kimi-k3", "z-ai/glm-5.3", "nvidia/nemotron-3-super-120b-a12b"], "groq": ["qwen/qwen3.8-27b"]}
          for p, models in want.items():
              ids = None
              for k in prov.env_keys(p):
                  try:
                      ids = set(prov.list_models(p, k)); break
                  except Exception as e:
                      note("B1_LIST_KEYFAIL", "%s %s" % (p, str(e)[:60]))
              note("B1_LIST_" + p.upper(), "count=%s | %s" % (None if ids is None else len(ids), "; ".join("%s=%s" % (m, "LISTED" if ids and m in ids else "NOT_LISTED") for m in models)))
              if ids:
                  fam = sorted(i for i in ids if any(t in i.lower() for t in ("kimi", "glm", "qwen3", "deepseek-v4", "nemotron-3")))
                  note("B1_FAMILIES_" + p.upper(), ", ".join(fam[:25]))
          # 2) The real chain through /chat/route and /chat/send provider=auto (real providers, real pool)
          from fastapi.testclient import TestClient
          from integration.chat_mvp.app import app
          c = TestClient(app)
          H = {"X-API-Key": key}

          def ask(tag):
              t0 = time.time()
              try:
                  r = c.post("/chat/route", headers=H, json={"group": "default", "message": "Reply with the single word OK", "max_tokens": 512})
                  j = r.json()
                  if r.status_code == 200:
                      note("B1_ROUTE_" + tag, "200 %.1fs model=%s attempt=%s reply_len=%d | trace=%s" % (time.time() - t0, j["route"]["model"], j["route"]["attempt"], len(j["reply"]), j["trace"]))
                  else:
                      note("B1_ROUTE_" + tag, "%d %.1fs %s" % (r.status_code, time.time() - t0, json.dumps(j.get("detail"))[:300]))
              except Exception as e:
                  note("B1_ROUTE_" + tag, "EXC %s" % type(e).__name__)

          def send(tag, message, cid=None):
              t0 = time.time()
              body = {"message": message, "provider": "auto"}
              if cid:
                  body["conversation_id"] = cid
              try:
                  r = c.post("/chat/send", headers=H, json=body)
                  j = r.json()
                  if r.status_code == 200:
                      note("B1_SEND_" + tag, "200 %.1fs provider=%s model=%s auto=%s same_conversation=%s reply_len=%d | trace=%s" % (time.time() - t0, j.get("provider"), j.get("model"), j.get("auto"), (cid is None) or (j.get("conversation_id") == cid), len(j.get("reply") or ""), j.get("trace")))
                      return j.get("conversation_id")
                  note("B1_SEND_" + tag, "%d %.1fs %s" % (r.status_code, time.time() - t0, json.dumps(j.get("detail"))[:300]))
              except Exception as e:
                  note("B1_SEND_" + tag, "EXC %s" % type(e).__name__)
              return cid

          pool = model_pool.POOL
          ask("1_all_healthy")
          cid = send("1_healthy", "Reply with the single word OK")
          pool.mark_bad("nvidia", "moonshotai/kimi-k3", "test: simulated dead")
          ask("2_kimi_dead")
          send("2_kimi_dead_same_conversation", "Now reply with the single word DONE", cid)
          pool.mark_bad("nvidia", "z-ai/glm-5.3", "test: simulated dead")
          ask("3_kimi_glm_dead")
          pool.mark_bad("hf", "deepseek-ai/DeepSeek-V4-Flash", "test: simulated dead")
          ask("4_kimi_glm_deepseek_dead_expect_groq_qwen")
          pool.mark_bad("groq", "qwen/qwen3.8-27b", "test: simulated dead")
          ask("5_only_nemotron_left")
          pool.mark_bad("nvidia", "nvidia/nemotron-3-super-120b-a12b", "test: simulated dead")
          ask("6_all_marked_dead_pool_never_leaves_without_route")
          st = c.get("/chat/router/status", headers=H).json()
          note("B1_STATUS", json.dumps({"attempt_timeout_s": st["attempt_timeout_s"], "cooling": list(st["model_pool"]["cooling"]), "latency": st["latency_seconds"]}))
          md = c.get("/chat/router/models", headers=H)
          note("B1_MODELS_ENDPOINT", "%d %s" % (md.status_code, json.dumps(md.json().get("providers"))[:300]))
          g = md.json().get("groups", {}).get("default", {})
          note("B1_MODELS_DEFAULT_ALL_DEAD", "pool_used=%s try_order=%s skipped=%s" % (g.get("pool_used"), [e["model"] for e in g.get("try_order", [])], g.get("skipped")))
          pv = c.get("/chat/providers").json().get("providers", [])
          am = c.get("/chat/providers/auto/models", headers=H)
          note("B1_PROVIDERS_AUTO", "first=%s configured=%s | auto_models=%d %s" % (pv[0].get("id") if pv else None, pv[0].get("configured") if pv else None, am.status_code, json.dumps(am.json())[:200]))
          chunk, n = "", 0
          for item in RES + [None]:
              if item is None or len(chunk) + len(item) > 3000:
                  if chunk:
                      n += 1
                      print("::notice title=B1_LIVE_%d::%s" % (n, chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))
                  chunk = ""
              if item is not None:
                  chunk += (" || " if chunk else "") + item
          PY

  mutate:
    # Mutation check (Director's rule 05:18: nothing is 100% without proof): break the code on purpose, one change at a time, and see that the tests notice.
    # A mutation counts as KILLED when it makes at least one test fail that does not already fail without the mutation (known failures are subtracted).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        set: [unit, routes]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloque1-cadena-chat
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/adapters/
            router inteligente universal/agents-yaiwes/common/
            router inteligente universal/api/
            router inteligente universal/domain/
            router inteligente universal/enchufe/
            router inteligente universal/engine/
            router inteligente universal/gateway/
            router inteligente universal/integration/
            router inteligente universal/plugins/
            router inteligente universal/red/
            router inteligente universal/security/
            router inteligente universal/tests/
            router inteligente universal/verifier/
            router inteligente universal/Banco de claves/
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic uvicorn huggingface_hub
      - name: Mutations
        env:
          MUT_SET: ${{ matrix.set }}
        run: |
          cd "router inteligente universal"
          python - <<'PY'
          import os, subprocess, sys
          CH = "integration/chat_mvp/"
          SET = os.environ["MUT_SET"]
          UNIT = ["tests/test_model_pool.py", "tests/test_resilience.py"]
          ROUTES = ["tests/test_resilience.py", "tests/test_chat_mvp_app.py"]
          MUTS = {
           "unit": (UNIT, [
            (CH + "resilience.py", "return st[0] < self.threshold and st[2] > 0 and self.clock() - st[2] >= self.cooldown", "return False", "breaker never forgives"),
            (CH + "resilience.py", 'REQUEST_ERRORS = ("PROVIDER_ERROR:400:", "PROVIDER_ERROR:413:", "PROVIDER_ERROR:422:")', 'REQUEST_ERRORS = ("NEVER",)', "400/422 cool the model"),
            (CH + "model_pool.py", "            if probe:\n                until = now + PROBE_LEASE\n                self._bad[(provider, model)] = (until, hit[1])\n                if leased is not None:\n                    leased.append((provider, model, until))\n", "", "no probe lease"),
            (CH + "resilience.py", "use_pool.release(provider, model, until)", "pass", "leases never given back"),
            (CH + "resilience.py", 'raise RouteFailed("ROUTER_SATURATED", trace) from exc', "pass", "busy router does not stop the chain"),
            (CH + "resilience.py", "except Exception as exc:  # noqa: BLE001 - whatever one option raises", "except RuntimeError as exc:  # noqa: BLE001 - whatever one option raises", "only RuntimeError moves the chain on"),
            (CH + "resilience.py", "token = prov.ATTEMPT_DEADLINE.set(option_deadline + waited)", "token = None", "queue wait charged to the model"),
            (CH + "resilience.py", "return value if math.isfinite(value) else 30.0", "return value", "nan/inf attempt timeout accepted"),
            (CH + "resilience.py", 'use_pool.mark_ok(entry["provider"], entry["model"])', "pass", "success does not settle the pool"),
            (CH + "resilience.py", "                    self.breaker.ok(kid)\n", "                    pass\n", "success does not clear the breaker"),
            (CH + "resilience.py", "NO_FAILOVER = {400, 404, 410, 413, 422}", "NO_FAILOVER = {400, 410, 413, 422}", "404 retried on other keys"),
            (CH + "resilience.py", "NO_FAILOVER = {400, 404, 410, 413, 422}", "NO_FAILOVER = {400, 404, 410, 422}", "413 retried on other keys"),
            (CH + "resilience.py", "if last is not None and deadline is not None and time.monotonic() >= deadline:", "if deadline is not None and time.monotonic() >= deadline:", "first key skipped when time is spent"),
            (CH + "model_pool.py", "if hit and hit[0] == until:", "if hit:", "release clears a newer cooldown"),
            (CH + "resilience.py", 'text = str(exc) if isinstance(exc, RuntimeError) else f"{type(exc).__name__}:{exc}"', "text = str(exc)", "non-Runtime errors lose their type"),
            (CH + "resilience.py", 'errbox["e"] = "ROUTER_SATURATED"', "pass", "saturated text lost"),
            (CH + "resilience.py", "budget = 0.0 if limit <= 0 else (prov.CHAT_TIMEOUT if is_last else limit)", "budget = 0.0 if (limit <= 0 or is_last) else limit", "last option without budget"),
            (CH + "model_pool.py", "return value if math.isfinite(value) and value >= 0 else DEFAULT_COOLDOWN", "return value", "no cooldown validation"),
            (CH + "resilience.py", "limit = min(prov.CHAT_TIMEOUT, base * max(1.0, max_tokens / 1024)) if base > 0 else 0.0", "limit = base * max(1.0, max_tokens / 1024) if base > 0 else 0.0", "limit not capped at 90"),
            (CH + "model_pool.py", "            for stale in [k for k in list(prov._models_cache) if k[0] == provider]:  # list(): another thread may add keys meanwhile\n                prov._models_cache.pop(stale, None)\n", "            pass\n", "refresh does not drop cache"),
            (CH + "resilience.py", 'if isinstance(exc, Saturated) or "ROUTER_SATURATED" in text:', "if False:", "busy router treated as dead model"),
            (CH + "resilience.py", "kept, skipped = use_pool.filter(chain, probe=True, leased=leased)", "kept, skipped = use_pool.filter(chain, leased=leased)", "run_policy does not take the probe lease"),
            (CH + "model_pool.py", "DEFAULT_COOLDOWN = 120.0", "DEFAULT_COOLDOWN = 60.0", "default cooldown changed"),
            (CH + "resilience.py", 'use_pool = pool if (pool is not None and policy["authorized_fallback"]) else None', "use_pool = pool", "pool used in groups without authorization"),
            (CH + "resilience.py", "if last is not None and deadline is not None and time.monotonic() >= deadline:", "if False:", "keys still tried after the option time is spent"),
            (CH + "resilience.py", '"chain": [KIMI_K3, GLM_53, DEEPSEEK_FLASH, QWEN_GROQ, NEMOTRON]', '"chain": [NEMOTRON, KIMI_K3, GLM_53, DEEPSEEK_FLASH, QWEN_GROQ]', "Nemotron first instead of last"),
           ]),
           "routes": (ROUTES, [
            (CH + "router.py", '[auto] + [{"id": k', '[{"id": k', "auto not listed first"),
            (CH + "router.py", '"configured": bool(chain)}', '"configured": True}', "auto always configured"),
            (CH + "router.py", 'used_provider, used_model, route_trace = out["route"]["provider"], out["route"]["model"], out["trace"]', 'used_provider, used_model, route_trace = "nvidia", "x", out["trace"]', "auto reports wrong model"),
            (CH + "router.py", 'body["auto"] = True', 'body["auto_"] = True', "auto flag missing in reply"),
            (CH + "router.py", "call=route_call, pool=model_pool.POOL)", "call=route_call)", "send auto without pool"),
            (CH + "router.py", 'if provider == "auto":  # one pseudo-model', 'if provider == "auto_":  # one pseudo-model', "auto has no pseudo-model"),
            (CH + "router.py", 'detail = f"{exc} | " + " ; ".join(trace) if (auto and trace) else str(exc)', "detail = str(exc)", "502 without trace"),
            (CH + "router.py", "        if reply:\n            if not conv:", "        if True:\n            if not conv:", "empty reply saved"),
            (CH + "route_api.py", "pool=model_pool.POOL)", "pool=None)", "/chat/route without pool"),
            (CH + "route_api.py", 'status = 409 if str(exc).startswith("NEEDS_DIRECTOR_AUTH") else 503', "status = 503", "no 409 for missing authorization"),
            (CH + "route_api.py", 'if not policy["authorized_fallback"]:', "if False:", "report uses pool for unauthorized groups"),
            (CH + "route_api.py", "kept, skipped = model_pool.POOL.filter(chain)", "kept, skipped = model_pool.POOL.filter(chain, probe=True)", "report takes the probe lease"),
            (CH + "route_api.py", "if chain and not kept:", "if not kept:", "empty chain reported as pool-emptied"),
            (CH + "route_api.py", '"attempt_timeout_s": resilience.attempt_timeout_s(), ', '"attempt_timeout_": resilience.attempt_timeout_s(), ', "status lacks attempt timeout"),
           ]),
          }
          files, muts = MUTS[SET]

          def run():
              r = subprocess.run([sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider", "-rfE"] + files, capture_output=True, text=True, timeout=900)
              fails = sorted({l.split(" - ")[0].split(" ", 1)[1] for l in r.stdout.splitlines() if l.startswith(("FAILED", "ERROR"))})
              tail = r.stdout.strip().splitlines()[-1] if r.stdout.strip() else ""
              return fails, tail

          RES = []
          base, tail = run()
          RES.append("BASELINE[%s] known_failures=%d | %s | %s" % (SET, len(base), tail, "; ".join(base)[:600]))
          killed = survived = bad = 0
          for path, old, new, label in muts:
              src = open(path, encoding="utf-8").read()
              if src.count(old) != 1:
                  RES.append("BAD_MUTATION %s (found %d times)" % (label, src.count(old)))
                  bad += 1
                  continue
              open(path, "w", encoding="utf-8").write(src.replace(old, new))
              try:
                  fails, _tail = run()
              finally:
                  open(path, "w", encoding="utf-8").write(src)
              new_fails = [f for f in fails if f not in base]
              if new_fails:
                  killed += 1
                  RES.append("KILLED   %s -> %s" % (label, "; ".join(f.split("::")[-1] for f in new_fails)[:160]))
              else:
                  survived += 1
                  RES.append("SURVIVED %s" % label)
          RES.append("TOTAL[%s] killed=%d survived=%d bad=%d of %d" % (SET, killed, survived, bad, len(muts)))
          chunk, n = "", 0
          for item in RES + [None]:
              if item is None or len(chunk) + len(item) > 3000:
                  if chunk:
                      n += 1
                      print("::notice title=B1_MUT_%s_%d::%s" % (SET, n, chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))
                  chunk = ""
              if item is not None:
                  chunk += (" || " if chunk else "") + item
          PY
