name: Prueba OmniRoute en el Router

# Prueba real, sin UI, de la instancia T03 estable dentro de la máquina HF 16 GB.
# Separa dos gates:
#   1) RUNTIME: instancia viva / API OmniRoute accesible. Este es el contrato de T03.
#   2) FREE_PROVIDER: respuesta real de model=auto. Es diagnóstico de disponibilidad upstream.
# Un bloqueo 403/418/429/502 de un proveedor gratuito no vuelve a marcar el runtime como caído.
# Relee LIVE_URL en cada intento. Nunca imprime claves.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          RIU_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, urllib.request, urllib.error

          FLAG = "https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag"
          H = {
              "Authorization": "Bearer " + os.environ["HF_TOKEN"],
              "X-API-Key": os.environ.get("RIU_KEY", ""),
              "Content-Type": "application/json",
              "User-Agent": "riu-prueba",
          }

          def base():
              t = urllib.request.urlopen(FLAG + "?x=" + str(time.time())).read().decode()
              return re.search(r"LIVE_URL=(\S+)", t).group(1).rstrip("/")

          def call(path, body=None, t=60):
              req = urllib.request.Request(
                  base() + path,
                  data=json.dumps(body).encode() if body else None,
                  headers=H,
                  method="POST" if body else "GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=t) as resp:
                      return resp.status, resp.read().decode()[:2500]
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()[:1500]
              except Exception as exc:
                  return 0, type(exc).__name__

          # Bundle precompilado: una sola instancia. No esperar ya 10/10.
          t0, st, vivas = time.time(), "", 0
          while time.time() - t0 < 600:
              code, st = call("/omniroute/status")
              try:
                  vivas = int(json.loads(st).get("vivas", 0))
              except Exception:
                  vivas = 0
              if vivas >= 1:
                  break
              time.sleep(15)

          runtime_ok = vivas >= 1
          print(f"::notice::ROUTER {base()}")
          print(f"::notice::INSTANCIAS_VIVAS {vivas}/1 · {st[:500]}")
          print(f"::notice::OMNIROUTE_RUNTIME_VEREDICTO {'PASS' if runtime_ok else 'FAIL'}")

          # /v1/models puede exigir autenticación de management aunque REQUIRE_API_KEY=false;
          # se registra como diagnóstico y no como gate de runtime.
          code, models = call("/omniroute/v1/models")
          print(f"::notice::MODELOS_DIAGNOSTICO http={code} {models[:400]}")

          free_ok = False
          code, ans = call(
              "/omniroute/v1/chat/completions",
              {
                  "model": "auto",
                  "messages": [{"role": "user", "content": "Responde solo: OK"}],
                  "max_tokens": 64,
              },
              180,
          )
          txt = ""
          try:
              txt = json.loads(ans)["choices"][0]["message"].get("content") or ""
          except Exception:
              pass
          free_ok = code == 200 and bool(txt.strip())
          print(
              f"::notice::CHAT_FREE model=auto http={code} "
              f"respuesta={txt[:80]!r} {ans[:500] if not txt else ''}"
          )
          if free_ok:
              print("::notice::OMNIROUTE_FREE_PROVIDER_VEREDICTO PASS")
          else:
              print("::warning::OMNIROUTE_FREE_PROVIDER_VEREDICTO BLOCKED_UPSTREAM")

          # T03 cierra por runtime estable. La disponibilidad de proveedores gratis
          # se reporta separadamente para no confundir un 403/418/429/502 externo con OOM/crash.
          raise SystemExit(0 if runtime_ok else 1)
          PY
