name: RIU Watchdog

# Every hour: reads the agents' Crazy Walls, writes agents-yaiwes/WATCHDOG/STATUS.md and LOG.md, and re-dispatches `RIU Agents Run` for
# pending agents (max 3 tries per set of closed steps). Deterministic: no LLM, no paid tokens. See README-WATCHDOG-NOTAS-DE-CLAUDE.md.
# Also every 30 min: triggers RIU HF Jobs Audit 32GB (Claude Sentinela path) to cancel Jobs ≠ 32 GB RAM.

on:
  push:
    paths:
      - 'router inteligente universal/agents-yaiwes/agent-16-chat-space-oauth/**'
      - 'router inteligente universal/agents-yaiwes/agent-17-chat-backend-32gb/**'
      - 'router inteligente universal/agents-yaiwes/agent-18-chat-final-auditor/**'
      - '.github/workflows/riu-watchdog.yml'
  schedule:
    - cron: '17 * * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riu-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hourly Crazy Wall pass (also runs on */30 — cheap, deterministic)
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            router inteligente universal/agents-yaiwes/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "router inteligente universal/agents-yaiwes/WATCHDOG/watchdog.py"
      - name: Commit status
        shell: bash
        run: |
          git config user.name "riu-watchdog"
          git config user.email "riu-watchdog@users.noreply.github.com"
          git add "router inteligente universal/agents-yaiwes/WATCHDOG" || true
          git commit -m "watchdog: estado de los agentes" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 4
          done

  hf_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger HF Jobs Audit 32GB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run riu-hf-jobs-audit-32gb.yml --ref main
