name: RIU Validate Provider Keys

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riu-validate-provider-keys.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Hugging Face identity and inference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_RESULT=GAP_SECRET_MISSING"
            exit 0
          fi
          whoami_code=$(curl -sS -o /tmp/hf_whoami.json -w "%{http_code}" -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          echo "HF_WHOAMI_HTTP=${whoami_code}"
          if [ "$whoami_code" != "200" ]; then
            echo "HF_RESULT=FAIL_AUTH"
            exit 1
          fi
          catalog_code=$(curl -sS -o /tmp/hf_models.json -w "%{http_code}" -H "Authorization: Bearer ${HF_TOKEN}" https://router.huggingface.co/v1/models)
          echo "HF_CATALOG_HTTP=${catalog_code}"
          if [ "$catalog_code" != "200" ]; then
            echo "HF_RESULT=FAIL_CATALOG"
            exit 1
          fi
          inference_code=$(curl -sS -o /tmp/hf_chat.json -w "%{http_code}" -H "Authorization: Bearer ${HF_TOKEN}" -H "Content-Type: application/json" -d '{"model":"moonshotai/Kimi-K3","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":5}' https://router.huggingface.co/v1/chat/completions)
          echo "HF_INFERENCE_HTTP=${inference_code}"
          if [ "$inference_code" = "200" ]; then
            echo "HF_RESULT=PASS_AUTH_INFERENCE"
          else
            echo "HF_RESULT=FAIL_INFERENCE"
            exit 1
          fi

      - name: Validate Groq
        env:
          PROVIDER_KEY: ${{ secrets.GROQ_API_KEY_1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROVIDER_KEY:-}" ]; then echo "GROQ_RESULT=GAP_SECRET_MISSING"; exit 0; fi
          code=$(curl -sS -o /tmp/groq.json -w "%{http_code}" -H "Authorization: Bearer ${PROVIDER_KEY}" https://api.groq.com/openai/v1/models)
          echo "GROQ_HTTP=${code}"
          [ "$code" = "200" ] && echo "GROQ_RESULT=PASS" || { echo "GROQ_RESULT=FAIL"; exit 1; }

      - name: Validate NVIDIA
        env:
          PROVIDER_KEY: ${{ secrets.NVIDIA_API_KEY_1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROVIDER_KEY:-}" ]; then echo "NVIDIA_RESULT=GAP_SECRET_MISSING"; exit 0; fi
          code=$(curl -sS -o /tmp/nvidia.json -w "%{http_code}" -H "Authorization: Bearer ${PROVIDER_KEY}" https://integrate.api.nvidia.com/v1/models)
          echo "NVIDIA_HTTP=${code}"
          [ "$code" = "200" ] && echo "NVIDIA_RESULT=PASS" || { echo "NVIDIA_RESULT=FAIL"; exit 1; }

      - name: Validate Cerebras
        env:
          PROVIDER_KEY: ${{ secrets.CEREBRAS_API_KEY_1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROVIDER_KEY:-}" ]; then echo "CEREBRAS_RESULT=GAP_SECRET_MISSING"; exit 0; fi
          code=$(curl -sS -o /tmp/cerebras.json -w "%{http_code}" -H "Authorization: Bearer ${PROVIDER_KEY}" https://api.cerebras.ai/v1/models)
          echo "CEREBRAS_HTTP=${code}"
          [ "$code" = "200" ] && echo "CEREBRAS_RESULT=PASS" || { echo "CEREBRAS_RESULT=FAIL"; exit 1; }
