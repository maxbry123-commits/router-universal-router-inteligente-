name: tmp-puentes-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloque3-puentes
          sparse-checkout: |
            router inteligente universal/plugins
            router inteligente universal/tests/test_puentes_plugins.py
            router inteligente universal/integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest fastapi httpx huggingface_hub
      - name: tests puentes (mocks, sin gasto)
        working-directory: router inteligente universal
        run: python -m pytest tests/test_puentes_plugins.py -v -rs
