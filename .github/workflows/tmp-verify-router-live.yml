name: TMP verify router live

# TEMPORAL (2026-09-29). Se borra al terminar. Solo estados y cuerpos cortos; nunca imprime claves.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_1 }}
          ROUTER_KEY: ${{ secrets.RIU_ROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          flag = urllib.request.urlopen("https://raw.githubusercontent.com/maxbry123-commits/router-universal-router-inteligente-/main/router%20inteligente%20universal/agents-yaiwes/ROUTER_JOB_PAUSE.flag").read().decode()
          url = re.search(r"^LIVE_URL=(\S+)", flag, re.M).group(1)
          H = {"Authorization": "Bearer " + os.environ["HF_TOKEN"], "X-API-Key": os.environ["ROUTER_KEY"], "Content-Type": "application/json"}
          def call(path, body=None):
              req = urllib.request.Request(url + path, data=json.dumps(body).encode() if body is not None else None, headers=H, method="POST" if body is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=150) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
              except Exception as e:
                  return -1, type(e).__name__
          rows = []
          for name, path, body, n in [("HEALTH", "/health", None, 200),
                                      ("ROUTER_STATUS", "/chat/router/status", None, 900),
                                      ("PLUGINS", "/plugins", None, 1200),
                                      ("SEND_AUTO", "/chat/send", {"message": "Reply with the single word OK", "provider": "auto", "max_tokens": 64}, 900)]:
              s, b = call(path, body)
              rows.append(f"{name} url={url} status={s} body={b[:n]}")
          print("::notice title=TMP_VERIFY_LIVE::" + " || ".join(rows).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
