name: Extraction Repair 01 NO-LFS 2026-09-03
run-name: Extraction repair 01 NO-LFS • ${{ github.run_id }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [extraction-repair-01-needed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/extraction-repair-01-no-lfs-20260903.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: extraction-repair-01-no-lfs-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Disable LFS filters locally without modifying component sources
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false

      - name: Extract next bounded batch
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/extract_guardian_repair_20260903.py --audit-only > pre-audit.json
          LIMIT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open("pre-audit.json"))
          gaps=d.get("remaining_gaps",[])
          if not gaps:
              print(1); raise SystemExit
          root=Path("router inteligente software/componentes todos/componentes descargados")
          max_components=6
          max_parts=40
          selected=0
          total_parts=0
          for row in gaps[:max_components]:
              slug=row["slug"]
              n=len(list(root.rglob(slug+"_*.zip")))
              n=max(n,1)
              if selected and total_parts+n>max_parts:
                  break
              if not selected and n>max_parts:
                  selected=1
                  break
              selected+=1
              total_parts+=n
          print(max(selected,1))
          PY
          )"
          echo "ADAPTIVE_LIMIT=$LIMIT"
          python3 scripts/extract_guardian_repair_20260903.py --limit "$LIMIT" | tee extraction-result.json

      - name: Materialize source pointers over HTTPS and enforce plain-Git gates
        id: materialize
        if: ${{ steps.extract.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, sys, urllib.parse, urllib.request
          from pathlib import Path

          ROOT = Path("router inteligente software/componentes todos/componentes descargados")
          MANIFEST = Path("Download code router inteligente universal/RESEARCH_DOWNLOAD_MANIFEST.jsonl")
          POINTER = b"version https://git-lfs.github.com/spec/v1\n"
          MAX_BLOB = 100 * 1024 * 1024

          def norm(s): return re.sub(r"[^a-z0-9]+", "", s.lower())

          manifest = {}
          for line in MANIFEST.read_text().splitlines():
              if not line.strip():
                  continue
              d = json.loads(line)
              if d.get("slug"):
                  manifest[norm(d["slug"])] = d

          def parse_pointer(data):
              txt = data.decode("utf-8", "strict")
              oid = re.search(r"^oid sha256:([0-9a-f]{64})$", txt, re.M)
              size = re.search(r"^size ([0-9]+)$", txt, re.M)
              if not oid or not size:
                  raise RuntimeError("INVALID_SOURCE_POINTER")
              return oid.group(1), int(size.group(1))

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent":"yaiwes-repair/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read(MAX_BLOB + 1)

          materialized = []
          failures = []

          for p in sorted(x for x in ROOT.rglob("*") if x.is_file()):
              try:
                  size = p.stat().st_size
                  if size >= MAX_BLOB:
                      failures.append({"path":str(p),"error":"GIT_BLOB_LIMIT_GAP","bytes":size})
                      continue
                  if size > 1024:
                      continue
                  data = p.read_bytes()
                  if not data.startswith(POINTER):
                      continue

                  rel = p.relative_to(ROOT)
                  slug = rel.parts[0]
                  source_rel = Path(*rel.parts[1:]).as_posix()
                  meta = manifest.get(norm(slug))
                  if not meta or not meta.get("source") or not meta.get("source_commit"):
                      failures.append({"path":str(p),"error":"SOURCE_TRACE_GAP"})
                      continue

                  m = re.match(r"https://github\.com/([^/]+)/([^/]+?)(?:\.git)?$", meta["source"])
                  if not m:
                      failures.append({"path":str(p),"error":"SOURCE_URL_GAP","source":meta["source"]})
                      continue

                  owner, repo = m.group(1), m.group(2)
                  commit = meta["source_commit"]
                  oid, expected_size = parse_pointer(data)
                  quoted = urllib.parse.quote(source_rel, safe="/")
                  urls = [
                      f"https://github.com/{owner}/{repo}/raw/{commit}/{quoted}",
                      f"https://media.githubusercontent.com/media/{owner}/{repo}/{commit}/{quoted}",
                  ]

                  actual = None
                  last = None
                  for url in urls:
                      try:
                          blob = fetch(url)
                          if blob.startswith(POINTER):
                              last = "POINTER_RETURNED"
                              continue
                          actual = blob
                          break
                      except Exception as e:
                          last = repr(e)

                  if actual is None:
                      failures.append({"path":str(p),"error":"SOURCE_OBJECT_FETCH_GAP","detail":last})
                      continue
                  if len(actual) != expected_size:
                      failures.append({"path":str(p),"error":"SOURCE_OBJECT_SIZE_MISMATCH","expected":expected_size,"actual":len(actual)})
                      continue
                  got = hashlib.sha256(actual).hexdigest()
                  if got != oid:
                      failures.append({"path":str(p),"error":"SOURCE_OBJECT_SHA_MISMATCH","expected":oid,"actual":got})
                      continue
                  if len(actual) >= MAX_BLOB:
                      failures.append({"path":str(p),"error":"GIT_BLOB_LIMIT_GAP","bytes":len(actual)})
                      continue

                  p.write_bytes(actual)
                  materialized.append({"path":str(p),"sha256":got,"bytes":len(actual),"source":meta["source"],"commit":commit})
              except Exception as e:
                  failures.append({"path":str(p),"error":"MATERIALIZE_EXCEPTION","detail":repr(e)})

          remaining_pointers = []
          oversized = []
          for p in sorted(x for x in ROOT.rglob("*") if x.is_file()):
              try:
                  sz = p.stat().st_size
                  if sz >= MAX_BLOB:
                      oversized.append({"path":str(p),"bytes":sz})
                  if sz <= 1024 and p.read_bytes().startswith(POINTER):
                      remaining_pointers.append(str(p))
              except OSError:
                  pass

          report = {
              "schema":"yaiwes.no_lfs.materializer.v1",
              "materialized":materialized,
              "failures":failures,
              "remaining_pointers":remaining_pointers,
              "oversized":oversized,
              "verdict":"PASS" if not failures and not remaining_pointers and not oversized else "GAP"
          }
          Path("forensics/extraction").mkdir(parents=True, exist_ok=True)
          Path("forensics/extraction/materialize-current.json").write_text(json.dumps(report, indent=2, ensure_ascii=False)+"\n")
          print(json.dumps(report, ensure_ascii=False))
          if report["verdict"] != "PASS":
              sys.exit(73)
          PY

      - name: Recompute deterministic tree hashes after materialization
        if: ${{ steps.extract.outcome == 'success' && steps.materialize.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024), b""):
                      h.update(b)
              return h.hexdigest()

          def tree_digest(root):
              h=hashlib.sha256(); count=0; total=0
              for p in sorted((x for x in root.rglob("*") if x.is_file()), key=lambda x:x.as_posix()):
                  rel=p.relative_to(root).as_posix()
                  if p.suffix.lower()==".zip" or p.name in {"RESEARCH_DOWNLOAD_MANIFEST.jsonl","EXTRACTION_GUARDIAN_REPORT.json"}:
                      continue
                  h.update(rel.encode()+b"\0")
                  h.update(digest(p).encode()+b"\n")
                  count += 1
                  total += p.stat().st_size
              return h.hexdigest(),count,total

          result_path=Path("extraction-result.json")
          d=json.loads(result_path.read_text())
          for row in d.get("processed",[]):
              root=Path(row["target"])
              sha,n,b=tree_digest(root)
              row["tree_sha256"]=sha
              row["files"]=n
              row["bytes"]=b
              row["post_materialization_hash"]=True

          result_path.write_text(json.dumps(d,ensure_ascii=False)+"\n")
          evidence=Path("forensics/extraction")/f"repair-{os.environ.get('GITHUB_RUN_ID','local')}.json"
          if evidence.exists():
              evidence.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({"rehashed":[{"slug":x["slug"],"tree_sha256":x["tree_sha256"],"files":x["files"],"bytes":x["bytes"]} for x in d.get("processed",[])]},ensure_ascii=False))
          PY

      - name: Commit extracted trees and immutable evidence
        id: publish
        if: ${{ steps.extract.outcome == 'success' && steps.materialize.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . ':(exclude).github/workflows'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "fix(extraction): repair bounded NO-LFS batch [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push --no-verify origin HEAD:main; then
                exit 0
              fi
              test "$attempt" -lt 3 || exit 41
              sleep $((attempt*10))
            done
          fi

      - name: Read-back, independent pointer audit, and persistent dispatch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "EXTRACT_OUTCOME=${{ steps.extract.outcome }}"
          echo "MATERIALIZE_OUTCOME=${{ steps.materialize.outcome }}"
          echo "PUBLISH_OUTCOME=${{ steps.publish.outcome }}"

          if [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "GAP: publish did not complete; no blind redispatch"
            exit 41
          fi

          git fetch origin main
          git reset --hard origin/main

          python3 scripts/extract_guardian_repair_20260903.py --audit-only | tee audit-result.json

          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          ROOT = Path("router inteligente software/componentes todos/componentes descargados")
          POINTER = b"version https://git-lfs.github.com/spec/v1\n"

          pointers=[]
          oversized=[]
          for p in ROOT.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  size=p.stat().st_size
                  if size >= 100*1024*1024:
                      oversized.append({"path":str(p),"bytes":size})
                  if size <= 1024 and p.read_bytes().startswith(POINTER):
                      pointers.append(str(p))
              except OSError:
                  pass

          d=json.load(open("audit-result.json"))
          gaps=d["remaining_gaps"]
          result={
            "remaining_gaps":len(gaps),
            "remaining_slugs":[x["slug"] for x in gaps],
            "remaining_source_pointers":pointers,
            "oversized_blobs":oversized,
            "verdict":"VERIFIED_CLOSED" if not gaps and not pointers and not oversized else "GAPS_PENDING"
          }
          Path("forensics/extraction/readback-current.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,ensure_ascii=False))
          if pointers or oversized:
              sys.exit(74)
          PY

          GAPS="$(python3 - <<'PY'
          import json
          print(len(json.load(open("audit-result.json"))["remaining_gaps"]))
          PY
          )"
          echo "REMAINING_GAPS=$GAPS"
          if [ "$GAPS" -gt 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=extraction-repair-01-needed
            echo "NEXT_REPAIR_DISPATCHED gaps=$GAPS"
          else
            echo "VERIFIED_CLOSED"
          fi
