# Ficha respaldo-hf -> harness DeepSeek (directo por HTTP, sin pasar por el Router de GitHub). El harness NO se edita: este patch es parte de la ficha.
# Uso: RESPALDO_HF_URL=https://<job>--8080.hf.jobs HF_TOKEN=<token HF del banco> DSH_TELEMETRY_MODE=DISABLED \
#   dsh headless --patch 'router inteligente universal/fichas/respaldo-hf/harness-respaldo.cordis.yml' "tarea"
# Cada job sirve UN modelo (el que se encendio): qwen3.8-27b o qwen3.6-35b.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: agent-default-model
  config:
    provider: respaldo-hf
    model: qwen3.6-35b
- id: llm-pi-ai
  config:
    providers:
      respaldo-hf:
        displayName: Router de respaldo HF (L4)
        apiKeyEnv: HF_TOKEN
        api: openai-completions
        baseURL: !!js (process.env.RESPALDO_HF_URL || '') + '/v1'
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3.8-27b
            name: Qwen 3.8 27B (arquitectura, plan, revision)
            contextWindow: 16384
            maxTokens: 4096
          - id: qwen3.6-35b
            name: Qwen 3.6 35B (codigo, ejecucion)
            contextWindow: 16384
            maxTokens: 4096
