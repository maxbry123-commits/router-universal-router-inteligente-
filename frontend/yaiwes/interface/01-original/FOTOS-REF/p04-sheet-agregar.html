<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FROMTED p04 — Sheet Agregar al chat (Claude)</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh;align-items:flex-end}
.phone{width:100%;max-width:390px;min-height:100dvh;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--sheet);border-radius:16px 16px 0 0;padding:12px 14px 28px;border:1px solid var(--border);border-bottom:0}
.handle{width:36px;height:4px;background:#444;border-radius:2px;margin:0 auto 12px}
.head{display:flex;align-items:center;margin-bottom:14px}
.head h2{flex:1;text-align:center;font-size:16px;font-weight:600}
.head button{border:0;background:transparent;color:var(--dim);width:32px}
.head button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;font-size:12px;color:var(--dim)}
.tile svg{width:22px;height:22px;stroke:var(--white);fill:none;stroke-width:1.5;margin:0 auto 8px;display:block}
.list .row{display:flex;align-items:center;gap:12px;padding:14px 8px;border-radius:12px}
.list .row svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:1.6}
.list .row span{flex:1;font-size:15px}
.list .row .sub{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.toggle{width:42px;height:26px;border-radius:13px;background:#333;position:relative;border:0}
.toggle.on{background:var(--blue)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:19px}
.chev{color:var(--dim);font-size:18px}
</style>
</head>
<body>
<div class="phone">
  <div class="sheet">
    <div class="handle"></div>
    <div class="head">
      <button aria-label="cerrar"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h2>Agregar al chat</h2>
      <span style="width:32px"></span>
    </div>
    <div class="grid3">
      <div class="tile"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Cámara</div>
      <div class="tile"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Fotos</div>
      <div class="tile"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Archivos</div>
    </div>
    <div class="list">
      <div class="row"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Investigación</span><button class="toggle" type="button" aria-label="off"></button></div>
      <div class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M2 12h20"/></svg><span>Búsqueda web</span><button class="toggle on" type="button" aria-label="on"></button></div>
      <div class="row"><svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span>Agregar al proyecto<span class="sub">Ninguno</span></span><span class="chev">›</span></div>
      <div class="row"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Acceso a herramientas<span class="sub">Auto</span></span><span class="chev">›</span></div>
      <div class="row"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Conectores</span><span class="chev">›</span></div>
    </div>
  </div>
</div>
</body>
</html>
