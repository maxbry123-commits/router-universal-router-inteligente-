<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FROMTED v2 — 02 Artifact</title>
<style>
:root {
  --bg: #0d0d0d; --surface: #171717; --border: #2a2a2a;
  --white: #f5f5f5; --gray-1: #b8b8b8; --gray-2: #8a8a8a;
  --orange: #ff6b1a; --blue: #2f6bff; --green: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #000; color: var(--white); min-height: 100dvh;
  display: flex; justify-content: center;
}
.phone {
  width: 100%; max-width: 390px; min-height: 100dvh; background: var(--bg);
  display: flex; flex-direction: column;
}
.bar {
  display: flex; align-items: center; padding: 12px 14px; gap: 8px;
  border-bottom: 1px solid var(--border);
}
.bar button {
  border: 0; background: transparent; color: var(--gray-2);
  width: 36px; height: 36px; display: grid; place-items: center;
}
.bar button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.bar h1 { flex: 1; text-align: center; font-size: 15px; font-weight: 600; color: var(--white); }
/* naranja SOLO en palabra Descargar — no botón relleno */
.dl {
  background: transparent !important; border: 0; color: var(--orange) !important;
  font-size: 13px; font-weight: 600; width: auto !important; padding: 0 4px;
  letter-spacing: 0.02em;
}
.tabs { display: flex; gap: 20px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.tabs span { font-size: 13px; color: var(--gray-2); }
.tabs span.on { color: var(--blue); } /* seleccionado = letras azul */
.preview {
  margin: 16px; flex: 1; min-height: 220px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
}
.preview .box {
  width: 72%; height: 58%; border-radius: 8px; border: 1px solid #333;
  background: linear-gradient(160deg, #222, #111 60%, #1a1a1a);
}
.meta {
  padding: 0 16px 8px; font-size: 12px; color: var(--gray-2);
  display: flex; justify-content: space-between;
}
.actions {
  display: flex; gap: 8px; padding: 8px 16px 16px; flex-wrap: wrap;
}
/* botones SIN color de relleno */
.actions button {
  flex: 1; min-width: 40%; padding: 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--white); font-size: 13px;
}
.note {
  margin: 0 16px 20px; padding: 12px; border-radius: 12px;
  border: 1px solid var(--border); background: #121212;
  font-size: 12px; color: var(--gray-2); line-height: 1.4;
}
.note .g { color: var(--green); margin-top: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <button aria-label="cerrar"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <h1>Artifact</h1>
    <button class="dl" type="button">Descargar</button>
  </div>
  <div class="tabs">
    <span class="on">Imagen</span>
    <span>Código</span>
    <span>MD</span>
  </div>
  <div class="preview"><div class="box"></div></div>
  <div class="meta"><span>1024×1024 · local</span><span>msg #12</span></div>
  <div class="actions">
    <button type="button">Copiar enlace</button>
    <button type="button">Anclar al chat</button>
  </div>
  <div class="note">
    Título de acción de archivo usa naranja solo en la palabra <span style="color:var(--orange)">Descargar</span> / <span style="color:var(--orange)">Cargar</span>.
    <div class="g">● Guardado en tu dispositivo</div>
  </div>
</div>
</body>
</html>
