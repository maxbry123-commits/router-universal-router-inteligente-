# SATÉLITE CENTRAL CONECCION — registro fusionado de cableado y conexiones
# Fuente maestra: SYSTEM_WIRING_REGISTRY.yaml (main). Inventario de pares: connections/registry.yaml (38 pares, resumidos abajo).
# Solo referencias. Ningun secreto. Estados: DISCOVERED, CONFIGURED, TESTING, ACTIVE, FAILED, BLOCKED, DEPRECATED, ORPHANED.
# Una conexion pasa a ACTIVE solo con prueba real de ejecucion (7 condiciones del umbral).

version: 1
schema: repo.wiring.ciwr/v1
principio: >-
  Registro maestro: no copia, no mueve y no ejecuta codigo. Documenta donde esta cada componente,
  como se conecta y con que evidencia. Una conexion no pasa a ACTIVE por estar configurada.

# 0. UMBRAL DE ACTIVACION
umbral_active:
  condiciones: [autenticacion_valida, conexion_real_con_el_proveedor, solicitud_de_inferencia_ejecutada, respuesta_valida_del_modelo, tiempo_de_respuesta_registrado, sin_errores_criticos]
  regla: una prueba superficial NO activa una conexion

# 1. PLATAFORMAS
plataformas:
  github: {rol: codigo_fuente_unico, rama_publicada: main}
  huggingface: {rol: espejo_auto_pull_minimo, regla: nunca es la fuente; el Space arranca con auto-pull del repo}
  vercel: {rol: frontend_publicado, regla: sin despliegue nuevo sin autorizacion expresa}
  computo: {rol: servidores_de_pago, perfil: {ram_gb: 32, tipo: cpu, en_hf: cpu-upgrade}, prohibido: cpu-basic}

# 2. COMPONENTES
componentes:
  - {id: chatbot, ruta: chat-router/chatbot/}
  - {id: chat_router, ruta: chat-router/chat/, subrutas: {frontend: chat-router/chat/frontend/, backend: chat-router/chat/backend/, espejo_openclaw: chat-router/chat/espejo/espejo_prod.js}}
  - {id: swe_code_free, ruta: chat-router/SWE CODE free/}
  - {id: swe_code, ruta: chat-router/SWE CODE/}
  - {id: router_mvp, ruta: router-mvp/, subrutas: {raiz_router: router-mvp/raiz_router/, raiz_fichas_prompt: router-mvp/raiz_fichas_prompt/, mvp: router-mvp/mvp/, router: router-mvp/router/}}
  - {id: router_swe_code, ruta: chat-router/SWE CODE/mini_router.py}
  - {id: harness_deepseek, ruta: chat-router/harness/, subrutas: {backend: chat-router/chat/backend/deepseek_harness/, plugin_registrado: chat-router/plugins/deepseek_harness/}}
  - {id: registro_central, ruta: connections/, subrutas: {maestro: SYSTEM_WIRING_REGISTRY.yaml, pares: connections/registry.yaml, topologia: connections/topology.yaml, endpoints: connections/endpoints.yaml, healthchecks: connections/healthchecks.yaml, mapa: chat-router/MAPA.md}}
  - {id: agentes, ruta: chat-router/agentes/}
  - {id: loop_cola_watchdog, ruta: chat-router/Loop cola wachdog/, subrutas: {loop: Loop/, cola: Cola/, watchdog: wachdog/, workflow: chat-router/workflow-loop-code-yaiwes/}}
  - {id: system_prompt_motores, ruta: router-mvp/raiz_fichas_prompt/, subrutas: {motores: chat-router/motores/, fabrica_motores: chat-router/motores/fabrica-motores/}}
  - {id: memoria, ruta: chat-router/memoria/, subrutas: {memoria_yaiwes: chat-router/memoria/memoria-yaiwes/, hf_datasets: chat-router/memoria/hf_datasets/}}
  - {id: plugins, ruta: chat-router/plugins/}

# 3. SERVICIOS (consumidor <-> proveedor)
servicios:
  - {id: nvidia, tipo: llm_provider, consumidor: [selector_de_modelos, harness_deepseek, agentes], proveedor: NVIDIA_BASE_URL, auth_ref: NVIDIA_API_KEY, healthcheck: inferencia real (requerido), fallback: [groq, modelos_locales], estado: DISCOVERED}
  - {id: groq, tipo: llm_provider, consumidor: [selector_de_modelos, harness_deepseek], proveedor: GROQ_BASE_URL, auth_ref: GROQ_API_KEY, healthcheck: inferencia real (requerido), fallback: [modelos_locales], estado: DISCOVERED}
  - {id: deepseek_harness, tipo: distribution_harness, consumidor: [chat_router, agentes, motores, loop_cola_watchdog], proveedor: chat-router/harness/, contrato: handoff/contracts/harness_contract.md, healthcheck: contrato (requerido), estado: CONFIGURED}
  - {id: modelos_locales, tipo: llm_provider, consumidor: [selector_de_modelos, chat_router], proveedor: chat-router/SWE CODE/, politica: 1_modelo_por_servidor, fallback: [nvidia, groq], estado: DISCOVERED}
  - {id: memoria, tipo: storage, consumidor: [chat_router, agentes, loop_cola_watchdog], proveedor: chat-router/memoria/, transporte: harness_plugin, healthcheck: escribir, ACK, leer, comparar (requerido), estado: DISCOVERED}
  - {id: storage, tipo: storage, consumidor: [chat_router, agentes, loop_cola_watchdog], proveedor: chat-router/memoria/hf_datasets/, plugin: chat-router/plugins/hf_storage/, healthcheck: escribir, reiniciar, leer (requerido), estado: DISCOVERED}
  - {id: mcp_router_riu, tipo: tool_server, consumidor: [chat_router, agentes, watchdog], proveedor: COMAND-CENTER-1/riu-router, transporte: mcp, healthcheck: mcp (requerido), estado: TESTING, evidencia: "initialize OK + tools/list = 14 (2026-11-06)"}
  - {id: space_riu_router, tipo: servidor_http, consumidor: [chat_router, vercel, watchdog], proveedor: COMAND-CENTER-1/riu-router (cpu-upgrade), healthcheck: http 200 con commit, estado: TESTING, evidencia: "/health 200 con commit (2026-11-06)"}
  - {id: vercel_frontend, tipo: hosting_frontend, consumidor: [usuarios], proveedor: VERCEL_PROJECT, healthcheck: no es gate, estado: DISCOVERED}
  - {id: github_source, tipo: source_of_truth, consumidor: [huggingface_mirror, vercel_frontend, agentes], proveedor: main, estado: CONFIGURED}
  - {id: huggingface_mirror, tipo: mirror, consumidor: [space_riu_router], proveedor: COMAND-CENTER-1/riu-router (auto-pull en arranque), healthcheck: commit del health == HEAD (requerido), estado: CONFIGURED}
  - {id: cola_servidores, tipo: orquestacion, consumidor: [chat_router, agentes, modelos_locales], policy: 85_por_ciento_salta, 15_min_duerme, estado: DISCOVERED}
  - {id: watchdog, tipo: supervision, consumidor: [vercel_frontend, queue, space_riu_router], trigger: vercel_al_encender, estado: DISCOVERED}
  - {id: system_prompt, tipo: instruccion_raiz, consumidor: [harness_deepseek, agentes, motores], proveedor: router-mvp/raiz_fichas_prompt/, estado: DISCOVERED}
  - {id: openclaw, tipo: gateway_independiente, consumidor: [usuarios, agentes], proveedor: chat-router/chat/espejo/espejo_prod.js, healthcheck: responde con el Router caido (requerido), estado: DISCOVERED}

# 4. CONEXIONES (C-001..C-014)
conexiones:
  - {id: C-001, consumidor: chat_router, proveedor: deepseek_harness, protocolo: inproc_python, estado: DISCOVERED}
  - {id: C-002, consumidor: deepseek_harness, proveedor: nvidia, protocolo: http, estado: DISCOVERED}
  - {id: C-003, consumidor: deepseek_harness, proveedor: groq, protocolo: http, estado: DISCOVERED}
  - {id: C-004, consumidor: deepseek_harness, proveedor: modelos_locales, protocolo: http, estado: DISCOVERED}
  - {id: C-005, consumidor: agentes, proveedor: deepseek_harness, protocolo: harness_plugin, estado: DISCOVERED}
  - {id: C-006, consumidor: loop_cola_watchdog, proveedor: deepseek_harness, protocolo: harness_plugin, estado: DISCOVERED}
  - {id: C-007, consumidor: chat_router, proveedor: mcp_router_riu, protocolo: mcp, estado: DISCOVERED}
  - {id: C-008, consumidor: chat_router, proveedor: memoria, protocolo: harness_plugin, estado: DISCOVERED}
  - {id: C-009, consumidor: agentes, proveedor: storage, protocolo: harness_plugin, estado: DISCOVERED}
  - {id: C-010, consumidor: vercel_frontend, proveedor: space_riu_router, protocolo: http, estado: DISCOVERED}
  - {id: C-011, consumidor: space_riu_router, proveedor: github_source, protocolo: git_auto_pull, estado: CONFIGURED}
  - {id: C-012, consumidor: watchdog, proveedor: modelos_locales, protocolo: http, estado: DISCOVERED}
  - {id: C-013, consumidor: watchdog, proveedor: queue, protocolo: inproc_python, estado: DISCOVERED}
  - {id: C-014, consumidor: openclaw, proveedor: modelos_locales, protocolo: http, estado: DISCOVERED}

# 4b. PARES DE connections/registry.yaml (resumen, sin copiar)
pares_inventario:
  total: 38
  estado: pending_audit (todos)
  protocolo: gateway_pending_audit (todos)
  evidencia: ninguna
  fuente: https://github.com/maxbry123-commits/router-universal-router-inteligente-/blob/main/connections/registry.yaml

# 5. HANDOFFS
handoffs: https://github.com/maxbry123-commits/router-universal-router-inteligente-/blob/main/handoff%20central/README.md

# 6. ESTADOS
estados: [DISCOVERED, CONFIGURED, TESTING, ACTIVE, FAILED, BLOCKED, DEPRECATED, ORPHANED]

# 7. PENDIENTES DEL OWNER
pendientes_owner:
  - {id: O1, tema: semantica_del_space, pregunta: "espejo real o auto-pull?"}
  - {id: O2, tema: watchdog_publica_en_main, pregunta: "sigue publicando commits en main fuera del DAG?"}
