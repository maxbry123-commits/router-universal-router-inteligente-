name: Repair duplicate MCP Python SDK only
on:
  push:
    paths:
      - '.github/workflows/repair-duplicate-mcp-python-sdk.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: research-download-chain-final
  cancel-in-progress: false
jobs:
  relocate-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: relocate duplicate without deletion or overwrite
        run: |
          set -euo pipefail
          SRC="Download code router/MCP-Python-SDK_0001.zip"
          DEST="Auditoria duplicados router/MCP-Python-SDK_0001.zip"
          test -e "$SRC"
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          git mv "$SRC" "$DEST"
      - name: commit traceable relocation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m 'fix(router): relocate duplicate MCP Python SDK archive'
          git push origin HEAD:main
