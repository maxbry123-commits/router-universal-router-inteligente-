# input_block_verbatim.yaml — reglas y tareas pendientes

input_block:
  version: "1.0"
  repo: "maxbry123-commits/router-universal-router-inteligente-"
  repo_url: "https://github.com/maxbry123-commits/router-universal-router-inteligente-.git"
  forbidden:
    - "force-push sin --force-with-lease"
    - "push a main sin autorizacion expresa del owner"
    - "push de arbol al Space (solo rebuild por API)"
    - "modificar ops/research_prepass.py"
    - "crear GitHub Actions, LFS o despliegues nuevos"
    - "rotar o imprimir claves"
    - "usar disco del contenedor o sandbox para codigo del owner (solo API de GitHub)"
  limits:
    max_nodes_parallel: 2
    max_retries_per_node: 3
  accept:
    push_ok_requires: ["rc=0", "ls-remote == HEAD"]
    rebuild_ok_requires: ["stage==RUNNING", "health.commit == main_sha"]

  tareas_pendientes:
    - id: T01
      tarea: "Auditar notas de agentes en el repo; dejar solo codigo, README, handoffs y cableado"
    - id: T02
      tarea: "Skill unificado de frontend FROMTED x YAIWES, con revision del chat"
    - id: T03
      tarea: "Organizar raices y motores de descarga, extraccion, busqueda, copiar y mover"
    - id: T04
      tarea: "Verificar componentes open source sueltos y enviarlos a Componentes/"
    - id: T05
      tarea: "Mover agentes a Agentes/"
    - id: T06
      tarea: "Mover almacenamiento y memoria a Memoria/ y luego a memoria/, con centinela de conteos"
    - id: T07
      tarea: "Recablear con el Satelite Central"
    - id: T08
      tarea: "Listar componentes de memoria y almacenamiento conectados al harness DeepSeek"
    - id: T09
      tarea: "Dar la URL de origen de cada componente y los enlaces a los motores de descarga y extraccion"
    - id: T10
      tarea: "Limpiar Claude notas.md e input_block_verbatim.yaml, dejando reglas y referencias de metodo"
    - id: T11
      tarea: "Confirmar fe57c122ed en main (limpieza de Claude notas.md subida sin autorizacion registrada)"
