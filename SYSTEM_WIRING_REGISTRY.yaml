  - {id: C-012, consumidor: watchdog, proveedor: modelos_locales, protocolo: http, archivo: chat-router/Loop cola wachdog/wachdog/, estado: DISCOVERED}
  - {id: C-013, consumidor: watchdog, proveedor: queue, protocolo: inproc_python, archivo: chat-router/Loop cola wachdog/wachdog/, estado: DISCOVERED}
  - {id: C-014, consumidor: openclaw, proveedor: modelos_locales, protocolo: http, archivo: chat-router/chat/espejo/espejo_prod.js, estado: DISCOVERED}

# ---------------------------------------------------------------------------------------------
# 5. HANDOFFS (documentos por area; el maestro NO los copia)
# ---------------------------------------------------------------------------------------------
handoffs:
  frontend: handoff/docs/HANDOFF_FRONTEND.md
  agentes: handoff/docs/HANDOFF_AGENTS.md
  modelos: handoff/docs/HANDOFF_MODELS.md
  memoria: handoff/docs/HANDOFF_MEMORY.md
  harness: handoff/docs/HANDOFF_HARNESS.md

# ---------------------------------------------------------------------------------------------
# 6. ESTADOS Y REGLAS DE TRANSICION
# ---------------------------------------------------------------------------------------------
estados:
  - {id: DISCOVERED, significa: existe y esta documentado; sin prueba}
  - {id: CONFIGURED, significa: esta cableado en codigo/config; sin prueba de ejecucion}
  - {id: TESTING, significa: hay sonda real en curso}
  - {id: ACTIVE, significa: cumple las 7 condiciones del umbral}
  - {id: FAILED, significa: la sonda fallo con evidencia}
  - {id: BLOCKED, significa: depende de una decision o credencial del owner}
  - {id: DEPRECATED, significa: sustituido; se conserva el enlace de compatibilidad}
  - {id: ORPHANED, significa: sin consumidor ni funcion demostrable; a cuarentena, nunca borrado sin evidencia}
niveles_de_evidencia:
  - documentada
  - encontrada_en_codigo
  - probada_en_ejecucion
  - rota_o_pendiente
reglas:
  - "Todo servicio tiene consumidor, proveedor, protocolo, endpoint/referencia, contrato, healthcheck y fallback."
  - "Ninguna conexion se declara activa sin las 7 condiciones."
  - "Los secretos solo se referencian; jamas se guardan aqui."
  - "El estado se actualiza con evidencia; no por configuracion."
  - "GitHub Actions y LFS prohibidos; los jobs pesados se trocean (E1..E8)."

# ---------------------------------------------------------------------------------------------
# 7. EXCLUSIONES Y PENDIENTES DEL OWNER
# ---------------------------------------------------------------------------------------------
exclusiones:
  motor_research_prepass:
    estado: NO_AUTORIZADO
    regla: "permanece intacto; el problema sigue pendiente; autorizar solo tras error + contexto + regresion, guardando el codigo anterior"
  claves:
    estado: INTACTAS
    regla: "ninguna quedo expuesta; no se tocan; solo referencias por entorno"
pendientes_owner:
  - {id: O1, tema: semantica_del_space, pregunta: "espejo real o auto-pull (el boot clona main)?"}
  - {id: O2, tema: watchdog_publica_en_main, pregunta: "sigue publicando commits en main fuera del DAG?"}
