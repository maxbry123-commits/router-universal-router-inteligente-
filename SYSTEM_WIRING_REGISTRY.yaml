version: "1.0.0"
updated: "2026-11-11"
planos:
  data_plane:
    nombre: "Router MVP v1"
    ruta: "ROUTER MVP v1/system_prompt_py/"
    rama: "ccr-f01c3de9-bmry0s"
    rol: "Ejecuta y almacena. Nunca decide."
    endpoints:
      - "POST /v1/chat/completions"
      - "GET /health"
      - "GET /control-plane/status"
    componentes:
      - openai_compatible_proxy.py
      - control_bridge.py
      - key_pool.py
      - fallback_middleware.py
      - provider_window.py
      - provider_timeouts.py
      - queue_manager.py
    proveedores: ["groq", "nvidia"]
  control_plane:
    nombre: "Router LLM HF"
    ruta: "router_llm_hf/"
    rama: "ccr-f01c3de9-bmry0s"
    rol: "Decide y controla. Nunca computa."
    componentes:
      - queue_manager.py
      - watchdog.py
      - recall_engine.py
      - output_contract.py
      - escalation_guard.py
      - mode_router.py
    integracion: "control_bridge.py importa este paquete al arrancar el Data Plane"
  hf_plane:
    nombre: "Hugging Face Spaces"
    rol: "Solo pesos, datasets, LoRAs y cascaron. Nunca logica de control."
    spaces:
      - id: "s1"
        modelo: "Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF"
        archivo: "qwen2.5-coder-0.5b-instruct-q5_k_m.gguf"
      - id: "s2"
        modelo: "LiquidAI/LFM2.5-350M-GGUF"
        archivo: "LFM2.5-350M-Q4_K_M.gguf"
      - id: "s3"
        modelo: "Qwen/Qwen3-0.6B-GGUF"
        archivo: "Qwen3-0.6B-Q8_0.gguf"
    persistencia: "Buckets/Datasets. Spaces stateless."
  control_hf:
    nombre: "Centro de control Hugging Face"
    ruta: "control huggueface/"
    rama: "ccr-f01c3de9-bmry0s"
    rol: "Pausa, reinicio, sleep-time, mirror, wake, registry."
    componentes:
      - control_api.py
      - bootstrap_spaces.py
      - sync_to_hf.py
      - hf_upload.sh
      - mirror_spaces.py
      - trigger_wake.py
      - registry_models.py
    seguridad: "ROUTER_API_KEY obligatoria, falla cerrado. HF_TOKEN por entorno."
conexiones:
  - consumidor: "data_plane"
    proveedor: "control_plane"
    via: "control_bridge.py import router_llm_hf"
    fallback: "passthrough si control_plane ausente"
  - consumidor: "control_hf"
    proveedor: "hf_plane"
    via: "HfApi restart_space/pause_space/set_space_sleep_time"
  - consumidor: "hf_plane"
    proveedor: "data_plane"
    via: "entrypoint.sh git clone de GitHub"
estado_general: "CERRADO salidas 1/3, 2/3, 3/3. Pendiente operacional: prueba Groq, GITHUB_BRANCH y MODEL_* en HF Secrets, decision main."
