<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FROMTED p07 — Sidebar Claude-style</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:390px;min-height:100dvh;background:var(--bg);padding:20px 16px;display:flex;flex-direction:column}
.brand{font-family:Georgia,serif;font-size:28px;font-weight:500;margin-bottom:22px}
.nav .item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;color:var(--dim);font-size:15px;margin-bottom:2px}
.nav .item.on{background:var(--elev);color:var(--white)}
.nav .item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .sec{font-size:12px;color:#666;margin:16px 10px 8px}
.nav .pill{margin-left:8px;background:var(--blue);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--border)}
.av{width:36px;height:36px;border-radius:50%;background:var(--elev);display:grid;place-items:center;color:var(--dim);font-weight:600}
.user .meta .n{font-size:14px}.user .meta .p{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">FROMTED</div>
  <nav class="nav">
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nuevo chat</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Chats</div>
    <div class="item on"><svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg> Proyectos</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 3l9 6v12H3V9l9-6z"/></svg> Artefactos</div>
    <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Personalizar</div>
    <div class="sec">Productos</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg> Código</div>
    <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg> Diseño <span class="pill">Nuevo</span></div>
  </nav>
  <div class="user"><div class="av">M</div><div class="meta"><div class="n">Max</div><div class="p">Plan local</div></div></div>
</div>
</body>
</html>
