<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FROMTED v2 — 04 Directorio (base 80% + iconos línea)</title>
<style>
/* Parte de design-04 que aprobaste ~80%, corregido:
   - iconos SVG línea monocromo (no emoji de color)
   - botones sin relleno de color
   - naranja solo palabra Descargar/Cargar
   - azul solo letras/focus seleccionados
   - verde solo texto notificación */
:root {
  --bg: #141414; --sheet: #1c1c1c; --elev: #252525; --border: #333;
  --white: #f0f0f0; --dim: #9b9b9b;
  --orange: #ff6b1a; --blue: #2f6bff; --green: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  display: flex; justify-content: center; min-height: 100dvh;
}
.phone { width: 100%; max-width: 390px; min-height: 100dvh; background: var(--bg); }
.sheet {
  margin: 8px; background: var(--sheet); border-radius: 16px;
  min-height: calc(100dvh - 16px); padding: 16px 14px 24px; border: 1px solid #2a2a2a;
}
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.head h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; }
.head button { border: 0; background: transparent; color: var(--dim); width: 32px; height: 32px; }
.head button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav {
  display: flex; gap: 20px; margin-bottom: 14px; font-size: 14px; color: var(--dim);
}
.nav span { display: inline-flex; align-items: center; gap: 6px; }
.nav span.on { color: var(--white); }
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--elev); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 12px; border: 1px solid transparent;
}
.search:focus-within { border-color: var(--blue); }
.search svg { width: 16px; height: 16px; stroke: var(--dim); fill: none; stroke-width: 1.6; flex-shrink: 0; }
.search input {
  flex: 1; background: transparent; border: 0; outline: 0; color: var(--white); font-size: 14px;
}
.search input::placeholder { color: var(--dim); }
.pills { display: flex; gap: 8px; margin-bottom: 12px; }
.pill {
  padding: 8px 14px; border-radius: 20px; background: var(--elev);
  color: var(--dim); font-size: 13px; border: 0;
}
.pill.on { color: var(--blue); } /* letras azul, no fondo azul */
.filters { display: flex; gap: 8px; margin-bottom: 14px; }
.filter {
  flex: 1; padding: 10px 12px; border-radius: 12px; background: var(--elev);
  color: var(--white); font-size: 13px; border: 0; text-align: left;
}
.row {
  display: flex; align-items: center; gap: 12px;
  background: var(--elev); border-radius: 14px; padding: 12px; margin-bottom: 8px;
}
.row.sel { box-shadow: inset 0 0 0 1px #3a3a3a; }
.row .ico {
  width: 40px; height: 40px; border-radius: 10px; background: #1a1a1a;
  display: grid; place-items: center; color: var(--dim);
}
.row .ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.row .meta { flex: 1; }
.row .meta .n { font-size: 14px; }
.row .meta .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
.row .add {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--white); display: grid; place-items: center;
}
.row .add svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.bottom { display: flex; gap: 8px; margin-top: 16px; }
.bottom button {
  flex: 1; padding: 12px; border-radius: 12px; font-size: 13px;
  background: var(--elev); border: 1px solid var(--border); color: var(--white);
}
/* texto naranja como título de acción, no botón pintado */
.bottom .link-orange {
  background: transparent; border: 0; color: var(--orange); font-weight: 600;
}
.foot {
  margin-top: 14px; font-size: 12px; color: var(--dim); line-height: 1.4;
}
.foot .g { color: var(--green); margin-top: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="sheet">
    <div class="head">
      <h1>Directorio</h1>
      <button aria-label="cerrar"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="nav">
      <span class="on">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Archivos
      </span>
      <span>
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        Notas
      </span>
      <span>
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Plugins
      </span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input placeholder="Buscar en dispositivo…" />
    </div>
    <div class="pills">
      <button class="pill on" type="button">Local</button>
      <button class="pill" type="button">Anclados</button>
      <button class="pill" type="button">Recientes</button>
    </div>
    <div class="filters">
      <button class="filter" type="button">Filtrar por ▾</button>
      <button class="filter" type="button">Ordenar ▾</button>
    </div>
    <div class="row sel">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></div>
      <div class="meta"><div class="n">plan-fromted.md</div><div class="s">MD · anclado</div></div>
      <button class="add" aria-label="añadir"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="row">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
      <div class="meta"><div class="n">artifact.png</div><div class="s">Imagen · local</div></div>
      <button class="add" aria-label="añadir"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="row">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
      <div class="meta"><div class="n">spec.pdf</div><div class="s">PDF</div></div>
      <button class="add" aria-label="añadir"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="bottom">
      <button type="button">Cerrar</button>
      <button class="link-orange" type="button">Descargar</button>
    </div>
    <div class="foot">
      Iconos línea monocromo (como fotos Grok/Claude). Botones grises. Naranja solo en la etiqueta Descargar.
      <div class="g">● Datos solo en tu dispositivo</div>
    </div>
  </div>
</div>
</body>
</html>
