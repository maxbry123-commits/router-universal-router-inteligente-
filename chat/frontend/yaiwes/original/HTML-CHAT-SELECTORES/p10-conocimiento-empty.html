<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FROMTED p10 — Conocimiento empty + menú +</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:390px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.top button{border:0;background:transparent;color:var(--dim);width:36px;height:36px}
.top button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.top h1{font-size:17px;font-weight:600}
.bar{height:3px;background:var(--elev);border-radius:2px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;width:0%;height:100%;background:var(--blue)}
.cap{font-size:13px;color:var(--dim);margin-bottom:40px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--dim)}
.mid svg{width:44px;height:44px;stroke:#555;fill:none;stroke-width:1.4;margin-bottom:14px}
.mid p{font-size:14px;line-height:1.5;max-width:280px}
.btn{padding:14px;border-radius:28px;border:0;background:#e8e8e8;color:#111;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
/* overlay menu like minimax left */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;max-width:390px;margin:0 auto}
.panel{width:78%;background:var(--sheet);height:100%;padding:16px 12px;border-right:1px solid var(--border)}
.panel .item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;font-size:14px;color:var(--dim)}
.panel .item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.panel .item.on{background:var(--elev);color:var(--white)}
.panel .sec{font-size:11px;color:#666;margin:14px 10px 6px}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <button aria-label="atrás"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Conocimiento del proyecto</h1>
  </div>
  <div class="bar"><i></i></div>
  <div class="cap">0% de la capacidad del proyecto utilizada</div>
  <div class="mid">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15h6"/></svg>
    <p>Agrega documentos, texto o código para usarlos como contexto en todas las conversaciones.</p>
  </div>
  <button class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15h6"/></svg> Agregar contenido</button>
</div>
</body>
</html>
