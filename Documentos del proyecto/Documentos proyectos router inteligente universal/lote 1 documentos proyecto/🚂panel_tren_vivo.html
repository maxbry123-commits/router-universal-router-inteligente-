<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Tren en Vivo 🚂 · NCT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;600&display=swap');
  :root{--pino:#0E2A1F;--panel:#0B211A;--borde:#1E4634;--papel:#F2EDE3;
        --laton:#C9A24B;--rojo:#D6453D;--menta:#7FD1A8;--tinta:#DCE8DF;
        --ambar:#E8B23A}
  *{box-sizing:border-box;margin:0}
  body{background:
    radial-gradient(1200px 500px at 70% -10%, #14382A 0%, var(--pino) 60%);
    color:var(--tinta);font:14px/1.5 'IBM Plex Mono',monospace;
    padding:14px;min-height:100vh;overflow-x:hidden}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--laton);padding-bottom:10px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:900;
     font-size:clamp(22px,4.5vw,36px);color:var(--papel)}
  h2{font-family:'Fraunces',Georgia,serif;color:var(--papel);font-size:16px;
     margin-bottom:8px}
  .sub{color:var(--laton);font-size:12px}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .caja{background:var(--panel);border:1px solid var(--borde);
        border-radius:10px;padding:14px}
  button{background:var(--laton);color:#1B1406;border:0;padding:9px 13px;
    border-radius:6px;font:600 13px 'IBM Plex Mono',monospace;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  button:focus-visible{outline:3px solid var(--menta)}
  button.fantasma{background:transparent;color:var(--laton);
    border:1px solid var(--laton)}
  /* ── el tren ── */
  .via{overflow-x:auto;padding:18px 4px 6px;white-space:nowrap}
  .tren{display:inline-flex;align-items:flex-end;gap:6px}
  .loco{font-size:34px;transform:translateY(4px)}
  .vagon{width:74px;border-radius:8px 8px 4px 4px;padding:7px 4px 5px;
    text-align:center;cursor:pointer;border:1px solid #00000055;
    box-shadow:0 3px 0 #00000066;font-size:11px;color:#10140F;
    position:relative;transition:transform .15s}
  .vagon:hover{transform:translateY(-3px)}
  .vagon::after{content:"●●";letter-spacing:26px;position:absolute;
    bottom:-11px;left:12px;color:#0A130E;font-size:9px}
  .done{background:var(--menta)} .running{background:var(--ambar)}
  .pending{background:#8FA396} .failed{background:var(--rojo);color:var(--papel)}
  .humo{position:absolute;top:-16px;left:6px;font-size:11px;opacity:.85}
  .detalle{margin-top:10px;background:#07160F;border:1px solid var(--borde);
    border-radius:8px;padding:10px;font-size:12.5px;min-height:44px}
  /* ── arbol de salud ── */
  .arbol{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .rama{background:#07160F;border:1px solid var(--borde);border-radius:7px;
    padding:7px;font-size:11px;text-align:center;cursor:pointer}
  .rama b{display:block;font-size:15px}
  /* ── aprobaciones y ledger ── */
  .prop{display:flex;gap:8px;align-items:center;background:#07160F;
    border:1px solid var(--borde);border-radius:8px;padding:9px;
    margin-bottom:7px;font-size:12.5px;flex-wrap:wrap}
  .prop .txt{flex:1;min-width:160px}
  .ledger{font-size:11px;max-height:130px;overflow:auto;background:#07160F;
    border:1px solid var(--borde);border-radius:8px;padding:8px}
  .ledger div{border-bottom:1px dashed #1E4634;padding:3px 0}
  .parte{white-space:pre-wrap;background:#07160F;border:1px dashed var(--laton);
    border-radius:8px;padding:10px;font-size:12.5px;margin-top:8px}
  .fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .copo{position:fixed;top:-20px;color:#FFFFFFAA;user-select:none;
    pointer-events:none;animation:caer linear forwards}
  @keyframes caer{to{transform:translateY(105vh) rotate(200deg)}}
  @media(prefers-reduced-motion:reduce){.copo{display:none}
    .vagon{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Panel del Tren en Vivo</h1>
  <span class="sub">NCT · vagones 🟢🟡🔴 · árbol de salud · firmas al ledger</span>
  <span class="sub" style="margin-left:auto" id="reloj"></span>
</header>

<div class="grid">
  <section class="caja">
    <h2>🚂 El tren (toca un vagón)</h2>
    <div class="via"><div class="tren" id="tren"></div></div>
    <div class="detalle" id="detalle">Toca un vagón para ver su ficha…</div>
    <div class="fila">
      <button id="btnAvanzar">▶ Avanzar tren</button>
      <button id="btnFallo" class="fantasma">💥 Simular fallo</button>
      <button id="btnNieve" class="fantasma">❄️ Nieve</button>
    </div>
    <h2 style="margin-top:14px">🎄 Árbol de salud (16 ramas)</h2>
    <div class="arbol" id="arbol"></div>
  </section>

  <section class="caja">
    <h2>🖋️ Cola de aprobaciones (tu firma → ledger)</h2>
    <div id="props"></div>
    <h2>📜 Ledger (hash-chain)</h2>
    <div class="ledger" id="ledger"><div>GENESIS</div></div>
    <div class="fila">
      <button id="btnParte">🎅 Generar Parte de Santa</button>
      <button id="btnCopiar" class="fantasma">📋 Copiar p/ Telegram</button>
    </div>
    <div class="parte" id="parte" hidden></div>
  </section>
</div>

<script>
// Estado en memoria — espejo del backend NCT (mismos nombres, misma ley)
const NODOS = ["T-001 boot","T-002 router","T-003 auth","T-004 cola",
 "T-005 providers","T-006 gateway","T-007 bus","T-008 gcl/z3",
 "T-009 loops","T-010 witness","T-011 memoria","T-012 sentinela",
 "T-013 fase_runner","T-014 generador","T-015 fichas","T-016 frontend",
 "T-017 interfaces","T-018 saas"];
const RAMAS = ["kernel","planner","loops","gcl","cognitivo","fichas","team",
 "escritor","runtime","router","memoria","contracts","frontend",
 "workspaces","sentinela","fase0"];
const S = {estados: NODOS.map((_,i)=> i<8 ? "done" : "pending"),
           props: [
  {id:"PROP-001", txt:"Sentinela: subir techo_tokens 50k→80k (presión 85%)"},
  {id:"PROP-002", txt:"Canary Router: pasar de 10% a 100% (0 errores/24h)"},
  {id:"PROP-003", txt:"Lote 1A fichas E-001..E-010: 10/10 humo verde 💡"}],
           ledger: [], prevHash: "GENESIS", nieve: false};
const $=id=>document.getElementById(id);
const LUZ={done:"done",running:"running",pending:"pending",failed:"failed"};

async function hash(txt){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0"))
         .join("").slice(0,16);
}
function pintaTren(){
  const t=$("tren"); t.innerHTML="<span class='loco'>🚂</span>";
  S.estados.forEach((e,i)=>{
    const v=document.createElement("div");
    v.className="vagon "+LUZ[e];
    v.innerHTML=(e==="running"?"<span class='humo'>💨</span>":"")+
      NODOS[i].split(" ")[0]+"<br><small>"+NODOS[i].split(" ")[1]+"</small>";
    v.onclick=()=>$("detalle").textContent=
      `🗂️ ${NODOS[i]} · estado: ${e} · `+
      (e==="done"?"certificado por witness ✅":
       e==="failed"?"escalera recovery: retry→rollback… ⛑️":
       e==="running"?"loop 9 fases en curso, anclas 📌 activas":
       "esperando dependencias del DAG-001");
    t.appendChild(v);});
}
function pintaArbol(){
  const a=$("arbol"); a.innerHTML="";
  const done=S.estados.filter(e=>e==="done").length;
  RAMAS.forEach((r,i)=>{
    const salud=i<done?"🟢":i<done+2?"🟡":"⚪";
    const d=document.createElement("div");
    d.className="rama"; d.innerHTML=`<b>${salud}</b>${r}`;
    d.onclick=()=>$("detalle").textContent=
      `🎄 rama ${r}: ${salud==="🟢"?"sana, tests verdes":
        salud==="🟡"?"en obra, loop activo":"pendiente de encendido"}`;
    a.appendChild(d);});
}
function pintaProps(){
  const p=$("props"); p.innerHTML="";
  S.props.forEach(pr=>{
    const d=document.createElement("div"); d.className="prop";
    d.innerHTML=`<span class="txt">${pr.id} · ${pr.txt}</span>`;
    const b=document.createElement("button"); b.textContent="Firmar 🖋️";
    b.onclick=async()=>{
      const h=await hash(S.prevHash+pr.id+pr.txt);
      S.prevHash=h;
      S.ledger.push(`🖋️ ${pr.id} firmada · ${h}…`);
      S.props=S.props.filter(x=>x.id!==pr.id);
      const l=document.createElement("div");
      l.textContent=S.ledger[S.ledger.length-1];
      $("ledger").appendChild(l); pintaProps();};
    const n=document.createElement("button"); n.className="fantasma";
    n.textContent="Rechazar";
    n.onclick=()=>{S.props=S.props.filter(x=>x.id!==pr.id);pintaProps();};
    d.append(b,n); p.appendChild(d);});
  if(!S.props.length) p.innerHTML=
    "<div class='prop'>✅ cola vacía — el Sentinela sigue vigilando</div>";
}
$("btnAvanzar").onclick=()=>{
  const run=S.estados.indexOf("running");
  if(run>=0) S.estados[run]="done";
  const pend=S.estados.indexOf("pending");
  if(pend>=0) S.estados[pend]="running";
  pintaTren(); pintaArbol();};
$("btnFallo").onclick=()=>{
  const run=S.estados.indexOf("running");
  if(run>=0){S.estados[run]="failed";
    $("detalle").textContent=
      `⛑️ ${NODOS[run]} falló → recovery: retry (1/6). WAL intacto.`;
    setTimeout(()=>{S.estados[run]="running";pintaTren();},1600);}
  pintaTren();};
function parte(){
  const done=S.estados.filter(e=>e==="done").length;
  const run=NODOS.filter((_,i)=>S.estados[i]==="running")
                 .map(n=>n.split(" ")[0]);
  return ["🎅 PARTE DE SANTA — taller NCT",
    `🎄 progreso: ${done}/${NODOS.length} `+"🟢".repeat(done)+
      "⚪".repeat(NODOS.length-done),
    `🚂 en marcha: ${run.join(", ")||"ninguno"}`,
    `🖋️ firmas en ledger: ${S.ledger.length} ✅ íntegro`,
    "🛷 el trineo sigue en ruta"].join("\n");
}
$("btnParte").onclick=()=>{$("parte").hidden=false;
  $("parte").textContent=parte();};
$("btnCopiar").onclick=async()=>{
  await navigator.clipboard.writeText(parte());
  $("btnCopiar").textContent="📋 ¡Copiado!";
  setTimeout(()=>$("btnCopiar").textContent="📋 Copiar p/ Telegram",1200);};
$("btnNieve").onclick=()=>{S.nieve=!S.nieve; if(S.nieve) nevar();};
function nevar(){
  if(!S.nieve) return;
  const c=document.createElement("span"); c.className="copo";
  c.textContent="❄"; c.style.left=Math.random()*100+"vw";
  c.style.fontSize=(8+Math.random()*12)+"px";
  c.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),9500); setTimeout(nevar,240);}
setInterval(()=>$("reloj").textContent=
  new Date().toLocaleTimeString("es"),1000);
S.estados[8]="running"; pintaTren(); pintaArbol(); pintaProps();
</script>
</body>
</html>
