    \ puede leer este archivo en cualquier momento como fuente visible de la conversación\
    \ con Agent 14.\n6. Sol/ChatGPT actúa solo como supervisor/mensajero del Director:\
    \ transmite órdenes del Director y devuelve al Director las respuestas de Agent\
    \ 14.\n7. No reinterpretar ni resumir instrucciones del Director cuando estén\
    \ marcadas como VERBATIM.\n8. Las respuestas nuevas de Agent 14 deben añadirse\
    \ sin borrar instrucciones previas del Director.\n\n## Contrato INPUT BLOCK VERBATIM\
    \ 1:1\n\nToda instrucción del Director marcada como INPUT VERBATIM se conserva\
    \ exactamente 1:1.\n\nSi un agente ejecutor no cumple las instrucciones del nodo\
    \ exactamente dentro de su alcance:\n- ese resultado NO cuenta como PASS;\n- Agent\
    \ 14 debe marcar GAP;\n- debe indicar FIX;\n- máximo 2 reintentos;\n- si continúa\
    \ incumpliendo, queda fuera de ese nodo y Agent 14 lo reasigna si corresponde.\n\
    \n## Objetivo global\n\nEntregar CHAT YAIWES 100% probado y funcionando con todas\
    \ las instrucciones del Director.\n\nDeadline operativo ordenado por el Director:\n\
    2026-09-23 01:32 America/Bogota.\n\nPASS global solo con evidencia real. Nunca\
    \ por descripción, promesa o texto generado.\n\n## Protocolo de respuesta de Agent\
    \ 14\n\nCada vez que exista una nueva orden del Director, Agent 14 debe responder\
    \ aquí con:\n\n### RESPUESTA AGENT 14\n\n**ORDEN RECIBIDA VERBATIM:**  \n(copiar\
    \ referencia o texto literal)\n\n**CONCLUSIÓN DEL OBJETIVO:**  \n(qué entiende\
