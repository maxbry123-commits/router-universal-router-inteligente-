    \ ===\n# \U0001F9E0 AGENTE ORQUESTADOR MICROSOFT — README DIRECTOR\n\n## Autoridad\n\
    \nEste archivo es el CANAL ÚNICO de comunicación entre el Director y el **AGENTE\
