<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLA Panel</title>
<style>
:root{--bg:#0d1117;--p:#161b22;--l:#30363d;--t:#e6edf3;--d:#8b949e;--ok:#3fb950;--w:#d29922;--e:#f85149;--a:#58a6ff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--t)}
header{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--l);flex-wrap:wrap}
h1{font-size:15px;margin:0 12px 0 0;color:var(--a)}
input,button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--a)}
.b{padding:3px 8px;border-radius:999px;font-size:12px;border:1px solid var(--l)}
.b.ok{color:var(--ok);border-color:var(--ok)}.b.w{color:var(--w);border-color:var(--w)}.b.e{color:var(--e);border-color:var(--e)}
main{padding:12px}.pn{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:10px;margin-bottom:12px}
.pn h2{font-size:13px;margin:0 0 8px;color:var(--d);text-transform:uppercase}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--l)}
.r:last-child{border:0}.k{color:var(--d)}.v{color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.cell{background:var(--bg);border:1px solid var(--l);border-radius:6px;padding:8px;text-align:center}
.cell .n{font-size:20px}.cell .l{font-size:11px;color:var(--d)}
.cell.h .n{color:var(--e)}.cell.n .n{color:var(--w)}.cell.l .n{color:var(--a)}
.bar{height:6px;background:var(--l);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0%;background:var(--ok)}
.bar.hot i{background:var(--e)}
</style>
</head>
<body>
<header>
<h1>COLA · Prioridad</h1>
<input id="api" size="22" value="http://localhost:7861">
<input id="key" size="10" type="password" placeholder="API Key">
<button id="mM">DEMO</button>
<button id="mR">REFRESH</button>
<span id="c" class="b w">DEMO</span>
</header>
<main>
<section class="pn"><h2>Prioridades (QueueManager)</h2>
<div class="grid">
<div class="cell h"><div class="n" id="pH">0</div><div class="l">HIGH</div></div>
<div class="cell n"><div class="n" id="pN">0</div><div class="l">NORMAL</div></div>
<div class="cell l"><div class="n" id="pL">0</div><div class="l">LOW</div></div>
</div></section>
<section class="pn"><h2>Estado · MAX_RAM_PCT = 85.0</h2>
<div class="r"><span class="k">encoladas</span><span class="v" id="qS">0</span></div>
<div class="r"><span class="k">activas (1 por modelo)</span><span class="v" id="qA">0</span></div>
<div class="r"><span class="k">saltos por RAM</span><span class="v" id="qK">0</span></div>
<div class="bar" id="rB"><i id="rF"></i></div>
<div class="r"><span class="k">RAM %</span><span class="v" id="rP">0</span></div>
</section>
</main>
<script>
var ALLOWED=["http://localhost:7860","http://localhost:7861","http://localhost:8080"];
var $=function(i){return document.getElementById(i)};
var live=false,loop=true,tick=0;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/`/g,"&#96;").replace(/\//g,"&#47;")}
function api(p,o){var h={};var k=$("key").value.trim();if(k)h["X-API-Key"]=k;o=o||{};o.headers=Object.assign({},h,o.headers);return fetch($("api").value.replace(/\/$/,"")+p,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function demo(){tick++;var hi=tick%3,lo=(tick*3)%2,no=(tick*2)%4;var act=tick%2;var ram=40+((tick*7)%55);var sk=Math.floor(tick/7);
return{high:hi,normal:no,low:lo,queue:hi+no+lo,active:act,ram:ram,skips:sk}}
function render(d){$("pH").textContent=d.high;$("pN").textContent=d.normal;$("pL").textContent=d.low;
$("qS").textContent=d.queue;$("qA").textContent=d.active;$("qK").textContent=d.skips;
$("rP").textContent=Math.round(d.ram);$("rF").style.width=Math.min(100,d.ram)+"%";
$("rB").className="bar"+(d.ram>=85?" hot":"")}
function refresh(){if(live){api("/capa/status").then(function(s){render({high:s.high||0,normal:s.normal||0,low:s.low||0,queue:s.queue_size||0,active:(s.active_tasks||[]).length,ram:s.ram_pct||0,skips:s.skips_by_ram||0});$("c").className="b ok";$("c").textContent="LIVE"}).catch(function(){live=false;$("mM").textContent="DEMO";$("c").className="b e";$("c").textContent="DEMO";render(demo())});return}render(demo())}
$("mM").onclick=function(){live=!live;$("mM").textContent=live?"LIVE":"DEMO";refresh()};
$("mR").onclick=refresh;
window.addEventListener("message",function(ev){
var origin=ev.origin||"";
var ok=ALLOWED.indexOf(origin)>=0||ev.source===window.parent;
if(!ok){console.warn("postMessage rechazado:",origin);return}
var d=ev.data||{};
if(d&&d.type==="capa:refresh")refresh();
});
try{if(window.parent!==window)window.parent.postMessage({type:"capa:ready",panel:"cola"},"*")}catch(e){}
setInterval(function(){if(loop)refresh()},2000);
render(demo());
</script>
</body>
</html>
