<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hermes · Agente de Comunicación</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font-family: monospace; padding: 20px; text-align: center; }
  h2 { color: #58a6ff; }
  .status-box { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; margin-top: 20px; }
  .status-ok { color: #3fb950; font-size: 24px; }
  .status-err { color: #f85149; font-size: 24px; }
</style>
</head>
<body>
  <h2>📡 Hermes Agent</h2>
  <div class="status-box">
    <div id="status-icon" class="status-err">❌</div>
    <div id="status-text" style="margin-top:10px; color:#8b949e;">Verificando conexión...</div>
  </div>
  <script>
    fetch("https://comand-center-1-local-llm-router.hf.space/health")
      .then(r => {
        if(r.ok) {
          document.getElementById('status-icon').textContent = "✅";
          document.getElementById('status-icon').className = "status-ok";
          document.getElementById('status-text').textContent = "Hermes está conectado al router.";
        } else { throw new Error("Fallback"); }
      })
      .catch(() => {
        document.getElementById('status-icon').textContent = "❌";
        document.getElementById('status-text').textContent = "Hermes no está disponible. El mirror no existe.";
      });
  </script>
</body>
</html>
