<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTION · Panel</title>
<style>
body{margin:0;font:13px/1.4 monospace;background:#0d1117;color:#e6edf3}
header{padding:10px;border-bottom:1px solid #30363d;display:flex;gap:8px;align-items:center}
h1{font-size:14px;margin:0;color:#58a6ff}
input,button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:5px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:#58a6ff}
main{padding:12px}
video,iframe{width:100%;max-height:calc(100vh - 100px);border:1px solid #30363d;border-radius:6px;background:#000}
</style></head><body>
<header>
<h1>🎬 MOTION</h1>
<input id="src" size="34" placeholder="/artifacts/motion/motion.mp4">
<button id="load">LOAD</button>
</header>
<main><video id="vid" controls></video></main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"'`\/]/g,c=>`&#${c.charCodeAt(0)};`)}
$("load").onclick=()=>{const u=$("src").value.trim()||"/artifacts/motion/motion.mp4";$("vid").src=esc(u);$("vid").play().catch(()=>{})};
window.addEventListener("message",e=>{if(e.data?.type==="motion:load"&&e.data.url)$("vid").src=e.data.url});
try{window.parent.postMessage({type:"capa:ready",panel:"motion"},"*")}catch(e){}
</script>
</body></html>
