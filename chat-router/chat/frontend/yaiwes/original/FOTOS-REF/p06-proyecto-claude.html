<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FROMTED p06 — Proyecto / conocimiento</title>
<style>
:root{--bg:#0d0d0d;--sheet:#1c1c1c;--elev:#252525;--border:#2e2e2e;--white:#f0f0f0;--dim:#9b9b9b;--orange:#ff6b1a;--blue:#2f6bff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:var(--white);display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:390px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px 20px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.top button{border:0;background:transparent;color:var(--dim);width:36px;height:36px}
.top button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.top h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--elev);border:1px solid var(--border);color:var(--dim);font-size:12px;margin-bottom:14px;width:fit-content}
.badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.note{border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--dim);font-size:14px;line-height:1.45;margin-bottom:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.card{background:var(--sheet);border:1px solid var(--border);border-radius:14px;padding:16px;min-height:100px}
.card .t{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--white)}
.card .a{font-size:14px;color:var(--orange);font-weight:500} /* Agregar = naranja como foto Claude */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:20px}
.empty svg{width:48px;height:48px;stroke:#555;fill:none;stroke-width:1.4;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.5;max-width:260px}
.btn{margin-top:auto;align-self:center;padding:12px 20px;border-radius:24px;border:0;background:#e8e8e8;color:#111;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <button aria-label="atrás"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  </div>
  <h1 style="margin-bottom:10px">FROMTED</h1>
  <div class="badge"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Privado</div>
  <div class="note">La memoria del proyecto aparecerá después de algunas conversaciones.</div>
  <div class="cards">
    <div class="card"><div class="t">Conocimiento del proyecto</div><div class="a">Agregar conocimiento</div></div>
    <div class="card"><div class="t">Instrucciones personalizadas</div><div class="a">Agregar instrucciones</div></div>
  </div>
  <div class="empty">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <p>Las conversaciones que hayas tenido aparecerán aquí.</p>
  </div>
  <button class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nuevo chat</button>
</div>
</body>
</html>
