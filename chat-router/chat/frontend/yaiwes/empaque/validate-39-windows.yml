name: validate-39-windows
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count 39
        run: |
          n=$(ls "UI YAIWES interface/Ui Yaiwes interface beta/02-fromted"/RUN-*.html "UI YAIWES interface/Ui Yaiwes interface beta/02-fromted"/WALL-*.html "UI YAIWES interface/Ui Yaiwes interface beta/02-fromted"/GBOT-*.html "UI YAIWES interface/Ui Yaiwes interface beta/02-fromted"/FOTO-*.html | wc -l)
          test "$n" -eq 39
