<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Trabajos — Prototipo Educativo</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a2e;
      --muted: #666666;
      --accent: #0066cc;
      --accent-bg: #e6f0ff;
      --accent-hover: #0052a3;
      --border: #e0e0e0;
      --error: #cc0033;
      --error-bg: #ffe6ea;
      --ok: #00802b;
      --ok-bg: #e6ffe6;
      --warn: #cc6600;
      --warn-bg: #fff4e6;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 620px; margin: 0 auto; }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      text-align: center;
      color: var(--fg);
    }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      background: var(--bg);
      transition: border-color 0.2s, background 0.2s;
    }
    .card.active { border-color: var(--accent); background: var(--accent-bg); }
    .card.error { border-color: var(--error); background: var(--error-bg); }
    .card.done { border-color: var(--ok); }
    .job-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .job-name { font-weight: 600; font-size: 1rem; }
    .job-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .status-running { background: var(--accent-bg); color: var(--accent); }
    .status-completed { background: var(--ok-bg); color: var(--ok); }
    .status-failed, .status-cancelled { background: var(--error-bg); color: var(--error); }
    .status-paused { background: var(--warn-bg); color: var(--warn); }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin: 10px 0 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .step-text { font-size: 0.8rem; color: var(--muted); }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      min-width: 64px;
    }
    button:hover { background: var(--accent-bg); border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.danger { color: var(--error); border-color: var(--error); }
    button.danger:hover { background: var(--error-bg); }
    button.primary { color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .error-msg {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--error-bg);
      border-radius: 4px;
      border-left: 3px solid var(--error);
    }
    .legend {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 16px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.1rem; }
      .card { padding: 12px; }
      button { padding: 6px 12px; font-size: 0.8rem; min-width: 56px; }
      .job-name { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1 id="titulo">Panel de Trabajos</h1>
    <div id="jobs" role="list" aria-label="Lista de trabajos en seguimiento"></div>
    <p class="legend">Prototipo educativo local · Sin conexión externa · Tecla R para refrescar</p>
  </div>

  <script>
    // ── Estado local simulado (sin servidor) ─────────────────────
    const estadoInicial = [
      { id: "t1", nombre: "Procesamiento-A", pasos: 5, actual: 3, st: "running", err: null },
      { id: "t2", nombre: "Procesamiento-B", pasos: 8, actual: 4, st: "paused",  err: null },
      { id: "t3", nombre: "Procesamiento-C", pasos: 4, actual: 4, st: "completed", err: null },
      { id: "t4", nombre: "Procesamiento-D", pasos: 6, actual: 2, st: "failed",  err: "Memoria insuficiente en paso 2" },
    ];
    let trabajos = JSON.parse(JSON.stringify(estadoInicial));

    const etiquetas = {
      running: "En ejecución",
      paused: "Pausado",
      completed: "Completado",
      cancelled: "Cancelado",
      failed: "Fallido",
    };

    // ── Renderizado del panel ────────────────────────────────────
    function render() {
      const cont = document.getElementById("jobs");
      cont.innerHTML = "";
      trabajos.forEach(function(t) {
        const card = document.createElement("div");
        card.className = "card";
        if (t.st === "running") card.classList.add("active");
        if (t.st === "failed") card.classList.add("error");
        if (t.st === "completed") card.classList.add("done");
        card.setAttribute("role", "listitem");
        card.setAttribute("aria-label", "Trabajo " + t.nombre + ", " + etiquetas[t.st]);
        card.tabIndex = 0;

        var pct = t.pasos > 0 ? Math.round((t.actual / t.pasos) * 100) : 0;

        // Cabecera: nombre + badge de estado
        var header = document.createElement("div");
        header.className = "job-header";
        var nombre = document.createElement("span");
        nombre.className = "job-name";
        nombre.textContent = t.nombre;
        var badge = document.createElement("span");
        badge.className = "job-status status-" + t.st;
        badge.textContent = etiquetas[t.st];
        header.appendChild(nombre);
        header.appendChild(badge);
        card.appendChild(header);

        // Barra de progreso accesible
        var bar = document.createElement("div");
        bar.className = "progress-bar";
        bar.setAttribute("role", "progressbar");
        bar.setAttribute("aria-valuenow", String(t.actual));
        bar.setAttribute("aria-valuemin", "0");
        bar.setAttribute("aria-valuemax", String(t.pasos));
        bar.setAttribute("aria-label", "Progreso " + pct + "%, paso " + t.actual + " de " + t.pasos);
        var fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = pct + "%";
        bar.appendChild(fill);
        card.appendChild(bar);

        // Texto de pasos
        var steps = document.createElement("div");
        steps.className = "step-text";
        steps.textContent = "Paso " + t.actual + " de " + t.pasos + " (" + pct + "%)";
        card.appendChild(steps);

        // Mensaje de error si existe
        if (t.err) {
          var errDiv = document.createElement("div");
          errDiv.className = "error-msg";
          errDiv.setAttribute("role", "alert");
          errDiv.textContent = "\u26A0 " + t.err;
          card.appendChild(errDiv);
        }

        // Grupo de botones de acción
        var grp = document.createElement("div");
        grp.className = "btn-group";
        var esActivo = t.st === "running" || t.st === "paused";

        if (esActivo) {
          grp.appendChild(mkBtn("Detener", function() { detener(t.id); }, "danger",
            "Detener trabajo " + t.nombre));
        }
        if (t.st === "running") {
          grp.appendChild(mkBtn("Pausar", function() { pausar(t.id); }, null,
            "Pausar trabajo " + t.nombre));
        }
        if (t.st === "paused") {
          grp.appendChild(mkBtn("Reanudar", function() { reanudar(t.id); }, "primary",
            "Reanudar trabajo " + t.nombre));
        }
        if (t.st === "running" || t.st === "paused") {
          grp.appendChild(mkBtn("Avanzar", function() { avanzar(t.id); }, null,
            "Avanzar un paso en " + t.nombre));
        }
        card.appendChild(grp);
        cont.appendChild(card);
      });
    }

    function mkBtn(label, onClick, extraClass, ariaLabel) {
      var b = document.createElement("button");
      b.textContent = label;
      b.addEventListener("click", onClick);
      if (ariaLabel) b.setAttribute("aria-label", ariaLabel);
      if (extraClass) b.classList.add(extraClass);
      return b;
    }

    // ── Acciones sobre trabajos ──────────────────────────────────
    function buscar(id) {
      for (var i = 0; i < trabajos.length; i++) {
        if (trabajos[i].id === id) return trabajos[i];
      }
      return null;
    }

    function detener(id) {
      var t = buscar(id);
      if (!t) return;
      t.st = "cancelled";
      render();
    }

    function pausar(id) {
      var t = buscar(id);
      if (!t || t.st !== "running") return;
      t.st = "paused";
      render();
    }

    function reanudar(id) {
      var t = buscar(id);
      if (!t || t.st !== "paused") return;
      t.st = "running";
      render();
    }

    function avanzar(id) {
      var t = buscar(id);
      if (!t) return;
      if (t.st !== "running" && t.st !== "paused") return;
      if (t.st === "paused") t.st = "running";
      if (t.actual < t.pasos) t.actual++;
      if (t.actual >= t.pasos) t.st = "completed";
      render();
    }

    // ── Atajos de teclado globales ───────────────────────────────
    document.addEventListener("keydown", function(e) {
      if (e.target.tagName === "BUTTON") return;
      if (e.key === "r" || e.key === "R") {
        if (!e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          render();
        }
      }
    });

    // ── Inicialización ───────────────────────────────────────────
    render();
  </script>
</body>
</html>
