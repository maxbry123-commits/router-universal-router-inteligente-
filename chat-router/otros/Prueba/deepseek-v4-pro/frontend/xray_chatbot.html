<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-RAY Chatbot</title>
<style>
/* ============================================================
   X-RAY Chatbot — Estilos minimalistas blanco + acento azul
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blanco: #ffffff; --gris-fondo: #f8f9fa; --gris-claro: #e9ecef;
  --gris-texto: #495057; --gris-oscuro: #212529; --borde: #dee2e6;
  --azul: #2563eb; --azul-claro: #dbeafe; --azul-hover: #1d4ed8;
  --rojo: #dc2626; --verde: #16a34a; --sombra: 0 1px 3px rgba(0,0,0,.08);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f1f3f5; color: var(--gris-oscuro); min-height: 100vh;
  display: flex; justify-content: center; align-items: flex-start; padding: 1rem;
}
.app {
  width: 100%; max-width: 520px; background: var(--blanco);
  border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
  overflow: hidden; display: flex; flex-direction: column; height: 95vh; max-height: 750px;
}
/* --- Header --- */
.header {
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--borde);
  display: flex; align-items: center; gap: .75rem; flex-shrink: 0;
}
.header h1 { font-size: 1.15rem; font-weight: 600; color: var(--gris-oscuro); }
.header .dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--verde);
  transition: background .2s;
}
.header .dot.off { background: var(--rojo); }

/* --- Tabs --- */
.tabs {
  display: flex; border-bottom: 1px solid var(--borde); flex-shrink: 0;
}
.tab {
  flex: 1; padding: .65rem; text-align: center; font-size: .85rem; font-weight: 500;
  cursor: pointer; background: transparent; border: none; color: var(--gris-texto);
  transition: background .15s, color .15s; border-bottom: 2px solid transparent;
}
.tab:hover { background: var(--gris-claro); }
.tab.active { color: var(--azul); border-bottom-color: var(--azul); }

/* --- Paneles --- */
.panel { display: none; flex: 1; overflow-y: auto; padding: 1rem; flex-direction: column; gap: .5rem; }
.panel.active { display: flex; }

/* --- Historial --- */
.historial { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
.burbuja {
  max-width: 85%; padding: .6rem .85rem; border-radius: 10px; font-size: .9rem;
  line-height: 1.4; word-break: break-word; animation: fadeIn .2s;
}
.burbuja.usuario { align-self: flex-end; background: var(--azul); color: #fff; }
.burbuja.sistema { align-self: flex-start; background: var(--gris-claro); color: var(--gris-oscuro); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.vacio { color: var(--gris-texto); text-align: center; padding: 2rem; font-size: .85rem; }

/* --- Input --- */
.input-row { display: flex; gap: .5rem; padding-top: .5rem; flex-shrink: 0; }
.input-row input {
  flex: 1; padding: .65rem .85rem; border: 1px solid var(--borde); border-radius: 8px;
  font-size: .9rem; outline: none; transition: border .15s;
}
.input-row input:focus { border-color: var(--azul); box-shadow: 0 0 0 2px var(--azul-claro); }
.btn {
  padding: .65rem 1rem; border: none; border-radius: 8px; font-size: .9rem; font-weight: 500;
  cursor: pointer; transition: background .15s;
}
.btn-primary { background: var(--azul); color: #fff; }
.btn-primary:hover { background: var(--azul-hover); }
.btn-sm { padding: .35rem .65rem; font-size: .8rem; border-radius: 6px; }
.btn-outline { background: transparent; border: 1px solid var(--borde); color: var(--gris-texto); }
.btn-outline:hover { background: var(--gris-claro); }

/* --- Anclas (chips) --- */
.seccion { margin-bottom: .75rem; }
.seccion h3 { font-size: .85rem; font-weight: 600; margin-bottom: .5rem; color: var(--gris-texto); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  padding: .35rem .7rem; border-radius: 20px; font-size: .8rem; font-weight: 500;
  cursor: pointer; border: 1px solid var(--borde); background: var(--blanco);
  transition: all .15s; user-select: none;
}
.chip.on { background: var(--azul); color: #fff; border-color: var(--azul); }
.chip.off { background: var(--gris-claro); color: var(--gris-texto); border-color: var(--borde); }

/* --- Checklist --- */
.tarea { display: flex; align-items: center; gap: .5rem; padding: .35rem 0; font-size: .85rem; }
.tarea input[type="checkbox"] { accent-color: var(--azul); width: 16px; height: 16px; cursor: pointer; }
.tarea .hecho { text-decoration: line-through; color: #adb5bd; }
.tarea-row { display: flex; gap: .4rem; }
.tarea-row input { flex: 1; padding: .45rem .6rem; border: 1px solid var(--borde); border-radius: 6px; font-size: .85rem; }

/* --- Toggles --- */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: .4rem 0; }
.toggle-row span { font-size: .85rem; }
.switch {
  position: relative; width: 40px; height: 22px; flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #ccc; border-radius: 22px;
  cursor: pointer; transition: .2s;
}
.slider::before {
  content: ""; position: absolute; width: 18px; height: 18px; left: 2px; bottom: 2px;
  background: #fff; border-radius: 50%; transition: .2s;
}
.switch input:checked + .slider { background: var(--azul); }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* --- Responsive --- */
@media (max-width: 480px) {
  .app { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
  body { padding: 0; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <span class="dot" id="statusDot"></span>
    <h1>X-RAY Chatbot</h1>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-panel="chat">Chat</button>
    <button class="tab" data-panel="anclas">Anclas</button>
    <button class="tab" data-panel="tareas">Checklist</button>
    <button class="tab" data-panel="flags">Flags</button>
  </div>

  <!-- Panel CHAT -->
  <div class="panel active" id="panel-chat">
    <div class="historial" id="historial"><div class="vacio">Envía un mensaje para empezar</div></div>
    <div class="input-row">
      <input id="msgInput" placeholder="Escribe tu mensaje..." autocomplete="off">
      <button class="btn btn-primary" id="btnEnviar">Enviar</button>
    </div>
  </div>

  <!-- Panel ANCLAS -->
  <div class="panel" id="panel-anclas">
    <div class="seccion"><h3>Anclas activables — click para ON/OFF</h3></div>
    <div class="chips" id="chipsAnclas"></div>
  </div>

  <!-- Panel CHECKLIST -->
  <div class="panel" id="panel-tareas">
    <div class="seccion"><h3>Checklist de tareas</h3></div>
    <div id="listaTareas"></div>
    <div class="tarea-row" style="margin-top:.5rem">
      <input id="nuevaTarea" placeholder="Nueva tarea..." autocomplete="off">
      <button class="btn btn-sm btn-outline" id="btnAgregarTarea">+</button>
    </div>
  </div>

  <!-- Panel FLAGS -->
  <div class="panel" id="panel-flags">
    <div class="seccion"><h3>Toggles independientes</h3></div>
    <div id="togglesFlags"></div>
  </div>
</div>

<script>
/* ============================================================
   X-RAY Chatbot — JS vanilla, memoria + localStorage
   Namespace: xray_deepseek-v4-pro
   ============================================================ */
const NS = "xray_deepseek-v4-pro";

// --- Modelo en memoria (equivalente a Sesion del backend) ---
let sesion = {
  sid: crypto.randomUUID ? crypto.randomUUID().substring(0, 12) : Date.now().toString(36),
  nombre: "",
  mensajes: [],
  anclas: { contexto: true, personalidad: true, restricciones: false, memoria: true, historial: true },
  checklist: [],
  flags: { tools: false, agente_tool: false, llm_tool: false },
};

// --- Persistencia con localStorage ---
function guardar() {
  try {
    const copia = { ...sesion, mensajes: sesion.mensajes.slice(-200) };
    localStorage.setItem(NS, JSON.stringify(copia));
  } catch(e) { /* quota exceeded, ignorar */ }
}

function cargar() {
  try {
    const raw = localStorage.getItem(NS);
    if (raw) {
      const data = JSON.parse(raw);
      sesion.sid = data.sid || sesion.sid;
      sesion.nombre = data.nombre || "";
      sesion.mensajes = data.mensajes || [];
      sesion.anclas = data.anclas || sesion.anclas;
      sesion.checklist = data.checklist || [];
      sesion.flags = data.flags || sesion.flags;
    }
  } catch(e) { /* corrupto, usar defaults */ }
}

// --- Construir payload (excluye anclas OFF) ---
function construirPayload(mensajeActual) {
  const activas = {};
  for (const [k, v] of Object.entries(sesion.anclas)) { if (v) activas[k] = v; }
  const partes = [];
  if (activas.contexto) partes.push("[CONTEXTO ACTIVO]");
  if (activas.personalidad) partes.push("Eres un asistente X-RAY conciso.");
  if (activas.restricciones) partes.push("Responde en español, máximo 3 frases.");
  if (activas.memoria) partes.push("Recuerda el historial previo.");
  if (activas.historial) partes.push("Historial (" + sesion.mensajes.length + " mensajes previos).");
  return {
    sid: sesion.sid,
    flags: { ...sesion.flags },
    checklist: sesion.checklist.slice(),
    anclas_activas: activas,
    historial: sesion.mensajes.slice(),
    mensaje_actual: mensajeActual,
    contexto_combinado: partes.join("\n"),
  };
}

// --- DOM references ---
const $historial = document.getElementById("historial");
const $msgInput = document.getElementById("msgInput");
const $btnEnviar = document.getElementById("btnEnviar");
const $statusDot = document.getElementById("statusDot");
const $chipsAnclas = document.getElementById("chipsAnclas");
const $listaTareas = document.getElementById("listaTareas");
const $nuevaTarea = document.getElementById("nuevaTarea");
const $btnAgregarTarea = document.getElementById("btnAgregarTarea");
const $togglesFlags = document.getElementById("togglesFlags");

// --- Render: historial ---
function renderHistorial() {
  if (sesion.mensajes.length === 0) {
    $historial.innerHTML = '<div class="vacio">Envía un mensaje para empezar</div>';
    return;
  }
  $historial.innerHTML = sesion.mensajes.map(m =>
    `<div class="burbuja ${m.rol}">${escapar(m.contenido)}</div>`
  ).join("");
  $historial.scrollTop = $historial.scrollHeight;
}

function escapar(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// --- Enviar mensaje ---
function enviarMensaje() {
  const texto = $msgInput.value.trim();
  if (!texto) return;
  sesion.mensajes.push({ rol: "usuario", contenido: texto, ts: Date.now() });
  $msgInput.value = "";
  renderHistorial();
  // Construir payload (OFF se refleja) y simular respuesta del sistema
  const payload = construirPayload(texto);
  const anclasOff = Object.entries(sesion.anclas).filter(([,v]) => !v).map(([k])=>k);
  const respuesta = "[SISTEMA] Payload generado. Anclas OFF excluidas: " +
    (anclasOff.length ? anclasOff.join(", ") : "ninguna") +
    " | Flags: " + JSON.stringify(payload.flags) +
    " | Tareas: " + payload.checklist.length;
  sesion.mensajes.push({ rol: "sistema", contenido: respuesta, ts: Date.now() });
  guardar();
  renderHistorial();
}

// --- Render: chips de anclas ---
function renderAnclas() {
  $chipsAnclas.innerHTML = Object.entries(sesion.anclas).map(([k, v]) =>
    `<span class="chip ${v ? 'on' : 'off'}" data-ancla="${k}">${k} ${v ? 'ON' : 'OFF'}</span>`
  ).join("");
}

// --- Render: checklist ---
function renderChecklist() {
  if (sesion.checklist.length === 0) {
    $listaTareas.innerHTML = '<div class="vacio" style="padding:1rem">Sin tareas</div>';
    return;
  }
  $listaTareas.innerHTML = sesion.checklist.map(t =>
    `<div class="tarea">
      <input type="checkbox" data-tid="${t.id}" ${t.hecho ? 'checked' : ''}>
      <span class="${t.hecho ? 'hecho' : ''}">${escapar(t.texto)}</span>
    </div>`
  ).join("");
}

// --- Render: toggles ---
function renderToggles() {
  $togglesFlags.innerHTML = Object.entries(sesion.flags).map(([k, v]) =>
    `<div class="toggle-row">
      <span>${k}</span>
      <label class="switch">
        <input type="checkbox" data-flag="${k}" ${v ? 'checked' : ''}>
        <span class="slider"></span>
      </label>
    </div>`
  ).join("");
}

// --- Eventos globales ---
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.panel).classList.add("active");
    if (tab.dataset.panel === "anclas") renderAnclas();
    if (tab.dataset.panel === "tareas") renderChecklist();
    if (tab.dataset.panel === "flags") renderToggles();
  });
});

$btnEnviar.addEventListener("click", enviarMensaje);
$msgInput.addEventListener("keydown", e => { if (e.key === "Enter") enviarMensaje(); });

// Chips anclas — delegación de eventos
$chipsAnclas.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const k = chip.dataset.ancla;
  sesion.anclas[k] = !sesion.anclas[k];
  guardar();
  renderAnclas();
  // Mostrar feedback: OFF se refleja en payload siguiente
  const offList = Object.entries(sesion.anclas).filter(([,v])=>!v).map(([n])=>n);
  $statusDot.className = offList.length ? "dot off" : "dot";
  console.log("[X-RAY] Anclas OFF para próximo payload:", offList.length ? offList.join(", ") : "ninguna");
});

// Checklist — checkbox toggle
$listaTareas.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  const tid = e.target.dataset.tid;
  const tarea = sesion.checklist.find(t => t.id === tid);
  if (tarea) { tarea.hecho = e.target.checked; guardar(); renderChecklist(); }
});

$btnAgregarTarea.addEventListener("click", () => {
  const texto = $nuevaTarea.value.trim();
  if (!texto) return;
  sesion.checklist.push({ id: Date.now().toString(36), texto, hecho: false });
  $nuevaTarea.value = "";
  guardar();
  renderChecklist();
});
$nuevaTarea.addEventListener("keydown", e => { if (e.key === "Enter") $btnAgregarTarea.click(); });

// Toggles flags
$togglesFlags.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  const flag = e.target.dataset.flag;
  sesion.flags[flag] = e.target.checked;
  guardar();
  console.log("[X-RAY] Flag", flag, "->", sesion.flags[flag]);
});

// --- Inicialización ---
cargar();
renderHistorial();
renderAnclas();
renderChecklist();
renderToggles();
// Status dot: verde si no hay anclas OFF, rojo si hay alguna OFF
const offInicial = Object.values(sesion.anclas).filter(v => !v).length;
$statusDot.className = offInicial ? "dot off" : "dot";

console.log("[X-RAY] Frontend iniciado. Sesión:", sesion.sid);
console.log("[X-RAY] Anclas:", sesion.anclas);
console.log("[X-RAY] Flags:", sesion.flags);
console.log("[X-RAY] localStorage NS:", NS);
console.log("[X-RAY] Payload ejemplo:", construirPayload("test"));
</script>
</body>
</html>
