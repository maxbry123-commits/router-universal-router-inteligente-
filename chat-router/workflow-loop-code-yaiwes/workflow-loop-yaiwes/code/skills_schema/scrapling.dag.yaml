schema_id: skills_schema/scrapling.dag.yaml
schema: yaiwes.skill-dag/v1
objective: 'Exponer Scrapling como herramienta de scraping/crawling adaptable y fail-closed, sin transferir autoridad al componente.'
work_surface: MIXED
acceptance:
- capability scrapling registrada en COMPONENT_CAPABILITIES
- runtime ausente falla cerrado via YAIWES_SCRAPLING_COMMAND
- no transfiere autoridad ni muta el goal global
tools:
- scrapling
- sheriff
- judge
- verifier
evidence:
- path: evidence/scrapling.json
  sha256: pending
oracle: 'component_adapter:scrapling'
gap_policy: 'RUNTIME_UNAVAILABLE => BLOCKED; nunca PASS sin evidencia'
nodes:
- id: claim
  role: writer
- id: execute
  depends_on:
  - claim
- id: verify
  depends_on:
  - execute
