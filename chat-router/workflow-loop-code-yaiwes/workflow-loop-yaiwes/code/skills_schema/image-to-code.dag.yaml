schema_id: skills_schema/image-to-code.dag.yaml
schema: yaiwes.skill-dag/v1
objective: Imagen -> código (entrada del pipeline)
work_surface: FRONTEND
acceptance:
- imagen procesada -> código generado
tools:
- sheriff
- sentinel
- supervisor
- guardian
- judge
- verifier
evidence:
- path: evidence/image-to-code.json
  sha256: pending
oracle: node:image_input
gap_policy: flag 🚩 PENDIENTE + GAP tipado; nunca PASS sin oracle
nodes:
- id: claim
  role: writer
- id: execute
  depends_on:
  - claim
- id: verify
  depends_on:
  - execute
