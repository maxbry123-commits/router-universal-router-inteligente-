schema: "seals-team.dag/v1"
description: "El Sheriff/Validador/Sentinela como grafo, no como prompt"

nodes:
  - id: leer_tarea
    type: DETERMINISTIC
    action: "lee siguiente entrada de task_contract.json / inventario"
    next: verificar_tipo

  - id: verificar_tipo
    type: DETERMINISTIC
    branches:
      instalar_paquete: instalar_deterministico
      evaluar_componente: consultar_experto_cerebras
      diseno_arquitectura: escalar_a_claude_verificador
      gap_desconocido: investigar_comunidad

  - id: instalar_deterministico
    type: DETERMINISTIC
    on_success: registrar_evidencia
    on_fail: investigar_comunidad

  - id: consultar_experto_cerebras
    type: LLM
    provider: cerebras
    budget: HIGH_VOLUME
    on_result: verificador_pre_salida

  - id: verificador_pre_salida
    type: LLM
    provider: claude
    budget: LOW_VOLUME
    on_pass: registrar_evidencia
    on_fail: investigar_comunidad

  - id: escalar_a_claude_verificador
    type: LLM
    provider: claude
    budget: LOW_VOLUME
    on_result: registrar_evidencia

  - id: investigar_comunidad
    type: LLM
    provider: cerebras
    max_intentos: 20
    on_fail: registrar_gap_y_seguir

  - id: registrar_evidencia
    type: DETERMINISTIC
    action: "escribe path + sha256 + resultado en Crazy Wall"
    next: siguiente_tarea

  - id: registrar_gap_y_seguir
    type: DETERMINISTIC
    action: "escribe GAP con evidencia en Crazy Wall, no detiene el loop"
    next: siguiente_tarea

  - id: siguiente_tarea
    type: DETERMINISTIC
    loop_to: leer_tarea
    on_empty_queue: activar_watchdog

  - id: activar_watchdog
    type: DETERMINISTIC
    action: "watchdog.py escanea inventario + Crazy Wall por trabajo pendiente"


# ----------------------------------------------------------------------
# SECCION EJECUTABLE - consumida por seals_core/dag_engine.py.
# nodes: (arriba) es la narrativa del grafo; steps/edges es lo que el
# engine valida fresco por tarea (P0-01: editar una edge cambia el flujo).
# ----------------------------------------------------------------------

steps:
  - id: RESEARCH
    action: "investigar/evaluar/disenar - tareas evaluar_componente y diseno_arquitectura"
  - id: EXECUTE
    action: "ejecutar determinista - tareas instalar_paquete y verificar_existencia"
  - id: VALIDATE
    action: "veredicto sheriff/oracle sobre la evidencia producida"

edges:
  - "RESEARCH->EXECUTE"
  - "EXECUTE->VALIDATE"
